лько наблюдение"],"C","При синдроме множественных эндокринных неоплазий 2-го типа феохромоцитома может сопровождать медуллярный рак, и операция при невыявленной феохромоцитоме грозит гипертоническим кризом с фатальным исходом. Поэтому её исключение обязательно до вмешательства. Каскадное тестирование родственников позволяет выполнить профилактическую тиреоидэктомию у носителей.","LIBRETTO-531 — phase III design / RET-mutant MTC","https://pubmed.ncbi.nlm.nih.gov/35969032/"],["Анапластический рак щитовидной железы:",["A. Крайне агрессивная опухоль с прогнозом, измеряемым месяцами; требует срочного молекулярного тестирования, поскольку при мутации BRAF V600E эффективна комбинация дабрафениба с траметинибом","B. Имеет благоприятный прогноз","C. Лечится радиойодом","D. Не требует лечения"],"A","Заболевание, при котором счёт идёт на недели: быстро растущее образование шеи со сдавлением дыхательных путей. Молекулярное тестирование должно выполняться в ускоренном режиме, поскольку при BRAF V600E таргетная терапия даёт ответы, позволяющие в части случаев перевести опухоль в резектабельную. Обязательна оценка проходимости дыхательных путей.","ROAR — dabrafenib plus trametinib in BRAF V600E anaplastic thyroid cancer","https://pubmed.ncbi.nlm.nih.gov/35026411/"]]},{"c":"М-53","t":"Нейроэндокринные опухоли","s":"Частная онкология, ч. 3","q":[["Главное разграничение среди нейроэндокринных новообразований:",["A. По наличию гормональной активности","B. По локализации","C. Высокодифференцированные опухоли, градуируемые по Ki-67, и низкодифференцированные нейроэндокринные карциномы — заболевания с принципиально разной биологией и лечением","D. По размеру"],"C","Высокодифференцированные опухоли даже при высоком индексе пролиферации сохраняют органоидную структуру и экспрессию рецепторов соматостатина, лечатся аналогами, радионуклидной и таргетной терапией. Низкодифференцированные карциномы ведут себя как мелкоклеточный рак и требуют платиносодержащей химиотерапии. Смешение этих категорий — грубая ошибка.","WHO Classification of Neuroendocrine Neoplasms 2022","https://pubmed.ncbi.nlm.nih.gov/35294740/"],["Опухоль G3 и нейроэндокринная карцинома:",["A. Различаются только по Ki-67","B. Синонимы","C. Разные категории: высокодифференцированная опухоль G3 сохраняет органоидное строение и экспрессию рецепторов соматостатина, тогда как карцинома низкодифференцирована и требует иного лечения","D. Обе лечатся химиотерапией"],"C","Это одно из важнейших уточнений современной классификации. Опухоль G3 с индексом Ki-67, например, 30 % может отвечать на аналоги соматостатина и радионуклидную терапию, тогда как карцинома с тем же индексом — нет. Различие устанавливается морфологически, а не только по значению Ki-67.","WHO Classification of Neuroendocrine Neoplasms 2022","https://pubmed.ncbi.nlm.nih.gov/35294740/"],["Какой метод предпочтителен для оценки экспрессии соматостатиновых рецепторов и стадирования высокодифференцированной нейроэндокринной опухоли?",["A. Только ультразвуковое исследование","B. Только ПЭТ с фтордезоксиглюкозой","C. ПЭТ/КТ с меченным галлием аналогом соматостатина","D. Только обзорная рентгенография"],"C","ПЭТ/КТ с 68Ga-меченными аналогами соматостатина чувствительно выявляет очаги хорошо дифференцированных NET и одновременно оценивает экспрессию SSTR, что важно для отбора на рецептор-направленную терапию. Анатомическая визуализация КТ/МРТ остаётся частью стадирования и не заменяется этим исследованием полностью.","Prospective 68Ga-DOTATATE PET/CT study in GEP-NET","https://pubmed.ncbi.nlm.nih.gov/26712231/"],["Аналоги соматостатина при высокодифференцированных нейроэндокринных опухолях:",["A. Не влияют на течение","B. Применяются только для контроля симптомов","C. Обладают также антипролиферативным действием и увеличивают беспрогрессивную выживаемость, поэтому назначаются и при нефункционирующих опухолях","D. Применяются только при карциномах"],"C","PROMID и CLARINET показали антипролиферативный эффект независимо от гормональной активности. Это изменило подход: аналоги стали первой линией при большинстве высокодифференцированных опухолей с экспрессией рецепторов, а не только средством контроля приливов и диареи.","CLARINET — lanreotide in metastatic enteropancreatic NET","https://pubmed.ncbi.nlm.nih.gov/25014687/"],["Пептид-рецепторная радионуклидная терапия применяется:",["A. При нейроэндокринных карциномах","B. Только при опухолях лёгкого","C. При высокодифференцированных опухолях с подтверждённой экспрессией рецепторов соматостатина по данным ПЭТ","D. При любых нейроэндокринных новообразованиях"],"C","Метод основан на доставке лютеция-177 к клеткам, экспрессирующим рецепторы соматостатина, поэтому их подтверждение обязательно. NETTER-1 показало существенное улучшение беспрогрессивной выживаемости, NETTER-2 — эффективность в первой линии у больных с высоким индексом пролиферации. Требуются защита почек инфузией аминокислот и контроль отдалённой гематологической токсичности.","NETTER-1 — 177Lu-Dotatate for midgut NET","https://pubmed.ncbi.nlm.nih.gov/28076709/"],["Карциноидный синдром развивается преимущественно:",["A. Только при опухолях лёгкого","B. При опухолях поджелудочной железы","C. При любой нейроэндокринной опухоли","D. При метастазах в печень, когда вазоактивные вещества минуют печёночный метаболизм"],"D","Продукты, секретируемые опухолью кишечника, в норме инактивируются в печени. При метастатическом поражении печени они попадают в системный кровоток, вызывая приливы, диарею и бронхоспазм. Отсюда следствие: карциноидный синдром при отсутствии метастазов в печень требует поиска внекишечной локализации первичной опухоли.","ENETS 2022 Guidance Paper: Carcinoid Syndrome and Carcinoid Heart Disease","https://pmc.ncbi.nlm.nih.gov/articles/PMC9539661/"],["Карциноидная болезнь сердца:",["A. Не встречается","B. Поражает левые отделы","C. Обратима при лечении","D. Фиброзное поражение преимущественно правых отделов сердца при длительно существующем карциноидном синдроме; требует эхокардиографического контроля"],"D","Серотонин и другие вазоактивные вещества вызывают фиброз эндокарда с поражением трикуспидального клапана и клапана лёгочной артерии; левые отделы защищены лёгочным метаболизмом. Развившийся порок необратим и может потребовать протезирования клапана. Поэтому необходимы эхокардиографический контроль и определение маркёров, отражающих секрецию.","ENETS 2022 Guidance Paper: Carcinoid Syndrome and Carcinoid Heart Disease","https://pmc.ncbi.nlm.nih.gov/articles/PMC9539661/"],["Карциноидный криз — это:",["A. Состояние, не связанное с нейроэндокринными опухолями","B. Только спонтанный эпизод диареи","C. Жизнеугрожающее гемодинамическое нарушение, которое может возникать спонтанно или при вмешательствах; у пациентов высокого риска требуется заранее разработанный периоперационный план с доступностью короткодействующего октреотида","D. Состояние, при котором достаточно профилактически назначить только антигистаминный препарат"],"C","Карциноидный криз может сопровождаться выраженными колебаниями артериального давления, бронхоспазмом и аритмиями и возникать во время анестезии, операции и других вмешательств. ENETS подчёркивает необходимость индивидуального периоперационного плана; короткодействующий октреотид должен быть доступен для профилактики/лечения, однако криз возможен несмотря на профилактику, поэтому формулировка «октреотид полностью профилактирует криз» некорректна.","ENETS 2022 Guidance Paper: Carcinoid Syndrome and Carcinoid Heart Disease","https://pmc.ncbi.nlm.nih.gov/articles/PMC9539661/"],["При низкодифференцированной нейроэндокринной карциноме показана:",["A. Радионуклидная терапия","B. Терапия аналогами соматостатина","C. Платиносодержащая химиотерапия с этопозидом, как при мелкоклеточном раке","D. Наблюдение"],"C","Низкодифференцированные карциномы биологически близки к мелкоклеточному раку лёгкого: быстрый рост, раннее метастазирование, высокая исходная чувствительность к платиносодержащей химиотерапии и ранние рецидивы. Аналоги соматостатина и радионуклидная терапия здесь неэффективны из-за утраты рецепторов.","WHO Classification of Neuroendocrine Neoplasms 2022","https://pubmed.ncbi.nlm.nih.gov/35294740/"],["Хромогранин A при нейроэндокринных опухолях:",["A. Заменяет визуализацию","B. Ложно повышается при приёме ингибиторов протонной помпы, почечной и печёночной недостаточности, атрофическом гастрите; интерпретируется с учётом этих факторов","C. Высокоспецифичный маркёр","D. Применяется для скрининга"],"B","Ингибиторы протонной помпы вызывают гипергастринемию и повышение хромогранина A в разы, что имитирует прогрессирование. Поскольку онкологические больные получают их часто, лекарственный анамнез следует уточнять перед интерпретацией. Основой оценки динамики остаётся визуализация.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-54","t":"Рак предстательной железы: локализованный и местнораспространённый","s":"Частная онкология, ч. 2","q":[["Как корректно интерпретировать Grade Group 1 (ISUP; Gleason 3+3=6) при раке предстательной железы?",["A. Это наиболее благоприятная группа градации; при клинически благоприятном локализованном процессе часто подходит активное наблюдение","B. Это группа с обязательным плохим прогнозом","C. Всем пациентам требуется немедленное радикальное лечение","D. Морфологически это не аденокарцинома"],"A","ISUP Grade Group 1 соответствует Gleason 3+3=6 и является наиболее благоприятной из пяти современных групп градации. Низкий риск метастазирования поддерживает активное наблюдение у правильно отобранных пациентов, но выражение «практически не метастазирует» слишком абсолютное и не должно заменять клиническую стратификацию по ПСА, стадии, объёму опухоли и другим признакам.","ISUP consensus — contemporary prostate cancer grade groups","https://pubmed.ncbi.nlm.nih.gov/27150257/"],["Роль мультипараметрической МРТ до биопсии предстательной железы:",["A. Заменяет биопсию","B. Применяется только при рецидиве","C. Повышает выявление клинически значимого рака и снижает выявление незначимого; позволяет выполнить прицельную биопсию","D. Не требуется"],"C","PRECISION и последующие работы показали двойную пользу: находить то, что важно, и не находить того, что не важно. Систематическая биопсия вслепую выявляет много клинически незначимых опухолей, порождая гипердиагностику и избыточное лечение.","PRECISION — MRI-targeted versus standard prostate biopsy","https://www.nejm.org/doi/full/10.1056/NEJMoa1801993"],["Главный вывод исследования ProtecT при 15-летнем наблюдении:",["A. Лучевая терапия хуже других методов","B. Смертность от рака предстательной железы была очень низкой и не различалась между тремя стратегиями; различались частота прогрессирования и профиль последствий лечения","C. Наблюдение опасно","D. Операция значительно превосходит наблюдение"],"B","Результат стал главным аргументом в пользу обсуждения активного наблюдения при локализованном раке, выявленном по ПСА. Больной должен понимать, что выбор влияет не столько на вероятность смерти от рака, сколько на то, когда и какой ценой он получит лечение.","ProtecT — 15-year outcomes","https://pubmed.ncbi.nlm.nih.gov/36912538/"],["Что характеризует активное наблюдение при благоприятном локализованном раке предстательной железы?",["A. Отсутствие последующего контроля","B. Только однократный контроль ПСА","C. Немедленная радикальная терапия при любом изменении ПСА","D. Структурированное наблюдение с серийным ПСА, клинической оценкой, МРТ и повторными биопсиями по протоколу; лечение начинают при признаках клинически значимого прогрессирования"],"D","Активное наблюдение — это не отказ от лечения, а стратегия отсроченного вмешательства при благоприятном риске. В долгосрочной когорте Klotz 15-летняя раково-специфическая выживаемость составила 94,3%, а около 55% пациентов оставались без радикального лечения к 15 годам. Современные протоколы используют ПСА, МРТ и повторные биопсии, но частота исследований должна соответствовать конкретной рекомендации и риску пациента.","Klotz cohort — long-term active surveillance outcomes","https://pubmed.ncbi.nlm.nih.gov/25512465/"],["ПЭТ с лигандами простат-специфического мембранного антигена по сравнению со стандартным стадированием:",["A. Не влияет на решения","B. Применяется только при рецидиве","C. Менее точна","D. Существенно точнее, выявляет метастазы, не видимые при КТ и сцинтиграфии, и меняет тактику у значительной доли больных"],"D","В proPSMA у больных раком предстательной железы высокого риска перед радикальным лечением PSMA-ПЭТ/КТ была точнее стандартного стадирования КТ + остеосцинтиграфией и чаще изменяла план ведения. Это поддерживает её использование для современного стадирования высокого риска, но более высокая чувствительность визуализации сама по себе не доказывает улучшение выживаемости от каждого изменения лечебной тактики.","proPSMA — PSMA PET/CT vs conventional staging","https://pubmed.ncbi.nlm.nih.gov/32209449/"],["Какой принцип гормональной терапии доказан при лучевой терапии местнораспространённого/высокого риска рака предстательной железы?",["A. Гормональная терапия противопоказана","B. Достаточно только нескольких недель ADT","C. ADT не влияет на исходы","D. Длительная ADT улучшает исходы; конкретная продолжительность и дополнительная интенсификация определяются риском и современными рекомендациями"],"D","В EORTC 22961 шесть месяцев андрогенной супрессии не обеспечили выживаемость, сопоставимую с трёхлетней терапией, при сочетании с лучевой терапией у местнораспространённого рака. Современная практика использует риск-адаптированную длительную ADT, а у части больных очень высокого риска обсуждается дополнительная системная интенсификация. Формулировка «обязательны 2–3 года каждому» заменена на более корректную риск-адаптированную.","EORTC 22961 — duration of androgen suppression with radiotherapy","https://www.nejm.org/doi/full/10.1056/NEJMoa0810095"],["Основные отдалённые последствия радикальной простатэктомии, требующие обсуждения до операции:",["A. Кардиотоксичность","B. Нейропатия","C. Только косметические","D. Недержание мочи и эректильная дисфункция, нередко стойкие"],"D","Эти последствия для многих мужчин значат больше, чем формальные онкологические показатели, и должны обсуждаться до, а не после операции. Нервосберегающая техника снижает риск эректильной дисфункции при онкологической допустимости. Пациент должен понимать, что при болезни низкого риска альтернативой является наблюдение без этих последствий.","EAU Guidelines","https://uroweb.org/guidelines"],["Основные отдалённые последствия длительной андрогенной депривации:",["A. Только приливы","B. Потеря костной массы и переломы, метаболический синдром, сердечно-сосудистые события, приливы, снижение мышечной массы, когнитивные и эмоциональные изменения","C. Только снижение либидо","D. Отсутствуют"],"B","Требуются оценка минеральной плотности костной ткани, назначение кальция и витамина D, при высоком риске — остеомодифицирующих агентов, контроль гликемии, липидов и артериального давления, поощрение физической активности. Это то, что систематически упускается при многолетней гормонотерапии.","EAU Guidelines","https://uroweb.org/guidelines"],["Биохимический рецидив после радикального лечения:",["A. Игнорируется","B. Требует оценки кинетики ПСА и визуализации, включая ПЭТ с лигандом ПСМА; тактика зависит от времени удвоения ПСА и локализации","C. Означает неизлечимость","D. Требует немедленной химиотерапии"],"B","Время удвоения ПСА — ключевой прогностический параметр: при коротком времени риск клинического прогрессирования высок. При рецидиве после простатэктомии обсуждается спасительная лучевая терапия на ложе, при рецидиве после облучения — иные подходы. Немедленное начало системной терапии при медленном росте ПСА не обосновано.","EAU Guidelines","https://uroweb.org/guidelines"],["Скрининг рака предстательной железы с помощью ПСА:",["A. Показан всем мужчинам ежегодно","B. Обсуждается индивидуально с информированием о пользе и вреде: снижении смертности ценой значительной гипердиагностики","C. Показан с 20 лет","D. Не проводится никогда"],"B","ERSPC показало снижение смертности от рака предстательной железы ценой существенной гипердиагностики. Современный подход — совместное принятие решения после разъяснения, что часть выявленных опухолей никогда не проявится, а лечение может ухудшить качество жизни. В РФ определение ПСА включено в диспансеризацию с определённого возраста.","PDQ® — рак предстательной железы","https://www.cancer.gov/publications/pdq"]]},{"c":"М-55","t":"Метастатический рак предстательной железы: гормоночувствительный и кастрационно-резистентный","s":"Частная онкология, ч. 2","q":[["Какова современная роль одной только андрогенной депривации при впервые выявленном метастатическом гормоночувствительном раке предстательной железы?",["A. Это предпочтительный вариант для большинства пациентов","B. Интенсификация противопоказана при метастатической болезни","C. Андрогенная депривация не используется даже как основа лечения","D. Для большинства пациентов стандартом является интенсификация ADT препаратом, воздействующим на андрогенный сигнальный путь; у части подходящих больных рассматривают тройную терапию с доцетакселом"],"D","Рандомизированные исследования, включая ARCHES, показали существенное улучшение исходов при добавлении ингибитора андрогенного сигнала к ADT. Монотерапия ADT может оставаться вынужденным вариантом у отдельных пациентов с противопоказаниями, выраженной хрупкостью или иными ограничениями, поэтому формулировка «обязательна всем» некорректна.","ARCHES — enzalutamide + ADT in mHSPC","https://pubmed.ncbi.nlm.nih.gov/31329516/"],["Как корректно интерпретировать место тройной терапии при метастатическом гормоночувствительном раке предстательной железы?",["A. У подходящих для доцетаксела больных интенсификация ADT + доцетаксел добавлением ингибитора андрогенного сигнала улучшает исходы; выбор зависит от объёма болезни, симптомов, сопутствующих состояний и предпочтений","B. Тройная терапия обязательна абсолютно всем пациентам","C. Доцетаксел следует добавлять только из-за возраста пациента","D. Тройная терапия противопоказана при большом объёме метастазов"],"A","PEACE-1 показало, что добавление абиратерона к ADT + доцетакселу улучшает радиографическую БПВ и общую выживаемость у больных de novo mHSPC. Практический выбор тройной терапии не должен сводиться к одному признаку «high-volume»: учитывают распространённость болезни, пригодность к химиотерапии, токсичность и альтернативы интенсификации.","PEACE-1 — abiraterone added to ADT + docetaxel","https://pubmed.ncbi.nlm.nih.gov/35405085/"],["Что показало исследование PSMAddition?",["A. Эффект только при кастрационной резистентности","B. Химиотерапия предпочтительнее","C. Радиолигандная терапия неэффективна","D. Добавление лютеция-177 с лигандом ПСМА к андрогенной депривации с ингибитором андрогенного сигнала при ПСМА-положительной гормоночувствительной болезни снизило риск прогрессирования или смерти на 33 %"],"D","PSMAddition показало улучшение радиографической выживаемости без прогрессирования при добавлении ¹⁷⁷Lu-PSMA-617 к ADT + ARPI у PSMA-положительных пациентов; риск радиографического прогрессирования или смерти снизился примерно на 33%. FDA одобрило комбинацию 31 июля 2026 года. Финальный анализ общей выживаемости остаётся запланированным, поэтому положительная тенденция OS не должна описываться как окончательно доказанный выигрыш.","FDA — 177Lu-PSMA-617 + ARPI for PSMA-positive mHSPC (PSMAddition)","https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-lutetium-lu-177-vipivotide-tetraxetan-androgen-receptor-pathway-inhibitor-therapy"],["Кастрационная резистентность определяется как:",["A. Появление симптомов","B. Прогрессирование при любом уровне тестостерона","C. Повышение ПСА выше 10 нг/мл","D. Прогрессирование при кастрационном уровне тестостерона; андрогенная депривация при этом не прекращается"],"D","Обязательное условие — подтверждённый кастрационный уровень тестостерона: без этого говорить о резистентности нельзя, и следует проверить, действительно ли достигнута кастрация. Андрогенная депривация продолжается на всех последующих линиях, поскольку часть клонов сохраняет зависимость от андрогенов.","EAU Guidelines","https://uroweb.org/guidelines"],["Молекулярное тестирование при метастатическом раке предстательной железы необходимо, потому что:",["A. Влияет только на прогноз","B. Определяет объём лучевой терапии","C. Нарушения генов гомологичной рекомбинации, прежде всего BRCA2, открывают возможность терапии PARP-ингибиторами; кроме того, часть мутаций герминальные","D. Не требуется"],"C","PROfound показал выигрыш олапариба при нарушениях гомологичной рекомбинации. Значительная часть таких мутаций герминальные, что означает необходимость генетического консультирования и каскадного тестирования родственников: BRCA2 повышает риск рака молочной железы, яичников и поджелудочной железы у членов семьи.","PROfound — overall survival with olaparib in mCRPC","https://www.nejm.org/doi/full/10.1056/NEJMoa2022485"],["Как в исследовании VISION отбирали пациентов для терапии ¹⁷⁷Lu-PSMA-617?",["A. Только по уровню ПСА","B. Только по остеосцинтиграфии","C. Только по морфологии первичной опухоли","D. По PSMA-ПЭТ: требовался как минимум один PSMA-положительный очаг и отсутствие исключающих PSMA-отрицательных очагов определённого размера"],"D","В VISION PSMA-позитивность определяли по ⁶⁸Ga-PSMA-11 ПЭТ/КТ. Требовался хотя бы один PSMA-положительный очаг и отсутствие PSMA-отрицательных очагов, соответствующих заранее заданным размерным критериям исключения. Поэтому формулировка «мишень должна экспрессироваться во всех значимых очагах» слишком абсолютна.","VISION — 177Lu-PSMA-617 in metastatic castration-resistant prostate cancer","https://pubmed.ncbi.nlm.nih.gov/34161051/"],["Больному с кастрационно-резистентным раком и костными метастазами показано:",["A. Только обезболивание","B. Дополнительно остеомодифицирующий агент после санации полости рта, с контролем кальция и витамина D","C. Только противоопухолевое лечение","D. Ничего дополнительно"],"B","Деносумаб и золедроновая кислота снижают частоту скелетных осложнений при кастрационно-резистентной болезни. Важно различать эту задачу и профилактику потери костной массы на фоне андрогенной депривации при неметастатической болезни, где применяются меньшие дозы и иные интервалы.","Denosumab vs zoledronic acid in mCRPC with bone metastases","https://pubmed.ncbi.nlm.nih.gov/21353695/"],["Феномен «вспышки» при начале терапии агонистом гонадотропин-рилизинг-гормона:",["A. Не существует","B. Транзиторный подъём тестостерона в первые дни, способный вызвать усиление боли, обструкцию мочевых путей и компрессию спинного мозга; профилактируется антиандрогеном","C. Требует отмены терапии","D. Означает прогрессирование"],"B","При большом объёме костного поражения или угрозе компрессии спинного мозга феномен вспышки опасен. Профилактика — назначение антиандрогена за несколько дней до и в течение нескольких недель после первой инъекции. Альтернатива — антагонист гонадотропин-рилизинг-гормона, не вызывающий вспышки.","EAU Guidelines","https://uroweb.org/guidelines"],["Как следует оценивать ответ и прогрессирование при распространённом раке предстательной железы?",["A. Только по ПСА","B. Только по сцинтиграфии костей","C. Только по симптомам","D. По совокупности ПСА, визуализации и клинического состояния; отдельное изменение одного показателя требует контекстной интерпретации"],"D","Изолированное изменение ПСА не всегда означает истинное клиническое прогрессирование и обычно не должно быть единственным основанием для немедленной смены эффективной терапии. При костных метастазах после начала лечения возможен flare-феномен на сцинтиграфии. Оценка должна объединять симптомы, лабораторные данные и визуализацию с учётом критериев PCWG/RECIST и повторной проверки сомнительных изменений.","EAU Guidelines — Prostate Cancer 2026","https://uroweb.org/guidelines/prostate-cancer"],["Какие метаболические и сердечно-сосудистые последствия требуют внимания при длительной андрогенной депривации?",["A. Только приливы","B. Только увеличение массы тела","C. Отсутствуют","D. Остеопороз и переломы, сахарный диабет, дислипидемия, сердечно-сосудистые события, саркопения, приливы и эмоциональные изменения"],"D","Больные метастатическим раком предстательной железы живут годами, и значительная их часть умирает от сердечно-сосудистых причин. Поэтому оценка минеральной плотности костной ткани, коррекция дефицита витамина D, контроль гликемии, липидов и артериального давления и поощрение физической активности — часть лечения, а не сопутствующая рекомендация.","EAU Guidelines","https://uroweb.org/guidelines"]]},{"c":"М-56","t":"Опухоли из невыявленного первичного очага","s":"Частная онкология, ч. 3","q":[["Когда правомерен диагноз «опухоль из невыявленного первичного очага»?",["A. Когда очаг не найден при КТ","B. Когда больной отказался от обследования","C. Когда выполнен полный диагностический алгоритм, включая адекватную иммуногистохимию, и первичная опухоль не выявлена","D. При любом метастазе"],"C","Это диагноз исключения, а не отказ от поиска. Чаще всего его ставят преждевременно, при неполном обследовании или, что особенно часто, при недостаточной иммуногистохимической панели. Правильный диагноз меняет лечение принципиально, поэтому усилия на его установление оправданы.","ESMO Clinical Practice Guideline — Cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"],["Женщина имеет изолированное поражение подмышечных лимфоузлов аденокарциномой, иммунопрофиль совместим с молочной железой, но первичная опухоль не определяется стандартной визуализацией. Каков принцип тактики?",["A. Рассматривать как оккультный рак молочной железы: выполнить дообследование молочных желёз, включая МРТ при показаниях, и лечить по алгоритмам рака молочной железы","B. Автоматически считать генерализованным CUP без уточнения","C. Только наблюдать","D. Назначить химиотерапию без морфологической верификации"],"A","Изолированное поражение подмышечных узлов с иммуногистохимическим профилем, соответствующим раку молочной железы, относится к благоприятным подгруппам CUP и ведётся по алгоритму оккультного РМЖ. МРТ молочных желёз может помочь выявить скрытый первичный очаг. Нельзя автоматически приписывать происхождение из молочной железы без морфологической поддержки.","ESMO Clinical Practice Guideline — Cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"],["У женщины выявлен серозный канцероматоз брюшины с морфологией и иммунопрофилем мюллеровской опухоли, первичный очаг не найден. Каков принцип лечения?",["A. Только наблюдение","B. Лечить как рак желудка","C. Вести по алгоритму первичного рака брюшины/эпителиального рака яичников, включая оценку возможности циторедукции, платиносодержащую терапию и BRCA/HRD-тестирование по показаниям","D. Только гормонотерапия"],"C","Серозный перитонеальный карциноматоз мюллеровского фенотипа у женщины относится к благоприятным клинико-патологическим подгруппам CUP и лечится аналогично раку яичников/первичному раку брюшины. Повышенного CA 125 недостаточно: необходима морфологическая и иммуногистохимическая поддержка мюллеровского происхождения.","ESMO Clinical Practice Guideline — Cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"],["Плоскоклеточный рак в шейных лимфоузлах без выявленного первичного очага:",["A. Ведётся как местнораспространённая опухоль головы и шеи с радикальной целью; необходимы ПЭТ-КТ, эндоскопия с биопсией типичных зон и определение p16 и вируса Эпштейна — Барр","B. Расценивается как метастатическая болезнь с паллиативным лечением","C. Не требует лечения","D. Лечится только хирургически"],"A","Первичный очаг чаще всего скрывается в нёбных или язычной миндалине и носоглотке. ПЭТ-КТ и панэндоскопия с биопсией, включая тонзиллэктомию, выявляют его у существенной части больных. Определение p16 указывает на ротоглоточное происхождение, а вируса Эпштейна — Барр — на носоглоточное. При радикальном подходе результаты хорошие.","ESMO Clinical Practice Guideline — Cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"],["У молодого мужчины выявлена низкодифференцированная опухоль срединной локализации в забрюшинном пространстве/средостении. Какой диагноз особенно важно активно исключить?",["A. Только саркому","B. Внегонадную герминогенную опухоль: определить АФП, ХГЧ и ЛДГ и выполнить соответствующую морфологическую/иммуногистохимическую оценку","C. Только лимфому без биопсии","D. Доброкачественную опухоль"],"B","У молодого мужчины с низкодифференцированной срединной опухолью необходимо активно исключать внегонадную герминогенную опухоль, поскольку это потенциально излечимая нозология и тактика принципиально отличается от эмпирического лечения CUP. Одних маркёров недостаточно: диагноз опирается на клинический контекст, визуализацию и морфологию/иммуногистохимию.","ESMO Clinical Practice Guideline — Cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"],["Какая иммуногистохимическая комбинация указывает на вероятное лёгочное происхождение аденокарциномы?",["A. CK7-положительная, CK20-отрицательная, TTF-1-положительная","B. GATA3-положительная","C. CK7-отрицательная, CK20-положительная, CDX2-положительная","D. PAX8-положительная"],"A","Сочетание CK7-положительного и CK20-отрицательного профиля с экспрессией TTF-1 характерно для лёгочной аденокарциномы, а также рака щитовидной железы. Профиль CK7-отрицательный, CK20-положительный с CDX2 указывает на колоректальное происхождение, GATA3 — на молочную железу и уротелий, PAX8 — на почку, щитовидную железу и женские половые органы.","Классификация ВОЗ","https://whobluebooks.iarc.fr/"],["Молекулярное профилирование при опухоли из невыявленного очага наиболее полезно тем, что:",["A. Выявляет действенные мишени независимо от локализации: слияния NTRK, MSI-H, высокую мутационную нагрузку, HER2, BRAF V600E","B. Точно определяет локализацию во всех случаях","C. Не имеет значения","D. Заменяет иммуногистохимию"],"A","Исследования терапии, подобранной по молекулярно предсказанной локализации, дали неоднозначные результаты. Более практична другая логика: искать тканенезависимые мишени, поскольку именно они дают эффективные опции при отсутствии установленной нозологии. Эта нозология входит в число тех, где широкое секвенирование оправдано рутинно.","ESMO Clinical Practice Guideline — cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"],["Какую роль играют MMR/MSI и другие биомаркёры при опухоли из невыявленного первичного очага (CUP)?",["A. Не имеют значения","B. MMR/MSI и широкое молекулярное профилирование могут выявить тканенезависимые терапевтические мишени; PD-L1 может быть дополнительным, но не универсально обязательным тестом","C. Их исследуют только у молодых пациентов","D. Они полностью заменяют морфологию и иммуногистохимию"],"B","При CUP особенно ценны биомаркёры, способные открыть тканенезависимое лечение: MSI-H/dMMR, NTRK-слияния и другие клинически значимые мишени. Широкое профилирование рассматривается после базовой морфологической диагностики, когда результат способен изменить лечение. PD-L1 сам по себе не является универсально обязательным тестом для всех CUP, поэтому прежняя формулировка была слишком широкой.","ESMO Clinical Practice Guideline — Cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"],["Наиболее частая ошибка при ведении больных с метастазами неясного происхождения:",["A. Слишком долгий поиск очага","B. Избыточное обследование","C. Направление к патологу","D. Преждевременная постановка диагноза при неполной иммуногистохимической панели и недовыполненном алгоритме, что лишает больного шанса на лечение по правильной нозологии"],"D","Разница в исходах между правильно распознанной благоприятной подгруппой и эмпирическим лечением огромна. При этом бесконечный поиск очага у больного с быстро ухудшающимся состоянием тоже вреден: алгоритм имеет разумные границы, за которыми начинается лечение. Баланс определяется темпом болезни.","ESMO Clinical Practice Guideline — Cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"],["При неблагоприятной подгруппе опухоли из невыявленного очага прогноз и тактика:",["A. Показана только лучевая терапия","B. Прогноз хороший, стандартная терапия эффективна","C. Лечение не проводится","D. Прогноз неблагоприятный; применяются платиносодержащие комбинации со скромными результатами, поэтому участие в клиническом исследовании нередко предпочтительнее"],"D","Медиана выживаемости в неблагоприятных подгруппах невелика, и эмпирическая химиотерапия даёт умеренный эффект. Отсюда особая значимость поиска действенных мишеней и клинических исследований, а также раннего подключения паллиативной помощи и честного разговора о целях лечения.","ESMO Clinical Practice Guideline — Cancer of unknown primary","https://pubmed.ncbi.nlm.nih.gov/36563965/"]]},{"c":"М-57","t":"Онкология и беременность; подростки и молодые взрослые; сохранение фертильности","s":"Частная онкология, ч. 3","q":[["Как в целом меняется возможность проведения цитотоксической химиотерапии в зависимости от срока беременности?",["A. Любая химиотерапия противопоказана на всём протяжении беременности","B. Все препараты безопасны в любом триместре","C. Беременность обязательно должна быть прервана перед лечением","D. Цитотоксическую химиотерапию обычно избегают в первом триместре; отдельные стандартные схемы могут применяться во втором и третьем триместрах после междисциплинарной оценки"],"D","ASCO 2026 рекомендует отложить системную химиотерапию до второго триместра из-за риска для органогенеза. При этом нельзя обобщать вывод на все противоопухолевые препараты: ряд классов — например HER2-направленная терапия, VEGF- и PARP-ингибиторы, ADC и клеточная терапия — противопоказаны на протяжении беременности. Решение требует совместного ведения онколога и специалистов по беременности высокого риска.","ASCO Guideline 2026 — management of cancer during pregnancy","https://pubmed.ncbi.nlm.nih.gov/41380115/"],["Какие противоопухолевые препараты или классы ASCO 2026 рекомендует не применять во время беременности независимо от триместра?",["A. Все антрациклины","B. Все таксаны","C. Любые препараты платины","D. Метотрексат, гормональную терапию, HER2-направленные препараты, ингибиторы VEGF и PARP, ADC и клеточную терапию"],"D","ASCO 2026 указывает, что ряд системных противоопухолевых классов не следует использовать во время беременности независимо от срока: в частности метотрексат, гормональную терапию, HER2-направленные препараты, ингибиторы VEGF и PARP, конъюгаты антитело–лекарство и клеточную терапию. Для традиционной цитотоксической химиотерапии допустимость зависит от препарата и триместра; начало обычно откладывают до второго триместра.","ASCO Guideline — Management of Cancer During Pregnancy 2026","https://pubmed.ncbi.nlm.nih.gov/41380115/"],["Какой интервал между последним курсом химиотерапии и планируемыми родами рекомендует ASCO 2026?",["A. Не менее 3 месяцев","B. Не более 1 недели","C. Обычно 2–4 недели","D. Интервал клинического значения не имеет"],"C","При продолжении беременности ASCO рекомендует планировать роды на сроке 37 недель и более, если это возможно, а последний курс химиотерапии — за 2–4 недели до родов. Это уменьшает риск родов на фоне цитопении и воздействия препарата на новорождённого.","ASCO Guideline — Management of Cancer During Pregnancy 2026","https://pubmed.ncbi.nlm.nih.gov/41380115/"],["Как следует подходить к лучевой терапии во время беременности?",["A. Она абсолютно противопоказана при любой локализации","B. Доза на плод значения не имеет","C. Возможность зависит от локализации, срока и расчётной дозы на плод; следует удерживать суммарное облучение плода ниже 100 мГр, а облучения живота и таза избегать","D. Можно облучать любую область без специальных мер"],"C","ASCO 2026 допускает лучевую терапию во время беременности только после индивидуального дозиметрического планирования. Команда должна стремиться удерживать кумулятивную дозу на плод ниже 100 мГр и применять меры снижения экспозиции. Облучения живота и таза следует избегать из-за высокого риска для плода. Для удалённых от матки областей лечение иногда возможно, но решение зависит от срока беременности, техники и рассчитанной дозы.","ASCO Guideline — Management of Cancer During Pregnancy 2026","https://pubmed.ncbi.nlm.nih.gov/41380115/"],["Когда следует обсуждать сохранение фертильности с пациентом репродуктивного возраста, если лечение может нарушить репродуктивную функцию?",["A. Только если пациент сам спросит","B. Только после завершения лечения","C. Как можно раньше после постановки диагноза и до начала гонадотоксичного или нарушающего репродуктивную функцию лечения, если это не создаёт опасной задержки терапии","D. Этот вопрос не относится к онкологической помощи"],"C","ASCO рекомендует рано обсуждать потенциальное влияние лечения на фертильность и направлять заинтересованных пациентов к специалисту по репродукции до начала лечения, когда это возможно. Разговор должен инициироваться медицинской командой, а не зависеть только от вопроса пациента. Однако слово «обязательно до любого противоопухолевого лечения» было слишком широким: не каждое вмешательство гонадотоксично, а экстренность лечения иногда ограничивает доступные варианты.","ASCO Guideline Update — Fertility Preservation 2025","https://pubmed.ncbi.nlm.nih.gov/40106739/"],["Основной метод сохранения фертильности у мужчин:",["A. Не существует","B. Только после лечения","C. Криоконсервация спермы до начала лечения","D. Гормональная защита"],"C","Метод простой, быстрый и доступный, требует нескольких дней. Важно, что фертильность нередко снижена уже на момент диагноза — например, при герминогенных опухолях и лимфомах. Отложить забор до «после первого курса» нельзя: качество спермы резко падает уже после него.","ASCO Guideline Update — Fertility Preservation 2025","https://pubmed.ncbi.nlm.nih.gov/40106739/"],["Основные методы сохранения фертильности у женщин:",["A. Методов не существует","B. Только криоконсервация эмбрионов","C. Гормональная терапия после лечения","D. Криоконсервация ооцитов или эмбрионов при возможности отсрочки на 2 недели; криоконсервация ткани яичника при невозможности отсрочки; подавление функции яичников агонистами во время химиотерапии как дополнительная мера"],"D","Стимуляция для получения ооцитов требует около двух недель, что при большинстве ситуаций допустимо. При невозможности отсрочки или в препубертатном возрасте применяется криоконсервация ткани яичника. Подавление функции яичников агонистами снижает риск преждевременной недостаточности, но не заменяет криоконсервацию.","ASCO Guideline Update — Fertility Preservation 2025","https://pubmed.ncbi.nlm.nih.gov/40106739/"],["Беременность после лечения рака молочной железы:",["A. Возможна только через 10 лет","B. Требует прерывания при наступлении","C. Противопоказана","D. Возможна; имеющиеся данные не показывают ухудшения онкологических исходов, при гормонозависимой опухоли обсуждается временное прерывание эндокринотерапии"],"D","Это один из самых частых вопросов молодых пациенток. Данные не подтверждают ухудшения прогноза при наступлении беременности после лечения. При гормонозависимой опухоли обсуждается временная приостановка эндокринотерапии с последующим её возобновлением. Решение принимается совместно с учётом риска рецидива и репродуктивных планов.","ASCO Guideline Update — Fertility Preservation 2025","https://pubmed.ncbi.nlm.nih.gov/40106739/"],["Какие факторы помогают объяснить исторически менее выраженный прогресс в исходах у части подростков и молодых взрослых с раком?",["A. Только биология опухоли","B. Возраст сам по себе полностью объясняет различия","C. Только отказ пациентов от лечения","D. Совокупность биологических, диагностических, организационных и социальных факторов, включая доступ к специализированной помощи и клиническим исследованиям"],"D","AYA-популяция неоднородна: различия исходов нельзя сводить к одной причине. Имеют значение биология некоторых опухолей, особенности диагностики и маршрутизации, доступ к клиническим исследованиям, переход между детской и взрослой службами, страхование/финансовые барьеры, приверженность и психосоциальные факторы. Поэтому прежняя формулировка о том, что молодые пациенты обязательно «позже обращаются», была слишком общей.","NCCN Clinical Practice Guidelines — Adolescent and Young Adult Oncology, Version 2.2024","https://pubmed.ncbi.nlm.nih.gov/37549914/"],["Что помимо противоопухолевого лечения требует внимания у больного 22 лет?",["A. Только диета","B. Только физическая активность","C. Ничего дополнительно","D. Фертильность, психосоциальная поддержка, образование и занятость, приверженность лечению, сексуальное здоровье, отдалённые последствия и долгосрочное наблюдение"],"D","NCCN выделяет для подростков и молодых взрослых отдельные потребности, выходящие за пределы контроля опухоли: фертильность и репродуктивное здоровье, психосоциальную поддержку, образование и занятость, финансовые вопросы, приверженность, сексуальное здоровье, генетические риски, поздние эффекты и длительное наблюдение. Эти темы следует обсуждать с учётом возраста и целей конкретного пациента, а не как единый обязательный набор проблем у каждого.","NCCN Clinical Practice Guidelines — Adolescent and Young Adult Oncology, Version 2.2024","https://pubmed.ncbi.nlm.nih.gov/37549914/"]]},{"c":"М-58","t":"Гериатрическая онкология","s":"Частная онкология, ч. 3","q":[["Основной принцип гериатрической онкологии:",["A. Пожилых не лечат","B. Пожилым назначают сниженные дозы","C. Решение принимается по биологическому возрасту и результатам гериатрической оценки, а не по паспортному возрасту","D. Возраст не имеет значения"],"C","Между двумя больными 78 лет разница может быть больше, чем между 50-летним и 70-летним. Автоматическое снижение доз по возрасту — распространённая ошибка, лишающая сохранного пожилого больного эффективного лечения; столь же ошибочно назначать полнодозовую терапию ослабленному больному.","ASCO Guideline Update — Geriatric Assessment 2023","https://pubmed.ncbi.nlm.nih.gov/37459573/"],["Опросник G8 применяется для:",["A. Стадирования","B. Скрининга: выявления больных, которым нужна полная гериатрическая оценка","C. Оценки токсичности","D. Оценки прогноза"],"B","Полная гериатрическая оценка требует времени, поэтому применяется двухэтапный подход: короткий скрининг всем пожилым больным и развёрнутая оценка тем, у кого он выявил проблемы. G8 занимает несколько минут и легко выполним на обычном приёме.","ASCO Guideline Update — geriatric assessment in older adults with cancer","https://pubmed.ncbi.nlm.nih.gov/37459573/"],["Что входит в комплексную гериатрическую оценку?",["A. Только лабораторные показатели","B. Только возраст и ECOG","C. Функциональная активность, коморбидность, когнитивные функции, эмоциональное состояние, питание, социальная поддержка и лекарственная нагрузка","D. Только функциональный статус"],"C","Шкала ECOG, привычная онкологу, не выявляет когнитивных нарушений, депрессии, нутритивного дефицита и социальной изоляции — а именно они определяют, справится ли больной с лечением. Гериатрическая оценка обнаруживает такие проблемы у большинства пожилых больных, выглядящих сохранными на приёме.","ASCO Guideline Update — Geriatric Assessment 2023","https://pubmed.ncbi.nlm.nih.gov/37459573/"],["Что показало исследование GAP70+ у пожилых пациентов, начинающих противоопухолевое лечение высокого риска?",["A. Гериатрическая оценка не изменила токсичность","B. Гериатрическая оценка заменила противоопухолевое лечение","C. Гериатрическая оценка увеличила частоту тяжёлых осложнений","D. Передача онкологу результатов гериатрической оценки с рекомендациями по ведению снизила частоту токсичности 3–5 степени"],"D","В GAP70+ тяжёлая токсичность 3–5 степени возникла у 51% пациентов в группе вмешательства против 71% при обычном ведении (RR 0,74; 95% ДИ 0,64–0,86). Исследование обосновывает не просто заполнение шкал, а использование выявленных проблем для изменения плана ведения.","GAP70+ — geriatric assessment-guided management","https://pubmed.ncbi.nlm.nih.gov/34741815/"],["Полипрагмазия у пожилого онкологического больного:",["A. Неизбежна и не требует внимания","B. Решается добавлением препаратов","C. Не влияет на онкологическое лечение","D. Повышает риск лекарственных взаимодействий, падений и нежелательных явлений; пересмотр терапии улучшает переносимость лечения"],"D","Часть препаратов назначена давно и уже не нужна, часть потенциально нежелательна в пожилом возрасте, часть вступает во взаимодействие с противоопухолевыми средствами. Пересмотр списка перед началом терапии — простое действие с ощутимым эффектом, которое почти никогда не выполняется.","ASCO Guideline Update — geriatric assessment in older adults receiving systemic cancer therapy","https://pubmed.ncbi.nlm.nih.gov/37459573/"],["Функция почек у пожилого больного:",["A. Оценивается по креатинину","B. Оценивается по расчётной скорости клубочковой фильтрации, поскольку нормальный креатинин при сниженной мышечной массе может маскировать значимое снижение функции","C. Всегда снижена","D. Не требует оценки"],"B","Это одна из самых частых причин передозировки у пожилых. При саркопении креатинин остаётся в пределах нормы при существенно сниженной фильтрации, что ведёт к передозировке препаратов с почечной экскрецией — прежде всего карбоплатина, рассчитываемого по формуле Калверта.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Как следует подходить к полипрагмазии у пожилого пациента с онкологическим заболеванием?",["A. Все хронические препараты необходимо автоматически отменить перед противоопухолевым лечением","B. Количество лекарств не имеет значения","C. Необходим систематический пересмотр лекарств с оценкой показаний, взаимодействий, дублирования, антихолинергической нагрузки и ожидаемой продолжительности пользы","D. Достаточно проверять только взаимодействия с цитостатиками"],"C","Гериатрическая оценка включает лекарственный анамнез и выявление потенциально неприемлемых или избыточных препаратов. Депрескрайбинг должен быть индивидуальным: отменяют не «всё лишнее», а лекарства с неблагоприятным соотношением пользы и риска с учётом целей лечения, функционального состояния, взаимодействий и ожидаемого времени до пользы. Это особенно важно при системной противоопухолевой терапии.","ASCO Guideline Update — Geriatric Assessment 2023","https://pubmed.ncbi.nlm.nih.gov/37459573/"],["Ослабленный пожилой больной с метастатической опухолью и ECOG 3:",["A. Требует оценки обратимости состояния: если ухудшение вызвано самой опухолью, лечение может помочь; если общей ослабленностью, противоопухолевая терапия скорее навредит","B. Должен получить полнодозовую химиотерапию","C. Не подлежит никакому лечению","D. Требует только госпитализации"],"A","Ключевой вопрос — обратимо ли ухудшение. При боли, анемии, гиперкальциемии, обструкции, вызванных опухолью, эффективное лечение способно улучшить состояние. При исходной ослабленности, деменции и саркопении химиотерапия ускоряет ухудшение. Разграничение требует оценки, а не впечатления.","ASCO Guideline Update — Geriatric Assessment 2023","https://pubmed.ncbi.nlm.nih.gov/37459573/"],["Что следует учитывать при обсуждении лечения с пожилым больным?",["A. Только стоимость","B. Мнение родственников как решающее","C. Также его собственные приоритеты: сохранение самостоятельности и когнитивных функций нередко важнее нескольких дополнительных месяцев жизни","D. Только медицинские факторы"],"C","Приоритеты пожилых больных часто отличаются от предполагаемых врачом: возможность жить дома, обходиться без посторонней помощи, сохранять ясность сознания. Прямой вопрос «что для вас сейчас важнее всего» меняет разговор и нередко само решение.","ASCO Guideline Update — Geriatric Assessment 2023","https://pubmed.ncbi.nlm.nih.gov/37459573/"],["Наиболее частая ошибка при лечении пожилых онкологических больных:",["A. Избыточное обследование","B. Две противоположные: необоснованный отказ от эффективного лечения у сохранного больного и назначение полнодозовой терапии ослабленному","C. Слишком частые визиты","D. Направление к гериатру"],"B","Обе ошибки происходят из одного источника — решения по паспортному возрасту и общему впечатлению вместо структурированной оценки. Гериатрическая оценка позволяет разделить сохранных, промежуточных и ослабленных больных и предложить каждому адекватный подход.","ASCO Guideline Update — Geriatric Assessment 2023","https://pubmed.ncbi.nlm.nih.gov/37459573/"]]},{"c":"М-59","t":"Психосоциальные аспекты; паллиативная помощь и обезболивание","s":"Частная онкология, ч. 3","q":[["Когда следует рассматривать подключение специализированной паллиативной помощи у пациента с распространённым онкологическим заболеванием?",["A. Рано в ходе заболевания, параллельно с активным противоопухолевым лечением, особенно при симптомах и снижении качества жизни","B. Только в последние недели жизни","C. Только после полного исчерпания противоопухолевых возможностей","D. Только по просьбе родственников"],"A","ASCO 2024 рекомендует раннее подключение междисциплинарной паллиативной помощи при распространённых солидных опухолях и гематологических заболеваниях параллельно с активным лечением; особенно важны неконтролируемые симптомы, психосоциальные и духовные потребности и снижение качества жизни.","ASCO Guideline Update — Palliative Care for Patients With Cancer, 2024","https://pubmed.ncbi.nlm.nih.gov/38748941/"],["Базовое правило назначения обезболивающих при хроническом болевом синдроме:",["A. Регулярно по часам, с дополнительным назначением препарата быстрого действия на случай прорывной боли","B. Только на ночь","C. По потребности при появлении боли","D. Только внутривенно"],"A","Приём по потребности означает, что больной каждый раз ждёт возвращения боли. Регулярный приём удерживает концентрацию препарата и предотвращает эпизоды. Отдельно назначается препарат быстрого действия для прорывной боли, обычно в дозе около одной шестой суточной.","WHO guideline — cancer pain in adults and adolescents","https://pubmed.ncbi.nlm.nih.gov/30776210/"],["Существует ли максимальная доза сильных опиоидов при онкологической боли?",["A. Да, строго фиксированная","B. Не более 100 мг морфина в сутки","C. Определяется массой тела","D. Нет: доза подбирается индивидуально по эффекту и переносимости; ограничением служат нежелательные явления, а не цифра"],"D","Опасение «превысить дозу» — одна из главных причин недостаточного обезболивания. У сильных опиоидов нет потолочного эффекта, доза титруется до достижения контроля. Ограничивают её седация, спутанность, угнетение дыхания — при постепенном титровании эти явления управляемы.","WHO guideline — cancer pain in adults and adolescents","https://pubmed.ncbi.nlm.nih.gov/30776210/"],["Что назначается одновременно с началом опиоидной терапии в обязательном порядке?",["A. Ничего","B. Слабительное, поскольку к запорам, в отличие от других эффектов, толерантность не развивается","C. Противорвотное пожизненно","D. Антидепрессант"],"B","Тошнота и седация обычно проходят через несколько дней, а запор сохраняется на всём протяжении терапии. Нелеченый запор ведёт к каловому завалу, тошноте, боли и нередко к самовольному прекращению приёма обезболивающих. Слабительное назначается с первого дня, а не при появлении жалоб.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Как ведут прорывную боль у пациента, уже получающего круглосуточную опиоидную терапию?",["A. Увеличивают интервал между приёмами базового опиоида","B. Прорывная боль всегда означает неэффективность всей схемы","C. Дополнительная терапия не требуется","D. Назначают опиоид немедленного высвобождения как спасительную дозу; частые эпизоды требуют пересмотра базовой схемы"],"D","ASCO рекомендует при прорывной боли у пациента на круглосуточном опиоиде назначать препарат немедленного высвобождения. Ориентировочная спасительная доза составляет 5–20% от суточной эквивалентной дозы морфина, однако доказательность для точного процента слабее, чем для самого принципа. Жёсткий порог «более 3–4 эпизодов = обязательно увеличить базовую дозу» заменён на индивидуальную переоценку фоновой анальгезии.","ASCO Guideline — opioids for adults with cancer-related pain","https://ascopubs.org/doi/10.1200/JCO.22.02198"],["Как правильно выполнять ротацию опиоидов при раковой боли?",["A. Использовать эквианальгетический пересчёт только как исходную оценку и индивидуально снижать стартовую дозу нового опиоида с последующей титрацией и наблюдением","B. Всегда назначать 100% рассчитанной эквианальгетической дозы без коррекции","C. Ротация опиоидов не применяется","D. Всегда удваивать рассчитанную дозу"],"A","Эквианальгетические таблицы имеют ограничения и не должны применяться как точная математическая формула. ASCO рекомендует персонализировать ротацию с учётом причины смены препарата, токсичности, функции органов, пути введения и клинической ситуации, после чего тщательно титровать дозу. Универсальное правило обязательного снижения ровно на 25–50% для всех переходов слишком упрощённо, особенно для метадона и отдельных маршрутов конверсии.","ASCO Guideline — opioids for adults with cancer-related pain","https://ascopubs.org/doi/10.1200/JCO.22.02198"],["Нейропатический компонент онкологической боли:",["A. Лечится только нестероидными препаратами","B. Часто требует адъювантных препаратов — антиконвульсантов или антидепрессантов — в дополнение к опиоидам","C. Не встречается","D. Хорошо купируется опиоидами"],"B","Жгучая, стреляющая боль с парестезиями при вовлечении нервных структур отвечает на опиоиды хуже. Габапентиноиды и антидепрессанты двойного действия применяются как адъюванты. При рефрактерной боли, например при опухолях тела поджелудочной железы, рассматриваются интервенционные методы.","WHO guideline — cancer pain in adults and adolescents","https://pubmed.ncbi.nlm.nih.gov/30776210/"],["Как ведут рефрактерную одышку при распространённом раке после коррекции обратимых причин?",["A. Кислород назначают всем независимо от сатурации","B. Всем требуется искусственная вентиляция лёгких","C. Эффективных симптоматических методов нет","D. Используют нефармакологические меры, включая поток воздуха на лицо; кислород — при гипоксемии; при недостаточном эффекте следует предложить системные опиоиды"],"D","ASCO рекомендует иерархический подход: сначала искать и лечить обратимые причины, затем применять нефармакологические меры. Поток воздуха на лицо может облегчать симптом; стандартный кислород показан при гипоксемии. Если этого недостаточно, следует предложить системные опиоиды. Это точнее, чем утверждение, что опиоиды являются единственным или всегда первым средством.","ASCO Guideline — management of dyspnea in advanced cancer","https://pubmed.ncbi.nlm.nih.gov/33617290/"],["Спутанность сознания у больного с распространённым раком:",["A. Делирий, при котором необходимо искать обратимые причины: лекарства, гиперкальциемию, инфекцию, задержку мочи, дегидратацию","B. Не требует внимания","C. Требует только седации","D. Неизбежный признак терминального состояния"],"A","При делирии необходимо искать и по возможности корректировать обратимые причины: лекарственные эффекты, инфекцию, метаболические нарушения, задержку мочи, обезвоживание и др. Немедикаментозная поддержка остаётся основой. Антипсихотики не следует автоматически назначать при каждом эпизоде: в плацебо-контролируемом исследовании паллиативных пациентов рисперидон и галоперидол не улучшали, а ухудшали целевые симптомы делирия. Они могут рассматриваться выборочно при выраженном опасном возбуждении или тяжёлом дистрессе.","Randomized trial — risperidone/haloperidol vs placebo for delirium in palliative care","https://pubmed.ncbi.nlm.nih.gov/27918778/"],["Дистресс у онкологического больного:",["A. Нормальная реакция, не требующая внимания","B. Подлежит активному выявлению скрининговыми инструментами и направлению к психологу или психиатру при выраженности, поскольку депрессия и тревога распространены и поддаются лечению","C. Лечится только беседой","D. Не встречается"],"B","Депрессия и тревожные расстройства у онкологических больных распространены, ухудшают качество жизни и приверженность лечению, но выявляются редко: их симптомы списывают на болезнь. Простые скрининговые вопросы на приёме выявляют значительную часть случаев, а лечение эффективно.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-60","t":"Правовые и организационные аспекты работы врача-онколога; ОМС, КСГ, документация","s":"Частная онкология, ч. 3","q":[["Какова правовая роль клинических рекомендаций в РФ?",["A. Обязательны только в федеральных центрах","B. Носят справочный характер","C. Служат основой оказания медицинской помощи и критерием оценки её качества; отступление требует обоснования в документации","D. Не имеют значения"],"C","Это существенное изменение последних лет. При экспертизе качества помощи и в судебных разбирательствах соответствие рекомендациям оценивается напрямую. Отступление возможно, когда оно обосновано состоянием больного или иными обстоятельствами, но обоснование должно быть зафиксировано, как правило решением врачебной комиссии.","Клинические рекомендации как правовая основа","https://cr.minzdrav.gov.ru/clin_recomend"],["Что должно содержать заключение онкологического консилиума?",["A. Только диагноз","B. Диагноз со стадией, обоснование выбранной тактики, конкретный план лечения с указанием этапов и сроков, состав участников и их подписи","C. Только назначенную схему","D. Только фамилии участников"],"B","Протокол консилиума — ключевой документ, определяющий тактику и защищающий врача при экспертизе. Формальные записи вида «рекомендовано лечение по месту жительства» лишены смысла. Консилиум обязателен при впервые выявленном заболевании и при существенном изменении тактики.","Врачебная комиссия и консилиум","https://cr.minzdrav.gov.ru/algorithms"],["Назначение препарата вне зарегистрированных показаний:",["A. Возможно по решению врачебной комиссии при наличии обоснования и информированного согласия пациента","B. Запрещено полностью","C. Решается лечащим врачом единолично","D. Не требует оформления"],"A","Ситуация нередкая в онкологии, где данные опережают регистрацию. Требуются: обоснование со ссылками на источники, решение врачебной комиссии, отдельное информированное согласие с разъяснением, что применение выходит за рамки инструкции. Оформление единолично недопустимо и создаёт риски для врача.","Врачебная комиссия и консилиум","https://cr.minzdrav.gov.ru/algorithms"],["Клинико-статистическая группа при лекарственной терапии определяется прежде всего:",["A. Возрастом больного","B. Длительностью госпитализации","C. Диагнозом","D. Применённой схемой лекарственной терапии и рядом дополнительных параметров"],"D","Тариф привязан к схеме, а не к нозологии. Отсюда практическое следствие: назначение по стандартизованной схеме и корректное её указание в документации обеспечивают адекватное финансирование случая, тогда как неточность ведёт к отнесению к группе с меньшим тарифом и фактическому недофинансированию.","Клинико-статистические группы","https://rosoncoweb.ru/standarts/protocols/resources/"],["Передача сведений о диагнозе родственникам пациента:",["A. Запрещена всегда","B. Требует письменного согласия пациента с указанием лиц, которым можно сообщать сведения, за исключением случаев, прямо предусмотренных законом","C. Допускается только супругу","D. Допускается свободно"],"B","Врачебная тайна распространяется и на близких родственников. Практическое решение — при первом обращении предложить пациенту указать в согласии лиц, которым можно сообщать сведения. Это снимает большинство конфликтов и защищает врача.","Врачебная тайна","https://cr.minzdrav.gov.ru/clin_recomend"],["Информированное добровольное согласие:",["A. Требуется только перед операцией","B. Может быть устным","C. Обязательное условие вмешательства и процесс информирования; отказ от вмешательства также оформляется письменно","D. Формальность, подпись на бланке"],"C","Согласие требуется перед медицинским вмешательством, включая лекарственную терапию. Отказ оформляется письменно с разъяснением возможных последствий и фиксацией этого разъяснения. Подпись без реального информирования не защищает ни пациента, ни врача.","Информированное добровольное согласие","https://cr.minzdrav.gov.ru/clin_recomend"],["Что означают предельные сроки в маршрутизации онкологических больных?",["A. Сроки госпитализации","B. Установленные нормативами сроки от подозрения на злокачественное новообразование до консультации онколога, верификации и начала лечения; их соблюдение контролируется","C. Рекомендательные ориентиры","D. Сроки выписки документов"],"B","Нормативы устанавливают предельные интервалы на каждом этапе. Практический смысл двойной: они защищают пациента от затягивания и служат ориентиром для организации работы. Задержки на этапе от подозрения до верификации — типичная точка потерь, и понимание нормативов помогает их отслеживать.","Маршрутизация онкологических больных","https://cr.minzdrav.gov.ru/algorithms"],["Наиболее частый дефект медицинской документации в онкологии:",["A. Отсутствие обоснования принятых решений: почему выбрана эта схема, почему отступили от рекомендаций, почему изменена доза","B. Избыточная подробность","C. Использование сокращений","D. Подробное описание жалоб"],"A","Запись должна позволять другому врачу и эксперту понять логику решений. Отсутствие обоснования редукции дозы, отсрочки цикла, отказа от показанного лечения — самый частый повод для претензий при экспертизе. Правило простое: решение, не зафиксированное в документации, считается не принятым.","Клинические рекомендации как правовая основа","https://cr.minzdrav.gov.ru/clin_recomend"],["Если больной отказывается от показанного лечения:",["A. Лечение проводится принудительно","B. Достаточно устного отказа","C. Больной снимается с наблюдения","D. Оформляется письменный отказ с фиксацией того, что последствия разъяснены; целесообразно выяснить причину отказа, которая нередко устранима"],"D","Помимо юридического оформления важна содержательная часть: за отказом часто стоят страх, неверная информация, финансовые или логистические препятствия, влияние окружения. Выяснение причины нередко позволяет решить проблему, и это входит в обязанности врача не меньше, чем оформление документа.","Информированное добровольное согласие","https://cr.minzdrav.gov.ru/clin_recomend"],["Зачем онкологу знать систему оплаты по ОМС?",["A. Это не входит в его задачи","B. Для расчёта зарплаты","C. Только для отчётности","D. От корректного оформления зависит финансирование случая, а значит и реальная доступность назначенного лечения для пациента"],"D","Правильно назначенное, но неверно оформленное лечение может оказаться недофинансированным, и отделение будет вынуждено ограничивать назначения. Понимание системы позволяет обеспечить больному именно то лечение, которое ему показано, а не то, которое проще провести.","Клинико-статистические группы","https://rosoncoweb.ru/standarts/protocols/resources/"]]},{"c":"М-61","t":"Подготовка к первичной специализированной аккредитации и итоговой аттестации","s":"Итоговая аттестация","q":[["Что должно входить в полный онкологический диагноз?",["A. Только гистология","B. Только стадия","C. Нозология и стадия","D. Гистологический тип и степень дифференцировки, стадия с указанием редакции классификации и префиксов, статус R после операции, обязательные биомаркёры"],"D","Каждый элемент влияет на решение. Указание редакции классификации необходимо для сопоставимости, префиксы отражают, на каком этапе установлена стадия, статус R определяет показания к дополнительному лечению, биомаркёры — выбор терапии.","Диагноз должен быть полным","https://cr.minzdrav.gov.ru/clin_recomend"],["В каких нозологиях молекулярный результат необходим до начала первой линии?",["A. Только при метастатической болезни любой локализации","B. Молекулярное тестирование не срочно","C. Только при раке лёгкого","D. При раке лёгкого, колоректальном раке, раке желудка, яичников, поджелудочной железы, меланоме, ГИСО, холангиокарциноме и ряде других"],"D","В каждом из этих случаев результат определяет выбор первой линии, а не только последующих. Назначение терапии до получения результата и последующая её смена — распространённая ошибка, а при некоторых сочетаниях, например иммунотерапии перед ингибитором тирозинкиназ при раке лёгкого, ещё и опасная.","Молекулярное тестирование","https://www.oncokb.org/"],["Что объединяет исследования DREAMseq, SWOG S1801 и NADINA?",["A. Все посвящены химиотерапии","B. Все показали, что результат зависит от порядка применения тех же препаратов, а не только от их набора","C. Все посвящены новым препаратам","D. Все отрицательные"],"B","DREAMseq показало преимущество начала с иммунотерапии при BRAF-мутированной меланоме, SWOG S1801 и NADINA — преимущество переноса части иммунотерапии на дооперационный этап. Общий вывод: последовательность сама по себе является терапевтическим фактором.","Порядок и последовательность","https://www.esmo.org/guidelines"],["Какие исследования служат примерами обоснованной деэскалации?",["A. IDEA, MSLT-II, LION, SHAPE, OPRA, активное наблюдение при раке предстательной железы и микрокарциноме щитовидной железы","B. Только хирургические исследования","C. Таких не существует","D. Только исследования новых препаратов"],"A","Сокращение длительности адъювантной терапии, отказ от лимфодиссекции и от систематической лимфаденэктомии, уменьшение объёма операции, органосохранение и наблюдение вместо лечения — всё это результаты качественных исследований. Умение не лечить лишнего требует такой же квалификации, как и умение лечить.","Деэскалация","https://www.esmo.org/guidelines"],["Что чаще всего определяет, будет ли программа лечения завершена в полном объёме?",["A. Стадия заболевания","B. Качество сопроводительной терапии: нутритивная поддержка, обезболивание, профилактика осложнений, своевременное ведение токсичности","C. Возраст больного","D. Выбор препарата"],"B","Больной, истощённый и не получающий адекватного обезболивания, не перенесёт даже правильно выбранный режим. Незавершённая адъювантная программа ухудшает результат. Поэтому сопроводительная терапия — не вспомогательная, а основная часть работы онколога.","Сопроводительная терапия","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Как правильно готовиться к практическому этапу аккредитации?",["A. Только решать тесты","B. Читать учебники","C. Отрабатывать конкретные действия: расчёт доз, оформление документации, разбор клинических ситуаций вслух, коммуникативные навыки в ролевом формате","D. Просматривать лекции"],"C","Практический этап проверяет действия, а не знания. Чтение не формирует навык расчёта дозы по формуле Калверта под контролем времени или проведения беседы по структуре SPIKES. Эти умения отрабатываются повторением в условиях, приближенных к экзаменационным.","Протоколы лекарственной терапии RUSSCO","https://ld.russco.org/Protocols"],["Какой источник наиболее уместен при подготовке к вопросам по тактике в российских экзаменационных материалах?",["A. Клинические рекомендации Минздрава России, дополняемые практическими рекомендациями RUSSCO","B. Обзорные статьи","C. Учебники десятилетней давности","D. Международные рекомендации"],"A","Российские экзаменационные материалы опираются на действующие клинические рекомендации. Международные документы необходимы для понимания логики и для реальной практики, но при подготовке к формальной аттестации первичны отечественные рекомендации в действующей редакции.","Клинические рекомендации Минздрава России","https://cr.minzdrav.gov.ru/clin_recomend"],["Что полезно вести на протяжении всей ординатуры для итоговой аттестации?",["A. Список прочитанных книг","B. Дневник практических навыков с фиксацией курируемых пациентов, консилиумов, ассистенций, разборов и выполненных манипуляций","C. Ничего","D. Только конспекты лекций"],"B","Дневник решает две задачи: подтверждает выполнение программы для аттестации и позволяет самому ординатору увидеть пробелы — например, что за два года он ни разу не участвовал в разговоре о целях лечения или не присутствовал на контуринге. Международный аналог — Log Book глобальной учебной программы.","Глобальная учебная программа ESMO/ASCO","https://society.asco.org/meetings-education/training-programs/global-curriculum"],["Как проверять актуальность знаний после завершения ординатуры?",["A. По мере необходимости","B. Достаточно однократного обучения","C. Знания не устаревают","D. Регулярно отслеживать обновления клинических рекомендаций и ключевых конгрессов, участвовать в разборах и журнальных клубах"],"D","Курс показал, насколько быстро меняются стандарты: за время обучения сменились первые линии при уротелиальном раке, лимфоме Ходжкина, раке желудка, раке эндометрия. Навык систематического обновления знаний важнее любого объёма запомненного материала.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Что оценивается на этапе разбора клинической ситуации помимо правильного ответа?",["A. Скорость ответа","B. Использование терминов","C. Только конечный ответ","D. Логика рассуждения: полнота собранных данных, обоснование решения, учёт альтернатив, понимание рисков и умение объяснить тактику"],"D","Экзаменатора интересует, как кандидат думает. Правильный ответ, полученный случайно, и неверный, но логично обоснованный, различаются по значению. Полезная привычка — проговаривать ход рассуждения вслух: что известно, чего не хватает, какие есть варианты, почему выбран этот.","Глобальная учебная программа ESMO/ASCO","https://www.esmoopen.com/article/S2059-7029(23)00866-9/fulltext"]]}]};</script>
<script>
(function(){
 var D=window.__ONCO_BANK__;
 var root=document.getElementById('oncoTest');
 if(!D||!root){return;}
 var MODS=D.m, S={};
 var LS='oncoTestProgress_v1';

 function load(){try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}}
 function save(o){try{localStorage.setItem(LS,JSON.stringify(o));}catch(e){}}
 function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
 function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
 var LETTERS=['A','B','C','D','E','F'];

 function allSections(){var s=[],seen={};MODS.forEach(function(m){if(!seen[m.s]){seen[m.s]=1;s.push(m.s);}});return s;}
 function totalQ(){return MODS.reduce(function(a,m){return a+m.q.length;},0);}

 function pool(sel){
  var out=[];
  MODS.forEach(function(m){
   if(sel.mode==='all'||(sel.mode==='sec'&&m.s===sel.sec)||(sel.mode==='mod'&&sel.mods.indexOf(m.c)>=0)){
    m.q.forEach(function(q,i){
     out.push({mc:m.c,mt:m.t,ms:m.s,qi:i,q:q[0],a:q[1],ok:q[2],exp:q[3],st:q[4],su:q[5]});
    });
   }
  });
  return out;
 }

 function start(sel){
  var p=pool(sel);
  if(!p.length){alert('Не выбрано ни одного модуля.');return;}
  shuffle(p);
  var n=Math.min(sel.n||p.length,p.length);
  S={items:p.slice(0,n).map(function(it){
      var idx=it.a.map(function(_,k){return k;});
      if(sel.shuffleA)shuffle(idx);
      return {d:it,order:idx,ans:null,done:false};
    }),
    i:0,exam:sel.exam,started:Date.now(),sel:sel};
  render();
 }

 function letterOf(item,pos){
  // исходная буква варианта, стоящего на позиции pos
  return LETTERS[item.order[pos]];
 }

 function renderQuestion(){
  var it=S.items[S.i], d=it.d, n=S.items.length;
  var pct=Math.round(S.i/n*100);
  var h='';
  h+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="meta"><span>Вопрос '+(S.i+1)+' из '+n+'</span>'+
     '<span>'+esc(d.mc)+' · '+esc(d.mt)+'</span></div>';
  h+='<div class="card"><p style="font-weight:600;margin-bottom:14px">'+esc(d.q)+'</p>';
  it.order.forEach(function(origIdx,pos){
   var txt=d.a[origIdx].replace(/^[A-F]\.\s*/,'');
   var cls='opt';
   if(it.ans===origIdx)cls+=' sel';
   if(it.done&&!S.exam){
    var isOk=LETTERS[origIdx]===d.ok;
    if(isOk)cls+=' ok';
    else if(it.ans===origIdx)cls+=' bad';
    else cls+=' dim';
   }
   h+='<label class="'+cls+'"><input type="radio" name="opt" value="'+origIdx+'"'+
      (it.ans===origIdx?' checked':'')+((it.done&&!S.exam)?' disabled':'')+'> '+
      '<b>'+LETTERS[pos]+'.</b> '+esc(txt)+'</label>';
  });
  if(it.done&&!S.exam){
   var ok=LETTERS[it.ans]===d.ok;
   h+='<div class="expl"><div class="verdict '+(ok?'ok':'bad')+'">'+
      (ok?'Верно':'Неверно')+'</div>';
   if(!ok){
    var correctPos=-1;it.order.forEach(function(o,p){if(LETTERS[o]===d.ok)correctPos=p;});
    h+='<p style="margin-bottom:8px">Правильный ответ: <b>'+LETTERS[correctPos]+'</b></p>';
   }
   h+='<p style="margin-bottom:0">'+esc(d.exp)+'</p>';
   if(d.su)h+='<p style="margin:8px 0 0"><a href="'+d.su+'" target="_blank" rel="noopener">'+esc(d.st||'Источник')+'</a></p>';
   h+='</div>';
  }
  h+='<div class="row">';
  if(!it.done&&!S.exam)h+='<button id="btnCheck"'+(it.ans===null?' disabled':'')+'>Проверить</button>';
  if(it.done||S.exam)h+='<button id="btnNext"'+(S.exam&&it.ans===null?' disabled':'')+'>'+
     (S.i===n-1?'Завершить':'Дальше')+'</button>';
  h+='<button class="ghost" id="btnQuit">Прервать</button>';
  h+='</div></div>';
  root.innerHTML=h;

  Array.prototype.forEach.call(root.querySelectorAll('input[name=opt]'),function(inp){
   inp.addEventListener('change',function(){it.ans=parseInt(this.value,10);
     renderQuestion();});
  });
  var bc=document.getElementById('btnCheck');
  if(bc)bc.addEventListener('click',function(){it.done=true;renderQuestion();});
  var bn=document.getElementById('btnNext');
  if(bn)bn.addEventListener('click',function(){
    it.done=true;
    if(S.i===S.items.length-1){finish();}else{S.i++;renderQuestion();}
  });
  document.getElementById('btnQuit').addEventListener('click',function(){
    if(confirm('Прервать прохождение? Результат не сохранится.'))menu();
  });
 }

 function finish(){
  var right=0,mistakes=[];
  S.items.forEach(function(it){
   var ok=it.ans!==null&&LETTERS[it.ans]===it.d.ok;
   if(ok)right++;else mistakes.push(it);
  });
  var n=S.items.length,pct=Math.round(right/n*100);
  var mins=Math.max(1,Math.round((Date.now()-S.started)/60000));

  var prog=load();
  var key=S.sel.mode==='mod'&&S.sel.mods.length===1?S.sel.mods[0]:(S.sel.mode==='sec'?S.sel.sec:'all');
  var prev=prog[key]||{best:0,runs:0};
  prog[key]={best:Math.max(prev.best,pct),runs:prev.runs+1,last:pct,date:new Date().toISOString().slice(0,10)};
  save(prog);

  var verdict=pct>=90?'отличный результат':pct>=70?'хороший результат':pct>=50?'требуется повторение':'раздел нужно проработать заново';
  var h='<div class="card" style="text-align:center">'+
   '<div class="score">'+pct+'%<small>'+right+' из '+n+' · '+mins+' мин · '+verdict+'</small></div></div>';

  if(mistakes.length){
   h+='<h3>Разбор ошибок ('+mistakes.length+')</h3>';
   mistakes.forEach(function(it){
    var d=it.d,correct='';
    d.a.forEach(function(t,k){if(LETTERS[k]===d.ok)correct=t.replace(/^[A-F]\.\s*/,'');});
    h+='<div class="mistake"><div class="qq">'+esc(d.q)+'</div>';
    h+='<p style="margin-bottom:6px"><span style="color:var(--ok)">Правильно:</span> '+esc(correct)+'</p>';
    if(it.ans!==null)h+='<p style="margin-bottom:6px;color:var(--bad)">Ваш ответ: '+esc(d.a[it.ans].replace(/^[A-F]\.\s*/,''))+'</p>';
    else h+='<p style="margin-bottom:6px;color:var(--muted)">Ответ не дан</p>';
    h+='<p style="margin-bottom:4px">'+esc(d.exp)+'</p>';
    if(d.su)h+='<p style="margin:0"><a href="'+d.su+'" target="_blank" rel="noopener">'+esc(d.st||'Источник')+'</a></p>';
    h+='<p class="hint" style="margin-top:6px">'+esc(d.mc)+' · '+esc(d.mt)+'</p></div>';
   });
  }else{
   h+='<div class="stat">Все ответы верны. Можно перейти к следующему разделу.</div>';
  }
  h+='<div class="row">';
  if(mistakes.length)h+='<button id="btnRetryErr">Повторить ошибки</button>';
  h+='<button class="ghost" id="btnAgain">Пройти заново</button>'+
     '<button class="ghost" id="btnMenu">К выбору темы</button></div>';
  root.innerHTML=h;window.scrollTo(0,0);

  var br=document.getElementById('btnRetryErr');
  if(br)br.addEventListener('click',function(){
    S.items=mistakes.map(function(it){it.ans=null;it.done=false;return it;});
    shuffle(S.items);S.i=0;S.started=Date.now();renderQuestion();window.scrollTo(0,0);
  });
  document.getElementById('btnAgain').addEventListener('click',function(){start(S.sel);window.scrollTo(0,0);});
  document.getElementById('btnMenu').addEventListener('click',menu);
 }

 function render(){renderQuestion();window.scrollTo(0,0);}

 function menu(){
  var prog=load();
  var secs=allSections();
  var h='';
  h+='<h2>Банк тестов ординатора</h2>';
  h+='<p class="lede">'+totalQ()+' вопросов по '+MODS.length+' темам курса. У каждого вопроса — пояснение и ссылка на источник.</p>';

  h+='<div class="card">';
  h+='<div class="field"><span>Что проходим</span><select id="selMode">'+
     '<option value="sec">Раздел программы</option>'+
     '<option value="mod">Отдельные темы</option>'+
     '<option value="all">Все темы курса</option></select></div>';

  h+='<div class="field" id="wrapSec"><span>Раздел</span><select id="selSec">'+
     secs.map(function(s){var c=MODS.filter(function(m){return m.s===s;}).reduce(function(a,m){return a+m.q.length;},0);
       return '<option value="'+esc(s)+'">'+esc(s)+' — '+c+' вопросов</option>';}).join('')+
     '</select></div>';

  h+='<div class="field" id="wrapMod" style="display:none"><span>Темы (можно несколько)</span><div class="modlist">'+
     MODS.map(function(m){var p=prog[m.c];
       return '<label><input type="checkbox" class="chkMod" value="'+m.c+'"> '+esc(m.c)+' — '+esc(m.t)+
       ' <span class="hint" style="display:inline">('+m.q.length+')</span>'+
       (p?'<span class="tag">лучший '+p.best+'%</span>':'')+'</label>';}).join('')+
     '</div></div>';

  h+='<div class="field"><span>Число вопросов</span><select id="selN">'+
     '<option value="10">10</option><option value="20" selected>20</option>'+
     '<option value="30">30</option><option value="50">50</option>'+
     '<option value="0">Все доступные</option></select></div>';

  h+='<div class="field"><span>Режим</span><select id="selExam">'+
     '<option value="0">Тренировка — проверка сразу, с пояснением</option>'+
     '<option value="1">Экзамен — проверка в конце</option></select></div>';

  h+='<div class="field"><label style="font-size:.92rem;cursor:pointer">'+
     '<input type="checkbox" id="chkShuf" checked> перемешивать варианты ответов</label></div>';

  h+='<div class="row"><button id="btnStart">Начать</button>';
  if(Object.keys(prog).length)h+='<button class="ghost" id="btnReset">Сбросить статистику</button>';
  h+='</div></div>';

  var keys=Object.keys(prog);
  if(keys.length){
   h+='<h3>Ваши результаты</h3><div class="card">';
   keys.forEach(function(k){
    var p=prog[k],mod=MODS.filter(function(m){return m.c===k;})[0];
    var name=mod?(k+' — '+mod.t):(k==='all'?'Все темы курса':k);
    h+='<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem">'+
       '<span>'+esc(name)+'</span><span style="white-space:nowrap;color:var(--muted)">лучший '+p.best+'% · попыток '+p.runs+'</span></div>';
   });
   h+='</div>';
  }
  h+='<p class="hint">Результаты сохраняются в этом браузере и видны только вам. Пояснения к вопросам предназначены для разбора, а не для заучивания: при расхождении с действующими клиническими рекомендациями приоритет за рекомендациями.</p>';
  root.innerHTML=h;

  function sync(){
   var m=document.getElementById('selMode').value;
   document.getElementById('wrapSec').style.display=m==='sec'?'':'none';
   document.getElementById('wrapMod').style.display=m==='mod'?'':'none';
  }
  document.getElementById('selMode').addEventListener('change',sync);sync();

  document.getElementById('btnStart').addEventListener('click',function(){
   var mode=document.getElementById('selMode').value;
   var mods=Array.prototype.map.call(root.querySelectorAll('.chkMod:checked'),function(c){return c.value;});
   if(mode==='mod'&&!mods.length){alert('Выберите хотя бы одну тему.');return;}
   start({mode:mode,sec:document.getElementById('selSec').value,mods:mods,
     n:parseInt(document.getElementById('selN').value,10),
     exam:document.getElementById('selExam').value==='1',
     shuffleA:document.getElementById('chkShuf').checked});
  });
  var brs=document.getElementById('btnReset');
  if(brs)brs.addEventListener('click',function(){
   if(confirm('Удалить сохранённую статистику?')){save({});menu();}
  });
 }
 menu();
})();
</script>
