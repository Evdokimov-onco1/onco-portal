онитом, эзофагитом в границах прежнего поля. Требует отмены препарата-провокатора и симптоматического лечения.","CTCAE v6.0","https://dctd.cancer.gov/research/ctep-trials/for-sites/adverse-events/ctcae-v6.pdf"],["Концепция олигометастатической болезни в лучевой терапии означает, что:",["A. Требуется облучение всего тела","B. Облучение всегда паллиативно","C. Метастазы не облучают","D. При ограниченном числе очагов стереотаксическое облучение всех проявлений болезни может улучшать выживаемость, а не только облегчать симптомы"],"D","SABR-COMET показало выигрыш в выживаемости при стереотаксическом облучении всех очагов у больных с ограниченным метастазированием. Это изменило само отношение к лучевой терапии при метастатической болезни: она перестала быть исключительно паллиативным методом. Отбор больных критичен, а решение принимается консилиумом.","SABR-COMET — long-term results","https://pubmed.ncbi.nlm.nih.gov/32484754/"]]},{"c":"М-31","t":"Немелкоклеточный рак лёгкого: ранние и местнораспространённые стадии","s":"Частная онкология, ч. 1","q":[["Какой метод предпочтителен для морфологического стадирования средостения при раке лёгкого?",["A. Только ПЭТ-КТ","B. Только КТ","C. Эндобронхиальная ультрасонография с тонкоигольной аспирацией как метод первой линии, медиастиноскопия при отрицательном результате и сохраняющемся подозрении","D. Только медиастиноскопия"],"C","КТ и ПЭТ/КТ оценивают вероятность поражения лимфоузлов, но не заменяют морфологическое подтверждение, когда оно требуется. При наличии показаний к инвазивному стадированию EBUS/EUS с пункцией являются предпочтительными малоинвазивными методами первого этапа при наличии экспертизы. Если результат отрицательный, а клиническое подозрение на N2/N3 сохраняется, вопрос хирургического стадирования решают индивидуально.","ESTS 2014 guideline — invasive mediastinal staging with EBUS/EUS","https://pubmed.ncbi.nlm.nih.gov/25806304/"],["При периферической опухоли лёгкого до 2 см у операбельного больного:",["A. Обязательна лобэктомия во всех случаях","B. Сегментэктомия не уступает лобэктомии и предпочтительна при сохранении адекватного края","C. Обязательна пневмонэктомия","D. Операция не показана"],"B","JCOG0802 и CALGB 140503 показали равноценность, а в японском исследовании — превосходство сегментэктомии по общей выживаемости при малых периферических опухолях. Сохранение паренхимы важно при сниженной функции лёгких и при риске второй первичной опухоли, что у больных раком лёгкого нередко.","JCOG0802/WJOG4607L","https://pubmed.ncbi.nlm.nih.gov/35461558/"],["Что необходимо определить до начала периоперационного лечения при резектабельном НМРЛ?",["A. Молекулярный статус (EGFR, ALK) и экспрессию PD-L1","B. Только гистологический тип","C. Ничего дополнительно","D. Только PD-L1"],"A","При мутации EGFR или перестройке ALK периоперационная иммунотерапия не показана: эффективность её в этих подгруппах низка, а правильная тактика — адъювантный осимертиниб (ADAURA) или алектиниб (ALINA). Назначение иммунотерапии перед таргетным препаратом создаёт дополнительный риск токсичности при последующем переходе на ингибитор тирозинкиназ.","ADAURA — updated results","https://pubmed.ncbi.nlm.nih.gov/36720083/"],["Что показало исследование ADAURA?",["A. Эффект только при III стадии","B. Адъювантный осимертиниб резко снижает риск рецидива, включая внутричерепной, и улучшает общую выживаемость при резецированном EGFR-мутированном НМРЛ","C. Осимертиниб не эффективен в адъювантном режиме","D. Показана только химиотерапия"],"B","Помимо выигрыша по безрецидивной выживаемости, впоследствии подтверждён выигрыш и по общей. Особенно выражено снижение частоты метастазов в головной мозг, что отражает высокую внутричерепную активность препарата. Следствие для практики: тестирование EGFR обязательно при резектабельных стадиях, а не только при метастатической болезни.","ADAURA — updated results","https://pubmed.ncbi.nlm.nih.gov/36720083/"],["Основное преимущество неоадъювантного подхода перед адъювантным при резектабельном НМРЛ:",["A. Меньшая стоимость","B. Сокращение сроков лечения","C. Отказ от операции","D. Возможность оценить ответ опухоли in vivo по степени патоморфологического регресса и лучшая переносимость лечения до операции"],"D","Полный патоморфологический ответ — сильный прогностический фактор и ранняя точка оценки эффективности. Кроме того, до операции больные переносят системную терапию лучше, а после торакотомии значительная часть не получает запланированную адъювантную терапию. Периоперационные режимы объединяют оба этапа.","CheckMate 816","https://pubmed.ncbi.nlm.nih.gov/35403841/"],["Стандарт при неоперабельной III стадии НМРЛ без драйверных мутаций:",["A. Хирургическое лечение","B. Только лучевая терапия","C. Только химиотерапия","D. Одновременная химиолучевая терапия с последующим консолидирующим дурвалумабом"],"D","PACIFIC установил стандарт: после завершения химиолучевой терапии без прогрессирования назначается дурвалумаб на год. При длительном наблюдении сохраняется значимая доля живущих больных, что для III стадии рака лёгкого — принципиальное изменение. Важно не упустить окно: препарат начинают в установленный срок после завершения облучения.","PACIFIC — durvalumab after chemoradiotherapy","https://pubmed.ncbi.nlm.nih.gov/28885881/"],["Больной с неоперабельной III стадией и мутацией EGFR завершил химиолучевую терапию. Что назначить?",["A. Осимертиниб по данным LAURA","B. Наблюдение","C. Химиотерапию","D. Дурвалумаб"],"A","LAURA показала существенное преимущество осимертиниба над плацебо в этой подгруппе. Данные по эффективности дурвалумаба при мутации EGFR слабые, а последовательное назначение ингибитора контрольных точек и осимертиниба повышает риск пневмонита. Это ещё один аргумент за молекулярное тестирование до начала лечения III стадии.","LAURA — osimertinib after chemoradiotherapy","https://pubmed.ncbi.nlm.nih.gov/38828946/"],["Неоперабельный периферический НМРЛ I стадии у пациента, не являющегося кандидатом на операцию. Какой локальный метод является стандартным вариантом при технической выполнимости?",["A. Только обычная фракционированная лучевая терапия 60–66 Гр","B. Только системная химиотерапия","C. Наблюдение без локального лечения","D. Стереотаксическая лучевая терапия (SBRT/SABR)"],"D","SBRT/SABR является стандартным локальным вариантом для medically inoperable раннего НМРЛ при подходящей анатомии и наличии технической возможности. Она обеспечивает высокий локальный контроль при небольшом числе фракций. Для центральных/ультрацентральных опухолей режим и ограничения отличаются, а выбор лечения учитывает функцию лёгких, размеры, локализацию и ожидаемую продолжительность жизни. Поэтому слово «оптимальная» без оговорок заменено на «стандартный вариант».","ASTRO Guideline — SBRT for early-stage NSCLC","https://www.astro.org/provider-resources/guidelines/astro-s-guideline-on-sbrt-for-early-stage-nsclc"],["Адъювантная химиотерапия после радикальной операции при НМРЛ показана:",["A. Всем больным","B. Начиная со стадии II и при IB с факторами риска; абсолютный выигрыш умеренный","C. Не показана никому","D. Только при I стадии"],"B","Платиносодержащие дублеты дают прирост пятилетней выживаемости порядка нескольких процентов, преимущественно при II и III стадиях. При стадии IA адъювантная химиотерапия не показана и может быть вредна. Решение принимается с учётом функционального статуса и восстановления после операции.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Основная причина, по которой при раке лёгкого важно раннее подключение отказа от курения:",["A. Отказ снижает частоту периоперационных осложнений, улучшает переносимость лучевой терапии и связан с лучшей выживаемостью даже после установления диагноза","B. Только профилактика второй опухоли","C. Только косметический эффект","D. Не влияет ни на что"],"A","Продолжение курения ухудшает заживление, повышает частоту лёгочных осложнений после операции, снижает радиочувствительность опухоли и усиливает лучевые реакции. Отказ даже за несколько недель до вмешательства даёт измеримый эффект, поэтому активная поддержка отказа — часть лечения, а не общая рекомендация.","PDQ® — рак лёгкого","https://www.cancer.gov/publications/pdq"]]},{"c":"М-32","t":"Распространённый немелкоклеточный рак лёгкого без драйверных мутаций","s":"Частная онкология, ч. 1","q":[["Какой показатель определяет выбор между монотерапией ингибитором контрольных точек и комбинацией с химиотерапией в первой линии?",["A. Гистологический тип","B. Пол","C. Возраст","D. Уровень экспрессии PD-L1 в сочетании с клинической ситуацией"],"D","При PD-L1 не менее 50 % возможна монотерапия пембролизумабом (KEYNOTE-024). При более низкой экспрессии показана комбинация с химиотерапией. Однако даже при высоком PD-L1 при большой опухолевой массе, симптомной болезни и необходимости быстрого ответа предпочтительна комбинация: иммунотерапия действует не сразу.","KEYNOTE-024","https://pubmed.ncbi.nlm.nih.gov/27718847/"],["При неплоскоклеточном раке лёгкого с PD-L1 15 % в первой линии обосновано:",["A. Только химиотерапия","B. Монотерапия пембролизумабом","C. Наблюдение","D. Пембролизумаб с платиной и пеметрекседом"],"D","KEYNOTE-189 показал преимущество комбинации над химиотерапией независимо от уровня PD-L1, включая больных с низкой экспрессией. При PD-L1 ниже 50 % монотерапия уступает комбинации, поэтому применяется именно комбинированный режим.","KEYNOTE-189","https://pubmed.ncbi.nlm.nih.gov/29658856/"],["Стандартная максимальная длительность иммунотерапии при достижении контроля болезни:",["A. До 2 лет","B. 4 цикла","C. Пожизненно","D. 6 месяцев"],"A","В регистрационных исследованиях терапия продолжалась до двух лет при отсутствии прогрессирования и неприемлемой токсичности. Часть больных сохраняет ответ после прекращения, что отражает формирование иммунологической памяти; при последующем прогрессировании возможна повторная попытка иммунотерапии.","KEYNOTE-024","https://pubmed.ncbi.nlm.nih.gov/27718847/"],["Больной получает пембролизумаб, через 3 месяца появилась одышка и на КТ двусторонние изменения по типу «матового стекла». Первоочередные действия:",["A. Начать химиотерапию","B. Назначить бронхолитики","C. Приостановить иммунотерапию, исключить инфекцию и прогрессирование, начать системные глюкокортикоиды при клинически значимой симптоматике","D. Продолжить терапию"],"C","Иммуноопосредованный пневмонит при раке лёгкого встречается чаще, чем при других нозологиях, поскольку лёгкие уже поражены опухолью и часто предшествующим облучением. Дифференцируется с инфекцией, прогрессированием, лимфангитом и сердечной недостаточностью. При 2-й степени — приостановка и глюкокортикоиды, при 3–4-й — окончательная отмена.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["В чём принципиальное отличие комбинации двух ингибиторов контрольных точек от комбинации с химиотерапией?",["A. В стоимости","B. Отличий нет","C. Двойная блокада даёт более длительное плато на кривой выживаемости, но медленнее развивается эффект и выше частота иммуноопосредованных явлений","D. Двойная блокада эффективнее у всех"],"C","CheckMate 227 показал длительное сохранение эффекта у части больных, но за счёт более высокой иммунной токсичности и отсутствия быстрого ответа. Добавление двух циклов химиотерапии в CheckMate 9LA было призвано решить именно проблему раннего контроля болезни. Выбор зависит от темпа прогрессирования и сопутствующей патологии.","CheckMate 9LA — final 6-year outcomes","https://pubmed.ncbi.nlm.nih.gov/40446626/"],["Больному с активным аутоиммунным заболеванием, требующим иммуносупрессии, и PD-L1 70 %:",["A. Решение индивидуально: при активном заболевании на иммуносупрессии предпочтительна химиотерапия, иммунотерапия обсуждается при контролируемом течении","B. Лечение не показано","C. Иммунотерапия абсолютно показана","D. Показана только лучевая терапия"],"A","Активное аутоиммунное заболевание — относительное противопоказание. Кроме риска обострения, значима сама иммуносупрессия: глюкокортикоиды в дозе выше эквивалента 10 мг преднизолона снижают эффективность ингибиторов контрольных точек. При контролируемом заболевании иммунотерапия возможна при усиленном мониторинге и совместном ведении с профильным специалистом.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Что означает олигопрогрессирование и как оно меняет тактику?",["A. Рост одного-двух очагов при контроле остальных; возможно локальное воздействие с продолжением прежней системной терапии","B. Повышение маркёров","C. Прогрессирование во всех очагах; требуется смена линии","D. Появление симптомов"],"A","При олигопрогрессировании смена эффективной системной терапии преждевременна. Стереотаксическое облучение или резекция прогрессирующего очага позволяет продолжить прежний режим и отсрочить переход на менее эффективную следующую линию. Решение принимается консилиумом.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Какая из перечисленных опций остаётся доказанным стандартным вариантом после прогрессирования неплоскоклеточного НМРЛ без драйверной мишени на платиновом режиме и иммунотерапии?",["A. Повторение той же платиносодержащей схемы всем пациентам","B. Повторная иммунотерапия независимо от предшествующего ответа","C. Доцетаксел, в том числе в комбинации с рамуцирумабом; выбор дальнейших препаратов зависит от молекулярного профиля, гистологии и доступных одобрений","D. Только симптоматическая терапия"],"C","В TROPION-Lung01 датопотамаб дерукстекан улучшил БПВ по сравнению с доцетакселом (4,4 против 3,7 мес; HR 0,75), но не показал статистически значимого преимущества по ОВ (12,9 против 11,8 мес; HR 0,94). Польза по БПВ была преимущественно в неплоскоклеточной подгруппе. Поэтому формулировка, что TROP2-конъюгаты уже универсально «входят в стандарт второй линии», была слишком широкой.","TROPION-Lung01 — datopotamab deruxtecan versus docetaxel","https://pubmed.ncbi.nlm.nih.gov/39250535/"],["Экспрессия PD-L1 при раке лёгкого оценивается как:",["A. Комбинированный индекс с иммунными клетками во всех тестах","B. Процент площади среза","C. CPS","D. TPS — доля опухолевых клеток с мембранным окрашиванием"],"D","При немелкоклеточном раке лёгкого используется TPS. Это отличается от рака желудка, пищевода и опухолей головы и шеи, где применяется CPS, учитывающий также иммунные клетки. Перенос порогов между системами недопустим. Кроме того, экспрессия гетерогенна и может различаться между первичной опухолью и метастазом.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Почему при распространённом неплоскоклеточном НМРЛ результаты молекулярного тестирования желательно получить до начала иммунотерапии, даже при высокой PD-L1?",["A. Драйверные нарушения могут определять более эффективную таргетную терапию, а последовательность ICI → некоторые TKI способна повышать риск токсичности","B. Только для научных целей","C. Это нужно только некурящим","D. Молекулярный профиль не влияет на первую линию"],"A","Высокая экспрессия PD-L1 не исключает наличие драйверного нарушения. При EGFR-, ALK- и ряде других онкогенных зависимостей приоритет обычно имеет соответствующая таргетная терапия, а эффективность моноиммунотерапии ниже. Кроме того, последовательность ингибитора контрольных точек с последующим осимертинибом ассоциирована с повышенным риском тяжёлых иммунных токсичностей. Поэтому при клинически стабильной ситуации целесообразно дождаться результатов полноценного молекулярного профиля.","ESMO Living Guideline — metastatic non-oncogene-addicted NSCLC update 2025","https://pubmed.ncbi.nlm.nih.gov/40543845/"]]},{"c":"М-33","t":"Распространённый немелкоклеточный рак лёгкого с драйверными мутациями","s":"Частная онкология, ч. 1","q":[["Минимальный объём молекулярного тестирования при впервые выявленной неплоскоклеточной карциноме лёгкого:",["A. EGFR, ALK, ROS1, BRAF, KRAS G12C, MET exon14, RET, NTRK, HER2 и PD-L1; предпочтительна широкая панель одномоментно","B. Только EGFR","C. Только PD-L1","D. Только ALK"],"A","Последовательное тестирование по одному гену расходует ткань и время. Рекомендации ESMO указывают немелкоклеточный рак лёгкого как нозологию, где широкое секвенирование оправдано рутинно. Для выявления слияний предпочтительны методики на основе РНК: панели на ДНК их пропускают.","ESMO Clinical Practice Guidelines · OncoKB","https://www.oncokb.org/"],["Какие современные варианты первой линии существуют при распространённом НМРЛ с классической активирующей мутацией EGFR (del19 или L858R)?",["A. Только химиотерапия","B. Только пембролизумаб при PD-L1 ≥50%","C. Осимертиниб; у подходящих пациентов также используются стратегии интенсификации, включая осимертиниб + платина/пеметрексед или амивантамаб + лазертиниб с учётом регистрации и токсичности","D. Только ингибитор ALK"],"C","Осимертиниб остаётся хорошо установленным вариантом первой линии. Результаты FLAURA2 и MARIPOSA добавили стратегии с улучшением контроля заболевания ценой большей токсичности и сложности лечения. Поэтому вопрос должен проверять знание доступных современных опций, а не предполагать единственный универсальный режим.","ESMO oncogene-addicted metastatic NSCLC guideline","https://pubmed.ncbi.nlm.nih.gov/40571160/"],["Что показало исследование FLAURA2?",["A. Добавление платины с пеметрекседом к осимертинибу улучшает беспрогрессивную и общую выживаемость с приростом медианы около 10 мес","B. Эффект только при поражении головного мозга","C. Отсутствие пользы от добавления химиотерапии","D. Химиотерапия эффективнее осимертиниба"],"A","Отношение рисков по общей выживаемости составило 0,77. Плата — токсичность химиотерапии: миелосупрессия, тошнота, необходимость внутривенных введений. Поэтому обсуждение с пациентом строится вокруг того, что он готов принять ради выигрыша, и вокруг качества жизни.","FLAURA2","https://pubmed.ncbi.nlm.nih.gov/37937763/"],["Ключевое ограничение при интерпретации результатов MARIPOSA:",["A. Короткое наблюдение","B. Малая выборка","C. Переход больных контрольной группы на исследуемый режим не допускался, тогда как в других исследованиях доступ к последующей терапии был шире — это затрудняет прямое сравнение","D. Отсутствие рандомизации"],"C","MARIPOSA показала прирост общей выживаемости более 12 мес по сравнению с осимертинибом. Однако отсутствие кроссовера означает, что часть выигрыша может отражать не превосходство режима, а ограниченный доступ контрольной группы к эффективным последующим линиям. Это классический пример того, почему дизайн исследования нужно учитывать при сравнении результатов разных работ.","MARIPOSA — amivantamab plus lazertinib","https://pubmed.ncbi.nlm.nih.gov/38924756/"],["Инсерции в экзоне 20 гена EGFR отличаются тем, что:",["A. Встречаются только у курильщиков","B. Не требуют лечения","C. Наиболее чувствительны к осимертинибу","D. Не отвечают на обычные ингибиторы тирозинкиназ; обоснована комбинация амивантамаба с химиотерапией"],"D","Структурные особенности инсерций экзона 20 препятствуют связыванию стандартных ингибиторов. PAPILLON показал эффективность амивантамаба с химиотерапией в первой линии. Практическое следствие: указание в отчёте «мутация EGFR» недостаточно, нужно знать конкретный вариант.","PAPILLON — amivantamab plus chemotherapy","https://pubmed.ncbi.nlm.nih.gov/37870976/"],["У пациента ALK-положительный распространённый НМРЛ с метастазами в головной мозг. Какой принцип выбора первой линии наиболее обоснован?",["A. Предпочесть препарат без внутричерепной активности","B. Использовать ALK-TKI нового поколения с высокой активностью в ЦНС; конкретный препарат выбирают с учётом доказательств, токсичности и доступности","C. Только химиотерапию","D. Только WBRT независимо от симптомов"],"B","ALK-TKI нового поколения, включая алектиниб, бригатиниб и лорлатиниб, обладают выраженной внутричерепной активностью и предпочтительны перед кризотинибом. Между ними нет универсально лучшего выбора для каждого пациента: учитывают профиль токсичности, сопутствующие заболевания, лекарственные взаимодействия и регуляторную доступность.","ESMO oncogene-addicted metastatic NSCLC guideline","https://pubmed.ncbi.nlm.nih.gov/40571160/"],["Специфические нежелательные явления лорлатиниба:",["A. Кардиотоксичность","B. Гиперлипидемия, требующая гиполипидемической терапии, и когнитивные нарушения с изменениями настроения","C. Ототоксичность","D. Нефротоксичность"],"B","Гиперхолестеринемия и гипертриглицеридемия развиваются у большинства больных и управляются статинами и фибратами. Когнитивные и психоэмоциональные изменения — замедленность, нарушения памяти, раздражительность — обратимы при редукции дозы, но их важно активно выявлять: пациенты часто не связывают их с препаратом, а родственники замечают раньше самого больного.","CROWN — 5-year outcomes","https://pubmed.ncbi.nlm.nih.gov/38819031/"],["Пациент с EGFR-мутированным НМРЛ прогрессирует после длительного ответа на осимертиниб. Какой следующий диагностический шаг наиболее информативен?",["A. Немедленно начать химиотерапию без повторного молекулярного анализа","B. Увеличить дозу осимертиниба всем пациентам","C. Добавить иммунотерапию без уточнения механизма резистентности","D. Выполнить молекулярное исследование при прогрессировании — предпочтительно тканевую повторную биопсию, если она безопасна и доступна, либо исследование циркулирующей опухолевой ДНК; при подозрении на трансформацию необходима ткань"],"D","После прогрессирования на осимертинибе механизм резистентности может быть геномным или гистологическим. Повторное молекулярное исследование способно выявить, например, MET-амплификацию и другие потенциально значимые изменения. Жидкостная биопсия полезна, если ткань недоступна, но гистологическую трансформацию подтверждает только тканевая биопсия.","Rebiopsy on Osi — resistance mechanisms after first-line osimertinib","https://pubmed.ncbi.nlm.nih.gov/42502985/"],["Пропуск экзона 14 гена MET как мишень характерен для:",["A. Только плоскоклеточного рака","B. Пожилых больных, часто с саркоматоидной гистологией; эффективны тепотиниб и капматиниб","C. Молодых некурящих","D. Только женщин"],"B","Это одна из немногих драйверных мишеней, чаще встречающихся у пожилых. Ингибиторы MET дают высокую частоту ответов при пероральном приёме, что особенно ценно в этой возрастной группе. Характерное нежелательное явление — периферические отёки, иногда выраженные.","VISION — tepotinib in MET exon 14 skipping NSCLC","https://pubmed.ncbi.nlm.nih.gov/32469184/"],["Почему при драйверных нарушениях иммунотерапия в первой линии не применяется?",["A. Она противопоказана","B. Эффективность в этих подгруппах низка, а последовательное назначение ингибитора контрольных точек и ингибитора тирозинкиназ повышает риск тяжёлой токсичности, прежде всего пневмонита","C. Из-за отсутствия данных","D. Из-за стоимости"],"B","Опухоли с драйверными нарушениями обычно имеют низкую мутационную нагрузку и слабый иммунный ответ. Дополнительная опасность — длительный период полувыведения антител: назначение осимертиниба вскоре после ингибитора контрольных точек связано с высокой частотой тяжёлого пневмонита. Поэтому порядок назначения имеет значение.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-34","t":"Мелкоклеточный рак лёгкого; нейроэндокринные опухоли лёгкого","s":"Частная онкология, ч. 1","q":[["Основная клиническая особенность мелкоклеточного рака лёгкого:",["A. Редкость метастазов в мозг","B. Отсутствие связи с курением","C. Крайне быстрый рост и раннее метастазирование при высокой исходной чувствительности к химиотерапии и облучению","D. Медленный рост"],"C","Сочетание высокой чувствительности и быстрого возврата болезни определяет всю тактику: лечение начинается срочно, ответы достигаются быстро и часто впечатляют, но рецидивы наступают рано. Практическое следствие — откладывать начало терапии на дни недопустимо.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Каков базовый современный подход первой линии при распространённой стадии мелкоклеточного рака лёгкого у пациента, подходящего для иммунотерапии?",["A. Платина + этопозид в сочетании с атезолизумабом или дурвалумабом с последующей поддерживающей иммунотерапией","B. Только хирургия","C. Только лучевая терапия","D. Только топотекан"],"A","Добавление атезолизумаба или дурвалумаба к платине/этопозиду улучшило общую выживаемость и стало стандартным подходом для большинства подходящих пациентов с распространённой стадией МРЛ. При противопоказаниях к иммунотерапии платина + этопозид остаётся обоснованным вариантом.","ESMO Clinical Practice Guideline — Small-cell lung cancer","https://pubmed.ncbi.nlm.nih.gov/33864941/"],["Что изменило исследование ADRIATIC?",["A. Показало выигрыш консолидирующего дурвалумаба после химиолучевой терапии при локализованной стадии","B. Отменило лучевую терапию","C. Заменило химиотерапию","D. Показало неэффективность иммунотерапии"],"A","Локализованная стадия мелкоклеточного рака долго оставалась без изменений в стандарте. ADRIATIC добавила консолидирующую иммунотерапию с улучшением беспрогрессивной и общей выживаемости, повторив логику PACIFIC при немелкоклеточном раке.","ADRIATIC — durvalumab in limited-stage SCLC","https://pubmed.ncbi.nlm.nih.gov/39293902/"],["Тарлатамаб относится к классу:",["A. Конъюгатов антитело–препарат","B. Биспецифических антител, связывающих DLL3 на опухолевой клетке и CD3 на T-лимфоците","C. Ингибиторов тирозинкиназ","D. Ингибиторов контрольных точек"],"B","DLL3 экспрессируется на большинстве клеток мелкоклеточного рака и практически отсутствует в нормальных тканях, что делает его удобной мишенью. Тарлатамаб даёт длительные ответы у части больных с рецидивом. Требуются ступенчатое наращивание дозы и наблюдение в первые введения из-за синдрома высвобождения цитокинов и неврологической токсичности.","DeLLphi-301 — tarlatamab in previously treated SCLC","https://pubmed.ncbi.nlm.nih.gov/37861218/"],["Профилактическое облучение головного мозга при мелкоклеточном раке в настоящее время:",["A. Обсуждается индивидуально: альтернатива — активное наблюдение с регулярной МРТ, учитывая нейрокогнитивную токсичность облучения","B. Заменено химиотерапией","C. Обязательно всем","D. Не применяется никогда"],"A","Исторические исследования проводились до широкой доступности МРТ, и часть «профилактического» эффекта отражала лечение невыявленных метастазов. Современные данные и доступность МРТ сделали возможным подход с регулярным наблюдением. Решение принимается с учётом стадии, ответа на терапию, возраста и когнитивного статуса.","ESTRO-EORTC guideline — radiotherapy for stage I-III small-cell lung cancer","https://pubmed.ncbi.nlm.nih.gov/41932500/"],["Как сегодня следует подходить к профилактическому облучению головного мозга (PCI) после ответа на лечение ограниченной стадии МРЛ?",["A. PCI полностью утратило значение и противопоказано","B. PCI остаётся стандартным подходом после ответа; МРТ-наблюдение без PCI изучается как альтернативная стратегия и требует строгого контроля","C. Достаточно одной КТ головного мозга","D. Всем пациентам вместо PCI выполняют стереотаксическую радиохирургию"],"B","Современные европейские рекомендации по лучевой терапии МРЛ сохраняют PCI как стандарт после ответа на лечение ограниченной стадии. При этом в эпоху регулярной МРТ активно исследуется стратегия наблюдения с ранним локальным лечением выявленных метастазов, особенно с учётом нейрокогнитивной токсичности PCI. Поэтому представлять МРТ-наблюдение как уже доказанную равнозначную замену PCI для всех пациентов преждевременно.","PDQ® — мелкоклеточный рак лёгкого","https://www.cancer.gov/publications/pdq"],["При рецидиве мелкоклеточного рака прогноз и выбор терапии определяются прежде всего:",["A. Гистологией","B. Уровнем лактатдегидрогеназы","C. Возрастом","D. Интервалом от завершения первой линии: при интервале более 6 месяцев возможна реиндукция платиносодержащим режимом, при коротком — прогноз хуже и требуются иные опции"],"D","Понятие платиночувствительного и платинорефрактерного рецидива определяет тактику. При длительном интервале повторное назначение платины с этопозидом даёт значимую частоту ответов. При коротком интервале рассматриваются топотекан, лурбинектедин, тарлатамаб и клинические исследования.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Чем типичный карциноид лёгкого отличается от мелкоклеточного рака?",["A. Он не метастазирует никогда","B. Он более агрессивен","C. Ничем существенным","D. Это высокодифференцированная опухоль с низким индексом пролиферации, медленным течением и принципиально лучшим прогнозом; основной метод лечения при локализованных формах — хирургический"],"D","Смешение этих нозологий — распространённая и опасная ошибка. Типичный карциноид имеет пятилетнюю выживаемость свыше 90 % при радикальной операции, малочувствителен к химиотерапии и требует длительного наблюдения. Атипичный карциноид занимает промежуточное положение. Разграничение проводится по числу митозов и наличию некрозов.","ESMO Clinical Practice Guideline — lung and thymic carcinoids","https://pubmed.ncbi.nlm.nih.gov/33482246/"],["При распространённой нефункционирующей высокодифференцированной нейроэндокринной опухоли лёгкого обоснован:",["A. Эверолимус по данным RADIANT-4, а также аналоги соматостатина при экспрессии рецепторов","B. Платиносодержащий режим","C. Только наблюдение","D. Иммунотерапия"],"A","RADIANT-4 показал улучшение беспрогрессивной выживаемости при эверолимусе. Аналоги соматостатина применяются при подтверждённой экспрессии рецепторов по данным соответствующей визуализации. Платиносодержащие режимы при высокодифференцированных опухолях малоэффективны — они предназначены для низкодифференцированных нейроэндокринных карцином.","RADIANT-4","https://pubmed.ncbi.nlm.nih.gov/26703889/"],["Больной с локализованной стадией мелкоклеточного рака: когда начинать торакальное облучение?",["A. Через полгода","B. Рано, в первых циклах химиотерапии, при одновременном режиме","C. После завершения всей химиотерапии","D. Облучение не показано"],"B","При ограниченной стадии МРЛ стандартом остаётся ранняя конкурентная химиолучевая терапия. Исследование CONVERT не показало превосходства 66 Гр один раз в сутки над 45 Гр в 30 фракциях дважды в сутки; при длительном наблюдении режим 45 Гр дважды в сутки сохранил статус стандартного. Конкретное время начала облучения согласуют с общей тактикой и возможностью безопасно провести конкурентное лечение.","CONVERT — long-term once- vs twice-daily chemoradiotherapy","https://pubmed.ncbi.nlm.nih.gov/38521132/"]]},{"c":"М-35","t":"Мезотелиома; тимома и рак тимуса","s":"Частная онкология, ч. 1","q":[["Основной этиологический фактор мезотелиомы плевры:",["A. Вирусная инфекция","B. Ионизирующее излучение","C. Курение","D. Контакт с асбестом, часто за десятилетия до появления опухоли"],"D","Латентный период между экспозицией и развитием опухоли достигает 20–40 лет, поэтому профессиональный анамнез нужно собирать подробно, включая давние места работы и возможный контакт через одежду членов семьи. Курение, в отличие от рака лёгкого, самостоятельным фактором риска мезотелиомы не является, хотя усиливает риск рака лёгкого у контактировавших с асбестом.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Какой метод предпочтителен для диагностики при подозрении на мезотелиому?",["A. Пункционная биопсия под контролем УЗИ во всех случаях","B. Только КТ","C. Торакоскопия с множественной биопсией плевры и иммуногистохимическим исследованием","D. Цитологическое исследование плевральной жидкости"],"C","Цитология плевральной жидкости при мезотелиоме часто неинформативна: отличить реактивный мезотелий от опухолевого без оценки инвазии невозможно. Торакоскопия обеспечивает адекватный объём материала и позволяет одновременно выполнить плевродез. Диагноз требует иммуногистохимической панели, а утрата экспрессии BAP1 и делеция CDKN2A служат дополнительными аргументами в пользу злокачественности.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Гистологический вариант мезотелиомы имеет значение потому, что:",["A. Эпителиоидный вариант прогностически наиболее благоприятен, саркоматоидный и бифазный — наименее; при неэпителиоидных вариантах особенно выражен выигрыш от двойной иммунотерапии","B. Определяет только объём операции","C. Влияет на стадирование","D. Не имеет значения"],"A","Разделение на эпителиоидный, саркоматоидный и бифазный варианты — один из сильнейших прогностических факторов. В CheckMate 743 преимущество комбинации ниволумаба с ипилимумабом было наиболее выраженным именно при неэпителиоидных вариантах, тогда как при эпителиоидном разница с химиотерапией была меньше.","CheckMate 743","https://pubmed.ncbi.nlm.nih.gov/33485464/"],["Какие варианты системной терапии первой линии рекомендованы при впервые выявленной неоперабельной мезотелиоме плевры?",["A. Только наблюдение","B. Ниволумаб + ипилимумаб; также возможны платина + пеметрексед + пембролизумаб, а у отдельных пациентов платина + пеметрексед","C. Только лучевая терапия","D. Только хирургическое лечение"],"B","Обновление ASCO относит ниволумаб + ипилимумаб к доказанным вариантам первой линии, причём при неэпителиоидной гистологии этот режим особенно предпочтителен. Пембролизумаб + платина + пеметрексед также может применяться как первая линия; при эпителиоидной опухоли выбор между иммунотерапией, химиоиммунотерапией и химиотерапией зависит от сопутствующих заболеваний, потребности в быстром ответе и доступности. Поэтому прежний вопрос создавал впечатление только двух допустимых режимов.","ASCO Guideline Update — Treatment of Pleural Mesothelioma","https://ascopubs.org/doi/10.1200/JCO-24-02425"],["Что показало исследование MARS 2 в отношении радикальной хирургии при мезотелиоме?",["A. Хирургия обязательна всем","B. Расширенная плеврэктомия с декортикацией в дополнение к системной терапии не улучшила выживаемость и сопровождалась большей частотой осложнений","C. Результат неопределённый","D. Хирургия улучшает выживаемость"],"B","Исследование существенно сузило роль радикальных вмешательств, которые долго выполнялись, несмотря на высокую травматичность и отсутствие рандомизированных доказательств. Хирургия сохраняет роль в диагностике и в паллиативных целях: торакоскопия с плевродезом при рецидивирующем выпоте существенно улучшает качество жизни.","MARS 2 — extended pleurectomy decortication versus chemotherapy alone","https://pubmed.ncbi.nlm.nih.gov/38740044/"],["При мезотелиоме у больного моложе 50 лет без явного контакта с асбестом следует подумать о:",["A. Вирусной этиологии","B. Лучевом анамнезе исключительно","C. Ошибке диагноза","D. Герминальном варианте BAP1 и направлении на генетическое консультирование"],"D","Герминальные варианты BAP1 формируют синдром предрасположенности к мезотелиоме, увеальной меланоме, меланоме кожи и раку почки. Мезотелиома в молодом возрасте, отсутствие асбестового анамнеза и отягощённый семейный анамнез по этим опухолям — показания к тестированию зародышевой линии с последующим каскадным обследованием родственников.","Germline BAP1 mutations predispose to malignant mesothelioma","https://pubmed.ncbi.nlm.nih.gov/21874000/"],["Тимома примерно у трети больных сопровождается:",["A. Ревматоидным артритом","B. Сахарным диабетом","C. Тиреотоксикозом","D. Миастенией"],"D","Миастения — наиболее частый ассоциированный синдром; встречаются также истинная эритроцитарная аплазия и гипогаммаглобулинемия. Миастению необходимо выявить и стабилизировать до операции, поскольку неконтролируемое течение грозит послеоперационным миастеническим кризом с дыхательной недостаточностью.","ESMO Clinical Practice Guideline — thymic epithelial tumours","https://pubmed.ncbi.nlm.nih.gov/26314779/"],["Главный фактор, определяющий прогноз при тимоме:",["A. Размер опухоли","B. Уровень онкомаркеров","C. Полнота резекции и наличие инвазии за пределы капсулы","D. Возраст больного"],"C","Полная резекция — важнейший прогностический фактор, поэтому вмешательство планируется как радикальное с самого начала. При местнораспространённых формах применяется индукционная химиотерапия для достижения резектабельности. Стадия по системе Масаока — Кога определяет показания к послеоперационной лучевой терапии.","ESMO CPG — thymic epithelial tumours","https://pubmed.ncbi.nlm.nih.gov/26314779/"],["Особенность течения тимомы, влияющая на наблюдение:",["A. Возможность поздних рецидивов через много лет, что требует длительного наблюдения","B. Метастазирование только в кости","C. Быстрое прогрессирование","D. Отсутствие рецидивов"],"A","Тимома нередко течёт индолентно, и рецидивы описаны через десять и более лет после радикальной операции, чаще в виде плеврального диссеминирования. Поэтому наблюдение длительное, а при ограниченном рецидиве повторная операция обоснована и может дать длительный контроль.","ESMO CPG — thymic epithelial tumours","https://pubmed.ncbi.nlm.nih.gov/26314779/"],["Рак тимуса отличается от тимомы тем, что:",["A. Агрессивнее, чаще метастазирует, реже ассоциирован с аутоиммунными синдромами и требует более активного системного лечения","B. Не требует операции","C. Течёт благоприятнее","D. Всегда неоперабелен"],"A","Это разные заболевания, объединяемые локализацией. Рак тимуса имеет существенно худший прогноз, чаще даёт отдалённые метастазы и реже сопровождается миастенией. При распространённом процессе применяются платиносодержащие режимы, изучаются ингибиторы контрольных точек — с осторожностью, поскольку при тимоме частота иммуноопосредованных явлений, включая миокардит, повышена.","ESMO CPG — thymic epithelial tumours","https://pubmed.ncbi.nlm.nih.gov/26314779/"]]},{"c":"М-36","t":"Рак пищевода и пищеводно-желудочного перехода","s":"Частная онкология, ч. 1","q":[["Основное различие в этиологии плоскоклеточного рака и аденокарциномы пищевода:",["A. Аденокарцинома связана с курением","B. Различий нет","C. Оба варианта связаны только с питанием","D. Плоскоклеточный рак связан с курением и алкоголем и чаще локализуется в средней трети; аденокарцинома — с гастроэзофагеальным рефлюксом, пищеводом Барретта и ожирением, локализуется в нижней трети"],"D","Различие определяет и профилактику, и наблюдение, и лечение. Пищевод Барретта — предрак аденокарциномы, требующий эндоскопического наблюдения; при дисплазии высокой степени показано эндоскопическое лечение. Заболеваемость аденокарциномой в западных странах растёт вслед за распространённостью ожирения и рефлюкса.","Классификация опухолей ВОЗ","https://whobluebooks.iarc.fr/"],["Что показало исследование ESOPEC при аденокарциноме пищевода?",["A. Операция не нужна","B. Химиолучевая терапия превосходит FLOT","C. Периоперационная химиотерапия FLOT превзошла неоадъювантную химиолучевую терапию по схеме CROSS по общей выживаемости","D. Различий нет"],"C","ESOPEC (NEJM 2025) — первое прямое сравнение двух конкурирующих стандартов. Результат изменил практику: при аденокарциноме пищевода и пищеводно-желудочного перехода предпочтителен периоперационный FLOT. При плоскоклеточном раке химиолучевая терапия по схеме CROSS сохраняет своё место.","ESOPEC — perioperative FLOT versus CROSS","https://pubmed.ncbi.nlm.nih.gov/39842010/"],["Больной после неоадъювантной химиолучевой терапии и радикальной операции по поводу рака пищевода: остаточная опухоль в препарате. Тактика:",["A. Лучевая терапия","B. Адъювантный ниволумаб по данным CheckMate 577","C. Наблюдение","D. Повторная операция"],"B","CheckMate 577 показал удвоение медианы безрецидивной выживаемости при адъювантном ниволумабе у больных с остаточной опухолью после неоадъювантной химиолучевой терапии. Достижение полного патоморфологического ответа, напротив, означает благоприятный прогноз и в этом исследовании не рассматривалось.","CheckMate 577 — adjuvant nivolumab","https://pubmed.ncbi.nlm.nih.gov/33789008/"],["Наиболее значимая проблема сопроводительной терапии при раке пищевода:",["A. Кардиотоксичность","B. Дисфагия с нутритивной недостаточностью и потерей массы тела","C. Нефротоксичность","D. Алопеция"],"B","Нутритивный статус напрямую влияет на переносимость лечения, частоту осложнений операции и общую выживаемость. Требуются раннее вовлечение диетолога, при необходимости — установка питательной стомы или назогастрального зонда, а при обструкции — стентирование, хотя перед планируемой операцией стент нежелателен из-за риска осложнений.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["При метастатическом плоскоклеточном раке пищевода первая линия:",["A. Таргетная терапия","B. Лучевая терапия","C. Химиотерапия в комбинации с ингибитором контрольных точек либо двойная иммунотерапия, прежде всего при экспрессии PD-L1","D. Только химиотерапия"],"C","CheckMate 648 и KEYNOTE-590 показали выигрыш при добавлении ингибитора контрольных точек. Экспрессия PD-L1 оценивается по CPS, а не по TPS, и определяет силу выигрыша. Двойная иммунотерапия без химиотерапии — опция при противопоказаниях к платине, но эффект развивается медленнее.","CheckMate 648 — longer-term follow-up","https://pmc.ncbi.nlm.nih.gov/articles/PMC11077338/"],["Активное наблюдение вместо операции после химиолучевой терапии при раке пищевода:",["A. Изучаемая стратегия при клиническом полном ответе, прежде всего при плоскоклеточном раке; требует строгого протокола наблюдения и готовности к спасительной операции","B. Не изучается","C. Стандарт для всех","D. Применяется при аденокарциноме"],"A","Эзофагэктомия — операция с высокой заболеваемостью и заметной летальностью, поэтому попытки органосохранения оправданы. Ограничение: клинический полный ответ по эндоскопии и визуализации не всегда совпадает с патоморфологическим, поэтому стратегия применима только в рамках протоколов или в центрах с отработанной программой наблюдения.","SANO — active surveillance after clinical complete response","https://pubmed.ncbi.nlm.nih.gov/40112851/"],["Опухоли пищеводно-желудочного перехода классифицируются:",["A. Всегда как рак желудка","B. Не классифицируются отдельно","C. По классификации Зиверта в зависимости от расположения эпицентра относительно кардии, что определяет объём операции и алгоритм лечения","D. Всегда как рак пищевода"],"C","Классификация Зиверта разделяет опухоли на три типа по расстоянию эпицентра от кардии. Тип определяет хирургический доступ, объём резекции и лимфодиссекции, а также то, по какому алгоритму — пищеводному или желудочному — будет строиться системное лечение.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Какие исследования обязательны при аденокарциноме пищеводно-желудочного перехода перед началом лечения метастатической болезни?",["A. Только гистология","B. Только PD-L1","C. Только HER2","D. HER2, PD-L1 (CPS), статус MMR/MSI и CLDN18.2"],"D","Каждый маркёр открывает свою терапевтическую опцию: HER2 — анти-HER2-терапию и её комбинацию с пембролизумабом, PD-L1 — иммунотерапию, dMMR/MSI-H — высокую чувствительность к ингибиторам контрольных точек, CLDN18.2 — зольбетуксимаб. Тестирование выполняется одномоментно до начала первой линии.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Пищевод Барретта с дисплазией высокой степени требует:",["A. Только антисекреторной терапии","B. Эзофагэктомии всем","C. Эндоскопического лечения — резекции или аблации — в специализированном центре","D. Наблюдения"],"C","Дисплазия высокой степени сопряжена с высоким риском прогрессирования в аденокарциному. Эндоскопическая резекция с последующей радиочастотной аблацией позволяет избежать эзофагэктомии с её высокой заболеваемостью. Обязательны подтверждение диагноза вторым патологом и наблюдение после лечения.","Классификация опухолей ВОЗ","https://whobluebooks.iarc.fr/"],["Основная сложность стадирования рака пищевода, влияющая на тактику:",["A. Определение гистологии","B. Определение размера опухоли","C. Точная оценка глубины инвазии и регионарных лимфоузлов; требуется эндосонография в дополнение к КТ и ПЭТ-КТ","D. Оценка функции печени"],"C","КТ плохо разграничивает T1–T2 и не оценивает надёжно перигастральные и параэзофагеальные лимфоузлы. Эндосонография с тонкоигольной аспирацией уточняет глубину инвазии и статус узлов, что определяет выбор между эндоскопической резекцией, операцией и неоадъювантной терапией. ПЭТ-КТ выявляет отдалённые метастазы, меняющие тактику у части больных.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-37","t":"Рак желудка","s":"Частная онкология, ч. 1","q":[["Какова современная периоперационная стратегия при резектабельной аденокарциноме желудка/пищеводно-желудочного перехода у пациента, подходящего для FLOT?",["A. Только послеоперационная лучевая терапия","B. Только операция независимо от стадии","C. Периоперационный FLOT; добавление дурвалумаба к FLOT с последующей поддержкой дурвалумабом имеет доказательство III фазы и одобрено FDA","D. Только неоадъювантная химиолучевая терапия"],"C","FLOT остаётся базовой периоперационной химиотерапией у подходящих больных. В MATTERHORN добавление дурвалумаба к периоперационному FLOT с последующей поддержкой дурвалумабом улучшило выживаемость без событий: HR 0,71; 2-летняя ВБС 67,4% против 58,5%. FDA одобрило этот режим 25 ноября 2025 года. Регуляторный статус в других странах следует проверять отдельно.","FDA — durvalumab + FLOT for resectable gastric/GEJ adenocarcinoma (MATTERHORN)","https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-durvalumab-resectable-gastric-or-gastroesophageal-junction-adenocarcinoma"],["Какие биомаркёры следует оценить до выбора первой линии при метастатической аденокарциноме желудка/ПЖП?",["A. Только PD-L1","B. HER2, PD-L1 (CPS), MMR/MSI и CLDN18.2 — для выбора доступных биомаркер-ориентированных опций","C. Только HER2","D. Только MSI"],"B","Современный выбор первой линии требует раннего определения HER2, PD-L1 CPS и MMR/MSI; CLDN18.2 также имеет терапевтическое значение у HER2-отрицательных опухолей при доступности золбетуксимаба. Панель тестов должна соответствовать зарегистрированным показаниям и национальным рекомендациям. Одновременное тестирование часто экономит ткань и время, но формулировка «обязательно у всех» заменена на клинически и регуляторно более точную.","Pan-Asian adapted ESMO Clinical Practice Guideline — gastric cancer","https://pubmed.ncbi.nlm.nih.gov/38458658/"],["Зольбетуксимаб направлен против:",["A. PD-L1","B. VEGF","C. HER2","D. Клаудина 18.2 — белка плотных контактов, экспрессируемого частью опухолей желудка"],"D","Клаудин 18.2 в норме экспрессируется в дифференцированных клетках слизистой желудка и становится доступным для антитела при опухолевой трансформации. SPOTLIGHT и GLOW показали выигрыш при добавлении зольбетуксимаба к химиотерапии у CLDN18.2-положительных больных с HER2-негативной опухолью. Характерная токсичность — выраженные тошнота и рвота в первые введения.","SPOTLIGHT / GLOW — zolbetuximab CLDN18.2","https://pubmed.ncbi.nlm.nih.gov/37852180/"],["Экспрессия PD-L1 при раке желудка оценивается как:",["A. CPS — с учётом опухолевых и иммунных клеток","B. Процент площади","C. Индекс инфильтрации","D. TPS"],"A","CPS учитывает и опухолевые клетки, и лимфоциты с макрофагами. Это отличается от рака лёгкого, где применяется TPS. Выигрыш от иммунотерапии нарастает с CPS, а при низких значениях он невелик, что учитывается при обсуждении с больным.","CheckMate 649 — 5-year follow-up","https://pubmed.ncbi.nlm.nih.gov/41687718/"],["Больной с HER2-положительным метастатическим раком желудка прогрессирует после трастузумаба с химиотерапией. Что обосновано во второй линии?",["A. Трастузумаб дерукстекан","B. Только химиотерапия","C. Повторить трастузумаб","D. Лучевая терапия"],"A","DESTINY-Gastric04 показал улучшение общей выживаемости при трастузумабе дерукстекане во второй линии по сравнению с химиотерапией. Требуется настороженность в отношении интерстициального поражения лёгких: пациента инструктируют немедленно сообщать о кашле и одышке. Целесообразно повторно оценить HER2-статус, поскольку он может утрачиваться.","DESTINY-Gastric04 — trastuzumab deruxtecan vs ramucirumab + paclitaxel","https://www.nejm.org/doi/10.1056/NEJMoa2503119"],["Диффузный тип рака желудка по Лаурену отличается тем, что:",["A. Не требует операции","B. Чаще встречается у молодых, склонен к инфильтративному росту и канцероматозу, хуже отвечает на лечение; при раннем возрасте и отягощённом анамнезе следует помнить о наследственном диффузном раке желудка с мутацией CDH1","C. Не метастазирует","D. Имеет лучший прогноз"],"B","Диффузный тип, включая перстневидноклеточный рак, растёт инфильтративно и часто даёт канцероматоз брюшины, плохо видимый на КТ. Наследственный диффузный рак желудка, связанный с герминальными вариантами CDH1, требует генетического консультирования и обсуждения профилактической гастрэктомии у носителей.","Классификация опухолей ВОЗ","https://whobluebooks.iarc.fr/"],["Диагностическая лапароскопия перед плановым лечением местнораспространённого рака желудка выполняется, чтобы:",["A. Выявить канцероматоз брюшины и опухолевые клетки в смывах, не видимые при КТ","B. Оценить размер опухоли","C. Взять биопсию первичной опухоли","D. Установить питательную стому"],"A","КТ пропускает мелкий канцероматоз у значительной части больных. Обнаружение диссеминации или положительной цитологии смывов переводит больного в метастатическую категорию и полностью меняет тактику, избавляя от ненужной операции. Именно поэтому лапароскопия со смывами включена в алгоритмы при местнораспространённом процессе.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["При раннем раке желудка, ограниченном слизистой оболочкой, с благоприятными характеристиками возможно:",["A. Эндоскопическая подслизистая диссекция","B. Химиотерапия","C. Только гастрэктомия","D. Только наблюдение"],"A","При соблюдении критериев — ограниченная глубина инвазии, дифференцированная гистология, отсутствие изъязвления и лимфоваскулярной инвазии, ограниченный размер — риск поражения лимфоузлов минимален, и эндоскопическая резекция даёт сопоставимые онкологические результаты при несравнимо лучшем качестве жизни. При неблагоприятных признаках в удалённом материале выполняется гастрэктомия.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Роль Helicobacter pylori при раке желудка:",["A. Защищает от рака","B. Влияет только на язвенную болезнь","C. Не доказана","D. Установленный канцероген; эрадикация снижает риск развития рака, особенно при выполнении до появления атрофии и метаплазии"],"D","Инфекция отнесена к канцерогенам группы 1. Эрадикация снижает заболеваемость раком желудка, а у больных после эндоскопической резекции раннего рака — риск метахронных опухолей. Эффект тем больше, чем раньше проведена эрадикация: при развившихся атрофии и кишечной метаплазии риск снижается частично.","PDQ® — рак желудка","https://www.cancer.gov/publications/pdq"],["Наиболее частая ошибка при ведении больного раком желудка после гастрэктомии:",["A. Отказ от КТ","B. Игнорирование нутритивных последствий: дефицита витамина B12 и железа, демпинг-синдрома, потери массы тела","C. Избыточное наблюдение","D. Слишком ранняя выписка"],"B","После гастрэктомии прекращается выработка внутреннего фактора, поэтому пожизненное парентеральное введение витамина B12 обязательно. Также характерны дефицит железа, кальция и витамина D, демпинг-синдром, стойкая потеря массы тела. Без диетологического сопровождения больной теряет вес и не переносит адъювантную терапию, что напрямую ухудшает результат лечения.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"]]},{"c":"М-38","t":"Рак ободочной кишки: ранние стадии и адъювантная терапия","s":"Частная онкология, ч. 1","q":[["Стандарт адъювантной терапии при III стадии рака ободочной кишки:",["A. Иринотекан-содержащий режим","B. Лучевая терапия","C. Фторпиримидин в монорежиме","D. Комбинация фторпиримидина с оксалиплатином; длительность 3 или 6 месяцев в зависимости от риска"],"D","MOSAIC установило преимущество добавления оксалиплатина. IDEA уточнило длительность: при T1–3N1 три месяца CAPOX не уступают шести при значительно меньшей нейротоксичности, при T4 или N2 предпочтительны шесть месяцев. Это редкий пример, когда качественный анализ позволил безопасно сократить лечение.","IDEA collaboration — final results","https://pubmed.ncbi.nlm.nih.gov/33271092/"],["Больной со II стадией рака ободочной кишки и MSI-H без факторов риска. Тактика:",["A. Иммунотерапия","B. Наблюдение: прогноз благоприятный, а фторпиримидин в монорежиме пользы не приносит","C. Фторпиримидин в монорежиме","D. Адъювантный FOLFOX"],"B","При II стадии dMMR/MSI-H рака ободочной кишки без дополнительных факторов высокого риска прогноз относительно благоприятный, а монотерапия фторпиримидином не показала ожидаемой пользы. Исторические данные Ribic и последующие рекомендации поддерживают отказ от рутинного 5-FU в монорежиме в этой ситуации. Формулировку о том, что фторпиримидин обязательно «вредит», следует считать слишком сильной.","Ribic et al. — MSI and benefit from adjuvant fluorouracil","https://pubmed.ncbi.nlm.nih.gov/12867608/"],["Какие признаки относят к факторам высокого риска при II стадии рака ободочной кишки и учитывают при обсуждении адъювантной терапии?",["A. Только возраст старше 65 лет","B. Только правосторонняя локализация","C. Только высокий уровень РЭА","D. T4, недостаточное число исследованных лимфоузлов, низкая дифференцировка, лимфоваскулярная/периневральная инвазия, обструкция или перфорация"],"D","При II стадии решение об адъювантной терапии принимают по совокупности факторов риска, ожидаемой абсолютной пользе, сопутствующим заболеваниям и статусу MMR/MSI. Опухоли dMMR/MSI-H обычно не получают фторпиримидин в монорежиме. Однако при T4 и/или других выраженных факторах высокого риска вопрос адъювантного лечения не следует закрывать автоматически только из-за MSI-H; обсуждается индивидуальная стратегия, включая оксалиплатин-содержащий режим у подходящих пациентов.","ASCO Guideline Update — Adjuvant Therapy for Stage II Colon Cancer","https://ascopubs.org/doi/10.1200/JCO.21.02538"],["Что показало исследование DYNAMIC?",["A. Определение циркулирующей опухолевой ДНК после операции при II стадии позволило вдвое сократить назначение химиотерапии без ухудшения выживаемости","B. Химиотерапия показана всем","C. Адъювантная терапия не нужна никому","D. Циркулирующая ДНК неинформативна"],"A","Логика проста: лечить тех, у кого болезнь осталась, и не лечить тех, у кого её нет. Отрицательный результат после операции позволил безопасно отказаться от химиотерапии у значительной доли больных. Метод активно изучается при других стадиях и нозологиях, но пока не стал универсальным стандартом.","DYNAMIC — ctDNA-guided adjuvant therapy","https://pubmed.ncbi.nlm.nih.gov/35657320/"],["Что изменило исследование ATOMIC при dMMR раке ободочной кишки III стадии?",["A. Показало неэффективность иммунотерапии","B. Показало улучшение безрецидивной выживаемости при добавлении атезолизумаба к адъювантной химиотерапии","C. Заменило операцию","D. Отменило химиотерапию"],"B","В ATOMIC у больных после радикальной операции по поводу dMMR рака ободочной кишки III стадии добавление атезолизумаба к mFOLFOX6 с последующей поддержкой атезолизумабом улучшило безрецидивную выживаемость: 3-летняя БРВ 86,3% против 76,2%; HR 0,50 (95% ДИ 0,35–0,73). Химиотерапия в экспериментальной группе не отменялась.","ATOMIC — atezolizumab plus mFOLFOX6 in stage III dMMR colon cancer","https://pubmed.ncbi.nlm.nih.gov/41880612/"],["Минимальное число лимфоузлов, которое должно быть исследовано в препарате при раке ободочной кишки:",["A. 20","B. Не регламентировано","C. 6","D. 12"],"D","При меньшем числе возможно занижение стадии: часть больных с III стадией будет расценена как II и не получит показанную адъювантную терапию. В такой ситуации недостаточная лимфодиссекция сама расценивается как фактор риска, и решение принимается в пользу лечения.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Когда обычно стремятся начать адъювантную химиотерапию после радикальной операции по поводу рака ободочной кишки?",["A. После восстановления пациента, желательно без неоправданной задержки; на практике часто ориентируются на начало в пределах 6–8 недель","B. Не ранее чем через 6 месяцев","C. Только после года наблюдения","D. Срок начала не имеет значения"],"A","Наблюдательные данные последовательно связывают более позднее начало адъювантной химиотерапии с худшими исходами, поэтому послеоперационное восстановление и направление к онкологу не следует неоправданно затягивать. Часто используют ориентир 6–8 недель, но это не жёсткая биологическая граница: осложнения операции и состояние пациента могут требовать отсрочки, а позднее начало не означает автоматического отсутствия пользы.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Наблюдение после радикального лечения рака ободочной кишки включает:",["A. Регулярный контроль РЭА, КТ органов грудной клетки и брюшной полости и колоноскопию по графику","B. Только колоноскопию","C. Только КТ","D. Только осмотр"],"A","Цель наблюдения — выявление резектабельного рецидива или метастазов, а также метахронных опухолей и полипов. Колоноскопия обязательна: если до операции она не была выполнена полностью из-за обструкции, её проводят в первые месяцы после вмешательства. Интенсивность наблюдения имеет смысл только у больных, которым при выявлении рецидива будет предложено активное лечение.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Дефицит системы репарации при колоректальном раке требует дополнительного шага, потому что:",["A. Определяет объём операции","B. Не требует ничего","C. Влияет только на прогноз","D. Может указывать на синдром Линча; при утрате MLH1/PMS2 необходимо исключить соматическую природу, при утрате MSH2/MSH6 — направить на генетическое консультирование"],"D","Примерно у части больных с dMMR причина герминальная. При утрате MLH1 и PMS2 исследуют метилирование промотора MLH1 и мутацию BRAF V600E: их наличие говорит против синдрома Линча. Утрата MSH2/MSH6 редко бывает соматической, и генетическое консультирование показано сразу. Выявление синдрома меняет наблюдение больного и судьбу его родственников.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Основное соображение при выборе длительности адъювантной терапии — 3 или 6 месяцев:",["A. Баланс между риском рецидива и кумулятивной нейротоксичностью оксалиплатина, которая может остаться на годы","B. Предпочтения хирурга","C. Возраст","D. Стоимость"],"A","Нейропатия после шести месяцев оксалиплатина сохраняется у значительной части больных и заметно ухудшает качество жизни. IDEA показало, что при низком риске сокращение до трёх месяцев не ухудшает исход, поэтому решение принимается с явным обсуждением этого баланса с пациентом.","IDEA collaboration — final results","https://pubmed.ncbi.nlm.nih.gov/33271092/"]]},{"c":"М-39","t":"Рак прямой кишки; рак анального канала","s":"Частная онкология, ч. 1","q":[["Основной метод стадирования местного распространения рака прямой кишки:",["A. Колоноскопия","B. МРТ малого таза с оценкой мезоректальной фасции и экстрамуральной сосудистой инвазии","C. КТ","D. УЗИ брюшной полости"],"B","МРТ определяет расстояние до мезоректальной фасции, наличие экстрамуральной сосудистой инвазии и статус латеральных лимфоузлов — именно эти параметры, а не только категория T, определяют выбор между непосредственной операцией и неоадъювантной терапией. КТ используется для исключения отдалённых метастазов.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Что такое тотальная неоадъювантная терапия при раке прямой кишки?",["A. Удаление всей прямой кишки","B. Проведение всей системной терапии и лучевой терапии до операции, а не после неё","C. Только химиотерапия","D. Отказ от операции"],"B","Перенос всего лечения на дооперационный этап решает две проблемы: значительная часть больных не получает адъювантную терапию после операции из-за длительного восстановления, а раннее системное воздействие направлено на микрометастазы. Кроме того, полный ответ открывает возможность органосохранения.","UNICANCER-PRODIGE 23","https://pubmed.ncbi.nlm.nih.gov/33862000/"],["Стратегия наблюдения (watch and wait) при раке прямой кишки применима:",["A. Всем больным","B. Вместо любого лечения","C. Только при I стадии","D. При достижении клинического полного ответа после тотальной неоадъювантной терапии, в центрах с протоколом строгого наблюдения и готовностью к спасительной операции"],"D","OPRA показало, что значительная доля больных с клиническим полным ответом избегает операции при сопоставимой выживаемости. Условия обязательны: тщательная оценка ответа эндоскопией, пальцевым исследованием и МРТ, наблюдение по жёсткому графику первые годы и готовность выполнить спасительную операцию при возобновлении роста, которое чаще происходит в первые два года.","OPRA — long-term organ-preservation results","https://pubmed.ncbi.nlm.nih.gov/37883738/"],["Больной с местнораспространённым раком прямой кишки и дефицитом системы репарации. Что принципиально меняется?",["A. Ничего","B. Требуется более агрессивная химиотерапия","C. Показана только операция","D. Иммунотерапия может давать клинический полный ответ, позволяя избежать облучения и операции; такой больной должен рассматриваться отдельно"],"D","В исследовании с достарлимабом при местнораспространённом dMMR раке прямой кишки клинический полный ответ был достигнут у всех включённых больных, что позволило избежать и лучевой терапии, и операции с её стойкими последствиями. Результат требует подтверждения на больших когортах и длительного наблюдения, но уже сейчас обязывает определять статус MMR до начала лечения.","Dostarlimab — nonoperative management of dMMR tumors","https://pubmed.ncbi.nlm.nih.gov/40293177/"],["Основное различие между результатами RAPIDO и PRODIGE 23:",["A. RAPIDO не включал лучевую терапию","B. PRODIGE 23 показал отрицательный результат","C. Оба подхода улучшают отдалённые результаты, но в RAPIDO при длительном наблюдении отмечена более высокая частота местных рецидивов, что влияет на выбор схемы","D. Различий нет"],"C","RAPIDO использовал короткий курс облучения с консолидирующей химиотерапией, PRODIGE 23 — индукционный FOLFIRINOX перед стандартной химиолучевой терапией. Оба улучшили отдалённые результаты, но данные о местных рецидивах в RAPIDO при длительном наблюдении заставляют осторожнее относиться к этой схеме при опухолях с высоким риском местного рецидива.","RAPIDO","https://pubmed.ncbi.nlm.nih.gov/33301740/"],["Ключевой принцип хирургии рака прямой кишки, определивший снижение частоты местных рецидивов:",["A. Лапароскопический доступ","B. Обязательная колостома","C. Тотальная мезоректумэктомия — удаление прямой кишки с мезоректальной клетчаткой единым блоком по фасциальным футлярам","D. Расширенная лимфодиссекция"],"C","Внедрение тотальной мезоректумэктомии снизило частоту местных рецидивов в разы. Качество препарата оценивается патологом и является показателем качества хирургии. Целостность мезоректальной фасции в препарате — прогностический фактор, который должен указываться в заключении.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Стандарт лечения рака анального канала:",["A. Только химиотерапия","B. Только лучевая терапия","C. Химиолучевая терапия с митомицином и фторурацилом; операция — метод спасения","D. Брюшно-промежностная экстирпация"],"C","Химиолучевая терапия позволяет излечить большинство больных с сохранением функции сфинктера. Операция выполняется при неполном ответе или рецидиве. Замена митомицина на цисплатин в RTOG 98-11 результатов не улучшила. Оценка ответа проводится не ранее чем через 8–12 недель после завершения лечения: регресс продолжается длительно.","ACT II — anal cancer chemoradiotherapy","https://pubmed.ncbi.nlm.nih.gov/23578724/"],["Этиология рака анального канала:",["A. Питание","B. Хронический геморрой","C. Вирус папилломы человека высокого онкогенного риска; повышенный риск при ВИЧ-инфекции и иммуносупрессии","D. Курение"],"C","Подавляющее большинство случаев ассоциировано с ВПЧ, поэтому вакцинация служит первичной профилактикой. Риск существенно повышен при ВИЧ-инфекции, после трансплантации органов и при иммуносупрессивной терапии, что определяет группы для скрининга анальной дисплазии.","PDQ® — рак анального канала","https://www.cancer.gov/publications/pdq"],["При оценке ответа после химиолучевой терапии рака анального канала остаточное образование через 6 недель:",["A. Не означает неудачи: регресс продолжается до 6 месяцев, поэтому решение об операции откладывается при отсутствии явного прогрессирования","B. Означает неудачу, требуется операция","C. Требует химиотерапии","D. Требует повторного облучения"],"A","Преждевременная операция лишает больного шанса на органосохранение. Оценка проводится клинически и по МРТ в динамике; при сомнениях выполняется биопсия. Спасительная брюшно-промежностная экстирпация показана лишь при доказанной остаточной опухоли или прогрессировании.","ACT II — anal cancer chemoradiotherapy","https://pubmed.ncbi.nlm.nih.gov/23578724/"],["Наиболее значимая проблема качества жизни после лечения рака прямой кишки:",["A. Синдром низкой передней резекции — учащённый фрагментированный стул, императивные позывы, недержание — а также сексуальная и мочевая дисфункция","B. Алопеция","C. Нейропатия","D. Кардиотоксичность"],"A","Синдром низкой передней резекции развивается у значительной части больных после сфинктеросохраняющих операций, особенно в сочетании с облучением, и может быть тягостнее, чем стома. Об этом необходимо предупреждать до операции: часть больных, зная о последствиях, осознанно выбирает иное решение. Требуются реабилитация, диетические меры и медикаментозная поддержка.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-40","t":"Рак поджелудочной железы; рак тонкой кишки и ампулярные раки","s":"Частная онкология, ч. 1","q":[["Резектабельность при раке поджелудочной железы определяется прежде всего:",["A. Локализацией в головке или теле","B. Размером опухоли","C. Уровнем CA 19-9","D. Взаимоотношением опухоли с магистральными сосудами — верхней брыжеечной артерией, чревным стволом, воротной и верхней брыжеечной венами"],"D","Категории резектабельного, пограничнорезектабельного и местнораспространённого процесса определяются степенью контакта опухоли с сосудами по данным качественной КТ с контрастированием по панкреатическому протоколу. Артериальное вовлечение критичнее венозного, поскольку венозная резекция с реконструкцией технически выполнима.","NCCN Guidelines","https://www.nccn.org/guidelines/category_1"],["Адъювантная терапия после радикальной операции по поводу рака поджелудочной железы у соматически сохранного больного:",["A. Лучевая терапия","B. Наблюдение","C. Гемцитабин в монорежиме","D. Модифицированный FOLFIRINOX по данным PRODIGE 24"],"D","PRODIGE 24 показал существенное превосходство модифицированного FOLFIRINOX над гемцитабином: медиана общей выживаемости выросла заметно. Режим требует хорошего функционального статуса и восстановления после операции; при непереносимости применяются гемцитабин с капецитабином или гемцитабин в монорежиме.","PRODIGE 24/CCTG PA.6","https://pubmed.ncbi.nlm.nih.gov/30575490/"],["Кому при подтверждённом раке поджелудочной железы следует предлагать исследование зародышевой линии?",["A. Только пациентам моложе 50 лет","B. Только при отягощённом семейном анамнезе","C. Всем пациентам с подтверждённым раком поджелудочной железы, поскольку результат может иметь лечебное и наследственное значение","D. Только перед хирургическим лечением"],"C","Современные рекомендации NCCN предлагают герминальное тестирование всем пациентам с подтверждённым раком поджелудочной железы независимо от возраста, стадии и семейного анамнеза. Результат может выявить наследственный синдром и повлиять на лечение, например при BRCA1/2/PALB2-ассоциированной опухоли. При распространённой болезни отдельно важно соматическое молекулярное профилирование. Прежнее объяснение было слишком сосредоточено только на BRCA и олапарибе.","NCCN Guidelines for Patients — Pancreatic Cancer 2025","https://pancreatic.org/wp-content/uploads/2025/07/NCCN-2025-pancreatic-patient.pdf"],["Первая линия при метастатическом раке поджелудочной железы у больного с ECOG 0–1 и сохранной функцией печени:",["A. FOLFIRINOX либо NALIRIFOX; альтернатива — гемцитабин с наб-паклитакселом","B. Только симптоматическая терапия","C. Иммунотерапия","D. Гемцитабин в монорежиме"],"A","PRODIGE 4 установил превосходство FOLFIRINOX у сохранных больных, NAPOLI 3 показал преимущество NALIRIFOX над гемцитабином с наб-паклитакселом. Гемцитабин в монорежиме остаётся опцией при ECOG 2 и выраженной коморбидности. Ключевой фактор выбора — функциональный статус, который при этой нозологии ухудшается быстро.","NAPOLI 3","https://pubmed.ncbi.nlm.nih.gov/37708904/"],["Экзокринная недостаточность поджелудочной железы у онкологического больного:",["A. Развивается у большинства больных с опухолью головки железы и после панкреатодуоденальной резекции; требует заместительной ферментной терапии в адекватной дозе","B. Не влияет на состояние","C. Лечится диетой без препаратов","D. Встречается редко"],"A","Проявляется стеатореей, вздутием и прогрессирующей потерей массы тела, но нередко расценивается как «естественное следствие болезни» и не лечится. Заместительная ферментная терапия назначается в достаточной дозе с каждым приёмом пищи; недостаточная доза — самая частая причина мнимой неэффективности. Коррекция напрямую влияет на массу тела и переносимость химиотерапии.","UK practical guidelines — pancreatic exocrine insufficiency","https://pmc.ncbi.nlm.nih.gov/articles/PMC8212181/"],["CA 19-9 при раке поджелудочной железы:",["A. Заменяет визуализацию","B. Определяет резектабельность","C. Используется для оценки ответа и наблюдения; при холестазе ложно повышается, а у части людей не вырабатывается вовсе","D. Применяется для скрининга"],"C","Оценка маркёра при желтухе лишена смысла: холестаз любой природы резко его повышает. Примерно у 5–10 % людей с фенотипом Льюис-отрицательным он не синтезируется, и в этом случае непригоден для наблюдения. Динамика после начала терапии обладает прогностическим значением.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["При механической желтухе у больного с опухолью головки поджелудочной железы, которому планируется неоадъювантная терапия:",["A. Дренирование не требуется","B. Показана только операция","C. Показана лучевая терапия","D. Показано билиарное дренирование или стентирование до начала лечения"],"D","Гипербилирубинемия делает невозможным назначение большинства химиопрепаратов и повышает риск холангита. Эндоскопическое стентирование восстанавливает отток; при планируемой неоадъювантной терапии предпочтителен металлический стент, обеспечивающий более длительную проходимость. После разрешения желтухи повторно оценивается CA 19-9.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Какова роль заместительной терапии панкреатическими ферментами при раке поджелудочной железы?",["A. Она не используется при онкологических заболеваниях","B. Она показана при клинических признаках экзокринной недостаточности и помогает улучшать пищеварение, нутритивный статус и симптомы","C. Она заменяет противоопухолевое лечение","D. Её назначают только после тотальной панкреатэктомии"],"B","Экзокринная недостаточность поджелудочной железы часто недооценивается у больных раком, особенно при опухолях головки железы и после хирургического лечения. Панкреатические ферменты назначают при клиническом подозрении или подтверждённой недостаточности; дозу титруют по приёму пищи, симптомам и нутритивному ответу. Ферментная терапия является поддерживающим лечением и не заменяет противоопухолевую терапию.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Почему при аденокарциноме ампулы большого дуоденального сосочка важно указывать гистологический подтип?",["A. Потому что кишечный и панкреатобилиарный подтипы отличаются биологией и прогнозом и могут влиять на выбор системной терапии","B. Потому что подтип определяет только стадию TNM","C. Потому что подтип определяет объём лимфодиссекции независимо от стадии","D. Подтип клинического значения не имеет"],"A","NCCN рекомендует морфологически подразделять ампулярные аденокарциномы на кишечный, панкреатобилиарный и смешанный подтипы. Это отражает биологическую неоднородность заболевания и может учитываться при выборе лекарственной терапии. Формулировка «лечить строго как колоректальный или строго как рак поджелудочной железы» слишком упрощённа.","NCCN Clinical Practice Guidelines — Ampullary Adenocarcinoma","https://pubmed.ncbi.nlm.nih.gov/37433437/"],["Какой молекулярный показатель имеет особенно важное значение при аденокарциноме тонкой кишки?",["A. HER2 во всех случаях","B. MMR/MSI: dMMR/MSI-H имеет наследственное и терапевтическое значение и может открыть возможность иммунотерапии","C. PD-L1 как единственный обязательный тест","D. Только РЭА"],"B","При аденокарциноме тонкой кишки рекомендуется оценивать MMR/MSI из-за связи с синдромом Линча и потенциальной чувствительности dMMR/MSI-H опухолей к ингибиторам контрольных точек. Дополнительное молекулярное профилирование особенно важно при распространённой болезни. Формулировка «обязательный единственный тест» избегается, поскольку объём диагностики зависит от стадии, доступных методов и актуальных рекомендаций.","NCCN Clinical Practice Guidelines — Small Bowel Adenocarcinoma","https://pubmed.ncbi.nlm.nih.gov/31487687/"]]},{"c":"М-41","t":"Гепатоцеллюлярный рак; холангиокарцинома","s":"Частная онкология, ч. 1","q":[["Особенность диагностики гепатоцеллюлярного рака у больного циррозом:",["A. Диагноз ставится по уровню АФП","B. При характерной картине накопления контраста на КТ или МРТ у больного циррозом диагноз может быть установлен без морфологической верификации","C. Требуется биопсия во всех случаях","D. Требуется только УЗИ"],"B","Типичная картина — артериальная гиперваскуляризация с последующим вымыванием контраста в венозную и отсроченную фазы — обладает высокой специфичностью у больного циррозом. Это исключение из общего правила обязательной морфологической верификации. Биопсия выполняется при нетипичной картине или при отсутствии цирроза.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Почему при гепатоцеллюлярном раке недостаточно оценить только распространённость опухоли?",["A. Из-за трудностей визуализации","B. Опухоль не метастазирует","C. Прогноз и возможности лечения определяются также функцией печени и функциональным статусом; всё это интегрирует система BCLC","D. Из-за особенностей стадирования"],"C","Больной с небольшим узлом на фоне декомпенсированного цирроза живёт меньше, чем больной с крупной опухолью и сохранной функцией печени. Система BCLC объединяет три составляющие и каждой стадии сопоставляет конкретную лечебную опцию — от резекции и трансплантации до системной терапии и симптоматической помощи.","BCLC strategy — 2026 update","https://pubmed.ncbi.nlm.nih.gov/41151697/"],["Какие иммунотерапевтические комбинации относятся к предпочтительным вариантам первой линии распространённого ГЦР при сохранной функции печени у подходящих пациентов?",["A. Атезолизумаб + бевацизумаб либо дурвалумаб + однократный тремелимумаб (STRIDE), с выбором по риску кровотечения, противопоказаниям и доступности","B. Только сорафениб для всех","C. Только химиотерапия FOLFOX","D. Только лучевая терапия"],"A","ESMO 2025 относит современные иммунотерапевтические комбинации к ключевым вариантам первой линии распространённого ГЦР. Атезолизумаб + бевацизумаб требует особого внимания к портальной гипертензии и риску кровотечения; STRIDE является важной альтернативой. Выбор нельзя сводить к одному режиму для всех пациентов.","ESMO Clinical Practice Guideline — Hepatocellular carcinoma 2025","https://pubmed.ncbi.nlm.nih.gov/39986353/"],["Что изменило исследование EMERALD-1?",["A. Отменило химиоэмболизацию","B. Показало, что добавление системной терапии к трансартериальной химиоэмболизации при промежуточной стадии улучшает беспрогрессивную выживаемость","C. Показало неэффективность иммунотерапии","D. Заменило трансплантацию"],"B","Промежуточная стадия по BCLC долго оставалась зоной исключительно локорегионарного лечения. EMERALD-1 показала, что комбинация химиоэмболизации с системной терапией улучшает результаты, размывая жёсткую границу между стадиями и требуя обсуждения таких больных на мультидисциплинарном консилиуме.","EMERALD-1","https://pubmed.ncbi.nlm.nih.gov/39798579/"],["Основной путь профилактики гепатоцеллюлярного рака:",["A. Вакцинация против вируса гепатита B, лечение вирусных гепатитов, контроль потребления алкоголя и метаболических факторов","B. Приём гепатопротекторов","C. Скрининг всем взрослым","D. Диета"],"A","Гепатоцеллюлярный рак — редкий пример опухоли с эффективной первичной профилактикой: вакцина против гепатита B фактически является противоопухолевой. Противовирусная терапия гепатитов B и C снижает риск, хотя не устраняет его полностью при сформировавшемся циррозе. Растёт вклад метаболически-ассоциированной жировой болезни печени. Скрининг проводится не всем, а больным циррозом и группам риска — ультразвуковым исследованием каждые 6 месяцев.","PDQ® — рак печени","https://www.cancer.gov/publications/pdq"],["Молекулярное профилирование при внутрипечёночной холангиокарциноме необходимо, потому что:",["A. Влияет на прогноз","B. Не требуется","C. Выявляет действенные мишени — слияния FGFR2, мутации IDH1, а также HER2, BRAF V600E, слияния NTRK и MSI-H","D. Определяет объём операции"],"C","Внутрипечёночная холангиокарцинома — одна из нозологий, где рекомендации ESMO указывают широкое секвенирование как рутинно оправданное. Действенные мишени выявляются у значительной доли больных, а каждая из них открывает опцию с существенно лучшим результатом, чем химиотерапия второй линии.","FIGHT-202 — pemigatinib in FGFR2-altered cholangiocarcinoma","https://pubmed.ncbi.nlm.nih.gov/38838500/"],["Первая линия при распространённой опухоли билиарного тракта:",["A. Фторпиримидин в монорежиме","B. Только таргетная терапия","C. Гемцитабин с цисплатином","D. Гемцитабин с цисплатином в комбинации с ингибитором контрольных точек"],"D","TOPAZ-1 и KEYNOTE-966 показали улучшение общей выживаемости при добавлении дурвалумаба или пембролизумаба к гемцитабину с цисплатином. Прирост умеренный, но воспроизведён в двух независимых исследованиях. Параллельно назначается молекулярное профилирование для планирования второй линии.","TOPAZ-1 — updated overall survival","https://pubmed.ncbi.nlm.nih.gov/38823398/"],["Характерная токсичность ингибиторов FGFR:",["A. Нефротоксичность","B. Гиперфосфатемия, требующая диеты и фосфат-связывающих препаратов, а также офтальмологические осложнения, включая серозную отслойку сетчатки","C. Ототоксичность","D. Кардиотоксичность"],"B","Гиперфосфатемия — класс-эффект, отражающий механизм действия, и требует регулярного контроля фосфора. Офтальмологические осложнения обязывают к плановым осмотрам офтальмолога. Также характерны изменения ногтей и волос, сухость слизистых.","FIGHT-202 — pemigatinib in FGFR2-altered cholangiocarcinoma","https://pubmed.ncbi.nlm.nih.gov/38838500/"],["Адъювантная терапия после радикальной операции по поводу опухоли билиарного тракта:",["A. Капецитабин по данным BILCAP","B. Лучевая терапия","C. Не показана","D. Гемцитабин с цисплатином"],"A","BILCAP установил адъювантный капецитабин стандартом, несмотря на то что первичная конечная точка в анализе по назначенному лечению формально не была достигнута — результат анализа с поправкой и данные по подгруппам оказались убедительными для практики. Это полезный пример для разбора на семинаре по методологии.","BILCAP","https://pubmed.ncbi.nlm.nih.gov/30922733/"],["Что особенно важно оценить перед назначением атезолизумаба с бевацизумабом пацие
