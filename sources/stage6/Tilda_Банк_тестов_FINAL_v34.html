рования на КТ. Это принципиально новая логика: лечение опережает клиническое событие. Вопрос о влиянии на общую выживаемость и о применимости подхода в рутинной практике пока обсуждается.","SERENA-6","https://pubmed.ncbi.nlm.nih.gov/40454637/"],["Что изменило исследование DESTINY-Breast09 в 1-й линии HER2-положительного метастатического рака?",["A. Отменило анти-HER2-терапию","B. Показало превосходство трастузумаба дерукстекана с пертузумабом над стандартным режимом с медианой беспрогрессивной выживаемости около 40 против 26 мес","C. Показало преимущество эндокринотерапии","D. Подтвердило режим CLEOPATRA"],"B","DESTINY-Breast09 бросил вызов стандарту CLEOPATRA, державшемуся более десяти лет; одобрение FDA получено в декабре 2025 г. При этом сохраняются вопросы: интерстициальное поражение лёгких, около 20 % прекращений терапии из-за токсичности и неясность эффективности повторного применения препарата у больных, получавших его на раннем этапе.","DESTINY-Breast09","https://pubmed.ncbi.nlm.nih.gov/41160818/"],["Категория HER2-low означает:",["A. Отсутствие экспрессии HER2","B. Экспрессию HER2 1+ или 2+ без амплификации при гибридизации in situ, при которой эффективен трастузумаб дерукстекан","C. HER2-положительный статус","D. Мутацию гена HER2"],"B","DESTINY-Breast04 показал эффективность трастузумаба дерукстекана у больных, ранее считавшихся HER2-негативными. Это заставило пересмотреть работу патоморфологов: теперь принципиально важно различать 0 и 1+, что прежде клинического значения не имело.","DESTINY-Breast04","https://pubmed.ncbi.nlm.nih.gov/35665782/"],["Экспрессия PD-L1 при трижды негативном метастатическом раке молочной железы:",["A. Определяет показания к PARP-ингибитору","B. При CPS ≥ 10 обосновывает добавление пембролизумаба к химиотерапии в 1-й линии","C. Не влияет на выбор терапии","D. Оценивается только при раннем раке"],"B","KEYNOTE-355 показал выигрыш при CPS ≥ 10. Это важное отличие от раннего рака, где по KEYNOTE-522 польза пембролизумаба не зависит от экспрессии PD-L1. Ординаторы часто переносят логику одного исследования на другое — здесь этого делать нельзя.","KEYNOTE-355","https://pubmed.ncbi.nlm.nih.gov/33278935/"],["Висцеральный криз — это:",["A. Синоним прогрессирования","B. Тяжёлое нарушение функции органа с быстрым прогрессированием, требующее немедленного ответа на лечение","C. Любое поражение внутренних органов","D. Метастазы в печени любого объёма"],"B","Понятие определяется не самим фактом висцерального поражения, а его функциональными последствиями: печёночная недостаточность, дыхательная недостаточность при лимфангите. Только в этой ситуации химиотерапия предпочтительнее эндокринотерапии с ингибитором CDK4/6 при гормонозависимом раке — из-за необходимости быстрого эффекта.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Больная с гормонозависимым раком прогрессирует на летрозоле с ингибитором CDK4/6. В опухоли выявлена мутация PIK3CA. Обоснованная опция:",["A. Повторное назначение того же ингибитора CDK4/6","B. Немедленная химиотерапия","C. Таргетная терапия на путь PI3K/AKT в комбинации с фулвестрантом","D. Наблюдение"],"C","При нарушениях пути PI3K/AKT/PTEN после прогрессирования на ингибиторе CDK4/6 обоснована комбинация с ингибитором этого пути и фулвестрантом; INAVO120 и CAPItello-291 подтвердили эффективность такого подхода. Обязателен контроль гликемии: гипергликемия — класс-эффект этой группы препаратов.","CAPItello-291","https://pubmed.ncbi.nlm.nih.gov/37256976/"],["Основной принцип выстраивания линий терапии при метастатическом раке молочной железы:",["A. Максимально долго использовать эндокринные и таргетные опции при гормонозависимом раке, откладывая химиотерапию, если нет висцерального криза","B. Менять линию при любом росте очага","C. Комбинировать все доступные препараты","D. Начинать с самого агрессивного режима"],"A","Заболевание протекает годами, и качество жизни определяется тем, насколько долго удаётся избегать химиотерапии с её кумулятивной токсичностью и алопецией. Логика лечения — последовательность линий, а не «максимум сразу»; каждая смена линии требует пересмотра целей и обсуждения с пациенткой.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-11","t":"Клиническое стадирование в онкологии I: система TNM","s":"Общая онкология","q":[["Если при определении категории T имеются сомнения между двумя значениями, следует:",["A. Выбрать более низкую категорию","B. Отложить стадирование","C. Указать обе","D. Выбрать более высокую категорию"],"A","Общее правило TNM: при сомнении выбирается менее распространённая категория. Это защищает от избыточного лечения и от искажения статистики. То же правило применяется к N, M и к группировке по стадиям.","Общие правила TNM (UICC)","https://www.uicc.org/what-we-do/sharing-knowledge/tnm"],["Обозначение ypT2N1 означает:",["A. Стадию рецидива","B. Патоморфологическую стадию после неоадъювантной терапии","C. Клиническую стадию до лечения","D. Стадию, установленную на аутопсии"],"B","Префикс y указывает, что классификация выполнена после системной или лучевой терапии, p — что она патоморфологическая. Категория ypT отражает остаточную опухоль и не сопоставима напрямую с исходной cT: сравнивать их как «уменьшение стадии» некорректно.","UICC TNM Classification of Malignant Tumours, 9th edition","https://www.uicc.org/resources/tnm/publications-resources"],["Клиническая классификация cTNM устанавливается:",["A. После завершения всей программы лечения","B. Только после операции","C. По данным обследования до начала любого лечения и в дальнейшем не меняется","D. В любой момент лечения"],"C","cTNM фиксируется на основании данных, полученных до начала лечения, и остаётся неизменной — она нужна для планирования и для сопоставимости статистики. Новые сведения, полученные позже, отражаются другими классификациями: pTNM, ypTNM, rTNM.","Общие правила TNM (UICC)","https://www.uicc.org/what-we-do/sharing-knowledge/tnm"],["Что означает классификация R1?",["A. Радикальная операция","B. Микроскопически определяемая остаточная опухоль","C. Один поражённый лимфоузел","D. Первый рецидив"],"B","R0 — отсутствие остаточной опухоли, R1 — микроскопическая (позитивный край резекции), R2 — макроскопическая. Статус R — независимый прогностический фактор и во многих нозологиях прямое показание к послеоперационной терапии, поэтому его отсутствие в заключении — серьёзный дефект документации.","Классификация R","https://www.uicc.org/what-we-do/sharing-knowledge/tnm"],["Суффикс (sn) в записи pN0(sn) означает:",["A. Наличие микрометастазов","B. Отсутствие данных о лимфоузлах","C. Категория N установлена по результату биопсии сторожевого лимфоузла","D. Синхронную опухоль"],"C","Суффикс (sn) указывает, что оценка выполнена по сторожевому лимфоузлу, без полной лимфодиссекции. Это принципиально для интерпретации: объём исследованной ткани меньше, и статус N установлен иным методом.","UICC TNM Classification of Malignant Tumours, 9th edition","https://www.uicc.org/resources/tnm/publications-resources"],["При каком заболевании группировка по стадиям напрямую зависит от возраста больного?",["A. Дифференцированный рак щитовидной железы","B. Рак желудка","C. Рак лёгкого","D. Рак молочной железы"],"A","Для дифференцированного рака щитовидной железы используется возрастной порог: у более молодых больных даже при отдалённых метастазах стадия не превышает II. Это отражает принципиально иное биологическое поведение опухоли и хороший прогноз в молодом возрасте.","UICC TNM Classification of Malignant Tumours, 9th edition","https://www.uicc.org/resources/tnm/publications-resources"],["Чем прогностическая стадия при раке молочной железы отличается от анатомической?",["A. Дополнительно учитывает степень злокачественности, рецепторный статус и HER2","B. Ничем","C. Применяется только при метастатической болезни","D. Учитывает только размер опухоли"],"A","Анатомическая стадия опирается только на распространённость. Прогностическая учитывает биологию: степень злокачественности, рецепторы эстрогенов и прогестерона, HER2 и при наличии — результат геномного теста. Одна и та же анатомическая стадия при разной биологии может соответствовать разным прогностическим стадиям.","UICC TNM Classification of Malignant Tumours, 9th edition","https://www.uicc.org/resources/tnm/publications-resources"],["Опухолевые отсевы (tumour deposits) в жировой клетчатке без остатков лимфоузла при колоректальном раке классифицируются как:",["A. Отдельная категория N1c","B. Метастазы в лимфоузлы (N)","C. Отдалённые метастазы (M1)","D. Не учитываются"],"A","Категория N1c введена именно для опухолевых депозитов при отсутствии поражения регионарных лимфоузлов. Их наличие ухудшает прогноз, поэтому патоморфолог обязан их указывать, а клиницист — учитывать при решении об адъювантной терапии.","UICC TNM Classification of Malignant Tumours, 9th edition","https://www.uicc.org/resources/tnm/publications-resources"],["Как в TNM 9-го издания классифицируются множественные экстраторакальные метастазы при раке лёгкого?",["A. M1c1 — в одной системе органов; M1c2 — в нескольких системах органов","B. M1a — в одной системе органов; M1b — в нескольких","C. Все относятся только к M1c без подразделения","D. Категория M зависит только от числа метастазов"],"A","В 9-м издании TNM категория M1c рака лёгкого уточнена: M1c1 означает множественные экстраторакальные метастазы в одной системе органов, M1c2 — в нескольких системах органов. Одиночный экстраторакальный метастаз остаётся M1b, а M1a включает контралатеральные лёгочные узлы и плевральное/перикардиальное метастатическое поражение.","IASLC Lung Cancer TNM Stages — 9th Edition","https://www.iaslc.org/file/10871/download?token=DmNIDkWP"],["Можно ли использовать критерии RECIST 1.1 для установления стадии заболевания?",["A. Да, если нет морфологической верификации","B. Да, это одно и то же","C. Нет: RECIST оценивает динамику на фоне лечения, стадирование описывает распространённость до лечения","D. Да, при метастатической болезни"],"C","Это разные инструменты с разными задачами. RECIST измеряет изменение суммы диаметров таргетных очагов для оценки эффекта; TNM описывает анатомическую распространённость. Смешение приводит к формулировкам вроде «стадия уменьшилась до частичного ответа», лишённым смысла.","RECIST 1.1","https://pubmed.ncbi.nlm.nih.gov/19097774/"]]},{"c":"М-12","t":"Первичные опухоли центральной нервной системы","s":"Частная онкология, ч. 3","q":[["Согласно классификации ВОЗ 2021 г., диагноз диффузной глиомы у взрослого считается полным при наличии:",["A. Только данных МРТ","B. Гистологии в сочетании с молекулярными данными: статусом IDH и, при IDH-мутации, коделецией 1p/19q","C. Только иммуногистохимии на GFAP","D. Только гистологического заключения"],"B","CNS5 ввела интегрированный диагноз. Диффузные глиомы взрослых делятся на три категории: астроцитома IDH-мутантная, олигодендроглиома IDH-мутантная с коделецией 1p/19q и глиобластома IDH-дикого типа. Без определения IDH диагноз неполон и тактика не может быть определена корректно.","WHO CNS5 summary","https://pubmed.ncbi.nlm.nih.gov/34185076/"],["Опухоль IDH-дикого типа гистологически соответствует диффузной астроцитоме 2-й степени, но выявлена амплификация EGFR. Каков диагноз по CNS5?",["A. Диагноз не может быть установлен","B. Глиобластома IDH-дикого типа, степень 4","C. Диффузная астроцитома 2-й степени","D. Олигодендроглиома"],"B","CNS5 ввела молекулярные критерии глиобластомы: при IDH-диком типе наличие амплификации EGFR, мутации промотора TERT либо сочетания +7/−10 позволяет установить диагноз глиобластомы независимо от гистологической картины, поскольку клиническое течение соответствует опухоли 4-й степени. Это принципиально меняет прогноз и лечение.","WHO CNS5 summary","https://pubmed.ncbi.nlm.nih.gov/34185076/"],["Стандарт лечения впервые выявленной глиобластомы у соматически сохранного больного:",["A. Максимально безопасная резекция, затем лучевая терапия с конкурентным и адъювантным темозоломидом","B. Только лучевая терапия","C. Только темозоломид","D. Наблюдение"],"A","Схема Stupp остаётся стандартом с 2005 г.: медиана общей выживаемости 14,6 против 12,1 мес при одной лучевой терапии, двухлетняя выживаемость 27 против 10 %. Объём резекции — независимый прогностический фактор, поэтому цель операции — максимальное безопасное удаление, а не биопсия.","Stupp regimen — radiotherapy plus temozolomide","https://pubmed.ncbi.nlm.nih.gov/15758009/"],["Клиническое значение метилирования промотора MGMT:",["A. Предиктивный маркёр эффективности темозоломида; при неметилированном статусе у пожилых обсуждается отказ от него","B. Маркёр IDH-мутации","C. Показание к лучевой терапии","D. Прогностический маркёр без влияния на выбор терапии"],"A","MGMT — фермент репарации, удаляющий алкильные группы; метилирование его промотора выключает ген и делает опухоль чувствительной к темозоломиду. Это один из немногих валидированных предиктивных маркёров в нейроонкологии. У пожилых с неметилированным статусом обоснованной опцией остаётся только лучевая терапия.","Hegi et al. — MGMT methylation and temozolomide benefit","https://pubmed.ncbi.nlm.nih.gov/15758010/"],["При олигодендроглиоме с мутацией IDH и коделецией 1p/19q стандартом адъювантного лечения является:",["A. Только лучевая терапия","B. Лучевая терапия с последующим режимом PCV","C. Наблюдение","D. Только темозоломид"],"B","RTOG 9402 и EORTC 26951 показали удвоение медианы общей выживаемости при добавлении PCV к облучению; при длительном наблюдении она превышает 14 лет. Коделеция 1p/19q — одновременно диагностический признак и мощный предиктор чувствительности к алкилирующей терапии.","RTOG 9402 — long-term results","https://pubmed.ncbi.nlm.nih.gov/23071247/"],["Что показало исследование INDIGO?",["A. Ворасидениб эффективен при глиобластоме","B. У больных с остаточной или рецидивной IDH-мутантной глиомой 2-й степени после операции ворасидениб увеличивает беспрогрессивную выживаемость и время до следующего вмешательства","C. Ворасидениб заменяет операцию","D. Ворасидениб эффективен при IDH-диком типе"],"B","INDIGO включил 331 больного с остаточной или рецидивной глиомой 2-й степени с мутацией IDH, статусом Карновского не менее 80, после операции и без иной противоопухолевой терапии. Значение подхода в том, что он позволяет отсрочить лучевую и химиотерапию у молодых больных с ожидаемой продолжительностью жизни в десятилетия, для которых поздняя нейрокогнитивная токсичность облучения — реальная проблема. Данных для глиом высокой степени и для больных с накоплением контраста нет.","INDIGO, NEJM 2023","https://pubmed.ncbi.nlm.nih.gov/37272516/"],["Псевдопрогрессирование при глиобластоме — это:",["A. Истинный рост опухоли","B. Признак резистентности","C. Артефакт МРТ","D. Нарастание накопления контраста в первые месяцы после химиолучевой терапии вследствие лечебных изменений, а не роста опухоли"],"D","Псевдопрогрессирование возникает у значительной части больных в первые 3 месяца после химиолучевой терапии, чаще при метилированном MGMT, и связано с воспалительной реакцией и нарушением проницаемости барьера. Критерии RANO требуют осторожности при трактовке изменений в этот период. Ошибочная смена терапии лишает больного эффективного лечения.","RANO 2.0","https://pubmed.ncbi.nlm.nih.gov/37774317/"],["Чем критерии RANO отличаются от RECIST при опухолях ЦНС?",["A. Ничем","B. Учитывают дозу глюкокортикоидов и неврологический статус, оценивают накапливающие и не накапливающие контраст компоненты","C. Основаны на объёме опухоли","D. Применяются только к метастазам"],"B","Уменьшение накопления контраста может быть следствием увеличения дозы дексаметазона, а не эффекта лечения. Поэтому RANO требуют, чтобы улучшение оценивалось при стабильной или сниженной дозе глюкокортикоидов и при отсутствии неврологического ухудшения. Отдельно оценивается не накапливающий контраст компонент, важный при антиангиогенной терапии.","RANO 2.0","https://pubmed.ncbi.nlm.nih.gov/37774317/"],["Профилактическое назначение противосудорожных препаратов больным с глиомой без судорог в анамнезе:",["A. Не рекомендуется — эффективность не доказана, а взаимодействия и побочные эффекты реальны","B. Показано всем","C. Показано при опухолях лобной доли","D. Показано перед операцией пожизненно"],"A","Профилактика без предшествующих судорог не показана. При их наличии предпочтительны препараты, не индуцирующие ферменты печени, поскольку индукторы CYP3A4 снижают концентрацию многих противоопухолевых средств. Глюкокортикоиды назначаются в минимально эффективной дозе и отменяются как можно раньше: они утяжеляют миопатию, гипергликемию, инфекции и искажают оценку ответа.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Основная задача лечения при глиоме 2-й степени у молодого больного:",["A. Контроль болезни при сохранении нейрокогнитивных функций на протяжении десятилетий","B. Максимально быстрое начало облучения","C. Немедленная химиотерапия во всех случаях","D. Только наблюдение"],"A","Ожидаемая продолжительность жизни при IDH-мутантной глиоме 2-й степени измеряется десятилетиями, поэтому поздняя токсичность лечения становится главной проблемой. Отсюда стратегия: максимально безопасная резекция, стратификация риска и отсрочка облучения у больных низкого риска, а с появлением ворасидениба — новая возможность фармакологического контроля до начала лучевой терапии.","INDIGO · ESMO","https://pubmed.ncbi.nlm.nih.gov/37272516/"]]},{"c":"М-13","t":"Метастатическое поражение головного мозга и оболочек","s":"Частная онкология, ч. 3","q":[["У пациента два метастаза в головной мозг до 2 см, хорошее функциональное состояние и контролируемая экстракраниальная болезнь. Какой локальный подход обычно предпочтителен?",["A. Облучение всего головного мозга во всех случаях","B. Стереотаксическая радиохирургия на очаги","C. Только системная терапия независимо от гистологии","D. Наблюдение без лечения"],"B","Для ограниченного числа небольших метастазов у пациента с хорошим функциональным статусом SRS позволяет добиться высокого локального контроля и лучше сохраняет когнитивные функции, чем рутинное добавление WBRT. Выбор зависит также от суммарного объёма, локализации, симптомов, гистологии и доступных системных препаратов.","ASCO-SNO-ASTRO guideline — Brain Metastases","https://pubmed.ncbi.nlm.nih.gov/34932393/"],["Если облучение всего головного мозга всё же необходимо, современный стандарт предполагает:",["A. Стандартную методику без модификаций","B. Одновременную химиотерапию","C. Увеличение дозы","D. Защиту гиппокампа в сочетании с мемантином"],"D","NRG CC001 показало, что защита гиппокампа с мемантином лучше сохраняет память и исполнительные функции при равной противоопухолевой эффективности. Гиппокамп критичен для формирования памяти и редко поражается метастазами, поэтому его исключение из зоны высокой дозы обосновано.","NRG Oncology CC001","https://pubmed.ncbi.nlm.nih.gov/32058845/"],["После полного хирургического удаления одиночного метастаза в головной мозг у пациента с хорошим функциональным статусом какой послеоперационный локальный подход обычно предпочтителен?",["A. Наблюдение во всех случаях","B. Профилактическое облучение всего головного мозга всем пациентам","C. Повторная операция без признаков рецидива","D. Стереотаксическое облучение послеоперационной полости"],"D","После резекции ограниченного метастатического поражения стереотаксическое облучение ложа снижает риск локального рецидива и позволяет избежать рутинного WBRT. Конкретная тактика зависит от размера полости, числа других очагов, гистологии, прогноза и возможностей последующего МРТ-наблюдения.","ASCO-SNO-ASTRO guideline — Brain Metastases","https://pubmed.ncbi.nlm.nih.gov/34932393/"],["Пациентка с HER2-положительным раком молочной железы и активными метастазами в головной мозг. Какая системная опция имеет доказанную внутричерепную активность?",["A. Тукатиниб с трастузумабом и капецитабином","B. Только облучение","C. Ингибитор CDK4/6","D. Тамоксифен"],"A","HER2CLIMB — одно из немногих регистрационных исследований, специально включавших больных с активными метастазами в мозг; получен выигрыш и по внутричерепным исходам. Значимую внутричерепную активность показал также трастузумаб дерукстекан в DESTINY-Breast12. Это меняет тактику: у части больных системная терапия позволяет отсрочить облучение.","HER2CLIMB — brain metastases analysis","https://pubmed.ncbi.nlm.nih.gov/32468955/"],["Больной с EGFR-мутированным раком лёгкого и бессимптомными мелкими метастазами в мозг. Возможно ли начать с системной терапии?",["A. Только при единичном очаге","B. Нет, облучение обязательно во всех случаях","C. Только после облучения всего мозга","D. Да: осимертиниб обладает высокой внутричерепной активностью и позволяет отсрочить облучение при бессимптомных очагах"],"D","Осимертиниб хорошо проникает через гематоэнцефалический барьер и обеспечивает высокую частоту внутричерепных ответов. При бессимптомных очагах допустимо начать с системной терапии под контролем МРТ, отложив облучение. При симптомных очагах, угрозе вклинения или крупных образованиях локальное лечение проводится в первую очередь.","FLAURA — CNS efficacy analysis","https://pubmed.ncbi.nlm.nih.gov/30153097/"],["Прогностический индекс GPA учитывает:",["A. Только гистологию","B. Только размер очагов","C. Функциональный статус, возраст, число метастазов, контроль экстракраниальной болезни и нозолого-специфические факторы, включая молекулярный статус","D. Только число метастазов"],"C","Диагноз-специфическая шкала GPA учитывает набор факторов, различающийся между нозологиями: при раке лёгкого — статус EGFR и ALK, при раке молочной железы — подтип. Медиана выживаемости между крайними группами различается в разы, что делает шкалу основой для выбора между активной тактикой и симптоматической помощью.","Diagnosis-Specific GPA for brain metastases","https://pubmed.ncbi.nlm.nih.gov/22203767/"],["Дексаметазон при метастазах в головной мозг назначается:",["A. При симптомном перифокальном отёке, в минимальной эффективной дозе с последующим снижением","B. Только перед облучением","C. Пожизненно","D. Всем больным независимо от симптомов"],"A","Бессимптомным больным глюкокортикоиды не нужны. При отёке начинают с умеренных доз и снижают по мере эффекта. Длительный приём вызывает миопатию, гипергликемию, остеопороз, психические нарушения и инфекции, а также снижает эффективность иммунотерапии. Кроме того, глюкокортикоиды искажают оценку ответа по критериям RANO-BM.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Диагноз лептоменингеального метастазирования устанавливается на основании:",["A. Только МРТ","B. Только цитологии ликвора","C. Сочетания клинической картины, МРТ головного и спинного мозга с контрастированием и цитологического исследования ликвора","D. Только неврологического осмотра"],"C","Цитология ликвора высокоспецифична, но чувствительность однократного исследования невысока — нередко требуется повторная люмбальная пункция с достаточным объёмом ликвора. МРТ всей нервной оси с контрастированием обязательна и должна выполняться до пункции, чтобы избежать артефактов. Классификация EANO и ESMO выделяет типы поражения, что влияет на выбор лечения.","EANO-ESMO CPG — leptomeningeal metastasis","https://pubmed.ncbi.nlm.nih.gov/37865164/"],["Какая опухоль наиболее часто даёт метастазы в головной мозг?",["A. Саркомы","B. Рак желудка","C. Рак предстательной железы","D. Рак лёгкого"],"D","Наибольший вклад вносит рак лёгкого, за ним следуют рак молочной железы и меланома. Меланома отличается наибольшей склонностью к внутричерепному распространению относительно своей частоты и высоким риском геморрагических метастазов, что важно при планировании вмешательств.","PDQ® — метастазы в головной мозг","https://www.cancer.gov/publications/pdq"],["Профилактическое противосудорожное лечение у больного с метастазами в мозг без судорог в анамнезе:",["A. Показано перед радиохирургией","B. Показано при множественных очагах","C. Показано всем","D. Не рекомендуется"],"D","Эффективность профилактики не доказана, а риски реальны: побочные эффекты, лекарственные взаимодействия — прежде всего индукция CYP3A4, снижающая концентрацию противоопухолевых препаратов, — и кожные реакции, особенно опасные на фоне облучения. При состоявшихся судорогах предпочтительны препараты без ферментной индукции.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-14","t":"Осложнения системной терапии II: тошнота и рвота, кожная, кардио- и нейротоксичность, тромбозы","s":"Общая онкология","q":[["Профилактика тошноты и рвоты назначается:",["A. Только пожилым","B. После первого эпизода рвоты","C. Заранее, исходя из эметогенного потенциала режима","D. Только при жалобах пациента"],"C","Профилактика всегда упреждающая: развившаяся рвота хуже контролируется, а перенесённый эпизод формирует условно-рефлекторную предвосхищающую тошноту, устойчивую к антиэметикам. Схема определяется классом режима — высоко-, умеренно-, низко- или минимально эметогенный.","MASCC/ESMO antiemetic guideline update","https://pubmed.ncbi.nlm.nih.gov/38458657/"],["Стандартная профилактика при высокоэметогенном режиме включает:",["A. Только антагонист 5-HT3","B. Антагонист 5-HT3, дексаметазон и антагонист NK1-рецепторов, при возможности с добавлением оланзапина","C. Только дексаметазон","D. Метоклопрамид"],"B","Трёхкомпонентная схема — основа; добавление оланзапина повышает полный контроль, прежде всего отсроченной фазы. Метоклопрамид применяется преимущественно как средство прорывной терапии, а не профилактики.","Olanzapine for prevention of CINV","https://pubmed.ncbi.nlm.nih.gov/27410922/"],["Предвосхищающая (условно-рефлекторная) тошнота лучше всего поддаётся:",["A. Антагонистам NK1","B. Профилактике адекватным контролем в первых циклах; при развившейся — бензодиазепинам и поведенческим методикам","C. Дексаметазону","D. Увеличению дозы антагониста 5-HT3"],"B","Это выработанный рефлекс, а не следствие прямого действия препарата, поэтому стандартные антиэметики малоэффективны. Единственная надёжная стратегия — не допустить рвоты с самого первого цикла. При развившейся форме применяются бензодиазепины и психотерапевтические методики.","MASCC/ESMO antiemetic guideline update","https://pubmed.ncbi.nlm.nih.gov/38458657/"],["Профилактика кожной токсичности при анти-EGFR-терапии:",["A. Не проводится","B. Изотретиноин","C. Системные глюкокортикоиды","D. Профилактический пероральный тетрациклин с увлажняющими средствами и защитой от солнца с первого дня терапии"],"D","Профилактический доксициклин или миноциклин, начатый одновременно с терапией, более чем вдвое снижает частоту тяжёлой сыпи. Дополнительно — эмоленты, солнцезащитные средства с высоким фактором, отказ от спиртосодержащей косметики. Важно объяснить пациенту, что сыпь ассоциирована с эффективностью лечения и не является поводом для его прекращения.","STEPP — pre-emptive skin treatment with panitumumab","https://pubmed.ncbi.nlm.nih.gov/20142600/"],["Ладонно-подошвенный синдром наиболее характерен для:",["A. Оксалиплатина","B. Винкристина","C. Цисплатина","D. Капецитабина, липосомального доксорубицина и мультикиназных ингибиторов"],"D","Проявления различаются: при капецитабине преобладают эритема и болезненность, при мультикиназных ингибиторах — гиперкератоз в зонах давления. Профилактика — эмоленты, мочевинсодержащие кремы, удобная обувь, исключение горячей воды и механических нагрузок. При 2–3-й степени требуется перерыв и редукция дозы.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Что следует выполнить до начала терапии с потенциальной кардиотоксичностью, включая антрациклины и anti-HER2-препараты?",["A. Ничего дополнительно","B. Исходную оценку сердечно-сосудистого риска и функции сердца; эхокардиографию с ФВ ЛЖ, а при возможности — GLS","C. Только измерение артериального давления","D. Коронарографию всем пациентам"],"B","ESC рекомендует исходную стратификацию сердечно-сосудистого риска до потенциально кардиотоксичной терапии. Эхокардиография с оценкой ФВ ЛЖ является базовым методом; GLS повышает чувствительность к ранней дисфункции, если доступен и воспроизводим. Дополнительные биомаркеры и частота последующего мониторинга зависят от исходного риска и конкретного препарата. Выявление субклинических изменений не означает автоматической необходимости назначать одинаковую кардиопротекцию каждому пациенту.","ESC Cardio-Oncology Guidelines 2022","https://pubmed.ncbi.nlm.nih.gov/36017568/"],["Как корректнее сравнить типичную кардиотоксичность антрациклинов и трастузумаба?",["A. Для антрациклинов риск тесно связан с кумулятивной дозой и может приводить к стойкой кардиомиопатии; дисфункция на трастузумабе чаще не связана с кумулятивной дозой и нередко улучшается после перерыва и кардиологической терапии","B. Механизмы и клиническое течение полностью одинаковы","C. Антрациклины не вызывают сердечной недостаточности","D. Дисфункция на трастузумабе всегда необратима"],"A","Антрациклиновая кардиотоксичность демонстрирует выраженную зависимость от суммарной экспозиции и может быть стойкой; поэтому важно учитывать пожизненную кумулятивную дозу. Дисфункция левого желудочка на фоне HER2-направленной терапии нередко частично или полностью обратима после приостановки лечения и кардиопротективной терапии, но слово «обратима» нельзя трактовать как гарантию для каждого пациента. Дексразоксан в рандомизированных исследованиях уменьшал частоту антрациклин-ассоциированных сердечных событий.","Randomized phase III — dexrazoxane cardioprotection with anthracyclines","https://pubmed.ncbi.nlm.nih.gov/16423847/"],["Пациент получает 5-фторурацил, во время инфузии возникла загрудинная боль с преходящими изменениями ST. Наиболее вероятный механизм:",["A. Кардиомиопатия","B. Тромбоэмболия","C. Коронарный вазоспазм, индуцированный фторпиримидином","D. Перикардит"],"C","Фторпиримидины вызывают коронарный вазоспазм, чаще в первые циклы. Инфузия немедленно прекращается, назначаются нитраты и блокаторы кальциевых каналов, исключается инфаркт. Повторное введение сопряжено с высоким риском рецидива и требует решения консилиума с кардиологом; при необходимости продолжения лечения рассматривается смена режима.","ESC Cardio-Oncology Guidelines 2022","https://pubmed.ncbi.nlm.nih.gov/36017568/"],["Как корректно сформулировать современную доказательную базу профилактики периферической нейропатии, вызванной химиотерапией (CIPN)?",["A. Нет лекарственного препарата, который ASCO рекомендует для рутинной профилактики CIPN; при уже развившейся болезненной CIPN наибольшую доказательную поддержку имеет дулоксетин","B. Всем пациентам профилактически назначают дулоксетин","C. Габапентин доказан как универсальная профилактика","D. Профилактика витаминами группы B обязательна"],"A","ASCO не рекомендует ни один лекарственный препарат для рутинной профилактики CIPN из-за недостаточной доказательной базы. Для уже сформировавшейся болезненной CIPN наиболее убедительные данные имеются для дулоксетина, хотя эффект умеренный. Нефармакологические подходы, включая охлаждение и компрессию, продолжают изучаться и могут применяться в отдельных центрах, но это не делает их универсальным фармакологическим стандартом.","ASCO Guideline Update — Prevention and Management of CIPN","https://pubmed.ncbi.nlm.nih.gov/32663120/"],["Особенность нейротоксичности оксалиплатина:",["A. Поражение слухового нерва","B. Только необратимая сенсорная нейропатия","C. Двигательные нарушения с первого введения","D. Острая холодовая дизестезия, провоцируемая холодом, и кумулятивная хроническая сенсорная нейропатия"],"D","Острая форма возникает в первые часы и дни, провоцируется холодом и обратима; пациента предупреждают избегать холодных напитков и контакта с холодными предметами. Хроническая форма кумулятивна и может нарастать некоторое время после прекращения лечения. Возможен также ларингоспазм, пугающий больного, но не угрожающий жизни.","ASCO Guideline Update — chemotherapy-induced peripheral neuropathy","https://pubmed.ncbi.nlm.nih.gov/32663120/"],["Ототоксичность наиболее характерна для:",["A. Оксалиплатина","B. Иринотекана","C. Карбоплатина","D. Цисплатина"],"D","Цисплатин вызывает необратимую сенсоневральную тугоухость, начинающуюся с высоких частот, а также шум в ушах. Аудиометрия до и во время лечения показана при высоких кумулятивных дозах и особенно у молодых больных, получающих лечение с радикальной целью. Ототоксичность усиливается при сочетании с аминогликозидами и петлевыми диуретиками.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Больному с раком поджелудочной железы и впервые выявленным тромбозом глубоких вен показана антикоагуляция. Что учесть при выборе препарата?",["A. Все препараты равнозначны","B. Показан только варфарин","C. Антикоагуляция не нужна","D. Прямые пероральные антикоагулянты не уступают низкомолекулярному гепарину, но повышают риск кровотечений при опухолях ЖКТ и мочевыводящих путей"],"D","Выбор определяется локализацией опухоли, риском кровотечения, функцией почек, тромбоцитопенией и лекарственными взаимодействиями. При опухолях желудочно-кишечного тракта и мочевыводящих путей предпочтителен низкомолекулярный гепарин. Варфарин у онкологических больных не рекомендуется из-за нестабильности МНО. Длительность — не менее 6 месяцев и далее, пока сохраняется активная опухоль или продолжается лечение.","Khorana score — VTE risk model","https://pubmed.ncbi.nlm.nih.gov/18216292/"]]},{"c":"М-15","t":"Клиническое стадирование II: специальные системы — FIGO, Lugano, BCLC, IGCCCG","s":"Общая онкология","q":[["Принципиальное отличие системы BCLC от TNM:",["A. BCLC учитывает только размер опухоли","B. BCLC объединяет распространённость опухоли, функцию печени и функциональный статус и сразу указывает лечебную тактику","C. BCLC применяется только при метастазах","D. Отличий нет"],"B","При гепатоцеллюлярном раке прогноз определяется не только опухолью, но и состоянием печени: больной с небольшим узлом на фоне декомпенсированного цирроза живёт меньше, чем больной с крупной опухолью и сохранной функцией. Поэтому BCLC интегрирует три составляющие и каждой стадии сопоставляет конкретный метод лечения — от резекции и трансплантации до системной терапии.","BCLC strategy — 2026 update","https://pubmed.ncbi.nlm.nih.gov/41151697/"],["Классификация IGCCCG при распространённых герминогенных опухолях учитывает:",["A. Только гистологию","B. Локализацию первичной опухоли, наличие нелёгочных висцеральных метастазов и уровни АФП, ХГЧ и ЛДГ","C. Только возраст","D. Только размер опухоли"],"B","Три параметра формируют группы благоприятного, промежуточного и неблагоприятного прогноза, определяющие число курсов химиотерапии. При благоприятном прогнозе доля излечения превышает 90 % даже при наличии отдалённых метастазов — исключительная ситуация в онкологии, объясняющая, почему занижение интенсивности лечения здесь недопустимо.","IGCCCG Update — metastatic germ-cell tumors","https://pubmed.ncbi.nlm.nih.gov/33729863/"],["Пятибалльная шкала Deauville используется для:",["A. Оценки нейротоксичности","B. Стадирования солидных опухолей","C. Оценки метаболического ответа при лимфомах путём сравнения накопления в очаге с накоплением в средостении и печени","D. Оценки функции печени"],"C","Шкала сравнивает накопление препарата в очаге с двумя внутренними референсами: кровяным пулом средостения и печенью. Значения 1–3 обычно расцениваются как полный метаболический ответ, 4–5 — как сохранение активности. Это позволяет строить ПЭТ-адаптированную терапию: усиливать лечение при плохом промежуточном ответе и сокращать его объём при хорошем.","Deauville five-point scale","https://pubmed.ncbi.nlm.nih.gov/21532082/"],["Что принципиально изменилось в стадировании рака шейки матки в редакции FIGO 2018 г.?",["A. Отменено понятие стадии","B. Разрешено использовать данные визуализации и патоморфологии; выделена стадия IIIC при поражении лимфоузлов","C. Стадирование стало исключительно клиническим","D. Введена молекулярная классификация"],"B","Историческая опора FIGO только на клинический осмотр объяснялась условиями стран с ограниченными ресурсами. Признание данных МРТ, ПЭТ-КТ и морфологии повысило точность, но создало проблему сопоставимости с историческими когортами: часть больных при пересмотре переходит в более высокую стадию.","FIGO 2018 cervical cancer staging","https://pubmed.ncbi.nlm.nih.gov/30656645/"],["Как молекулярная классификация вошла в стадирование рака эндометрия по FIGO 2023?",["A. POLE-мутированные опухоли ранних стадий переводятся в более раннюю стадию, p53-аномальные — в более позднюю","B. Заменила анатомическое стадирование полностью","C. Применяется только при метастазах","D. Не вошла"],"A","Редакция 2023 г. признала, что биология определяет прогноз сильнее анатомии: POLE-ультрамутированные опухоли имеют превосходный прогноз даже при неблагоприятной гистологии, тогда как p53-аномальные — плохой при формально ранней стадии. Изменение вызвало дискуссию, поскольку требует доступности молекулярного тестирования, и это следует учитывать при сравнении с предыдущими редакциями.","FIGO staging of endometrial cancer 2023","https://pubmed.ncbi.nlm.nih.gov/37337978/"],["Стадирование множественной миеломы по R-ISS основано на:",["A. Проценте плазматических клеток в костном мозге","B. Числе очагов в костях","C. Уровнях β2-микроглобулина, альбумина, лактатдегидрогеназы и цитогенетике высокого риска","D. Уровне парапротеина"],"C","Анатомическая распространённость при миеломе прогноз не определяет: болезнь системная изначально. Прогноз задают опухолевая масса, функция органов и биология клона. R2-ISS дополнительно учитывает прирост 1q. Это наглядный пример того, что стадирование — инструмент прогноза, а не описание анатомии.","R2-ISS — multiple myeloma","https://pubmed.ncbi.nlm.nih.gov/35605179/"],["Чем шкала ALBI предпочтительнее шкалы Чайлда — Пью?",["A. Основана только на объективных лабораторных показателях — альбумине и билирубине — и не включает субъективно оцениваемые асцит и энцефалопатию","B. Применяется без анализов","C. Учитывает размер опухоли","D. Проще запоминается"],"A","В шкале Чайлда — Пью два из пяти параметров оцениваются субъективно, что снижает воспроизводимость между врачами; кроме того, она разрабатывалась для прогноза при портокавальном шунтировании, а не при опухолях. ALBI лучше разделяет больных внутри класса A по Чайлду — Пью, что практически важно при отборе на локорегионарное и системное лечение.","ALBI grade","https://pubmed.ncbi.nlm.nih.gov/25512453/"],["Почему при лимфомах не применяется классификация TNM?",["A. По историческим причинам","B. Потому что лимфомы не стадируются","C. Потому что применяется только ПЭТ","D. Потому что лимфомы поражают лимфатическую систему диффузно, и распространённость определяется числом и расположением зон относительно диафрагмы, а не размером первичной опухоли"],"D","Понятие первичной опухоли и регионарных лимфоузлов к лимфомам неприменимо. Система Ann Arbor, модифицированная в классификации Lugano, описывает число поражённых зон, их расположение относительно диафрагмы, экстранодальное распространение и наличие общих симптомов.","Lugano classification","https://pubmed.ncbi.nlm.nih.gov/25113753/"],["Больной гепатоцеллюлярным раком: один узел 3 см, класс A по Чайлду — Пью, ECOG 0, без сосудистой инвазии. Стадия по BCLC и предпочтительная тактика:",["A. BCLC B; химиоэмболизация","B. BCLC C; системная терапия","C. BCLC D; симптоматическая помощь","D. BCLC A; резекция, абляция или трансплантация"],"D","Ранняя стадия BCLC A подразумевает лечение с радикальной целью. Выбор между резекцией, радиочастотной или микроволновой абляцией и трансплантацией определяется портальной гипертензией, локализацией узла и критериями отбора на трансплантацию. Прямая связь стадии с лечебной опцией — главное практическое достоинство системы.","BCLC strategy — 2026 update","https://pubmed.ncbi.nlm.nih.gov/41151697/"],["Общий принцип, объединяющий все специальные системы стадирования:",["A. Они проще TNM","B. Они применяются только в исследованиях","C. Они включают факторы, определяющие прогноз и выбор лечения сильнее анатомии: функцию органа, биохимические маркёры, молекулярный профиль","D. Они заменяют морфологический диагноз"],"C","Стадирование — прогностический инструмент, а анатомия лишь один из предикторов. Там, где функция печени, уровень маркёров или молекулярный подтип определяют исход сильнее размеров опухоли, разумно включить их в систему. Понимание этой логики важнее заучивания таблиц.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-16","t":"Патоморфология в онкологии","s":"Общая онкология","q":[["Что такое время холодовой ишемии и почему оно важно?",["A. Время транспортировки в лабораторию при низкой температуре","B. Время от прекращения кровоснабжения ткани до помещения её в фиксатор; его удлинение ведёт к деградации антигенов и нуклеиновых кислот","C. Время фиксации в формалине","D. Время хранения блока"],"B","Удлинение этого интервала приводит к ложноотрицательным результатам определения рецепторов и HER2 и к деградации РНК, критичной для выявления слияний генов. Ответственность за него лежит на клинической стороне — на операционной и процедурном кабинете, а не на лаборатории.","ASCO/CAP Guideline Update — ER/PgR testing: tissue handling requirements","https://ascopubs.org/doi/10.1200/JCO.19.02309"],["Стандартный алгоритм определения HER2 при раке молочной железы:",["A. Иммуногистохимия, при результате 2+ — гибридизация in situ","B. Только иммуногистохимия","C. Только гибридизация in situ","D. Только молекулярное исследование"],"A","Иммуногистохимия — первый этап; 0 и 1+ считаются отрицательными, 3+ — положительным, 2+ требует уточнения гибридизацией in situ. После появления данных по HER2-low различие между 0 и 1+ приобрело клиническое значение, и оценка этих категорий требует особой аккуратности.","ASCO/CAP Guideline Update — HER2 testing","https://pubmed.ncbi.nlm.nih.gov/29846122/"],["Порог позитивности рецепторов эстрогенов при раке молочной железы:",["A. 50 % и более","B. Любое окрашивание","C. 10 % и более","D. 1 % и более, при этом 1–10 % выделяется как низкая экспрессия"],"D","Порог 1 % сохранён, поскольку часть таких больных отвечает на эндокринотерапию. Категория с экспрессией 1–10 % выделена отдельно: по биологии эти опухоли ближе к рецептор-отрицательным, и решение об эндокринотерапии принимается индивидуально с учётом остальных характеристик.","ASCO/CAP Guideline Update — ER/PgR testing","https://pubmed.ncbi.nlm.nih.gov/31928404/"],["При иммуногистохимическом исследовании выявлена утрата экспрессии MLH1 и PMS2. Что необходимо сделать далее?",["A. Повторить иммуногистохимию","B. Ничего","C. Сразу направить на генетическое консультирование","D. Исследовать метилирование промотора MLH1 и мутацию BRAF V600E для исключения соматической природы"],"D","Утрата MLH1/PMS2 чаще имеет соматическую природу — метилирование промотора, нередко в сочетании с мутацией BRAF V600E при колоректальном раке. Их наличие говорит против синдрома Линча. При отрицательном результате показано тестирование зародышевой линии. Утрата MSH2/MSH6, напротив, редко бывает соматической, и генетическое консультирование показано сразу.","CAP Guideline — MMR/MSI testing for immune checkpoint inhibitor therapy","https://pubmed.ncbi.nlm.nih.gov/35920830/"],["Можно ли перенести пороговое значение экспрессии PD-L1 из одной нозологии в другую?",["A. Да, показатель универсален","B. Да, при одинаковой гистологии","C. Да, если использован тот же клон","D. Нет: различаются клоны антител, способы подсчёта (TPS, CPS, IC) и валидированные пороги"],"D","PD-L1 нельзя интерпретировать вне конкретной нозологии и валидированной системы тестирования: различаются антитела, платформы, алгоритмы подсчёта (TPS, CPS, IC) и клинические пороги. Исследования Blueprint показали значительную, но не абсолютную сопоставимость некоторых клонов; поэтому автоматический перенос порога или диагностической системы между показаниями некорректен.","Blueprint phase 2 — PD-L1 IHC assay comparability in NSCLC","https://pubmed.ncbi.nlm.nih.gov/29800747/"],["Основное ограничение цитологического материала по сравнению с гистологическим:",["A. Не позволяет установить злокачественность","B. Не подходит для иммуногистохимии в принципе","C. Требует больше времени","D. Отсутствие информации об архитектонике ткани и инвазии; ограниченный объём для иммуногистохимии и молекулярных исследований"],"D","Цитология позволяет установить злокачественность и нередко гистогенез, но не показывает инвазию и структуру ткани. Клеточные блоки из цитологического материала пригодны и для иммуногистохимии, и для молекулярного исследования, поэтому их приготовление следует запрашивать заранее. Тем не менее при планировании радикального лечения предпочтительна гистологическая верификация.","CAP/IASLC/AMP Molecular Testing Guideline — lung cancer","https://www.iaslc.org/research-education/research-committees/pathology-committee/cap/iaslc/amp-molecular-testing"],["Какова главная опасность избыточной иммуногистохимической панели при малой биопсии лёгкого?",["A. Удорожание исследования","B. Опасности нет","C. Расходование ткани, необходимой для молекулярного исследования, определяющего терапию","D. Удлинение сроков"],"C","При малой биопсии число срезов ограничено. Клиницист должен заранее сформулировать вопрос и согласовать с патологом план, зарезервировав материал на определение EGFR, ALK, ROS1, PD-L1 и панель NGS. Повторная биопсия для получения материала — дополнительный риск и потеря недель, поэтому бережное расходование ткани стало отдельной дисциплиной.","CAP/IASLC/AMP Molecular Testing Guideline — lung cancer","https://www.iaslc.org/research-education/research-committees/pathology-committee/cap/iaslc/amp-molecular-testing"],["Срочное интраоперационное исследование замороженных срезов имеет ограничение:",["A. Ниже точность из-за артефактов замораживания; непригодно для оценки рецепторного статуса и молекулярных исследований","B. Не применяется в онкологии","C. Занимает более часа","D. Не позволяет оценить край резекции"],"A","Метод отвечает на узкие вопросы: есть ли опухоль, чист ли край, поражён ли сторожевой лимфоузел. Артефакты замораживания ухудшают морфологическую детализацию, а ткань, прошедшая заморозку, хуже подходит для последующих исследований. Точный диагноз и подтип устанавливаются по парафиновым срезам.","Классификация опухолей ВОЗ","https://whobluebooks.iarc.fr/"],["Какая информация в направлении на морфологическое исследование наиболее помогает патологу корректно интерпретировать онкологический материал?",["A. Только фамилия пациента","B. Только предполагаемый диагноз","C. Только дата забора","D. Локализация и способ забора, клинический контекст и стадия, предшествующее лечение и конкретная диагностическая задача"],"D","Качественное морфологическое заключение требует клинического контекста. Особенно важны локализация и тип образца, сведения о предшествующей системной или лучевой терапии и задача исследования, поскольку лечение может существенно изменять морфологию и биомаркеры. Конкретный набор обязательных реквизитов определяется локальными нормативами и формой направления; поэтому прежнее слово «обязан» без ссылки на конкретный норматив заменено на клинически корректную формулировку.","College of American Pathologists — Cancer Protocol Templates","https://www.cap.org/protocols-and-guidelines/cancer-reporting-tools/cancer-protocol-templates"],["Как фиксация формалином влияет на пригодность FFPE-материала для секвенирования?",["A. Не влияет на нуклеиновые кислоты","B. Делает любой материал непригодным для NGS","C. Полностью разрушает ДНК во всех образцах","D. Может вызывать фрагментацию, сшивки и химические повреждения ДНК с артефактными вариантами; это учитывают при подготовке и интерпретации NGS"],"D","FFPE остаётся основным клиническим материалом для молекулярной диагностики и обычно пригоден для современных NGS-панелей. Однако формалин вызывает фрагментацию, сшивки и дезаминирование цитозина, что может формировать артефактные C>T/G>A варианты. Качество зависит от преданалитики, длительности фиксации, доли опухоли и возраста блока. ctDNA — возможный дополнительный источник материала в подходящих ситуациях, но не универсальная «альтернатива FFPE».","Mathieson & Thomas — FFPE biospecimens in genomic medicine","https://pubmed.ncbi.nlm.nih.gov/32697619/"]]},{"c":"М-17","t":"Герминогенные опухоли; рак полового члена","s":"Частная онкология, ч. 2","q":[["У больного с гистологически чистой семиномой яичка уровень АФП 180 нг/мл. Как это трактовать?",["A. Опухоль ведётся как несеминомная независимо от гистологического заключения","B. Лабораторная ошибка, повторить","C. Признак поражения печени","D. Норма для семиномы"],"A","Чистая семинома не продуцирует АФП. Его повышение означает наличие несеминомного компонента, не попавшего в срез, и опухоль лечится как несеминомная. Исключить надо лишь заболевания печени и редкие наследственные варианты. Это одна из ключевых практических аксиом в тестикулярной онкологии.","ESMO-EURACAN — Testicular seminoma and non-seminoma","https://pubmed.ncbi.nlm.nih.gov/35065204/"],["Что необходимо предложить каждому мужчине до начала химиотерапии по поводу герминогенной опухоли?",["A. Гормональную терапию","B. Профилактическую орхиэктомию контралатерального яичка","C. Ничего дополнительно","D. Криоконсервацию спермы"],"D","При I стадии герминогенной опухоли после орхифуникулэктомии активное наблюдение является полноценной стратегией у пациента, способного соблюдать график контроля. Риск рецидива зависит от гистологии и факторов риска: при семиноме в современных сериях он обычно около 12–20%, а при несеминомной опухоли существенно зависит от лимфоваскулярной инвазии. При своевременном выявлении рецидива общая выживаемость приближается к 100%.","ESMO-EURACAN — Testicular seminoma and non-seminoma","https://pubmed.ncbi.nlm.nih.gov/35065204/"],["Мужчина 28 лет, семинома яичка I стадии после орхифуникулэктомии, маркёры нормализовались, КТ без патологии. Предпочтительная тактика:",["A. Забрюшинная лимфаденэктомия","B. Три курса BEP","C. Адъювантная лучевая терапия всем","D. Активное наблюдение"],"D","Общая выживаемость при I стадии близка к 100 % при любой тактике, но наблюдение избавляет большинство больных от лечения и его отдалённых последствий, а рецидивы успешно лечатся. Адъювантная лучевая терапия сегодня практически не применяется из-за риска вторых опухолей. Наблюдение требует дисциплины пациента и доступности КТ — это обязательное условие выбора.","EAU Guidelines — Testicular Cancer: disease management","https://uroweb.org/guidelines/testicular-cancer/chapter/disease-management"],["Основной фактор риска рецидива при несеминомной опухоли I стадии:",["A. Размер опухоли","B. Возраст","C. Лимфоваскулярная инвазия","D. Уровень ЛДГ"],"C","Лимфоваскулярная инвазия повышает риск рецидива примерно до 50 % против 15 % при её отсутствии. При её наличии обсуждается один курс BEP как альтернатива наблюдению; при отсутствии предпочтительно наблюдение.","ESMO-EURACAN — Testicular seminoma and non-seminoma","https://pubmed.ncbi.nlm.nih.gov/35065204/"],["Каков стандартный объём первой линии при метастатической герминогенной опухоли благоприятного прогноза по IGCCCG?",["A. 2 курса BEP","B. 4 курса BEP","C. 3 курса BEP; 4 курса EP — признанная альтернатива, когда блеомицин нежелателен или противопоказан","D. 6 курсов BEP"],"C","Для хорошего прогноза стандартом остаются 3 курса BEP. Четыре курса EP используют как альтернативу, когда блеомицин нельзя безопасно применять. Снижение функции почек само по себе не делает EP предпочтительным, поскольку цисплатин остаётся его ключевым компонентом. При промежуточном и неблагоприятном прогнозе обычно применяют 4 цикла цисплатин-содержащей терапии согласно соответствующей группе риска.","EAU Guidelines — Testicular Cancer","https://uroweb.org/guidelines/testicular-cancer/chapter/disease-management"],["При фебрильной нейтропении на фоне BEP у больного с герминогенной опухолью правильная тактика в отношении следующего курса:",["A. Сохранить дозы, добавив первичную профилактику Г-КСФ","B. Прекратить лечение","C. Снизить дозы на 25 %","D. Отложить курс на 2 недели"],"A","Цель лечения радикальная, поэтому интенсивность дозы сохраняется, а миелотоксичность компенсируется колониестимулирующими факторами. Снижение доз и удлинение интервалов при герминогенных опухолях напрямую снижают вероятность излечения — здесь это принципиально важнее, чем при большинстве других нозологий.","ESMO-EURACAN — Testicular seminoma and non-seminoma","https://pubmed.ncbi.nlm.nih.gov/35065204/"],["После химиотерапии по поводу семиномы остаточное образование в забрюшинном пространстве 4 см. Дальнейшая тактика:",["A. Наблюдение без дополнительной оценки","B. Рассмотреть ФДГ-ПЭТ/КТ не ранее чем через 2 месяца после завершения химиотерапии","C. Немедленная забрюшинная лимфодиссекция","D. Автоматически начать вторую линию химиотерапии"],"B","При семиноме остаточную массу первоначально оценивают по данным визуализации и опухолевых маркёров. При остаточном образовании >3 см ФДГ-ПЭТ/КТ может помочь оценить жизнеспособность опухоли, но исследование следует выполнять не ранее чем через 2 месяца после окончания химиотерапии: более раннее исследование повышает риск ложноположительного результата. Отрицательная прогностическая ценность высока (>90%), тогда как положительная прогностическая ценность ограничена, поэтому положительный ПЭТ сам по себе не должен автоматически приводить к началу активного лечения.","EAU Guidelines — post-chemotherapy residual mass in seminoma","https://uroweb.org/guidelines/testicular-cancer/chapter/disease-management"],["После химиотерапии по поводу несеминомной опухоли остаточное образование 2 см, маркёры в норме. Тактика:",["A. Дополнительный курс BEP","B. ПЭТ-КТ","C. Хирургическое удаление резидуального образования","D. Наблюдение"],"C","При несеминомных опухолях ПЭТ неинформативна: тератома не накапливает препарат. В резидуальной ткани примерно в трети случаев обнаруживается зрелая тератома — она не чувствительна к химиотерапии, способна расти и малигнизироваться, ещё примерно в 10 % находят жизнеспособную опухоль. Поэтому образование более 1 см удаляют хирургически.","Postchemotherapy residual mass in nonseminoma — pcRPLND indication","https://pubmed.ncbi.nlm.nih.gov/29428550/"],["«Синдром растущей тератомы» — это:",["A. Рецидив семиномы","B. Прогрессирование опухоли на фоне химиотерапии","C. Увеличение образования при нормальных маркёрах за счёт роста зрелой тератомы","D. Лучевая реакция"],"C","Ключевой признак — рост образования при нормальных маркёрах на фоне или после химиотерапии. Расценить это как прогрессирование и назначить вторую линию — ошибка: тератома к химиотерапии не чувствительна, лечение только хирургическое, причём выполнять его следует до того, как образование станет нерезектабельным.","Postchemotherapy residual mass in nonseminoma — pcRPLND indication","https://pubmed.ncbi.nlm.nih.gov/29428550/"],["Что должно входить в пожизненное наблюдение излеченного больного с герминогенной опухолью?",["A. Только контроль маркёров","B. Контроль сердечно-сосудистых факторов риска, функции почек, слуха, гормонального статуса и настороженность в отношении вторых опухолей","C. Наблюдение не требуется","D. Ежегодная КТ пожизненно"],"B","Излеченные больные живут десятилетия, и основной причиной смерти становятся не рецидивы, а отдалённые последствия: сердечно-сосудистые события, вторые опухоли, нефротоксичность, тугоухость, гипогонадизм и метаболический синдром. Пожизненная КТ не проводится из-за лучевой нагрузки и риска индуцированных опухолей.","EAU Guidelines — Testicular Cancer: follow-up and long-term toxicities","https://uroweb.org/guidelines/testicular-cancer/chapter/followup-after-curative-therapy"],["Основной прогностический фактор при раке полового члена:",["A. Уровень ПСА","B. Возраст","C. Размер первичной опухоли","D. Состояние паховых лимфоузлов"],"D","Поражение паховых лимфоузлов определяет прогноз решающим образом, поэтому их оценка обязательна. При клинически негативных узлах и опухоли с риском метастазирования применяется динамическая биопсия сторожевого лимфоузла: она позволяет избежать паховой лимфаденэктомии, сопровождающейся высокой частотой лимфедемы и раневых осложнений.","EAU/ASCO guideline — sentinel node biopsy in penile cancer","https://pubmed.ncbi.nlm.nih.gov/38216778/"],["При опухоли полового члена низкой стадии предпочтительна тактика:",["A. Органосохраняющее лечение при возможности достижения чистого края","B. Тотальная пенэктомия во всех случаях","C. Наблюдение","D. Только лучевая терапия"],"A","Органосохраняющие подходы — местное иссечение, лазерная деструкция, гланулэктомия, брахитерапия — при сопоставимом онкологическом результате сохраняют мочеиспускание, сексуальную функцию и психологическое благополучие. Более 80 % опухолей ассоциированы с ВПЧ, что делает вакцинацию мерой первичной профилактики.","Рекомендации EAU","https://uroweb.org/guidelines"]]},{"c":"М-18","t":"Лимфома Ходжкина","s":"Частная онкология, ч. 3","q":[["Какой морфологический подход предпочтителен для подтверждения классической лимфомы Ходжкина?",["A. Диагноз устанавливают только по общему анализу крови","B. Достаточно ПЭТ-КТ без ткани","C. Предпочтительна эксцизионная биопсия доступного лимфоузла с морфологическим и иммуногистохимическим исследованием; при невозможности может использоваться адекватная core-биопсия","D. Тонкоигольная аспирация является методом выбора"],"C","Для диагностики классической лимфомы Ходжкина важно сохранить архитектуру ткани, поэтому эксцизионная биопсия доступного лимфоузла предпочтительна. Однако она не является единственно возможным способом: при анатомической недоступности или высоком риске вмешательства хорошо выполненная core-биопсия с достаточным материалом может быть диагностической. Тонкоигольной аспирации обычно недостаточно для первичной верификации.","NCCN/ESMO principles — Hodgkin lymphoma diagnosis","https://pubmed.ncbi.nlm.nih.gov/32196010/"],["Обязательный метод стадирования при лимфоме Ходжкина:",["A. ПЭТ-КТ","B. Сцинтиграфия костей","C. УЗИ","D. КТ с контрастированием"],"A","По классификации Lugano ПЭТ-КТ — стандарт стадирования: она точнее выявляет поражение и во многих случаях избавляет от трепанобиопсии костного мозга, ранее обязательной. Промежуточная ПЭТ используется для адаптации терапии.","Lugano classification","https://pubmed.ncbi.nlm.nih.gov/25113753/"],["Что показало исследование RATHL?",["A. ABVD уступает BEACOPP","B. Лучевая терапия обязательна","C. Блеомицин необходим во всех курсах","D. При отрицательной ПЭТ после двух курсов ABVD блеомицин из последующих курсов можно исключить без потери эффективности"],"D","Блеомицин вызывает пневмонит с потенциально фатальным исходом, и его исключение у больных с хорошим ранним ответом снижает риск без ущерба для результата. RATHL — классический пример деэскалации, управляемой промежуточной ПЭТ.","RATHL — PET-adapted therapy in Hodgkin lymphoma","https://pubmed.ncbi.nlm.nih.gov/27332902/"],["Какой режим в 2026 году имеет наиболее сильную современную доказательную базу для первой линии III–IV стадии классической лимфомы Ходжкина?",["A. Только ABVD","B. Только лучевая терапия","C. Эскалированный BEACOPP всем пациентам","D. Ниволумаб + AVD"],"D","SWOG S1826 показало преимущество ниволумаба + AVD над брентуксимабом ведотином + AVD по БПВ при благоприятном профиле переносимости. 20 марта 2026 года FDA одобрило ниволумаб + AVD для ранее не леченной классической лимфомы Ходжкина III–IV стадии у пациентов 12 лет и старше. Это делает режим важнейшим современным стандартом, но выбор конкретной первой линии всё равно зависит от возраста, сопутствующих заболеваний, доступности и национальных рекомендаций.","FDA approval — nivolumab + AVD for untreated stage III–IV classical Hodgkin lymphoma","https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-nivolumab-chemotherapy-previously-untreated-hodgkin-lymphoma"],["У больных 60 лет и старше в исследовании S1826 режим с ниволумабом показал:",["A. Только лучшую переносимость","B. Худшие результаты","C. Двухлетнюю беспрогрессивную выживаемость 89 % против 64 % и общую 96 % против 85 %","D. Отсутствие различий"],"C","Пожилые больные лимфомой Ходжкина исторически имели худшие результаты, в том числе из-за плохой переносимости брентуксимаба с его нейротоксичностью. Выигрыш в этой подгруппе оказался особенно выраженным, что делает выбор режима принципиальным именно у пожилых.","S1826 older-patient analysis — nivolumab-AVD vs BV-AVD","https://pubmed.ncbi.nlm.nih.gov/40523203/"],["Основной побочный эффект блеомицина, определяющий тактику:",["A. Нейропатия","B. Пневмонит с риском необратимого фиброза","C. Кардиотоксичность","D. Нефротоксичность"],"B","Блеомициновый пневмонит может быть фатальным. Требуются исходная оценка функции внешнего дыхания с диффузионной способностью, активный опрос о кашле и одышке перед каждым введением и осторожность с высокими концентрациями кислорода в дальнейшем, в том числе при анестезии. Появление симптомов — основание немедленно прекратить введение препарата.","RATHL — PET-adapted therapy in Hodgkin lymphoma","https://pubmed.ncbi.nlm.nih.gov/27332902/"],["Какие вопросы следует обсудить с молодым пациентом до начала потенциально гонадотоксичного лечения лимфомы?",["A. Только режим приёма препаратов","B. Только предполагаемую дату завершения терапии","C. Риск нарушения фертильности и варианты её сохранения, а также значимые поздние последствия лечения и план последующего наблюдения","D. Дополнительное обсуждение не требуется"],"C","У молодых пациентов до начала потенциально гонадотоксичной терапии следует своевременно обсудить риск нарушения фертильности и доступные способы её сохранения. Также важны поздние сердечно-сосудистые, эндокринные и вторичные онкологические последствия, зависящие от конкретных препаратов и полей лучевой терапии. Не каждому пациенту требуется один и тот же перечень вмешательств: программа наблюдения должна соответствовать фактически полученному лечению.","NCCN Survivorship","https://www.nccn.org/guidelines/category_3"],["Женщине, получившей облучение средостения по поводу лимфомы Ходжкина в 22 года, программа наблюдения должна включать:",["A. Ежегодную ПЭТ-КТ пожизненно","B. Раннее начало скрининга рака молочной железы, контроль функции щитовидной железы и оценку сердечно-сосудистого риска","C. Только осмотр гематолога","D. Наблюдение не требуется через 5 лет"],"B","Облучение средостения в молодом возрасте резко повышает риск рака молочной железы, поэтому скрининг начинается существенно раньше популяционного, обычно с включением МРТ. Также требуются контроль функции щитовидной железы, оценка клапанного аппарата и коронарного риска. Регулярная ПЭТ-КТ в бессимптомном периоде не проводится: она сама несёт лучевую нагрузку и даёт ложноположительные результаты.","NCCN Survivorship principles — late effects after cancer therapy","https://www.nccn.org/guidelines/category_3"],["При рецидиве после аутологичной трансплантации предпочтительная опция по данным KEYNOTE-204:",["A. Бендамустин","B. Лучевая терапия","C. Пембролизумаб","D. Повторная трансплантация"],"C","Классическая лимфома Ходжкина исключительно чувствительна к блокаде PD-1: генетические изменения локуса 9p24.1 приводят к гиперэкспрессии лигандов PD-L1 и PD-L2. KEYNOTE-204 показало превосходство пембролизумаба над брентуксимабом ведотином в этой популяции.","KEYNOTE-204","https://pubmed.ncbi.nlm.nih.gov/33721562/"],["Нодулярная лимфома Ходжкина с лимфоидным преобладанием отличается от классической тем, что:",["A. Всегда протекает агрессивнее","B. Не требует лечения никогда","C. Имеет иной иммунофенотип (CD20-положительная, CD30-отрицательная), индолентное течение и лечится иначе, включая ритуксимаб-содержащие подходы","D. Течением не отличается"],"C","Это отдельное заболевание с B-клеточным иммунофенотипом. Течение индолентное, при локализованных стадиях возможны только лучевая терапия или наблюдение после полного удаления узла; применяются ритуксимаб-содержащие режимы. Существует риск трансформации в агрессивную B-клеточную лимфому, что требует настороженности.","Классификация опухолей ВОЗ","https://whobluebooks.iarc.fr/"],["Промежуточная ПЭТ-КТ после двух курсов используется для того, чтобы:",["A. Адаптировать терапию: усилить при плохом ответе или деэскалировать при хорошем","B. Оценить токсичность","C. Определить стадию","D. Установить диагноз"],"A","ПЭТ-адаптированная стратегия — центральная идея современного лечения лимфомы Ходжкина. При 1–3 баллах Deauville возможна деэскалация, при 4–5 — эскалация. Следует помнить о ложноположительных результатах вследствие воспаления, действия колониестимулирующих факторов и бурой жировой ткани, а также о том, что предсказательная сила промежуточной ПЭТ при режимах с ингибиторами контрольных точек изучена меньше.","Lugano classification","https://pubmed.ncbi.nlm.nih.gov/25113753/"]]},{"c":"М-19","t":"Молекулярная генетика и трансляционная медицина в онкологии","s":"Общая онкология","q":[["Шкала ESCAT предназначена для:",["A. Оценки токсичности","B. Оценки ответа","C. Ранжирования клинической значимости молекулярной мишени по уровню доказательности","D. Стадирования"],"C","Уровень I означает мишень, эффективность воздействия на которую подтверждена в проспективных рандомизированных исследованиях при данной нозологии; далее по нисходящей — от подтверждения в исследованиях без рандомизации до данных доклинических моделей. Без такого ранжирования отчёт NGS превращается в список находок без указания, какие из них можно использовать.","ESMO ESCAT scale","https://pubmed.ncbi.nlm.nih.gov/30137196/"],["Вариант с неопределённой клинической значимостью (VUS) в отчёте означает:",["A. Находку, влияние которой на функцию гена и на прогноз неизвестно; основанием для лечения не является","B. Доброкачественный полиморфизм","C. Показание к таргетной терапии","D. Ошибку лаборатории"],"A","VUS не служит основанием ни для терапии, ни для решений о профилактических вмешательствах при герминальном тестировании. Со временем классификация может измениться в обе стороны, поэтому периодическая переоценка целесообразна. Назначение таргетного препарата по VUS — распространённая и вредная ошибка.","ESMO Precision Medicine Working Group — NGS 2024","https://pubmed.ncbi.nlm.nih.gov/38834388/"],["Как отличить герминальную мутацию от соматической при секвенировании опухоли без парного образца крови?",["A. По частоте аллеля можно заподозрить, но надёжное разграничение требует исследования нормальной ткани или крови","B. Никак","C. Однозначно по типу гена","D. По уровню экспрессии"],"A","Частота аллеля около 50 % в гене, связанном с наследственным синдромом, повышает подозрение на герминальную природу, но подтверждение требует исследования нормальной ткани — обычно крови или буккального эпителия. Это критично: герминальная мутация означает необходимость генетического консультирования и каскадного тестирования родственников.","ESMO Precision Medicine Working Group — NGS 2024","https://pubmed.ncbi.nlm.nih.gov/38834388/"],["Почему при интерпретации NGS опухоли или плазмы важно учитывать клональное кроветворение?",["A. Потому что оно всегда означает гемобластоз","B. Потому что оно возникает только как артефакт фиксации","C. Потому что соматические варианты клеток крови, например в DNMT3A, TET2 или ASXL1, могут быть ошибочно приняты за опухолевые мутации","D. Потому что оно делает любое секвенирование недостоверным"],"C","Клональное кроветворение часто выявляется случайно при секвенировании опухолевой ткани, плазмы или парного образца крови. Варианты, происходящие из лейкоцитов, могут быть ошибочно интерпретированы как опухолевые или герминальные. Сопоставление с парной кровью, клиническим контекстом, VAF и спектром генов помогает избежать ошибочной трактовки. Сам факт CHIP не равен диагнозу гемобластоза.","Review — clonal hematopoiesis in patients with solid tumors","https://pmc.ncbi.nlm.nih.gov/articles/PMC9669303/"],["Как правильно интерпретировать отрицательный результат ctDNA-профилирования при распространённой опухоли?",["A. Отрицательный результат не исключает наличие опухолевой мутации; при сохраняющейся клинической необходимости следует рассмотреть исследование ткани","B. Он означает, что тканевая биопсия требуется в абсолютно каждом случае","C. ctDNA неприменима в онкологии","D. Он надёжно исключает все драйверные мутации"],"A","Чувствительность плазменного ctDNA зависит от объёма болезни, локализации метастазов и уровня выделения опухолевой ДНК. При низком shedding, малом объёме болезни или изолированном поражении ЦНС отрицательный результат может быть ложноотрицательным. Поэтому при клинически важном отрицательном результате и доступном материале следует рассмотреть тканевое тестирование; необходимость зависит от конкретной диагностической задачи.","ESMO Precision Medicine Working Group — ctDNA recommendations","https://pubmed.ncbi.nlm.nih.gov/35809752/"],["Что показало исследование DYNAMIC при раке ободочной кишки II стадии?",["A. Циркулирующая ДНК неинформативна","B. Тактика, основанная на определении циркулирующей опухолевой ДНК после операции, позволила существенно сократить назначение химиотерапии без ухудшения выживаемости","C. Химиотерапия показана всем","D. Адъювантная химиотерапия не нужна никому"],"B","Это первое рандомизированное подтверждение клинической пользы оценки молекулярной остаточной болезни при солидной опухоли. Логика та же, что при гемобластозах: лечить тех, у кого болезнь осталась, и не лечить тех, у кого её нет. Метод активно изучается и в других нозологиях.","DYNAMIC — ctDNA-guided adjuvant therapy","https://pubmed.ncbi.nlm.nih.gov/35657320/"],["Слияния NTRK характеризуются тем, что:",["A. Выявляются только методом иммуногистохимии","B. Встречаются часто во всех опухолях","C. Не имеют клинического значения","D. Редки в большинстве нозологий, но очень часты в отдельных редких формах; служат тканенезависимым показанием к ингибиторам TRK"],"D","Частота менее 1 % в большинстве распространённых опухолей и близка к 100 % в отдельных редких формах, например в секреторной карциноме слюнной железы и инфантильной фибросаркоме. Ларотректиниб и энтректиниб дают высокую частоту ответов независимо от локализации. Для выявления слияний предпочтительны методики на основе РНК: панели на ДНК могут их пропускать.","Larotrectinib in TRK fusion-positive cancers","https://pubmed.ncbi.nlm.nih.gov/29466156/"],["Когда широкая панель NGS даёт наибольшую практическую пользу?",["A. Только при скрининге","B. Только при гемобластозах","C. При любой опухоли на любой стадии","D. При распространённой опухоли, когда исчерпаны или ограничены стандартные опции, а также в нозологиях с большим числом действенных мишеней"],"D","Молекулярный консилиум помогает интерпретировать сложные геномные данные и сопоставлять их с доказательствами, клиническими исследованиями и доступностью терапии. Систематический обзор 2025 года показал, что лишь часть пациентов, обсуждённых на MTB, реально получает рекомендованное таргетное лечение; сравнительные данные предполагают лучшие исходы у получивших matched therapy, но большая часть доказательств остаётся наблюдательной и подвержена отбору. Поэтому MTB — важный инструмент принятия решения, а не гарантия клинической пользы.","ESMO Precision Medicine Working Group — NGS 2024","https://pubmed.ncbi.nlm.nih.gov/38834388/"],["Для выявления слияний генов предпочтительнее использовать:",["A. Только флуоресцентную гибридизацию","B. Панели на основе ДНК","C. Методики на основе РНК либо специализированные ДНК-панели с покрытием интронов","D. Иммуногистохимию"],"C","Точки разрыва при слияниях часто лежат в крупных интронах, плохо покрываемых стандартными ДНК-панелями. Секвенирование РНК напрямую выявляет химерный транскрипт. Иммуногистохимия применима как скрининговый метод для отдельных мишеней (ALK, ROS1, пан-TRK), но требует подтверждения.","ESMO Precision Medicine Working Group — NGS 2024","https://pubmed.ncbi.nlm.nih.gov/38834388/"],["Что такое молекулярный консилиум и зачем он нужен?",["A. Мультидисциплинарное обсуждение молекулярных отчётов, повышающее долю больных, реально получающих терапию по результату тестирования","B. Формальная процедура","C. Способ ускорить анализ","D. Замена патоморфологическому заключению"],"A","Разрыв между числом выявленных мишеней и числом больных, реально получивших соответствующее лечение, велик. Молекулярный консилиум с участием онколога, патолога, генетика и биоинформатика этот разрыв сокращает: он ранжирует находки по ESCAT, проверяет доступность препаратов и подбирает клинические исследования.","Systematic review/meta-analysis — clinical effectiveness of molecular tumor boards (2025)","https://www.nature.com/articles/s41698-025-00865-1"]]},{"c":"М-20","t":"Основы медицинской статистики для онколога","s":"Общая онкология","q":[["Отношение рисков 0,70 означает:",["A. Медиана выживаемости выросла на 30 %","B. Больные живут на 30 % дольше","C. Мгновенный риск события в группе вмешательства в среднем на 30 % ниже, чем в контроле","D. У 70 % больных наступил эффект"],"C","Отношение рисков описывает соотношение интенсивности наступления событий, усреднённое за период наблюдения. Оно не переводится напрямую ни в прирост медианы, ни в долю ответивших. Клинически осмысленный вывод требует ещё и абсолютных величин: медиан, долей живущих к определённому сроку.","RMST as an alternative to the hazard ratio in cancer trials","https://pubmed.ncbi.nlm.nih.gov/28975263/"],["Что означает цензурирование наблюдения в анализе выживаемости?",["A. Исключение больного из анализа","B. Учёт больного до момента, когда информация о нём прекращается без наступления события","C. Ошибку данных","D. Отказ от лечения"],"B","Цензурированный больной участвует в анализе до последнего известного момента наблюдения. Метод Каплана — Мейера корректно с этим работает. Однако если выбывание связано с прогнозом — например, тяжёлые больные чаще теряются из-под наблюдения, — возникает искажение, называемое информативным цензурированием.","RMST as an alternative to the hazard ratio in cancer trials","https://pubmed.ncbi.nlm.nih.gov/28975263/"],["Почему БПВ как конечная точка требует более осторожной интерпретации, чем общая выживаемость?",["A. Потому что БПВ всегда короче","B. Потому что БПВ невозможно анализировать статистически","C. Потому что БПВ нельзя использовать в рандомизированных исследованиях","D. На БПВ влияют график и методика обследований и правила фиксации прогрессирования; кроме того, улучшение БПВ не во всех нозологиях надёжно предсказывает улучшение ОВ"],"D","БПВ — валидная и широко используемая конечная точка, но её оценка чувствительна к частоте визуализации, моменту обследований и критериям прогрессирования. Суррогатная связь между эффектом на БПВ и эффектом на ОВ различается между заболеваниями и линиями терапии. Поэтому значимое улучшение БПВ само по себе не следует автоматически трактовать как доказанное улучшение продолжительности жизни.","Systematic review of surrogate endpoints and overall survival in oncology","https://pubmed.ncbi.nlm.nih.gov/29482777/"],["В исследовании получено отношение рисков 0,62 с доверительным интервалом от 0,38 до 1,01. Как это трактовать?",["A. Достоверное преимущество","B. Вред от лечения","C. Направление эффекта благоприятное, но интервал включает 1, то есть отсутствие различий не исключено","D. Отсутствие эффекта"],"C","Доверительный интервал, включающий 1, означает, что данные совместимы и с отсутствием эффекта. Ширина интервала указывает на малое число событий. Формулировка «наметилась тенденция» некорректна: правильнее сказать, что исследование не обладало достаточной мощностью, чтобы ответить на вопрос.","RMST as an alternative to the hazard ratio in cancer trials","https://pubmed.ncbi.nlm.nih.gov/28975263/"],["Логика исследования не меньшей эффективности состоит в том, чтобы:",["A. Оценить безопасность","B. Сравнить с плацебо","C. Показать, что новый метод не хуже стандарта в пределах заранее заданной границы, обычно при иных преимуществах — меньшей токсичности, удобстве, стоимости","D. Доказать превосходство нового метода"],"C","В исследовании не меньшей эффективности заранее задают клинически обоснованную границу Δ, определяющую максимально допустимую потерю эффективности нового вмешательства. Вывод о non-inferiority не означает доказанного равенства двух методов. Особое значение имеют как анализ по протоколу, так и intention-to-treat: расхождения между ними должны быть рассмотрены, поскольку нарушения протокола могут искусственно сближать группы.","CONSORT extension for noninferiority and equivalence randomized trials","https://pubmed.ncbi.nlm.nih.gov/23268518/"],["В исследовании общий эффект лечения незначим, но в подгруппе пациентов старше 65 лет результат статистически значим. Как интерпретировать находку?",["A. Общий анализ автоматически недействителен","B. Лечение доказанно неэффективно во всех остальных подгруппах","C. Самого значимого P в одной подгруппе достаточно для изменения стандарта","D. Это требует осторожной интерпретации: важны предварительная спецификация подгруппы, тест взаимодействия, число сравнений, биологическая правдоподобность и воспроизводимость"],"D","Значимость эффекта внутри одной подгруппы и отсутствие значимости в другой не доказывают различие эффектов между подгруппами. Нужен формальный тест взаимодействия. Предварительно запланированные гипотезы, ограниченное число сравнений и независимое подтверждение повышают доверие; пост-хок находка чаще является гипотезообразующей, особенно если основной результат исследования отрицательный.","Brookes et al. — subgroup analyses and interaction testing in randomized trials","https://pubmed.ncbi.nlm.nih.gov/15066682/"],["Почему при иммунотерапии отношение рисков может недооценивать пользу?",["A. Мало больных","B. Ошибка расчёта","C. Кривые выживаемости расходятся поздно, нарушая допущение пропорциональности рисков; часть больных получает длительный эффект, что усреднённый показатель не отражает","D. Короткое наблюдение"],"C","Отношение рисков предполагает постоянство соотношения во времени. При иммунотерапии в первые месяцы различий нет или контрольная группа даже выигрывает, а затем формируется плато. В таких случаях дополнительно оценивают долю живущих к определённому сроку и площадь между кривыми.","RMST as an alternative to the hazard ratio in cancer trials","https://pubmed.ncbi.nlm.nih.gov/28975263/"],["Больной спрашивает: «Насколько мне поможет этот препарат?» Наиболее корректный способ ответа:",["A. Привести абсолютные величины: медианы выживаемости в обеих группах, доли живущих к определённому сроку, вероятность ответа и основные риски","B. Сказать, что эффективность доказана","C. Назвать величину p","D. Назвать отношение рисков"],"A","Относительные величины систематически завышают воспринимаемую пользу. Абсолютные показатели, выраженные в естественных частотах, понятнее и честнее. Одновременно приводятся риски в тех же единицах, чтобы решение принималось на основе полной картины.","ESMO-MCBS v1.1","https://pubmed.ncbi.nlm.nih.gov/28945867/"],["Для чего нужна шкала ESMO-MCBS?",["A. Для оценки статистической значимости","B. Для расчёта дозы","C. Для градации величины клинической пользы с учётом абсолютного выигрыша, качества жизни и токсичности","D. Для стадирования"],"C","Шкала отвечает на вопрос, который статистическая значимость не решает: насколько результат важен для больного. Прирост медианы выживаемости на 6 недель при выраженной токсичности и на 12 месяцев при хорошей переносимости статистически могут быть одинаково значимы, но клинически несопоставимы.","ESMO-MCBS v1.1","https://pubmed.ncbi.nlm.nih.gov/28945867/"],["Ошибка бессмертного времени в наблюдательных исследованиях возникает, когда:",["A. Группы не рандомизированы по возрасту","B. Больных наблюдают слишком долго","C. Период, в течение которого больной обязательно должен был выжить, чтобы попасть в группу лечения, засчитывается этой группе","D.
