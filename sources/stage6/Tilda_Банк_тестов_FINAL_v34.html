<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap');
body{margin:0;background:#fbfcfd;padding:28px 0}
.onco-test{--deep:#003a63;--mid:#014f86;--sky:#61a5c2;--pale:#a9d6e5;--wash:#ecf6f9;
 --ok:#1d6b38;--okbg:#e4f2e8;--bad:#9c2b2b;--badbg:#fae9e9;--line:#dbe6ee;--muted:#5f6b75;
 font-family:'Noto Sans','TildaSans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 color:#1a1a1a;font-size:16px;line-height:1.6;max-width:820px;margin:0 auto;padding:0 16px 48px}
.onco-test *{box-sizing:border-box}
.onco-test h2{font-size:1.35rem;color:var(--deep);margin:0 0 6px;letter-spacing:-.01em}
.onco-test h3{font-size:1rem;color:var(--mid);margin:22px 0 8px;text-transform:uppercase;
 letter-spacing:.06em;font-weight:600}
.onco-test p{margin:0 0 12px}
.onco-test .lede{color:var(--muted);margin:0 0 22px}
.onco-test .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px}
.onco-test .stat{background:var(--wash);border-radius:10px;padding:12px 18px;margin:0 0 18px;font-size:.92rem}
.onco-test .stat b{color:var(--deep)}
.onco-test label.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
 margin:8px 0;cursor:pointer;transition:border-color .12s,background .12s;background:#fff}
.onco-test label.opt:hover{border-color:var(--sky)}
.onco-test label.opt input{margin-right:10px}
.onco-test label.opt.sel{border-color:var(--mid);background:var(--wash)}
.onco-test label.opt.ok{border-color:var(--ok);background:var(--okbg)}
.onco-test label.opt.bad{border-color:var(--bad);background:var(--badbg)}
.onco-test label.opt.dim{opacity:.55}
.onco-test button{font:inherit;font-weight:600;border:none;border-radius:9px;padding:11px 20px;
 cursor:pointer;background:var(--deep);color:#fff;transition:background .12s}
.onco-test button:hover{background:var(--mid)}
.onco-test button.ghost{background:#fff;color:var(--mid);border:1px solid var(--line)}
.onco-test button.ghost:hover{background:var(--wash)}
.onco-test button:disabled{opacity:.4;cursor:default}
.onco-test .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.onco-test select,.onco-test input[type=number]{font:inherit;padding:9px 12px;border:1px solid var(--line);
 border-radius:9px;background:#fff;max-width:100%}
.onco-test select{width:100%}
.onco-test .field{margin:0 0 14px}
.onco-test .field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:5px}
.onco-test .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 18px}
.onco-test .bar i{display:block;height:100%;background:var(--sky);transition:width .25s}
.onco-test .meta{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;
 gap:12px;margin-bottom:8px;flex-wrap:wrap}
.onco-test .expl{margin-top:14px;padding:14px 16px;background:var(--wash);border-left:4px solid var(--sky);
 border-radius:0 9px 9px 0;font-size:.94rem}
.onco-test .expl b{color:var(--deep)}
.onco-test .expl a{color:var(--mid)}
.onco-test .verdict{font-weight:700;margin-bottom:6px}
.onco-test .verdict.ok{color:var(--ok)}
.onco-test .verdict.bad{color:var(--bad)}
.onco-test .score{font-size:2.6rem;font-weight:700;color:var(--deep);line-height:1.1}
.onco-test .score small{display:block;font-size:.9rem;font-weight:400;color:var(--muted);margin-top:4px}
.onco-test .mistake{border-left:3px solid var(--bad);padding:10px 0 10px 14px;margin:14px 0;font-size:.94rem}
.onco-test .mistake .qq{font-weight:600;margin-bottom:6px}
.onco-test .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;
 text-transform:uppercase;background:var(--wash);color:var(--mid);border-radius:20px;padding:4px 10px;margin-left:8px}
.onco-test .modlist{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.onco-test .modlist label{display:block;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:.92rem}
.onco-test .modlist label:hover{background:var(--wash)}
.onco-test .modlist input{margin-right:8px}
.onco-test .hint{font-size:.85rem;color:var(--muted);margin-top:10px}
@media(max-width:600px){.onco-test{padding:0 12px 36px;font-size:15px}
 .onco-test h2{font-size:1.15rem}.onco-test button{width:100%}.onco-test .row button{width:100%}}

</style>
<div class="onco-test" id="oncoTest"></div>
<script>window.__ONCO_BANK__={"m":[{"c":"М-01","t":"Биология злокачественных опухолей. Ключевые характеристики опухолевой клетки","s":"Общая онкология","q":[["Какое из перечисленных свойств НЕ входит в число ключевых характеристик опухоли по Hanahan (2022)?",["A. Индукция ангиогенеза","B. Устойчивая пролиферативная сигнализация","C. Обязательная утрата всех генов-супрессоров","D. Уклонение от иммунного разрушения"],"C","Концепция описывает функциональные приобретённые способности опухоли, а не обязательный набор генетических событий. Утрата всех генов-супрессоров не требуется и не наблюдается: разные опухоли достигают одних и тех же функциональных свойств разными молекулярными путями.","Hanahan 2022 — Hallmarks of Cancer: New Dimensions","https://pubmed.ncbi.nlm.nih.gov/35022204/"],["Чем драйверная мутация отличается от пассажирской?",["A. Драйверная даёт клетке селективное преимущество и участвует в опухолевой прогрессии","B. Драйверная встречается чаще","C. Пассажирская всегда находится в некодирующей области","D. Пассажирская не выявляется методом NGS"],"A","Драйверная мутация обеспечивает селективное преимущество клона. Пассажирские накапливаются попутно и функционального значения не имеют, но могут преобладать численно — особенно при высокой мутационной нагрузке.","COSMIC — каталог соматических мутаций","https://cancer.sanger.ac.uk/cosmic"],["Что такое клональная эволюция опухоли и почему она важна клинически?",["A. Это синоним метастазирования","B. Опухоль представляет собой набор субклонов, состав которых меняется под давлением отбора, в том числе лекарственного","C. Клональная эволюция происходит только при гемобластозах","D. Опухоль состоит из генетически идентичных клеток"],"B","Внутриопухолевая гетерогенность и отбор субклонов объясняют развитие резистентности: терапия уничтожает чувствительные клоны и освобождает нишу для устойчивых. Отсюда практические следствия — повторная биопсия при прогрессировании и мониторинг циркулирующей опухолевой ДНК.","cBioPortal — данные по гетерогенности опухолей","https://www.cbioportal.org/"],["Какую роль играет опухолевое микроокружение?",["A. Активный участник: фибробласты, иммунные и эндотелиальные клетки поддерживают рост, инвазию и лекарственную устойчивость","B. Определяет только скорость ангиогенеза","C. Значимо только при саркомах","D. Пассивная опорная структура"],"A","Ассоциированные с опухолью фибробласты, супрессорные миелоидные клетки, регуляторные T-клетки и сосудистая сеть формируют среду, поддерживающую опухоль. Именно поэтому мишенями терапии становятся не только сами опухолевые клетки, но и микроокружение — ангиогенез, иммунные контрольные точки.","Hanahan 2022 — Hallmarks of Cancer: New Dimensions","https://pubmed.ncbi.nlm.nih.gov/35022204/"],["Ангиогенный переключатель («angiogenic switch») означает:",["A. Активацию лимфангиогенеза","B. Переход опухоли от бессосудистого роста к формированию собственной сосудистой сети","C. Смену типа кровоснабжения с артериального на венозный","D. Появление метастазов в лёгких"],"B","Без собственной сосудистой сети опухоль не может расти более 1–2 мм. Смещение баланса про- и антиангиогенных факторов в пользу первых (прежде всего VEGF) запускает неоангиогенез. Это молекулярное обоснование антиангиогенной терапии — бевацизумаба, афлиберцепта, мультикиназных ингибиторов.","Holland-Frei Cancer Medicine, раздел по ангиогенезу","https://www.ncbi.nlm.nih.gov/books/NBK12354/"],["Какой механизм обеспечивает опухолевым клеткам репликативное бессмертие?",["A. Инактивация p53","B. Реактивация теломеразы или альтернативное удлинение теломер","C. Утрата PTEN","D. Амплификация MYC"],"B","Укорочение теломер ограничивает число делений нормальной клетки. Реактивация теломеразы (TERT), в том числе за счёт мутаций промотора, либо механизм ALT снимают это ограничение. Инактивация p53 и амплификация MYC относятся к другим характеристикам.","Hanahan 2022 — Hallmarks of Cancer: New Dimensions","https://pubmed.ncbi.nlm.nih.gov/35022204/"],["Эпителиально-мезенхимальный переход в метастатическом каскаде обеспечивает прежде всего:",["A. Активацию теломеразы","B. Повышение мутационной нагрузки","C. Устойчивость к апоптозу","D. Приобретение подвижности и инвазивных свойств с утратой межклеточной адгезии"],"D","При ЭМП снижается экспрессия E-кадгерина, клетка утрачивает полярность и адгезию, приобретая подвижность. Это лишь один этап каскада: далее следуют интравазация, выживание в кровотоке, экстравазация и колонизация — «узким местом» является именно последний этап.","Holland-Frei Cancer Medicine, раздел по метастазированию","https://www.ncbi.nlm.nih.gov/books/NBK12354/"],["Эффект Варбурга — это:",["A. Утрата способности к гликолизу","B. Накопление гликогена в опухолевых клетках","C. Преимущественный аэробный гликолиз с образованием лактата даже при достаточном кислороде","D. Повышенное окислительное фосфорилирование"],"C","Перестройка энергетического метаболизма — одна из ключевых характеристик опухоли. Клиническое приложение — ПЭТ с 18F-ФДГ: накопление препарата отражает повышенное потребление глюкозы, что и позволяет визуализировать опухолевые очаги.","Holland-Frei Cancer Medicine, раздел по метаболизму опухоли","https://www.ncbi.nlm.nih.gov/books/NBK12354/"],["Геномная нестабильность при синдроме Линча обусловлена:",["A. Дефектом эксцизионной репарации нуклеотидов","B. Дефектом системы репарации неспаренных оснований (MMR)","C. Амплификацией HER2","D. Дефектом гомологичной рекомбинации"],"B","Герминальные мутации MLH1, MSH2, MSH6, PMS2 или делеция EPCAM ведут к дефекту MMR и микросателлитной нестабильности с высокой мутационной нагрузкой. Клиническое следствие — высокая чувствительность к ингибиторам контрольных точек. Дефект гомологичной рекомбинации характерен для мутаций BRCA1/2.","OncoKB — клиническая значимость альтераций","https://www.oncokb.org/"],["Какая характеристика опухоли непосредственно объясняет эффективность ингибиторов PARP при мутациях BRCA1/2?",["A. Геномная нестабильность вследствие дефекта гомологичной рекомбинации","B. Репликативное бессмертие","C. Индукция ангиогенеза","D. Уклонение от иммунного разрушения"],"A","При дефекте гомологичной рекомбинации клетка зависит от альтернативных путей репарации. Блокада PARP приводит к накоплению неисправленных двунитевых разрывов и гибели именно опухолевых клеток — классический пример синтетической летальности и перевода фундаментального знания в терапию.","OncoKB — BRCA1/2 и PARP-ингибиторы","https://www.oncokb.org/"]]},{"c":"М-02","t":"Этиология, эпидемиология, скрининг и профилактика злокачественных новообразований","s":"Общая онкология","q":[["Какое исследование входит в первый этап диспансеризации в РФ для скрининга колоректального рака?",["A. Колоноскопия всем с 40 лет","B. Ирригоскопия","C. Исследование кала на скрытую кровь","D. Определение РЭА"],"C","Первый этап диспансеризации предусматривает исследование кала на скрытую кровь: с 40 до 64 лет раз в два года, с 65 до 75 лет ежегодно. Колоноскопия выполняется на втором этапе по показаниям — при положительном результате. Онкомаркеры для скрининга не применяются.","Приказ Минздрава России № 404н","https://www.garant.ru/products/ipo/prime/doc/401314440/"],["Маммография в рамках диспансеризации проводится:",["A. С 50 до 60 лет ежегодно","B. С 18 лет ежегодно","C. С 40 до 75 лет 1 раз в 2 года","D. Только при отягощённом семейном анамнезе"],"C","Действующий порядок предусматривает маммографию обеих молочных желёз в двух проекциях с 40 до 75 лет с интервалом два года. Женщины из групп высокого риска наблюдаются по отдельным программам вне рамок диспансеризации.","Приказ Минздрава России № 404н","https://www.garant.ru/products/ipo/prime/doc/401314440/"],["Что такое систематическая ошибка, связанная с опережением диагноза (lead-time bias)?",["A. Различие в качестве диагностики между центрами","B. Ошибка при рандомизации","C. Скрининг чаще выявляет быстро прогрессирующие опухоли","D. Более раннее выявление удлиняет измеряемую выживаемость, не меняя даты смерти"],"D","При более раннем выявлении отсчёт выживаемости начинается раньше, поэтому она формально возрастает даже если лечение не повлияло на исход. Именно поэтому единственной корректной конечной точкой для оценки скрининговой программы служит смертность от данной опухоли, а не выживаемость.","PDQ® Cancer Screening Overview","https://www.cancer.gov/publications/pdq"],["Ошибка, связанная с продолжительностью течения (length-time bias), означает:",["A. Опухоли растут медленнее у участников скрининга","B. Различие в длительности исследования между группами","C. Скрининг удлиняет период наблюдения","D. Скрининг непропорционально часто выявляет медленно растущие опухоли с благоприятным прогнозом"],"D","Медленно растущие опухоли дольше находятся в доклинической фазе и потому чаще попадают в скрининговое «окно». Крайнее проявление — гипердиагностика: выявление опухолей, которые никогда не проявились бы клинически. Наиболее наглядный пример — скрининг ПСА и скрининг рака щитовидной железы.","PDQ® Cancer Screening Overview","https://www.cancer.gov/publications/pdq"],["Каков основной результат исследования NLST?",["A. Преимущество рентгенографии перед НДКТ","B. Снижение общей заболеваемости раком лёгкого","C. Отсутствие пользы скрининга","D. Снижение смертности от рака лёгкого примерно на 20 % при НДКТ у лиц высокого риска"],"D","NLST впервые доказал, что низкодозная компьютерная томография у курильщиков высокого риска снижает смертность от рака лёгкого по сравнению с рентгенографией. NELSON подтвердил результат в европейской популяции. Скрининг не снижает заболеваемость — он смещает выявление на более ранние стадии.","National Lung Screening Trial — LDCT screening","https://pubmed.ncbi.nlm.nih.gov/23697514/"],["Почему результаты ERSPC и PLCO по скринингу ПСА расходятся?",["A. Высокая контаминация контрольной группы в PLCO — многие участники контроля тоже проходили тестирование ПСА","B. Разная длительность наблюдения","C. Различия в возрасте участников","D. Разные методы определения ПСА"],"A","В PLCO значительная доля участников контрольной группы проходила определение ПСА вне протокола, что сблизило группы и «размыло» эффект. Это классический пример того, как организация исследования влияет на результат, — обязательный сюжет для семинара по методологии.","ERSPC — prostate-cancer screening","https://pubmed.ncbi.nlm.nih.gov/19297566/"],["Первичная профилактика злокачественных новообразований — это:",["A. Устранение воздействия канцерогенов и вакцинация","B. Диспансерное наблюдение после лечения","C. Раннее выявление опухоли","D. Лечение предраковых состояний"],"A","Первичная профилактика направлена на предотвращение возникновения опухоли: отказ от курения, вакцинация против ВПЧ и вируса гепатита B, снижение потребления алкоголя, контроль массы тела, защита от избыточной инсоляции. Раннее выявление относится ко вторичной профилактике.","PDQ® Cancer Prevention","https://www.cancer.gov/publications/pdq"],["Вакцинация против ВПЧ снижает риск развития:",["A. Только рака шейки матки","B. Всех опухолей репродуктивной системы","C. Рака шейки матки, а также части опухолей ротоглотки, ануса, вульвы, влагалища и полового члена","D. Только генитальных кондилом"],"C","ВПЧ высокого онкогенного риска этиологически связан не только с раком шейки матки, но и со значительной долей опухолей ротоглотки, анального канала, вульвы, влагалища и полового члена. Максимальный эффект достигается при вакцинации до начала половой жизни.","PDQ® Cancer Prevention","https://www.cancer.gov/publications/pdq"],["Согласно классификации IARC, отнесение фактора к группе 1 означает:",["A. Достаточные доказательства канцерогенности для человека","B. Фактор запрещён к применению","C. Наиболее высокий риск развития опухоли","D. Канцерогенность доказана только в эксперименте на животных"],"A","Классификация IARC отражает силу доказательств канцерогенности, а не величину риска. В группе 1 находятся и табакокурение, и переработанное мясо — уровень доказательности одинаков, а величина риска различается на порядки. Эту разницу необходимо объяснять пациентам.","IARC — материалы и статистика","https://gco.iarc.fr/"],["Какая конечная точка корректна для оценки эффективности скрининговой программы?",["A. Число выполненных исследований","B. Смертность от данной опухоли в популяции","C. Пятилетняя выживаемость выявленных больных","D. Доля ранних стадий среди выявленных"],"B","Выживаемость выявленных, доля ранних стадий и охват искажаются ошибками опережения диагноза, продолжительности течения и гипердиагностикой. Единственный надёжный показатель — смертность от данной опухоли в популяции, приглашённой на скрининг, оценённая по принципу intention-to-screen.","PDQ® Cancer Screening Overview","https://www.cancer.gov/publications/pdq"]]},{"c":"М-03","t":"Иммунологические аспекты в онкологии","s":"Общая онкология","q":[["Ингибиторы CTLA-4 действуют преимущественно на этапе:",["A. Взаимодействия T-клетки с опухолевой клеткой в микроокружении","B. Высвобождения опухолевых антигенов","C. Презентации антигена и активации T-клеток в лимфоузле","D. Миграции T-клеток к опухоли"],"C","CTLA-4 ограничивает активацию наивных T-клеток при взаимодействии с антигенпрезентирующей клеткой в лимфоузле, тогда как ось PD-1/PD-L1 работает в опухолевом микроокружении на этапе эффекторной фазы. Разные точки приложения объясняют и разный профиль токсичности: при блокаде CTLA-4 иммуноопосредованные явления возникают чаще и раньше.","Chen & Mellman — Cancer-Immunity Cycle","https://pubmed.ncbi.nlm.nih.gov/23890059/"],["Какой биомаркер служит показанием к иммунотерапии независимо от локализации первичной опухоли?",["A. Амплификация HER2","B. Микросателлитная нестабильность высокой степени (MSI-H) / дефицит MMR","C. Экспрессия PD-L1","D. Мутация KRAS"],"B","MSI-H/dMMR — первый тканенезависимый биомаркер в онкологии: высокая мутационная нагрузка порождает множество неоантигенов и делает опухоль чувствительной к блокаде контрольных точек. Экспрессия PD-L1 предиктивна лишь в отдельных нозологиях и не является универсальной.","KEYNOTE-158 — TMB-high pembrolizumab analysis","https://pubmed.ncbi.nlm.nih.gov/32919526/"],["Псевдопрогрессирование при иммунотерапии — это:",["A. Артефакт компьютерной томографии","B. Появление новых очагов на фоне ответа в старых","C. Временное увеличение очагов за счёт иммунной инфильтрации с последующим ответом","D. Истинный рост опухоли, ошибочно расценённый как ответ"],"C","Инфильтрация опухоли иммунными клетками может увеличивать её размеры до наступления регресса. По критериям iRECIST прогрессирование при отсутствии клинического ухудшения требует подтверждения повторным исследованием через 4–8 недель. Явление нечастое, и клиническое состояние больного важнее рентгенологической картины.","iRECIST Working Group","https://pubmed.ncbi.nlm.nih.gov/28271869/"],["Пациент получает пембролизумаб, на 8-й неделе развилась диарея до 5 раз в сутки сверх исходного. Первоочередная тактика?",["A. Приостановить иммунотерапию, исключить инфекцию, начать системные глюкокортикоиды","B. Отменить иммунотерапию навсегда и наблюдать","C. Немедленно назначить инфликсимаб","D. Продолжить терапию, назначить лоперамид"],"A","Диарея 2-й степени требует приостановки терапии, исключения инфекционной природы (в том числе Clostridioides difficile) и назначения преднизолона 1 мг/кг в сутки или эквивалента. Инфликсимаб или ведолизумаб применяются при отсутствии эффекта от глюкокортикоидов в течение 48–72 часов. Лоперамид при иммуноопосредованном колите противопоказан: он маскирует симптомы и повышает риск токсической дилатации.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["При каком иммуноопосредованном явлении терапия ингибитором контрольных точек может быть продолжена на фоне заместительного лечения?",["A. Пневмонит 3-й степени","B. Миокардит любой степени","C. Синдром Стивенса — Джонсона","D. Гипотиреоз"],"D","Эндокринопатии — гипотиреоз, надпочечниковая недостаточность — обычно необратимы, но управляемы заместительной терапией, и иммунотерапию, как правило, продолжают. Миокардит, пневмонит 3–4-й степени и тяжёлые кожные реакции требуют полной отмены: миокардит отличается высокой летальностью и требует немедленной госпитализации и высоких доз глюкокортикоидов.","ESMO CPG — management of immunotherapy toxicities","https://pubmed.ncbi.nlm.nih.gov/36270461/"],["Основной механизм «холодной» опухоли, не отвечающей на ингибиторы контрольных точек:",["A. Дефицит MMR","B. Высокая мутационная нагрузка","C. Гиперэкспрессия PD-L1","D. Отсутствие инфильтрации опухоли T-клетками и низкая антигенность"],"D","«Холодные» опухоли характеризуются низкой мутационной нагрузкой, малым числом неоантигенов и отсутствием T-клеточной инфильтрации. Стратегии преодоления — комбинации с химиотерапией, лучевой терапией, антиангиогенными препаратами и биспецифическими антителами, задача которых привлечь и активировать иммунные клетки.","Chen & Mellman — Cancer-Immunity Cycle","https://pubmed.ncbi.nlm.nih.gov/23890059/"],["Пациенту с аутоиммунным тиреоидитом планируется иммунотерапия по поводу меланомы. Тактика?",["A. Иммунотерапия возможна при контролируемом заболевании с усиленным мониторингом","B. Требуется отмена заместительной терапии левотироксином","C. Иммунотерапия абсолютно противопоказана","D. Требуется предварительная профилактическая терапия глюкокортикоидами"],"A","Компенсированные аутоиммунные заболевания не являются абсолютным противопоказанием. Риск обострения повышен, поэтому решение принимается индивидуально с усиленным мониторингом и при готовности к раннему вмешательству. Профилактические глюкокортикоиды не назначаются: они могут снизить эффективность иммунотерапии.","ESMO CPG — management of immunotherapy toxicities","https://pubmed.ncbi.nlm.nih.gov/36270461/"],["Как корректнее описать длительность терапии anti-PD-1 при отсутствии прогрессирования?",["A. Всегда ровно 4 цикла","B. Всегда 6 месяцев","C. Она зависит от нозологии и протокола; во многих регистрационных исследованиях использовался предел около 2 лет","D. Обязательно пожизненно"],"C","Универсальной для всех опухолей «максимальной длительности anti-PD-1» нет. Во многих ключевых исследованиях терапию ограничивали примерно двумя годами, в других применяли лечение до прогрессирования/неприемлемой токсичности или иные сроки. Оптимальная длительность после стойкого ответа остаётся предметом исследований и должна соответствовать конкретному показанию и препарату.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Влияет ли применение системных глюкокортикоидов в высоких дозах на эффективность иммунотерапии?",["A. Не влияет","B. Полностью блокирует действие препарата","C. Назначение высоких доз в начале лечения по немедицинским показаниям может снижать эффективность, при этом лечение развившихся irAE откладывать нельзя","D. Всегда повышает эффективность"],"C","Есть данные о худших исходах у больных, получавших глюкокортикоиды в высоких дозах на старте лечения не по поводу токсичности. Однако при развитии иммуноопосредованных явлений глюкокортикоиды назначаются немедленно и в полной дозе — риск от нелеченого миокардита или пневмонита несопоставимо выше.","ESMO CPG — management of immunotherapy toxicities","https://pubmed.ncbi.nlm.nih.gov/36270461/"],["Что означает плато на кривой общей выживаемости при иммунотерапии меланомы?",["A. Отсутствие различий между группами","B. Наличие подгруппы больных с длительным сохранением эффекта после завершения лечения","C. Ошибку статистической обработки","D. Прекращение наблюдения"],"B","Выход кривой на плато при длительном наблюдении (CheckMate 067) означает, что часть больных живёт долго без прогрессирования, в том числе после прекращения терапии. Это принципиально отличает иммунотерапию от химиотерапии при метастатической болезни и позволяет обсуждать с пациентом реальную, хотя и не гарантированную, перспективу длительной ремиссии.","CheckMate 067 — long-term outcomes","https://pubmed.ncbi.nlm.nih.gov/34818112/"]]},{"c":"М-04","t":"Лекарственная терапия злокачественных опухолей: классификация препаратов и принципы назначения","s":"Общая онкология","q":[["Доза карбоплатина рассчитывается по формуле Калверта как:",["A. AUC × (СКФ + 25)","B. AUC × 100","C. AUC × масса тела","D. AUC × площадь поверхности тела"],"A","Доза в миллиграммах равна целевой AUC, умноженной на сумму скорости клубочковой фильтрации и 25. Карбоплатин выводится преимущественно почками, поэтому фармакокинетическое дозирование точнее расчёта по площади поверхности тела. Занижение СКФ ведёт к недодозированию, завышение — к тяжёлой миелосупрессии.","Calvert formula — carboplatin dosing","https://pubmed.ncbi.nlm.nih.gov/2681557/"],["Пациентке с ожирением (ИМТ 38) планируется адъювантная химиотерапия. Как рассчитывать дозу?",["A. Снизить дозу на 25 %","B. По фактической массе тела без произвольного ограничения площади поверхности тела","C. Ограничить площадь поверхности тела значением 2,0 м²","D. По идеальной массе тела"],"B","Рекомендации ASCO предписывают полнодозовую терапию по фактической массе тела: редукция «из осторожности» снижает эффективность лечения без доказанного выигрыша по безопасности. Ограничение площади поверхности тела значением 2,0 м² — распространённая, но не обоснованная практика.","ASCO Guideline — systemic therapy dosing in adults with obesity","https://pubmed.ncbi.nlm.nih.gov/33939491/"],["Перед назначением фторпиримидинов целесообразно оценить:",["A. Активность UGT1A1","B. Статус DPYD / активность дигидропиримидиндегидрогеназы","C. Полиморфизм CYP2D6","D. Уровень тимидилатсинтазы"],"B","Дефицит DPD ведёт к тяжёлой токсичности фторпиримидинов, вплоть до фатальной. При выявленном частичном дефиците доза снижается, при полном препараты противопоказаны. UGT1A1 относится к иринотекану, CYP2D6 — к тамоксифену.","CPIC Guideline — DPYD and fluoropyrimidines","https://pubmed.ncbi.nlm.nih.gov/29152729/"],["Пациент принимает варфарин, планируется капецитабин. Что необходимо учесть?",["A. Капецитабин потенцирует действие варфарина, требуется учащённый контроль МНО","B. Взаимодействия нет","C. Варфарин снижает эффективность капецитабина","D. Требуется отмена капецитабина"],"A","Фторпиримидины усиливают антикоагулянтный эффект варфарина с риском кровотечений. Необходим более частый контроль МНО либо переход на низкомолекулярный гепарин, который у онкологических больных предпочтителен и по другим причинам. Проверять взаимодействия следует в профильной базе.","Liverpool Cancer Drug Interactions","https://cancer-druginteractions.org/"],["Термин «неоадъювантная терапия» означает лечение, проводимое:",["A. После радикальной операции","B. До планируемого локального лечения","C. Одновременно с лучевой терапией","D. При метастатической болезни"],"B","Неоадъювантная терапия предшествует локальному лечению, адъювантная следует за ним, периоперационная включает оба этапа. Дополнительная ценность неоадъювантного подхода — возможность in vivo оценить чувствительность опухоли по степени патоморфологического ответа.","Практические рекомендации RUSSCO","https://www.rosoncoweb.ru/standarts/RUSSCO/"],["При экстравазации везиканта (например, антрациклина) первоочередные действия:",["A. Немедленно прекратить введение, аспирировать остаток через катетер, не удаляя его сразу, приподнять конечность и применить местные меры и антидот при наличии","B. Ввести физиологический раствор в место экстравазации","C. Продолжить введение медленнее","D. Наложить давящую повязку и согреть область"],"A","Введение прекращается немедленно; через катетер аспирируется остаток препарата, и лишь затем катетер удаляется. Далее — возвышенное положение конечности, сухой холод для антрациклинов (для алкалоидов барвинка, напротив, тепло), при экстравазации антрациклинов рассматривается дексразоксан. Обязательны маркировка границ поражения, фотофиксация, документирование и консультация хирурга при некрозе.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Биоаналог отличается от оригинального препарата тем, что:",["A. Не требует клинических исследований","B. Имеет иной механизм действия","C. Полностью идентичен по химической структуре, как дженерик","D. Является биологическим препаратом, сходство которого с оригиналом подтверждено сравнительными исследованиями качества, эффективности и безопасности"],"D","Биологические препараты невозможно воспроизвести абсолютно точно, поэтому для биоаналога требуется программа сравнительных исследований. Это отличает его от дженерика химического препарата, где достаточно доказательства биоэквивалентности. Замена оригинала биоаналогом допустима, но должна документироваться.","Практические рекомендации RUSSCO","https://www.rosoncoweb.ru/standarts/RUSSCO/"],["При каком уровне нейтрофилов, как правило, откладывается очередной цикл миелосупрессивной химиотерапии?",["A. Менее 0,5 × 10⁹/л","B. Менее 2,0 × 10⁹/л","C. Уровень нейтрофилов значения не имеет","D. Менее 1,5 × 10⁹/л"],"D","Общепринятый порог для начала очередного цикла — нейтрофилы не менее 1,5 × 10⁹/л и тромбоциты не менее 100 × 10⁹/л, если протокол не предусматривает иного. При повторных отсрочках или фебрильной нейтропении в анамнезе решается вопрос о редукции дозы либо о первичной профилактике Г-КСФ — выбор зависит от цели лечения: при радикальной задаче предпочтительна поддержка колониестимулирующими факторами, а не снижение дозы.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["По критериям RECIST 1.1 частичный ответ определяется как:",["A. Уменьшение объёма опухоли на 30 %","B. Уменьшение не менее чем на 50 %","C. Любое уменьшение размеров","D. Уменьшение суммы наибольших диаметров таргетных очагов не менее чем на 30 %"],"D","Частичный ответ — уменьшение суммы наибольших диаметров таргетных очагов не менее чем на 30 % от исходной. Прогрессирование — увеличение не менее чем на 20 % при абсолютном приросте не менее 5 мм либо появление новых очагов. Оценивается сумма диаметров, а не объём.","RECIST 1.1","https://pubmed.ncbi.nlm.nih.gov/19097774/"],["Пациенту с клиренсом креатинина 35 мл/мин планируется цисплатин. Тактика?",["A. Рассмотреть замену на карбоплатин с расчётом дозы по формуле Калверта либо иной режим","B. Снизить дозу цисплатина вдвое","C. Отказаться от лекарственной терапии","D. Назначить цисплатин в полной дозе с усиленной гидратацией"],"A","Цисплатин нефротоксичен и при значимом снижении клиренса креатинина, как правило, не применяется. Стандартное решение — замена на карбоплатин с дозированием по целевой AUC либо выбор режима без препаратов платины. Произвольное уменьшение дозы цисплатина вдвое не решает проблему нефротоксичности и снижает эффективность.","Протоколы лекарственной терапии RUSSCO","https://ld.russco.org/Protocols"]]},{"c":"М-05","t":"Острые лейкозы и миелодиспластический синдром","s":"Частная онкология, ч. 3","q":[["В классификации ВОЗ 5-го издания диагноз ОМЛ с определяющей генетической аномалией (например, NPM1, KMT2A-перестройка) устанавливается:",["A. Только после цитогенетического подтверждения ремиссии","B. При бластах 10 % и более","C. Только при бластах 20 % и более","D. Независимо от процента бластов"],"D","В классификации ВОЗ 5-го издания для большинства ОМЛ с определяющими генетическими аномалиями порог бластов упразднён. ICC 2022 сохраняет порог 10 % для этих категорий — расхождение, которое важно знать при формулировке диагноза и при отборе в исследования. Порог 20 % остаётся для ОМЛ, определяемого дифференцировкой.","WHO-HAEM5: Myeloid and Histiocytic/Dendritic Neoplasms","https://pubmed.ncbi.nlm.nih.gov/35732831/"],["Стратификация риска ОМЛ по ELN 2022 к неблагоприятной группе относит:",["A. Мутацию TP53, комплексный кариотип, моносомный кариотип, перестройки KMT2A","B. t(8;21) и inv(16)","C. NPM1 без FLT3-ITD","D. Биаллельную мутацию CEBPA"],"A","Неблагоприятная группа определяется мутацией TP53, комплексным и моносомным кариотипом, перестройками KMT2A (кроме отдельных вариантов), inv(3), мутациями ASXL1, RUNX1 и рядом других. NPM1 без FLT3-ITD, биаллельная мутация CEBPA в bZIP-домене и core-binding factor лейкозы относятся к благоприятной группе. От категории риска напрямую зависит показание к аллогенной трансплантации в первой ремиссии.","ELN 2022 recommendations for AML","https://pubmed.ncbi.nlm.nih.gov/35797463/"],["Какие молекулярные исследования при впервые выявленном ОМЛ должны быть выполнены в ускоренном режиме, поскольку влияют на индукцию?",["A. FLT3 (ITD и TKD) и NPM1, а также PML::RARA при подозрении на ОПЛ","B. JAK2 и CALR","C. Только кариотип","D. Полная панель NGS независимо от сроков"],"A","Результат FLT3 нужен в первые дни: он определяет добавление мидостаурина или квизартиниба к индукции. NPM1 влияет на стратификацию и на показания к трансплантации. PML::RARA исследуется экстренно при любом подозрении на ОПЛ. Полная панель NGS выполняется параллельно, её результат нужен к моменту решения о консолидации.","QuANTUM-First","https://pubmed.ncbi.nlm.nih.gov/37116523/"],["Какой режим является одним из основных стандартных вариантов для пациента с впервые выявленным ОМЛ, не подходящего для интенсивной индукции?",["A. Высокие дозы цитарабина","B. Только сопроводительная терапия всем пациентам","C. «7+3» независимо от сопутствующей патологии","D. Венетоклакс с азацитидином; при отдельных молекулярных подтипах возможны и другие таргетные варианты"],"D","VIALE-A показало преимущество азацитидина с венетоклаксом над азацитидином у пациентов, не подходящих для интенсивной индукции: медиана ОВ 14,7 против 9,6 месяца. Но этот режим не является единственным возможным выбором: решение зависит от молекулярного профиля, сопутствующей патологии, инфекционного риска, лекарственных взаимодействий и доступности альтернатив. При венетоклаксе необходимы профилактика синдрома лизиса опухоли и коррекция дозы при сильных ингибиторах CYP3A.","VIALE-A","https://pubmed.ncbi.nlm.nih.gov/32786187/"],["Ингибиторы менина (ревумениб, зифтомениб) показаны при:",["A. ОМЛ с мутацией TP53","B. Остром промиелоцитарном лейкозе","C. Рецидивирующем и рефрактерном ОМЛ с мутацией NPM1 или перестройкой KMT2A","D. Любом рецидиве ОМЛ"],"C","Нарушение взаимодействия менина с KMT2A подавляет транскрипционную программу HOXA9/MEIS1, критичную именно для KMT2A-перестроенного и NPM1-мутированного лейкоза. Ревуменib одобрен FDA в ноябре 2024 г. при KMT2A-перестройках и в октябре 2025 г. при NPM1; зифтомениб — в ноябре 2025 г. при NPM1. Частота полных ремиссий с гематологическим восстановлением около 21–23 %, что при рефрактерном течении существенно.","AUGMENT-101","https://pubmed.ncbi.nlm.nih.gov/39121437/"],["Класс-определяющее осложнение ингибиторов менина и ингибиторов IDH, требующее протокола раннего распознавания:",["A. Кардиомиопатия","B. Синдром дифференцировки","C. Геморрагический цистит","D. Периферическая нейропатия"],"B","Синдром дифференцировки проявляется лихорадкой, одышкой, инфильтратами в лёгких, отёками, гипотензией, прибавкой массы тела, иногда почечной дисфункцией. Лечение — немедленный дексаметазон, при тяжёлом течении временная отмена препарата. То же осложнение характерно для ретиноевой кислоты и триоксида мышьяка при ОПЛ. Дополнительно ревумениб требует ЭКГ-контроля интервала QT.","European LeukemiaNet — APL management recommendations","https://pubmed.ncbi.nlm.nih.gov/30803991/"],["Больной с впервые выявленным острым лейкозом, лейкоциты 180 × 10⁹/л, одышка, спутанность сознания. Наиболее вероятное неотложное состояние и правильное действие:",["A. Синдром лизиса опухоли; начать гемодиализ","B. ДВС-синдром; ввести гепарин","C. Нейролейкемия; выполнить люмбальную пункцию","D. Лейкостаз; экстренная циторедукция, гидратация, профилактика синдрома лизиса, при возможности лейкаферез; отложить трансфузию эритроцитов"],"D","Гиперлейкоцитоз с дыхательной и/или неврологической симптоматикой позволяет подозревать лейкостаз и требует неотложной циторедукции, гидратации и профилактики синдрома лизиса опухоли. Лейкаферез не является обязательным рутинным этапом для каждого пациента: его роль обсуждается индивидуально, особенно при тяжёлом симптомном лейкостазе. Переливание эритроцитов без необходимости стараются избегать до снижения лейкоцитоза из-за возможного увеличения вязкости крови.","Hyperleukocytosis and leukostasis: management of a medical emergency","https://pubmed.ncbi.nlm.nih.gov/27967252/"],["Лабораторные критерии синдрома лизиса опухоли по Cairo — Bishop включают:",["A. Только повышение мочевой кислоты","B. Гипокалиемию, гипофосфатемию, гиперкальциемию","C. Только острое повреждение почек","D. Гиперкалиемию, гиперфосфатемию, гиперурикемию, гипокальциемию"],"D","При массивном распаде клеток в кровь поступают калий, фосфаты и нуклеиновые кислоты; связывание фосфата с кальцием даёт гипокальциемию. Клинический вариант добавляет острое повреждение почек, аритмии и судороги. Профилактика — гидратация и аллопуринол, при высоком риске расбуриказа; ощелачивание мочи более не рекомендуется, так как способствует выпадению фосфата кальция.","Cairo-Bishop — tumor lysis syndrome classification","https://pubmed.ncbi.nlm.nih.gov/16466460/"],["При подозрении на острый промиелоцитарный лейкоз полностью транс-ретиноевая кислота назначается:",["A. Немедленно, до получения подтверждения","B. После подтверждения PML::RARA методом ПЦР","C. Только при лейкоцитах ниже 10 × 10⁹/л","D. После нормализации коагулограммы"],"A","Основная причина ранней смерти при ОПЛ — коагулопатия потребления и кровоизлияние, а ретиноевая кислота быстро её купирует. Каждый час ожидания увеличивает риск. Параллельно проводится агрессивная трансфузионная поддержка: криопреципитат или свежезамороженная плазма для поддержания фибриногена выше 1,5 г/л и тромбоконцентрат при более высоких порогах, чем обычно.","APL0406","https://pubmed.ncbi.nlm.nih.gov/27400939/"],["Что означает сохранение измеримой остаточной болезни после консолидации при ОМЛ?",["A. Необходимость повторной индукции во всех случаях","B. Технический артефакт","C. Отсутствие ремиссии","D. Высокий риск рецидива и один из главных аргументов в пользу аллогенной трансплантации"],"D","Измеримая остаточная болезнь оценивается многоцветной проточной цитометрией и молекулярными методами по NPM1, core-binding factor транскриптам. Её сохранение — независимый предиктор рецидива, превосходящий по прогностической силе исходную цитогенетику, и переводит больного в категорию, где трансплантация в первой ремиссии оправдана.","ELN MRD Working Party 2021","https://pubmed.ncbi.nlm.nih.gov/34724563/"],["Больной ОМЛ достиг ремиссии после интенсивной индукции, к трансплантации не подходит по возрасту и коморбидности. Что показал QUAZAR AML-001?",["A. Показана повторная индукция","B. Показан гилтеритиниб","C. Поддерживающая терапия бесполезна","D. Пероральный азацитидин в поддерживающем режиме улучшает общую выживаемость"],"D","QUAZAR AML-001 установил роль поддерживающей терапии пероральным азацитидином у больных в первой ремиссии, не идущих на трансплантацию: улучшены безрецидивная и общая выживаемость. До этого исследования поддерживающая терапия при ОМЛ считалась неэффективной.","QUAZAR AML-001","https://pubmed.ncbi.nlm.nih.gov/33369355/"],["Основной принцип современного лечения Ph-позитивного острого лимфобластного лейкоза у взрослых:",["A. Только трансплантация","B. Монотерапия иматинибом","C. Сочетание ингибитора тирозинкиназы с иммунотерапией или редуцированной химиотерапией с целью глубокого молекулярного ответа","D. Максимально интенсивная химиотерапия"],"C","GIMEMA D-ALBA показала, что режим дазатиниб с блинатумомабом практически без химиотерапии даёт высокую частоту молекулярного ответа при низкой токсичности; PhALLCON подтвердил превосходство понатиниба над иматинибом в комбинации с редуцированной химиотерапией. Глубина молекулярного ответа определяет, потребуется ли трансплантация.","D-ALBA — dasatinib plus blinatumomab","https://pubmed.ncbi.nlm.nih.gov/33085860/"],["Что показало исследование E1910 при Ph-негативном ОЛЛ?",["A. Трансплантация не нужна никому","B. Добавление блинатумомаба больным в ремиссии с определяемой остаточной болезнью улучшает общую выживаемость","C. Блинатумомаб бесполезен в консолидации","D. Химиотерапия может быть отменена полностью"],"B","E1910 — образцовый пример терапии, управляемой измеримой остаточной болезнью: вмешательство назначается не по клиническому событию, а по молекулярному маркёру у больных, формально находящихся в ремиссии. Это меняет саму логику планирования лечения.","E1910","https://pubmed.ncbi.nlm.nih.gov/39047240/"],["Ключевое отличие тактики при МДС низкого и высокого риска:",["A. Тактика не различается","B. При высоком риске лечение не проводится","C. При низком риске задача — коррекция цитопений и качество жизни, при высоком — сдерживание прогрессии в ОМЛ и оценка кандидатуры на трансплантацию","D. При низком риске всегда показана трансплантация"],"C","Стратификация по IPSS-M определяет всё. При низком риске применяются эритропоэз-стимулирующие препараты, луспатерцепт, иметелстат, при изолированной делеции 5q — леналидомид. При высоком риске назначаются гипометилирующие агенты и рассматривается аллогенная трансплантация как единственный потенциально излечивающий метод.","IPSS-M","https://pubmed.ncbi.nlm.nih.gov/38319256/"],["Чем IPSS-M принципиально отличается от IPSS-R?",["A. Учитывает возраст","B. Включает мутационный статус 31 гена и перераспределяет по категориям риска примерно каждого четвёртого больного","C. Не требует данных костного мозга","D. Применяется только при вторичном МДС"],"B","IPSS-R опирается на бласты, кариотип и глубину цитопений. IPSS-M добавляет молекулярный профиль, в том числе TP53 с оценкой числа затронутых аллелей, SF3B1, ASXL1, RUNX1. Существенная часть больных меняет категорию риска, что напрямую влияет на решение о трансплантации — поэтому молекулярное исследование при МДС не факультативно.","IPSS-M","https://pubmed.ncbi.nlm.nih.gov/38319256/"],["Больной МДС низкого риска, зависимый от трансфузий, без ответа на эритропоэз-стимулирующие препараты, кольцевидных сидеробластов нет. Какая опция обоснована?",["A. Гидроксимочевина","B. Иметелстат","C. Интенсивная химиотерапия","D. Спленэктомия"],"B","IMerge показал длительную независимость от трансфузий при иметелстате у больных МДС низкого риска, рефрактерных к эритропоэтинам, включая подгруппу без кольцевидных сидеробластов. Луспатерцепт наиболее эффективен при кольцевидных сидеробластах и мутации SF3B1 (MEDALIST, COMMANDS), поэтому здесь предпочтителен иметелстат. Требуется контроль цитопений в первые циклы.","IMerge","https://pubmed.ncbi.nlm.nih.gov/38048786/"]]},{"c":"М-06","t":"Хронический миелолейкоз и хронический лимфолейкоз","s":"Частная онкология, ч. 3","q":[["Молекулярная основа хронического миелолейкоза:",["A. Мутация CALR","B. Мутация JAK2 V617F","C. Транслокация t(9;22) с образованием химерного гена BCR::ABL1","D. Делеция 13q"],"C","Химерный белок BCR::ABL1 обладает конститутивной тирозинкиназной активностью. Точное знание механизма позволило создать иматиниб — первый успешный таргетный препарат в онкологии, и именно эта история задала логику всей последующей таргетной терапии.","IRIS — long-term follow-up","https://pubmed.ncbi.nlm.nih.gov/28273028/"],["Основной метод мониторинга ответа при ХМЛ и ключевые вехи:",["A. Уровень лактатдегидрогеназы","B. Количественная ПЦР на BCR::ABL1 по международной шкале: не более 10 % к 3 мес, не более 1 % к 12 мес","C. Общий анализ крови ежемесячно","D. Стернальная пункция каждые 3 месяца"],"B","Стандарт — количественная ПЦР в реальном времени с выражением результата по международной шкале. Большой молекулярный ответ соответствует уровню не более 0,1 %; глубокий молекулярный ответ (MR4.0 и глубже) — условие для обсуждения отмены терапии. Цитогенетическое исследование сохраняет роль при неудаче терапии и подозрении на клональную эволюцию.","European LeukemiaNet 2020 — CML","https://pubmed.ncbi.nlm.nih.gov/32127639/"],["Что показало исследование ASC4FIRST?",["A. Все ингибиторы эквивалентны","B. Иматиниб остаётся оптимальной первой линией","C. Асциминиб эффективен только при мутации T315I","D. Асциминиб превзошёл ингибиторы по выбору исследователя: большой молекулярный ответ к 48-й неделе у 68 % против 49 % при лучшей переносимости"],"D","ASC4FIRST включил 405 больных с впервые выявленным Ph-позитивным ХМЛ в хронической фазе. Асциминиб действует на миристоильный карман, а не на АТФ-связывающий сайт, чем объясняется высокая селективность и меньшая внецелевая токсичность. Ускоренное одобрение FDA получено 29.10.2024, после чего NCCN внесли препарат в предпочтительные опции первой линии категории 1.","ASC4FIRST","https://pubmed.ncbi.nlm.nih.gov/38820078/"],["Больной ХМЛ получает иматиниб 3 месяца, BCR::ABL1 = 32 % по международной шкале. Первоочередные действия:",["A. Отменить терапию","B. Немедленно направить на трансплантацию","C. Продолжить иматиниб без изменений","D. Оценить приверженность и лекарственные взаимодействия, исследовать мутации киназного домена, затем рассмотреть смену препарата"],"D","Уровень выше 10 % к 3 месяцам — неудача терапии по ELN. Однако прежде чем менять препарат, исключают самые частые причины: низкую приверженность (главная и недооценённая) и взаимодействия, в том числе с индукторами CYP3A4. Затем анализируют мутации киназного домена: их спектр определяет выбор следующего препарата.","European LeukemiaNet 2020 — CML","https://pubmed.ncbi.nlm.nih.gov/32127639/"],["При мутации T315I сохраняют активность:",["A. Иматиниб в удвоенной дозе","B. Бозутиниб","C. Нилотиниб и дазатиниб","D. Понатиниб и асциминиб"],"D","T315I — «привратниковая» мутация, стерически препятствующая связыванию ингибиторов первого и второго поколения. Понатиниб сохраняет активность ценой сосудистой токсичности, минимизируемой стратегией снижения дозы по данным OPTIC. Асциминиб связывается с миристоильным карманом — принципиально иным участком — и потому не зависит от этой мутации.","OPTIC — response-based ponatinib dosing","https://pubmed.ncbi.nlm.nih.gov/34932337/"],["Какие условия в целом необходимы для попытки прекращения TKI у пациента с ХМЛ в хронической фазе?",["A. Любой полный гематологический ответ","B. Только желание пациента","C. Достаточно одного отрицательного ПЦР","D. Длительная терапия TKI, устойчивый глубокий молекулярный ответ в течение рекомендованного срока и возможность частого стандартизованного молекулярного мониторинга"],"D","Попытка treatment-free remission возможна у тщательно отобранных пациентов с ХМЛ в хронической фазе. Точные пороги общей длительности TKI и длительности MR4/MR4.5 различаются между рекомендациями и зависят от клинического контекста, поэтому фиксированное универсальное правило «глубокий ответ не менее 2 лет» упрощает ситуацию. Ключевы устойчивость глубокого ответа, отсутствие признаков продвинутой фазы и готовность к частому ПЦР-мониторингу после отмены.","European LeukemiaNet recommendations — CML","https://pubmed.ncbi.nlm.nih.gov/33257933/"],["Диагноз ХЛЛ устанавливается при:",["A. Наличии делеции 13q","B. Абсолютном числе моноклональных B-лимфоцитов не менее 5 × 10⁹/л с характерным иммунофенотипом","C. Любом лимфоцитозе","D. Увеличении лимфоузлов"],"B","Требуются оба компонента: количественный порог 5 × 10⁹/л клональных B-лимфоцитов и характерный иммунофенотип (CD19, CD5, CD23, слабая экспрессия поверхностных иммуноглобулинов и CD20). При меньшем числе и отсутствии лимфаденопатии и цитопений говорят о моноклональном B-клеточном лимфоцитозе; при наличии лимфаденопатии без лимфоцитоза — о лимфоме из малых лимфоцитов.","iwCLL 2018 guidelines","https://pubmed.ncbi.nlm.nih.gov/29540348/"],["Показание к началу терапии при ХЛЛ:",["A. Возраст старше 70 лет","B. Лимфоцитоз более 30 × 10⁹/л","C. Установление диагноза","D. Активная болезнь по iwCLL: симптомы, прогрессирующая цитопения, массивная или симптомная лимфаденопатия либо спленомегалия, быстрое удвоение числа лимфоцитов"],"D","Раннее начало терапии при бессимптомном течении не улучшает выживаемость, а абсолютное число лимфоцитов само по себе показанием не является. Это одна из самых частых ошибок в амбулаторной практике — «лечить анализ», а не пациента.","iwCLL 2018 guidelines","https://pubmed.ncbi.nlm.nih.gov/29540348/"],["Какие исследования обязательны перед каждой линией терапии ХЛЛ?",["A. BRAF","B. Делеция 17p и мутация TP53","C. Уровень иммуноглобулинов","D. JAK2"],"B","Делеция 17p и мутация TP53 определяют резистентность к химиоиммунотерапии и влияют на выбор режима. Они могут появляться в ходе клональной эволюции, поэтому исследование повторяется перед каждой линией, а не однократно при диагнозе. Мутационный статус IGHV определяется однократно — он не меняется.","CLL-IPI","https://pubmed.ncbi.nlm.nih.gov/27118450/"],["Что изменило исследование AMPLIFY в первой линии ХЛЛ?",["A. Отменило необходимость таргетной терапии","B. Подтвердило роль химиоиммунотерапии","C. Установило преимущество ибрутиниба","D. Показало превосходство фиксированного 14-месячного перорального режима акалабрутиниб + венетоклакс над FCR/BR у больных без делеции 17p и мутации TP53"],"D","Медиана беспрогрессивной выживаемости в группе комбинации не достигнута против 47,6 мес при химиоиммунотерапии, отношение рисков 0,65; к 3 годам без прогрессирования около 77 %. Одобрение FDA получено 19.02.2026. Практическое следствие сформулировано экспертным сообществом прямо: место химиоиммунотерапии при ХЛЛ теперь близко к нулю.","AMPLIFY — fixed-duration acalabrutinib/venetoclax","https://pubmed.ncbi.nlm.nih.gov/39976417/"],["Главное преимущество режимов фиксированной длительности перед непрерывной терапией ингибитором BTK:",["A. Определённая точка окончания лечения, период без терапии, меньшая кумулятивная токсичность и стоимость","B. Отсутствие необходимости мониторинга","C. Возможность приёма раз в неделю","D. Более высокая эффективность во всех подгруппах"],"A","Фиксированная длительность даёт пациенту жизнь без ежедневного приёма препарата и возможность повторного применения режима при позднем рецидиве. Плата — необходимость ступенчатого наращивания дозы венетоклакса с профилактикой синдрома лизиса в начале лечения, что требует организационных условий.","CLL14","https://pubmed.ncbi.nlm.nih.gov/32888452/"],["Почему в современных рекомендациях предпочтение отдаётся ингибиторам BTK второго поколения перед ибрутинибом?",["A. Они эффективны только при делеции 17p","B. Они принимаются внутривенно","C. При сопоставимой или большей эффективности они существенно реже вызывают фибрилляцию предсердий, артериальную гипертензию и кровоточивость","D. Они дешевле"],"C","ALPINE показал превосходство занубрутиниба над ибрутинибом по частоте ответа и беспрогрессивной выживаемости при меньшей кардиологической токсичности. Ибрутиниб как ингибитор первого поколения менее селективен, и внецелевое действие на другие киназы объясняет его характерные осложнения.","ALPINE","https://pubmed.ncbi.nlm.nih.gov/32207333/"],["Больной ХЛЛ прогрессирует на ковалентном ингибиторе BTK; выявлена мутация BTK C481S. Обоснованная опция:",["A. Пиртобрутиниб — нековалентный обратимый ингибитор BTK","B. Хлорамбуцил","C. Другой ковалентный ингибитор BTK","D. Ритуксимаб в монорежиме"],"A","Мутация C481S нарушает ковалентное связывание и делает неэффективными все ковалентные ингибиторы, поэтому смена одного на другой бессмысленна. Пиртобрутиниб связывается обратимо и не зависит от состояния этого остатка. Альтернатива — переход на венетоклакс-содержащий режим; при рефрактерности к обоим классам обсуждается CAR-T-терапия.","BRUIN — pirtobrutinib in CLL/SLL","https://pubmed.ncbi.nlm.nih.gov/37407001/"],["У больного ХЛЛ за месяц резко увеличился один лимфоузел, появились лихорадка и потеря массы тела, лактатдегидрогеназа выросла втрое. Первоочередное действие:",["A. Назначить антибиотики","B. Выполнить биопсию именно этого узла, при возможности после ПЭТ-КТ для выбора наиболее метаболически активного участка","C. Усилить терапию ХЛЛ","D. Наблюдение"],"B","Быстрое увеличение лимфоузла, B-симптомы и резкий рост ЛДГ заставляют подозревать трансформацию Рихтера. ERIC рекомендует ПЭТ/КТ при подозрении на трансформацию и эксцизионную биопсию доступного очага, предпочтительно с наибольшей ФДГ-активностью. Диагноз требует гистологического подтверждения; усиление терапии ХЛЛ без биопсии может привести к принципиально неверной тактике.","ERIC international consensus recommendations — Richter transformation","https://pubmed.ncbi.nlm.nih.gov/40239121/"],["Какой принцип особенно важен при профилактике осложнений ХЛЛ, связанных со вторичным иммунодефицитом?",["A. Живые вакцины рекомендуются всем","B. Инфекционные осложнения нехарактерны для ХЛЛ","C. Нужно активно снижать инфекционный риск: вакцинация неживыми вакцинами, оценка гипогаммаглобулинемии и профилактика/заместительная терапия по показаниям","D. Профилактика требуется только после трансплантации"],"C","Инфекции остаются одной из ведущих причин заболеваемости и смертности при ХЛЛ, но формулировка «самая частая причина смерти» зависит от эпохи лечения и конкретной популяции. Практически важнее проверять знание профилактики: вакцинации до и во время лечения подходящими неживыми вакцинами, оценки рецидивирующих инфекций и гипогаммаглобулинемии, а также специфической профилактики для отдельных схем.","ESMO Clinical Practice Guideline — Chronic lymphocytic leukaemia","https://www.esmo.org/guidelines/haematological-malignancies/chronic-lymphocytic-leukaemia"],["У пациента с ХЛЛ развилась аутоиммунная гемолитическая анемия. Всегда ли это требует немедленного начала терапии ХЛЛ?",["A. Да, независимо от тяжести и ответа на лечение анемии","B. Показана только спленэктомия","C. Нет. Сначала лечат аутоиммунную гемолитическую анемию; лечение ХЛЛ становится показанным при плохо контролируемой/рефрактерной аутоиммунной цитопении или наличии других критериев активного ХЛЛ","D. Аутоиммунная гемолитическая анемия с ХЛЛ не связана"],"C","iwCLL относит плохо контролируемые кортикостероидами аутоиммунные анемию или тромбоцитопению к показаниям к терапии ХЛЛ. При впервые возникшей аутоиммунной гемолитической анемии без других признаков активного ХЛЛ первоначально лечат саму аутоиммунную цитопению. Важно отличать её от цитопении из-за инфильтрации костного мозга, поскольку лечебная тактика различается.","iwCLL 2018 guidelines","https://pubmed.ncbi.nlm.nih.gov/29540348/"]]},{"c":"М-07","t":"Осложнения системной терапии I: гематологическая токсичность, фебрильная нейтропения, анемия, тромбоцитопения","s":"Общая онкология","q":[["Определение фебрильной нейтропении:",["A. Лихорадка при лейкоцитах менее 4,0 × 10⁹/л","B. Температура выше 37,5 °C при любом уровне нейтрофилов","C. Лихорадка с ознобом независимо от анализа крови","D. Однократная температура 38,3 °C и выше либо 38,0 °C и выше в течение часа при нейтрофилах менее 0,5 × 10⁹/л или менее 1,0 × 10⁹/л с ожидаемым снижением"],"D","Определение включает оба компонента: температурный порог и уровень нейтрофилов. Ожидаемое дальнейшее снижение приравнивается к уже достигнутому — ждать падения ниже 0,5 × 10⁹/л нельзя.","ASCO/IDSA — outpatient fever and neutropenia guideline","https://pubmed.ncbi.nlm.nih.gov/29461916/"],["Первоочередное действие при поступлении больного с фебрильной нейтропенией:",["A. Дождаться результатов посевов крови","B. Назначить Г-КСФ","C. Выполнить КТ органов грудной клетки","D. Начать эмпирическую антибактериальную терапию широкого спектра в течение первого часа, взяв посевы непосредственно перед введением"],"D","Задержка антибактериальной терапии напрямую увеличивает летальность. Посевы крови берутся из периферической вены и из центрального катетера непосредственно перед первым введением, но не задерживают его. Г-КСФ не заменяет антибиотики, а визуализация выполняется после начала терапии.","ASCO/IDSA — outpatient fever and neutropenia guideline","https://pubmed.ncbi.nlm.nih.gov/29461916/"],["Индекс MASCC 21 балл и выше означает:",["A. Высокий риск осложнений, требуется интенсивная терапия","B. Необходимость противогрибковой терапии","C. Низкий риск; возможно пероральное и амбулаторное ведение при выполнении организационных условий","D. Показание к трансплантации"],"C","21 балл и выше соответствует низкому риску тяжёлых осложнений. Однако амбулаторное ведение возможно лишь при отсутствии значимой сопутствующей патологии, переносимости пероральных препаратов, наличии сопровождающего лица, телефонной связи и возможности быстро добраться до стационара. При невыполнении хотя бы одного условия пациент госпитализируется.","Индекс MASCC","https://www.mdcalc.com/calc/3913/mascc-risk-index-febrile-neutropenia"],["Первичная профилактика Г-КСФ показана при ожидаемом риске фебрильной нейтропении:",["A. Более 5 %","B. Только после первого эпизода фебрильной нейтропении","C. Около 20 % и выше, а также при 10–20 % с дополнительными факторами риска","D. Более 50 %"],"C","Порог около 20 % — общепринятый. В промежутке 10–20 % решение принимается индивидуально с учётом возраста старше 65 лет, сниженного функционального статуса, предшествующей терапии, сопутствующих заболеваний и открытых ран. Профилактика после уже перенесённого эпизода называется вторичной.","ASCO Guideline Update — WBC Growth Factors 2026","https://pubmed.ncbi.nlm.nih.gov/41740078/"],["Пациент получает адъювантную химиотерапию с радикальной целью и после первого цикла перенёс фебрильную нейтропению. Какой принцип следует использовать перед следующим циклом?",["A. Автоматически прекратить адъювантную терапию","B. Всегда снизить дозу цитостатиков на 50%","C. Рассмотреть вторичную профилактику Г-КСФ, особенно если сохранение дозовой интенсивности важно для исхода; решение индивидуализировать с учётом режима и риска","D. Не менять поддерживающую терапию"],"C","После эпизода фебрильной нейтропении вторичная профилактика Г-КСФ показана прежде всего тогда, когда снижение дозы или задержка потенциально ухудшат результат лечения. В других ситуациях допустимы модификация дозы/режима или задержка. Поэтому прежняя формулировка «оптимально сохранить дозу» была слишком безусловной.","ASCO guideline — WBC growth factors","https://pubmed.ncbi.nlm.nih.gov/26169616/"],["Стандартный порог профилактической трансфузии тромбоконцентрата у стабильного больного с гипопродуктивной тромбоцитопенией:",["A. Менее 20 × 10⁹/л","B. Менее 50 × 10⁹/л","C. Менее 10 × 10⁹/л","D. Менее 5 × 10⁹/л"],"C","У стабильных больных без лихорадки и кровоточивости профилактический порог — 10 × 10⁹/л. Он повышается до 20 × 10⁹/л при лихорадке и коагулопатии, до 50 × 10⁹/л перед инвазивными вмешательствами и до 100 × 10⁹/л перед нейрохирургическими и офтальмологическими операциями.","Platelet transfusion threshold trial","https://pubmed.ncbi.nlm.nih.gov/9933859/"],["Перед назначением эритропоэз-стимулирующего препарата при анемии, обусловленной химиотерапией, необходимо:",["A. Выполнить трепанобиопсию","B. Ничего дополнительно не требуется","C. Определить уровень эритропоэтина","D. Исключить дефицит железа, витамина B12, фолатов, кровотечение и гемолиз"],"D","Анемия у онкологического больного часто многофакторна, и назначать препарат без исключения устранимых причин — ошибка. Функциональный дефицит железа встречается очень часто, и внутривенное железо повышает эффективность терапии. Целевой уровень гемоглобина не превышает 120 г/л, поскольку более высокие значения увеличивают риск тромбозов.","ASCO/ASH Guideline — cancer-associated anemia","https://pubmed.ncbi.nlm.nih.gov/30969847/"],["Больной с фебрильной нейтропенией получает антибактериальную терапию широкого спектра 5 суток, лихорадка сохраняется, очаг не выявлен, нейтропения глубокая. Дальнейшая тактика:",["A. Отменить антибиотики","B. Пересмотреть спектр, повторить визуализацию и посевы, рассмотреть эмпирическую противогрибковую терапию","C. Назначить глюкокортикоиды","D. Продолжить прежнюю терапию"],"B","Персистирующая лихорадка на 4–7-е сутки при глубокой нейтропении — показание к пересмотру диагноза: повторные посевы, КТ органов грудной клетки и придаточных пазух, осмотр катетера и слизистых, определение галактоманнана. При сохраняющемся риске инвазивного микоза добавляется эмпирическая противогрибковая терапия.","ASCO/IDSA — outpatient fever and neutropenia guideline","https://pubmed.ncbi.nlm.nih.gov/29461916/"],["Пэгилированная форма Г-КСФ отличается от филграстима тем, что:",["A. Действует иначе на костный мозг","B. Не вызывает оссалгий","C. Применяется только при лейкозах","D. Вводится однократно за цикл благодаря замедленному выведению"],"D","Пэгилирование замедляет почечный клиренс, что позволяет вводить препарат однократно после цикла вместо ежедневных инъекций. Механизм действия и профиль побочных эффектов, включая боли в костях, сходны. Г-КСФ не вводится одновременно с химиотерапией — требуется интервал.","ASCO Guideline Update — WBC Growth Factors 2026","https://pubmed.ncbi.nlm.nih.gov/41740078/"],["Наиболее частая ошибка при ведении амбулаторного больного, получающего миелосупрессивную терапию:",["A. Назначение антиэметиков","B. Слишком частый контроль анализов","C. Избыточное назначение Г-КСФ","D. Отсутствие у пациента чёткой инструкции немедленно измерить температуру и обратиться за помощью при лихорадке"],"D","Фебрильная нейтропения — неотложное состояние, и исход зависит от того, насколько быстро пациент попадёт в стационар. Каждый больной должен иметь письменную памятку с указанием температурного порога, контактного телефона отделения и запретом самостоятельно принимать жаропонижающие до осмотра — они маскируют лихорадку и откладывают обращение.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"]]},{"c":"М-08","t":"Опухоли головы и шеи","s":"Частная онкология, ч. 2","q":[["Стадирование ВПЧ-ассоциированного (p16-положительного) рака ротоглотки отличается от ВПЧ-негативного тем, что:",["A. Стадия определяется исключительно размером опухоли","B. Не отличается","C. Применяется только клиническое стадирование","D. Используется отдельная классификация с существенно более благоприятной группировкой стадий"],"D","ВПЧ-ассоциированный рак ротоглотки имеет принципиально лучший прогноз, поэтому для него введена отдельная система стадирования: то же поражение лимфоузлов соответствует более ранней стадии. Определение p16 методом иммуногистохимии обязательно при всех опухолях ротоглотки.","Классификация ВОЗ · ESMO","https://www.esmo.org/guidelines/esmo-clinical-practice-guidelines-head-and-neck-cancers"],["Показанием к добавлению цисплатина к послеоперационной лучевой терапии является:",["A. ВПЧ-положительный статус","B. Любая стадия III–IV","C. Позитивный край резекции или экстранодальное распространение","D. Возраст моложе 60 лет"],"C","RTOG 9501 и EORTC 22931 показали выигрыш от добавления цисплатина именно при этих двух признаках высокого риска. Другие факторы — множественное поражение лимфоузлов, периневральная и сосудистая инвазия — учитываются, но самостоятельным показанием к химиолучевой терапии не служат.","RTOG 9501 — postoperative chemoradiotherapy","https://pubmed.ncbi.nlm.nih.gov/15128893/"],["Больной с резектабельным местнораспространённым плоскоклеточным раком головы и шеи, PD-L1 CPS 15. Что изменило исследование KEYNOTE-689?",["A. Показало преимущество цетуксимаба","B. Отменило хирургическое лечение","C. Заменило лучевую терапию","D. Добавило периоперационный пембролизумаб к стандартному лечению с улучшением выживаемости без событий"],"D","В KEYNOTE-689 пембролизумаб назначался неоадъювантно, затем в адъювантном режиме вместе с лучевой терапией с цисплатином или без него и далее в поддерживающем. Медиана выживаемости без событий составила 51,8 против 30,4 мес. Это первое за двадцать лет положительное исследование в данной популяции.","KEYNOTE-689 — perioperative pembrolizumab","https://pubmed.ncbi.nlm.nih.gov/40532178/"],["Что показали исследования RTOG 1016 и De-ESCALaTE при ВПЧ-ассоциированном раке ротоглотки?",["A. Лучевая терапия может быть отменена","B. Химиотерапия не нужна","C. Замена цисплатина цетуксимабом ухудшает выживаемость","D. Цетуксимаб не уступает цисплатину"],"C","Оба исследования показали худшие результаты при замене цисплатина цетуксимабом, несмотря на благоприятный прогноз ВПЧ-ассоциированной опухоли. Общий урок: благоприятный прогноз не оправдывает произвольного ослабления лечения, и деэскалация допустима только в рамках протокола.","NRG RTOG 1016","https://pubmed.ncbi.nlm.nih.gov/30449625/"],["Первая линия при рецидивирующем или метастатическом плоскоклеточном раке головы и шеи с CPS 25 и высокой опухолевой нагрузкой без угрожающих симптомов:",["A. Режим EXTREME","B. Метотрексат","C. Пембролизумаб в монорежиме либо в комбинации с химиотерапией","D. Только симптоматическая терапия"],"C","По KEYNOTE-048 при CPS ≥ 1 пембролизумаб в монорежиме превосходит EXTREME по общей выживаемости, а комбинация с химиотерапией эффективна независимо от CPS. Комбинация предпочтительна при необходимости быстрого ответа и большой симптомной нагрузке; монотерапия — при высоком CPS и возможности подождать эффекта.","KEYNOTE-048","https://pubmed.ncbi.nlm.nih.gov/31679945/"],["Рак носоглотки отличается от других опухолей головы и шеи тем, что:",["A. Не требует стадирования","B. Ассоциирован с вирусом Эпштейна — Барр, высокочувствителен к лучевой и химиотерапии, основной метод лечения — химиолучевая терапия","C. Не метастазирует в лимфоузлы","D. Практически всегда лечится хирургически"],"B","Рак носоглотки эндемичен для Юго-Восточной Азии, связан с вирусом Эпштейна — Барр и отличается высокой чувствительностью к облучению и химиотерапии. Хирургия играет ограниченную роль, а уровень ДНК вируса в плазме служит инструментом мониторинга. При рецидивирующем и метастатическом течении добавление ингибитора контрольных точек к платиносодержащему режиму улучшает исходы.","JUPITER-02","https://pubmed.ncbi.nlm.nih.gov/38015220/"],["Основная задача, определяющая выбор тактики при раке гортани T3:",["A. Отказ от лучевой терапии","B. Сохранение функции органа при сопоставимой выживаемости","C. Сокращение длительности лечения","D. Минимизация стоимости"],"B","RTOG 91-11 показал, что одновременная химиолучевая терапия с цисплатином даёт наибольшую частоту сохранения гортани. Однако при обширной деструкции хряща или нефункционирующей гортани ларингэктомия остаётся правильным выбором: сохранение нефункционального органа не в интересах пациента.","RTOG 91-11","https://pubmed.ncbi.nlm.nih.gov/23182993/"],["Наиболее значимая проблема сопроводительной терапии при химиолучевом лечении опухолей головы и шеи:",["A. Кардиотоксичность","B. Алопеция","C. Нефротоксичность","D. Мукозит с нарушением питания и потерей массы тела"],"D","Тяжёлый мукозит развивается у большинства больных и делает питание через рот невозможным. Нутритивная поддержка вплоть до гастростомы, адекватное обезболивание, уход за полостью рта и санация зубов до начала лечения определяют, будет ли программа завершена в срок. Перерывы в облучении напрямую ухудшают результат.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Что необходимо выполнить до начала лучевой терапии на область головы и шеи?",["A. Колоноскопию","B. Санацию полости рта и осмотр стоматолога","C. Спирометрию","D. Эхокардиографию"],"B","Облучение слюнных желёз ведёт к ксеростомии и резкому росту риска кариеса, а удаление зубов после облучения чревато остеорадионекрозом челюсти. Поэтому санация и при необходимости удаление зубов проводятся заранее, с интервалом до начала лучевой терапии, и пациент получает программу фторпрофилактики.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines/esmo-clinical-practice-guidelines-head-and-neck-cancers"],["Курение во время лучевой терапии по поводу опухоли головы и шеи:",["A. Не влияет на результат","B. Допустимо при снижении числа сигарет","C. Влияет только на риск второй опухоли","D. Снижает эффективность лечения и увеличивает токсичность"],"D","Продолжение курения снижает оксигенацию тканей и радиочувствительность опухоли, усиливает мукозит и ухудшает выживаемость. Отказ от курения — часть противоопухолевого лечения, а не рекомендация общего характера, и требует активной поддержки: беседы, фармакотерапии, направления в кабинет отказа от курения.","PDQ® — опухоли головы и шеи","https://www.cancer.gov/publications/pdq"]]},{"c":"М-09","t":"Рак молочной железы: биология, подтипы, ранние стадии","s":"Частная онкология, ч. 1","q":[["Какие биомаркёры должны быть определены в первичной инвазивной опухоли молочной железы для базового выбора системной терапии?",["A. Только HER2","B. Только ER","C. Только p53","D. ER и PR, HER2; пролиферативная активность, включая Ki-67, может дополнительно использоваться в патоморфологической и клинической оценке"],"D","ER/PR и HER2 являются ключевыми валидированными предиктивными маркёрами при инвазивном раке молочной железы. Ki-67 широко используется как дополнительный показатель пролиферации, но его аналитическая воспроизводимость и обязательность зависят от задачи и рекомендаций; он не должен представляться как равный ER/HER2 универсально обязательный предиктивный тест. При HER2 IHC 2+ выполняют подтверждающее ISH согласно действующему алгоритму.","Клинические рекомендации Минздрава России — рак молочной железы","https://cr.minzdrav.gov.ru/clin_recomend"],["Главное преимущество неоадъювантной системной терапии перед адъювантной при равной эффективности:",["A. Возможность оценить чувствительность опухоли in vivo и адаптировать послеоперационное лечение, а также повысить шанс органосохраняющей операции","B. Меньшая токсичность","C. Более короткая длительность","D. Меньшая стоимость"],"A","Общая выживаемость при неоадъювантном и адъювантном подходе сопоставима, но неоадъювантный даёт две практические выгоды: увеличивает возможность органосохраняющего лечения и позволяет по остаточной опухоли выделить группу высокого риска, изменив послеоперационную терапию — именно на этом построены KATHERINE и DESTINY-Breast05.","KATHERINE","https://pubmed.ncbi.nlm.nih.gov/30516102/"],["Больная с трижды негативным раком молочной железы T2N1, высокий риск. Стандарт неоадъювантной терапии:",["A. Химиотерапия в комбинации с пембролизумабом с последующим адъювантным пембролизумабом","B. Только операция","C. Эндокринотерапия","D. Химиотерапия без иммунотерапии"],"A","KEYNOTE-522 показал повышение частоты полного патоморфологического ответа и выживаемости без событий при добавлении пембролизумаба к неоадъювантной химиотерапии с продолжением в адъювантном режиме. Важная особенность: выигрыш наблюдается независимо от экспрессии PD-L1, в отличие от метастатической болезни.","KEYNOTE-522","https://pubmed.ncbi.nlm.nih.gov/35139274/"],["После неоадъювантной терапии по поводу HER2-положительного рака выявлена остаточная инвазивная опухоль. Тактика адъювантной терапии:",["A. Наблюдение","B. Продолжить трастузумаб","C. Назначить только эндокринотерапию","D. Назначить трастузумаб эмтанзин либо, при высоком риске, трастузумаб дерукстекан"],"D","KATHERINE установил преимущество трастузумаба эмтанзина над трастузумабом при остаточной опухоли. DESTINY-Breast05 показал превосходство трастузумаба дерукстекана над трастузумабом эмтанзином в группе высокого риска при отношении рисков около 0,47; при этом необходим мониторинг интерстициального поражения лёгких, поскольку зарегистрированы случаи с летальным исходом.","DESTINY-Breast05","https://pubmed.ncbi.nlm.nih.gov/41370739/"],["Полный патоморфологический ответ (pCR) определяется как:",["A. Отсутствие опухолевых клеток любого типа, включая протоковый рак in situ","B. Уменьшение опухоли более чем на 90 %","C. Отсутствие инвазивной опухоли в молочной железе и лимфоузлах","D. Отрицательный край резекции"],"C","Общепринятое определение — ypT0/is ypN0: сохранение протокового рака in situ допускается. Достижение полного патоморфологического ответа связано с лучшим прогнозом, особенно при трижды негативном и HER2-положительном подтипах, и служит основанием не эскалировать адъювантную терапию.","KEYNOTE-522","https://pubmed.ncbi.nlm.nih.gov/35139274/"],["21-геновый тест (Oncotype DX) применяется для:",["A. Определения HER2-статуса","B. Выбора между хирургическими подходами","C. Скрининга","D. Решения о целесообразности адъювантной химиотерапии при гормонозависимом HER2-негативном раке"],"D","TAILORx показал, что при промежуточном значении показателя рецидива у больных без поражения лимфоузлов химиотерапию можно безопасно не проводить, с оговорками для молодых пациенток. RxPONDER распространил вопрос на больных с поражением 1–3 лимфоузлов, где выигрыш от химиотерапии оказался связан преимущественно с пременопаузальным статусом.","TAILORx","https://pubmed.ncbi.nlm.nih.gov/29860917/"],["Показанием к адъювантному олапарибу является:",["A. Любой трижды негативный рак","B. Мутация PIK3CA","C. Герминальная мутация BRCA1/2 при высоком риске рецидива","D. Соматическая мутация BRCA в опухоли"],"C","OlympiA включал больных с герминальными мутациями BRCA1/2 и высоким риском — при остаточной опухоли после неоадъювантной терапии либо при высоком стадийном риске. Практическое следствие: тестирование зародышевой линии должно быть выполнено своевременно, иначе показание к олапарибу будет упущено.","OlympiA","https://pubmed.ncbi.nlm.nih.gov/34081848/"],["Добавление абемациклиба к адъювантной эндокринотерапии (monarchE) показано:",["A. Больным с высоким риском рецидива, прежде всего при значимом поражении лимфоузлов","B. Всем больным гормонозависимым раком","C. Только при метастатической болезни","D. Только пациенткам старше 65 лет"],"A","monarchE включал больных высокого риска, определяемого числом поражённых лимфоузлов, размером опухоли, степенью злокачественности и уровнем Ki-67. NATALEE с рибоциклибом расширил популяцию, включив часть больных без поражения лимфоузлов, но с другими факторами риска и иной длительностью терапии.","monarchE","https://pubmed.ncbi.nlm.nih.gov/36493792/"],["Биопсия сторожевого лимфоузла при клинически негативных подмышечных лимфоузлах позволяет:",["A. Заменить лучевую терапию","B. Отказаться от системной терапии","C. Избежать полной лимфодиссекции и связанной с ней лимфедемы при сопоставимых онкологических результатах","D. Повысить выживаемость"],"C","Биопсия сторожевого лимфоузла не улучшает выживаемость, но радикально снижает частоту лимфедемы, нарушений подвижности плеча и нейропатии. Это классический пример деэскалации хирургического лечения без потери онкологической эффективности.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["У пременопаузальной пациентки 34 лет с гормонозависимым раком высокого риска адъювантная эндокринотерапия:",["A. Ограничивается тамоксифеном","B. Может включать подавление функции яичников в сочетании с тамоксифеном или ингибитором ароматазы","C. Не проводится","D. Заменяется химиотерапией"],"B","При высоком риске у молодых пациенток подавление функции яичников в комбинации с ингибитором ароматазы или тамоксифеном улучшает исходы по сравнению с тамоксифеном отдельно. Обязательно обсуждаются сохранение фертильности до начала лечения, контрацепция и переносимость: выраженные климактерические симптомы — частая причина прекращения терапии.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-10","t":"Метастатический рак молочной железы: эндокринотерапия, ингибиторы CDK4/6, HER2-положительный и трижды негативный подтипы","s":"Частная онкология, ч. 1","q":[["Как следует поступить при первом выявлении метастатического рецидива рака молочной железы, если очаг безопасно доступен для биопсии?",["A. Ориентироваться только на характеристики первичной опухоли","B. Получить биопсию метастатического очага для подтверждения диагноза и повторной оценки ER/PR/HER2, если процедура клинически выполнима","C. Биопсия метастаза противопоказана","D. Достаточно только онкомаркеров"],"B","При первом метастатическом рецидиве рекомендуется по возможности получить ткань из доступного очага: это подтверждает диагноз и позволяет повторно оценить ER, PR и HER2, поскольку биология опухоли может измениться. Однако биопсия не является абсолютным требованием при недоступном или опасном очаге, очевидной клинической картине или если результат не изменит тактику. Прежнее «необходимо выполнить даже если...» было слишком безусловным.","ESMO Clinical Practice Guideline — metastatic breast cancer","https://www.esmo.org/guidelines/living-guidelines/esmo-living-guideline-metastatic-breast-cancer"],["Стандарт 1-й линии при гормонозависимом HER2-негативном метастатическом раке молочной железы без висцерального криза:",["A. Химиотерапия","B. Эндокринотерапия в монорежиме","C. PARP-ингибитор","D. Эндокринотерапия в комбинации с ингибитором CDK4/6"],"D","Комбинация эндокринотерапии с ингибитором CDK4/6 примерно удваивает беспрогрессивную выживаемость и стала стандартом. Химиотерапия в 1-й линии оправдана лишь при висцеральном кризе — угрожающем жизни нарушении функции органа, требующем быстрого ответа.","MONALEESA-2 — final overall survival","https://pubmed.ncbi.nlm.nih.gov/35263519/"],["Мутация ESR1 при гормонозависимом раке молочной железы:",["A. Не имеет клинического значения","B. Означает необходимость химиотерапии","C. Присутствует изначально у большинства больных","D. Чаще возникает как приобретённый механизм резистентности к ингибиторам ароматазы и определяет выбор последующей эндокринотерапии"],"D","Мутации ESR1 приобретаются под давлением ингибиторов ароматазы и делают рецептор конститутивно активным. EMERALD показал преимущество элацестранта при их наличии. SERENA-6 пошёл дальше: смена препарата при появлении мутации в циркулирующей опухолевой ДНК ещё до рентгенологического прогрессирования улучшила исходы.","SERENA-6","https://pubmed.ncbi.nlm.nih.gov/40454637/"],["Какое исследование впервые обосновало смену терапии по молекулярному, а не рентгенологическому событию?",["A. SERENA-6","B. KEYNOTE-355","C. EMBRACA","D. CLEOPATRA"],"A","В SERENA-6 пациенток мониторировали на появление мутации ESR1 в циркулирующей опухолевой ДНК и при её обнаружении меняли эндокринный компонент на камизестрант, не дожидаясь прогресси
