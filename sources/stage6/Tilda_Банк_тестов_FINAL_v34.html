 Данные утеряны"],"C","Immortal time — период наблюдения, в течение которого участник по определению должен оставаться живым, чтобы впоследствии быть классифицированным как получивший лечение. Если этот период ошибочно относится к экспонированной группе, возникает искусственное преимущество выживаемости. Коррекция требует корректного определения момента начала наблюдения и, при необходимости, моделирования лечения как меняющейся во времени экспозиции. Это одна из систематических ошибок наблюдательных сравнений, но не основание считать любые RWE-данные бесполезными.","Suissa — immortal time bias in pharmaco-epidemiology","https://pubmed.ncbi.nlm.nih.gov/18056625/"],["Кроссовер (переход больных контрольной группы на исследуемый препарат при прогрессировании) влияет на результат так, что:",["A. Делает исследование недействительным","B. Завышает выигрыш по общей выживаемости","C. Размывает различия по общей выживаемости, из-за чего её выигрыш может не достигнуть значимости при реальной эффективности","D. Не влияет"],"C","Переход пациентов контрольной группы на активное лечение после прогрессирования может уменьшать наблюдаемое различие по общей выживаемости между группами и усложнять причинную интерпретацию OS. Это не делает исследование недействительным, но требует учитывать дизайн и методы анализа при интерпретации результата.","Systematic review of surrogate endpoints and overall survival in oncology","https://pubmed.ncbi.nlm.nih.gov/29482777/"]]},{"c":"М-21","t":"Неходжкинские лимфомы","s":"Частная онкология, ч. 3","q":[["Основа диагностики лимфомы:",["A. Иммунофенотипирование крови","B. Данные ПЭТ-КТ","C. Эксцизионная биопсия с иммуногистохимическим и при необходимости молекулярным исследованием","D. Пункционная цитология лимфоузла"],"C","Классификация лимфом основана на архитектонике ткани, иммунофенотипе и генетических нарушениях. Цитология не позволяет установить вариант, а без варианта нельзя выбрать лечение. При невозможности эксцизионной биопсии выполняется толстоигольная под визуальным контролем с забором нескольких столбиков.","Классификация опухолей ВОЗ","https://whobluebooks.iarc.fr/"],["Международный прогностический индекс при диффузной B-крупноклеточной лимфоме включает:",["A. Только возраст и пол","B. Только уровень гемоглобина","C. Только стадию","D. Возраст, функциональный статус, стадию, уровень ЛДГ, число экстранодальных зон"],"D","Пять факторов формируют группы риска, от которых существенно зависит доля излечения. Индекс сохраняет прогностическое значение и в эпоху ритуксимаба; его расчёт обязателен при обсуждении тактики, в том числе при решении о применении режима с полатузумабом.","International Prognostic Index — aggressive NHL","https://pubmed.ncbi.nlm.nih.gov/8141877/"],["Что показало исследование POLARIX?",["A. R-CHOP устарел полностью","B. Химиотерапия не нужна","C. Полатузумаб неэффективен","D. Полатузумаб ведотин с R-CHP улучшает беспрогрессивную выживаемость по сравнению с R-CHOP без доказанного выигрыша в общей"],"D","Выигрыш по беспрогрессивной выживаемости получен, по общей — нет. Поэтому режим применяется избирательно, прежде всего при высоком международном прогностическом индексе и в неблагоприятных молекулярных подгруппах. Это типичный пример решения, требующего понимания разницы между конечными точками.","POLARIX","https://pubmed.ncbi.nlm.nih.gov/34904799/"],["Пациент с ДВККЛ имеет первично-рефрактерное заболевание или ранний рецидив после первой линии и подходит для интенсивного лечения. Какой подход имеет приоритет в современной второй линии?",["A. Только наблюдение","B. Повторение той же первой линии","C. Лучевая терапия независимо от распространённости","D. CAR-T-клеточная терапия в подходящей клинической ситуации"],"D","Для первично-рефрактерной ДВККЛ и рецидива в течение примерно 12 месяцев после первой линии рандомизированные исследования вывели CAR-T во вторую линию у подходящих пациентов. При более позднем химиочувствительном рецидиве спасительная химиотерапия с последующей ауто-ТГСК сохраняет важную роль. Поэтому прежнее обобщение «CAR-T — оптимальная вторая линия» без указания времени рецидива было чрезмерным.","EHA Clinical Practice Guideline — Large B-cell lymphoma","https://pubmed.ncbi.nlm.nih.gov/40975426/"],["Основные ранние осложнения CAR-T-клеточной терапии:",["A. Кожная токсичность","B. Нефротоксичность и кардиотоксичность","C. Синдром высвобождения цитокинов и синдром нейротоксичности, ассоциированный с иммунными эффекторными клетками","D. Периферическая нейропатия"],"C","Синдром высвобождения цитокинов проявляется лихорадкой, гипотензией и гипоксией; лечение — тоцилизумаб и глюкокортикоиды. Неврологический синдром проявляется спутанностью, афазией, судорогами и требует глюкокортикоидов. Оба состояния управляемы при своевременном распознавании, поэтому терапия проводится только в центрах с соответствующим опытом и протоколами.","TRANSFORM — lisocabtagene maraleucel second line","https://pubmed.ncbi.nlm.nih.gov/35717989/"],["Биспецифические антитела при B-клеточных лимфомах отличаются от CAR-T тем, что:",["A. Эффективнее во всех ситуациях","B. Не вызывают цитокинового синдрома","C. Доступны «с полки» без производства индивидуального продукта, но требуют ступенчатого наращивания дозы для снижения риска цитокинового синдрома","D. Применяются только в первой линии"],"C","Отсутствие необходимости в афереза и производстве делает их доступными тогда, когда времени на CAR-T нет. Глофитамаб и эпкоритамаб активны в том числе после прогрессирования на CAR-T. Ступенчатое наращивание дозы в начале терапии обязательно, а первые введения проводятся под наблюдением.","Glofitamab for relapsed/refractory DLBCL","https://pubmed.ncbi.nlm.nih.gov/36507690/"],["Больная 62 лет с фолликулярной лимфомой, стадия III, без симптомов, опухолевая масса невелика, показателей высокой активности нет. Тактика:",["A. Аутологичная трансплантация","B. Наблюдение до появления показаний к лечению","C. Немедленная иммунохимиотерапия","D. Лучевая терапия"],"B","При бессимптомной фолликулярной лимфоме с малой опухолевой массой раннее начало терапии не увеличивает общую выживаемость. Показания к лечению определяются симптомами, большой опухолевой массой, цитопениями и нарушением функции органов. Наблюдение здесь — не бездействие, а обоснованный выбор, который нужно уметь объяснить пациенту.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Что означает POD24 при фолликулярной лимфоме?",["A. Ответ через 24 месяца","B. Прогрессирование в первые 24 месяца после начала иммунохимиотерапии — признак существенно худшего прогноза","C. Длительность терапии","D. Дозу препарата"],"B","Раннее прогрессирование выделяет группу с многократно худшей выживаемостью и требует пересмотра стратегии: обязательна повторная биопсия для исключения трансформации в агрессивную лимфому, обсуждаются CAR-T, биспецифические антитела и клинические исследования.","POD24 in follicular lymphoma","https://pubmed.ncbi.nlm.nih.gov/26124482/"],["При каком варианте неходжкинской лимфомы обязательна интенсивная профилактика синдрома лизиса опухоли?",["A. Лимфома из малых лимфоцитов","B. Лимфома из клеток маргинальной зоны","C. Фолликулярная лимфома","D. Лимфома Беркитта"],"D","Лимфома Беркитта обладает крайне высокой скоростью пролиферации, и массивный распад клеток при начале терапии закономерен. Обязательны интенсивная гидратация, расбуриказа при высоком риске и частый лабораторный контроль. Лечение должно начинаться экстренно, но с одновременной профилактикой — это ситуация, где промедление и неподготовленность одинаково опасны.","Risk-adapted dose-adjusted EPOCH-R in Burkitt lymphoma","https://pubmed.ncbi.nlm.nih.gov/32453640/"],["Профилактика поражения ЦНС при диффузной B-крупноклеточной лимфоме:",["A. Показана всем больным","B. Не проводится никогда","C. Проводится только интратекально","D. Обсуждается при высоком индексе CNS-IPI и поражении отдельных экстранодальных зон, при этом эффективность высокодозного метотрексата ставится под сомнение современными данными"],"D","Риск оценивается по индексу CNS-IPI с учётом поражения почек, надпочечников, яичек, молочной железы. Однако крупные ретроспективные исследования не подтвердили снижения частоты поражения ЦНС при профилактике высокодозным метотрексатом, поэтому подход пересматривается. Больным группы риска необходима настороженность и низкий порог для обследования при неврологических симптомах.","Lancet Oncology Review — CNS prophylaxis for DLBCL","https://pubmed.ncbi.nlm.nih.gov/36055310/"],["Что изменило исследование TRIANGLE при мантийноклеточной лимфоме?",["A. Отменило химиотерапию","B. Заменило диагностику","C. Показало неэффективность ингибиторов BTK","D. Добавление ибрутиниба к индукции и поддерживающей терапии улучшило исходы и поставило под вопрос обязательность аутологичной трансплантации в первой линии у молодых"],"D","Мантийноклеточная лимфома долго считалась заболеванием, при котором молодым больным обязательна интенсификация с аутологичной трансплантацией. TRIANGLE показало, что включение ингибитора BTK меняет расстановку, и роль трансплантации в первой линии сокращается — пример деэскалации интенсивного лечения за счёт таргетного препарата.","TRIANGLE — ibrutinib in mantle-cell lymphoma","https://pubmed.ncbi.nlm.nih.gov/38705160/"]]},{"c":"М-22","t":"Множественная миелома и макроглобулинемия Вальденстрёма","s":"Частная онкология, ч. 3","q":[["Критерии CRAB при множественной миеломе включают:",["A. Только анемию и поражение костей","B. Только уровень парапротеина","C. Лихорадку, потливость, потерю массы тела","D. Гиперкальциемию, почечную недостаточность, анемию, поражение костей"],"D","CRAB описывает поражение органов-мишеней. Критерии IMWG дополнены биомаркёрами SLiM: 60 % и более плазматических клеток в костном мозге, соотношение вовлечённых и невовлечённых свободных лёгких цепей 100 и выше, более одного очага на МРТ. Их наличие позволяет начать лечение до развития органного повреждения.","IMWG updated diagnostic criteria for multiple myeloma","https://pubmed.ncbi.nlm.nih.gov/25439696/"],["Больной с моноклональной гаммапатией неопределённого значения:",["A. Требует трансплантации","B. Требует немедленного лечения","C. Наблюдается, поскольку риск трансформации в миелому составляет около 1 % в год","D. Не требует наблюдения"],"C","Моноклональная гаммапатия неопределённого значения предшествует практически всем случаям миеломы, но трансформируется медленно. Лечение не проводится; наблюдение включает контроль парапротеина, показателей крови, кальция и функции почек. Тлеющая миелома с признаками высокого риска — отдельная категория, при которой обсуждается раннее вмешательство.","IMWG updated diagnostic criteria for multiple myeloma","https://pubmed.ncbi.nlm.nih.gov/25439696/"],["Какой современный принцип первой линии применяют у пациента с впервые выявленной множественной миеломой, подходящего для ауто-ТГСК?",["A. Индукция четырёхкомпонентным режимом anti-CD38 + VRd с последующей ауто-ТГСК у подходящих пациентов и поддерживающей терапией","B. Только мелфалан внутрь","C. Наблюдение до прогрессирования независимо от симптомов","D. Только лучевая терапия"],"A","Современные рекомендации отдают предпочтение индукции на основе anti-CD38 + бортезомиб/леналидомид/дексаметазон перед сбором клеток и ауто-ТГСК у трансплантационно пригодных пациентов. Конкретный anti-CD38-препарат, сроки трансплантации и поддерживающая стратегия зависят от риска, доступности и национальных рекомендаций; у части стандартного риска трансплантацию можно отложить.","EHA-EMN Evidence-Based Guidelines — Multiple Myeloma","https://pubmed.ncbi.nlm.nih.gov/40624367/"],["Какой современный принцип выбора первой линии терапии обоснован у пациента с впервые диагностированной множественной миеломой, которому не планируется трансплантация?",["A. У функционально сохранного пациента возможно применение четырёхкомпонентной схемы D-VRd; у более хрупких больных интенсивность подбирают индивидуально, включая менее интенсивные анти-CD38-содержащие варианты","B. Только дексаметазон","C. Высокодозная химиотерапия обязательна независимо от состояния","D. Мелфалан с преднизолоном является универсальным стандартом"],"A","CEPHEUS показало преимущество D-VRd перед VRd у пациентов с впервые диагностированной миеломой, которым трансплантация не планировалась или была отложена: MRD-негативность 60,9% против 39,4%, а риск прогрессирования или смерти был ниже (HR 0,57). Однако результаты исследования не означают, что одинаковая четырёхкомпонентная интенсивность подходит каждому пожилому или хрупкому пациенту: необходимо учитывать функциональный статус, сопутствующие заболевания и ожидаемую переносимость.","CEPHEUS phase III — daratumumab + VRd","https://pubmed.ncbi.nlm.nih.gov/39910273/"],["Как следует интерпретировать отрицательную измеримую остаточную болезнь (MRD) при множественной миеломе?",["A. Как технический артефакт","B. Как отсутствие выявляемых опухолевых клеток ниже заданного порога чувствительности; это сильный прогностический маркёр, но использование MRD для изменения лечения требует конкретного доказательного контекста","C. Как доказательство излечения","D. Как синоним полного ответа по парапротеину"],"B","MRD-негативность ассоциирована с существенно лучшими БПВ и ОВ и является одним из наиболее сильных прогностических показателей при миеломе. При этом MRD-негативность не равна излечению. Адаптация продолжительности или интенсивности лечения исключительно на основании MRD должна опираться на результаты соответствующих исследований и рекомендации, а не применяться автоматически.","Meta-analysis — MRD negativity and survival in multiple myeloma","https://pubmed.ncbi.nlm.nih.gov/27632282/"],["Больной с миеломой и первым рецидивом через 2 года после трансплантации. Наиболее перспективная опция при доступности:",["A. Только дексаметазон","B. Лучевая терапия","C. Повторение первой линии","D. CAR-T-клеточная терапия"],"D","CARTITUDE-4 показало превосходство цилтакабтагена аутолейцела над стандартными режимами уже при первом рецидиве, KarMMa-3 — преимущество идекабтагена виклейцела при рецидивирующей и рефрактерной болезни. Клеточная терапия перемещается в ранние линии, поскольку там эффективнее и лучше переносится; при недоступности рассматриваются биспецифические антитела и комбинации.","CARTITUDE-4","https://pubmed.ncbi.nlm.nih.gov/37272512/"],["Специфическая токсичность белантамаба мафодотина:",["A. Нейропатия","B. Нефротоксичность","C. Кардиотоксичность","D. Поражение роговицы с нарушением зрения, требующее регулярного офтальмологического контроля"],"D","Кератопатия — класс-определяющее осложнение, обратимое, но требующее отсрочек и редукции доз. Обязателен осмотр офтальмолога до начала и перед каждым введением. DREAMM-7 и DREAMM-8 показали значимый выигрыш по беспрогрессивной выживаемости, что делает управление этой токсичностью практической задачей.","DREAMM-7 — belantamab mafodotin, bortezomib and dexamethasone","https://pubmed.ncbi.nlm.nih.gov/38828933/"],["Какова роль остеомодифицирующих препаратов при активной симптомной множественной миеломе?",["A. Лучевая терапия должна проводиться на все костные очаги","B. Бисфосфонаты или деносумаб снижают риск скелетных осложнений; выбор зависит в том числе от функции почек, а до начала лечения нужна стоматологическая оценка","C. Они не показаны при миеломе","D. Их применяют только для обезболивания"],"B","ASCO рекомендует остеомодифицирующие препараты пациентам с активной симптомной множественной миеломой, требующей системной терапии. Памидронат или золедроновая кислота являются стандартными вариантами; деносумаб не уступает золедроновой кислоте по профилактике скелетных событий и может быть предпочтителен при почечной недостаточности. Перед началом терапии необходимы стоматологическая оценка и профилактика остеонекроза челюсти.","ASCO Guideline Update — bone-modifying agents in multiple myeloma","https://ascopubs.org/doi/10.1200/JCO.2017.76.6402"],["Основная причина почечной недостаточности при миеломе:",["A. Обструкция мочевых путей","B. Повреждение канальцев свободными лёгкими цепями, часто в сочетании с гиперкальциемией, дегидратацией и нефротоксичными препаратами","C. Гломерулонефрит","D. Гиперкальциемия исключительно"],"B","Цилиндровая нефропатия — ведущий механизм. Тактика: экстренное начало эффективной противоопухолевой терапии для быстрого снижения продукции лёгких цепей, интенсивная гидратация, коррекция гиперкальциемии, отмена нестероидных противовоспалительных препаратов и по возможности избегание контрастных исследований. Бортезомиб не требует коррекции дозы при почечной недостаточности, что делает его удобным в этой ситуации.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Профилактика тромбозов при лечении иммуномодулирующими препаратами:",["A. Только компрессионный трикотаж","B. Обязательна: аспирин при низком риске, антикоагулянт при высоком","C. Не требуется","D. Только при постельном режиме"],"B","Леналидомид и другие иммуномодулирующие препараты, особенно в сочетании с дексаметазоном, существенно повышают риск венозных тромбоэмболических осложнений. Риск оценивается индивидуально; при низком назначается аспирин, при высоком — низкомолекулярный гепарин или прямой пероральный антикоагулянт.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Какая молекулярная особенность наиболее характерна для макроглобулинемии Вальденстрёма и имеет значение для терапии ингибиторами BTK?",["A. MYD88 L265P выявляется у большинства больных; MYD88 и CXCR4 помогают интерпретировать вероятность и кинетику ответа на ингибиторы BTK","B. Транслокация t(11;14) является определяющей","C. Мутация JAK2 встречается у большинства пациентов","D. Делеция 17p является обязательным диагностическим критерием"],"A","MYD88 L265P выявляется у подавляющего большинства пациентов с макроглобулинемией Вальденстрёма. Статус MYD88 и CXCR4 влияет на вероятность, глубину и скорость ответа на различные ингибиторы BTK, но формулировка «MYD88 определяет чувствительность» слишком категорична. При симптомном синдроме гипервязкости требуется неотложное снижение уровня IgM, обычно плазмаферез.","Ibrutinib in treatment-naïve Waldenström macroglobulinemia","https://pubmed.ncbi.nlm.nih.gov/30044692/"]]},{"c":"М-23","t":"Хирургия в онкологии: принципы и роль в мультимодальном лечении","s":"Общая онкология","q":[["Чем понятие резектабельности отличается от операбельности?",["A. Операбельность определяется хирургом, резектабельность — терапевтом","B. Резектабельность — техническая возможность удалить опухоль радикально; операбельность — способность конкретного больного перенести вмешательство","C. Резектабельность относится только к метастазам","D. Это синонимы"],"B","Разграничение принципиально для консилиума: опухоль может быть резектабельной у неоперабельного больного и наоборот. Резектабельность оценивается по данным визуализации и анатомии, операбельность — по функциональному статусу, сопутствующей патологии и резервам органов.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Что означает принцип en bloc в онкологической хирургии?",["A. Удаление опухоли единым блоком с окружающими тканями и путями лимфооттока без нарушения её целостности","B. Удаление опухоли по частям для меньшей травмы","C. Удаление только видимой опухоли","D. Одномоментное удаление нескольких органов"],"A","Нарушение целостности опухоли ведёт к обсеменению операционного поля и резко ухудшает прогноз. Отсюда же правило не выполнять чрескожную биопсию яичка и запрет на энуклеацию сарком мягких тканей: «вылущивание» опухоли оставляет опухолевые клетки в псевдокапсуле.","Holland-Frei Cancer Medicine","https://www.ncbi.nlm.nih.gov/books/NBK12354/"],["Больной завершил неоадъювантную химиолучевую терапию. Когда оптимально оперировать?",["A. Немедленно после последнего цикла","B. Сроки не имеют значения","C. Через год","D. В нозолого-специфичный интервал, позволяющий реализоваться эффекту лечения и восстановиться показателям крови"],"D","Слишком ранняя операция проводится на фоне цитопении и отёка тканей, слишком поздняя — рискует прогрессированием и фиброзом. Интервалы различаются по нозологиям: при раке прямой кишки обычно 8–12 недель после химиолучевой терапии, при раке молочной железы — после восстановления показателей крови. Бевацизумаб отменяется минимум за 4–6 недель до вмешательства из-за нарушения заживления.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Что показало исследование LACC при раннем раке шейки матки?",["A. Операция не нужна","B. Малоинвазивная радикальная гистерэктомия дала худшую безрецидивную и общую выживаемость по сравнению с открытой","C. Различий нет","D. Малоинвазивный доступ предпочтителен"],"B","Результат оказался неожиданным и изменил практику: при раннем раке шейки матки стандартом остаётся открытая операция. Общий вывод шире конкретной нозологии — преимущество доступа, доказанное при раке ободочной кишки, не переносится автоматически на другие локализации и требует отдельной проверки.","LACC trial","https://pubmed.ncbi.nlm.nih.gov/30380365/"],["Основной вывод исследования PRODIGE 7 при канцероматозе колоректального происхождения:",["A. Добавление гипертермической внутрибрюшинной химиотерапии к полной циторедукции не улучшило выживаемость; решающим остаётся полнота циторедукции","B. Циторедукция бесполезна","C. Показана только системная терапия","D. HIPEC обязателен"],"A","Исследование существенно сузило показания к HIPEC при колоректальном канцероматозе, тогда как ценность полной циторедукции у отобранных больных сохраняется. При раке яичников ситуация иная — там данные по HIPEC в определённых условиях положительные, что подчёркивает необходимость нозолого-специфичного подхода.","PRODIGE 7","https://pubmed.ncbi.nlm.nih.gov/33476595/"],["Что такое R1-резекция и почему это важно?",["A. Первая по счёту операция","B. Повторная операция","C. Радикальная операция","D. Микроскопически определяемая опухоль по краю резекции — независимый неблагоприятный прогностический фактор и во многих нозологиях показание к дополнительному лечению"],"D","Статус R должен присутствовать в каждом послеоперационном заключении. При R1 обсуждаются реоперация, послеоперационная лучевая терапия или системное лечение в зависимости от нозологии. Отсутствие оценки R в протоколе — серьёзный дефект документации, лишающий консилиум ключевой информации.","Классификация TNM и R","https://www.uicc.org/what-we-do/sharing-knowledge/tnm"],["Число исследованных лимфоузлов в препарате имеет значение, потому что:",["A. Влияет на оплату по КСГ","B. При недостаточном числе исследованных узлов возможно занижение стадии, что ведёт к отказу от показанной адъювантной терапии","C. Отражает мастерство хирурга","D. Не имеет значения"],"B","Для каждой нозологии установлен минимум: при раке ободочной кишки обычно не менее 12 узлов. Меньшее число означает, что стадия может быть занижена — явление миграции стадии. В такой ситуации при прочих факторах риска решение об адъювантной терапии принимается в пользу лечения.","Классификация TNM","https://www.uicc.org/what-we-do/sharing-knowledge/tnm"],["Преабилитация перед онкологической операцией включает:",["A. Только отказ от курения","B. Только предоперационное голодание","C. Физическую подготовку, нутритивную поддержку, коррекцию анемии, психологическую подготовку и отказ от курения","D. Только дыхательную гимнастику"],"C","Преабилитация может включать физические упражнения, нутритивную поддержку и коррекцию тревоги до операции. Рандомизированные данные, в том числе при хирургии рака лёгкого, показывают улучшение функциональной готовности и восстановления, но эффект зависит от вида операции, программы, длительности и исходного состояния пациента. Это не универсальная замена стандартной предоперационной подготовке.","Randomized trial — multimodal prehabilitation before lung cancer surgery","https://pubmed.ncbi.nlm.nih.gov/33321089/"],["Продлённая профилактика венозных тромбоэмболических осложнений после обширной операции по поводу опухоли брюшной полости:",["A. Проводится только в стационаре","B. Проводится в течение примерно 4 недель после выписки","C. Не требуется","D. Проводится пожизненно"],"B","Риск тромбоза сохраняется недели после выписки, а большинство эпизодов развивается уже дома. Продлённая профилактика низкомолекулярным гепарином в течение примерно 4 недель после обширных вмешательств по поводу опухолей брюшной полости и таза снижает частоту тромбозов и рекомендована при отсутствии высокого риска кровотечения.","ENOXACAN II — extended enoxaparin after abdominal/pelvic cancer surgery","https://pubmed.ncbi.nlm.nih.gov/11919306/"],["Паллиативная операция в онкологии выполняется с целью:",["A. Улучшения статистики","B. Устранения угрожающего или тягостного симптома — обструкции, кровотечения, перфорации — при невозможности радикального лечения","C. Удаления всей опухоли","D. Уточнения диагноза"],"B","После крупных операций по поводу опухолей брюшной полости и таза у пациентов с высоким риском ВТЭО может быть показана продлённая профилактика антикоагулянтом. В ENOXACAN II продолжение эноксапарина примерно до 4 недель уменьшало частоту венозных тромбоэмболий по сравнению с коротким курсом. Решение должно учитывать риск кровотечения, тип операции и актуальные рекомендации.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-24","t":"Методология клинических исследований","s":"Общая онкология","q":[["Основная задача исследования I фазы в онкологии:",["A. Сравнить со стандартом","B. Оценить безопасность и определить рекомендуемую дозу","C. Доказать эффективность","D. Оценить качество жизни"],"B","Эффективность в I фазе оценивается как вторичная конечная точка. Историческая цель — определение максимально переносимой дозы через дозолимитирующую токсичность — сегодня пересматривается: для таргетных препаратов и иммунотерапии оптимальная доза часто ниже максимально переносимой.","FDA perspective on oncology dosage optimization / Project Optimus","https://pubmed.ncbi.nlm.nih.gov/39072758/"],["В чём суть инициативы Project Optimus?",["A. Отменить исследования I фазы","B. Перейти от выбора дозы по максимальной переносимости к обоснованию оптимальной дозы с учётом фармакодинамики, эффективности и переносимости","C. Ускорить регистрацию препаратов","D. Стандартизировать дозы во всех странах"],"B","Логика максимально переносимой дозы пришла из цитостатической химиотерапии, где эффект дозозависим. Для таргетных препаратов и иммунотерапии кривая доза — эффект выходит на плато раньше, чем кривая доза — токсичность, поэтому регистрация избыточных доз приводила к ненужной токсичности и отказам от лечения.","FDA perspective on oncology dosage optimization / Project Optimus","https://pubmed.ncbi.nlm.nih.gov/39072758/"],["Корзинное исследование отличается от зонтичного тем, что:",["A. Различий нет","B. Корзинное включает больных с разными опухолями, объединёнными общей молекулярной мишенью; зонтичное — одну нозологию с разделением на молекулярные подгруппы","C. Корзинное всегда рандомизировано","D. Зонтичное не требует биомаркёра"],"B","В корзинном исследовании один препарат или терапевтическая стратегия изучается в нескольких нозологиях/подтипах, объединённых общим биомаркером. Зонтичное исследование, напротив, разделяет одну нозологию на молекулярные подгруппы и тестирует соответствующие вмешательства. Платформенный дизайн позволяет со временем добавлять и закрывать экспериментальные ветви. Эти понятия частично перекрываются, поэтому абсолютные определения следует использовать осторожно.","Master protocol trials in oncology — basket, umbrella and platform designs","https://pmc.ncbi.nlm.nih.gov/articles/PMC6120722/"],["Зачем нужен независимый комитет по мониторингу данных?",["A. Для отбора больных","B. Для оценки промежуточных данных по безопасности и эффективности и рекомендации о продолжении, изменении или прекращении исследования","C. Для ускорения набора","D. Для публикации результатов"],"B","Комитет — единственная группа, видящая незаслеплённые промежуточные данные. Он может рекомендовать досрочное прекращение при явном преимуществе, при вреде или при бесперспективности. Это защищает участников и предотвращает продолжение исследования, ответ на вопрос которого уже получен.","ICH E6(R3) Good Clinical Practice","https://www.ema.europa.eu/en/ich-e6-good-clinical-practice-scientific-guideline"],["Информированное согласие в клиническом исследовании — это:",["A. Согласие родственников","B. Формальность","C. Подпись на бланке","D. Процесс: разъяснение целей, процедур, рисков, альтернатив и права выйти в любой момент, с проверкой понимания и достаточным временем на решение"],"D","Подпись фиксирует процесс, но не заменяет его. Особая проблема онкологии — терапевтическое заблуждение: больной воспринимает исследование как гарантированно лучшее лечение. Обязанность врача — объяснить, что цель исследования в получении знания, а личная польза не гарантирована, и что отказ никак не повлияет на дальнейшее лечение.","Declaration of Helsinki — 2024 revision","https://pubmed.ncbi.nlm.nih.gov/39425945/"],["Больной спрашивает: «Мне дадут пустышку?» Корректный ответ при исследовании в онкологии:",["A. «Это неизвестно»","B. «В онкологии плацебо в чистом виде почти не применяется: обычно сравнивают стандартное лечение с добавлением исследуемого препарата или плацебо, поэтому без лечения вы не останетесь»","C. «Возможно, вы получите только плацебо»","D. «Плацебо не бывает»"],"B","Полное плацебо допустимо только при отсутствии эффективного стандарта. Обычно сравниваются стандарт плюс исследуемый препарат против стандарта плюс плацебо, либо новый режим против действующего стандарта. Честное объяснение этой конструкции снимает основной страх и не создаёт ложных ожиданий.","Declaration of Helsinki — 2024 revision","https://pubmed.ncbi.nlm.nih.gov/39425945/"],["Почему результат одногруппового исследования II фазы нельзя приравнивать к доказательству пользы?",["A. Короткое наблюдение","B. Отсутствие группы сравнения не позволяет отделить эффект препарата от отбора больных и естественного течения болезни","C. Отсутствие ослепления","D. Малая выборка"],"B","Высокая частота ответов может отражать благоприятный отбор. История онкологии знает немало препаратов, впечатляющих во II фазе и провалившихся в III. Ускоренные регистрации по данным одногрупповых исследований требуют последующего подтверждения.","CONSORT 2025 Statement","https://pubmed.ncbi.nlm.nih.gov/40245901/"],["Что такое систематическая ошибка публикации (publication bias)?",["A. Исследования с статистически значимыми или «положительными» результатами имеют большую вероятность публикации и часто публикуются быстрее, чем исследования с отрицательными или неопределёнными результатами","B. Любая ошибка редактора журнала","C. Публикация только исследований большого размера","D. Любое расхождение между протоколом и статьёй"],"A","Publication bias возникает, когда вероятность и скорость публикации зависят от направления или статистической значимости результатов. В методологическом обзоре Cochrane положительные исследования имели существенно более высокие шансы быть опубликованными, чем отрицательные/нулевые. Это может завышать оценку эффекта в систематических обзорах. Следует отличать publication bias от selective outcome reporting — избирательного представления исходов внутри уже опубликованного исследования.","Cochrane — publication bias due to significance/direction of trial results","https://www.cochrane.org/evidence/MR000006_publication-bias-clinical-trials-due-statistical-significance-or-direction-trial-results"],["Внешняя контрольная группа на основе данных реальной практики принимается регуляторами:",["A. Только в наблюдательных исследованиях","B. Никогда","C. Ограниченно: при редких заболеваниях, отсутствии стандарта или очевидном эффекте, при условии сопоставимости популяций и качества данных","D. Всегда"],"C","Основная проблема внешнего контроля — несопоставимость популяций и различия в диагностике и сопроводительной терапии между эпохами. Такой дизайн применяется, когда рандомизация невозможна или неэтична, и требует тщательного подбора и анализа чувствительности.","Oncology Reviews 2026 — real-world evidence and external control arms in oncology HTA","https://www.frontiersin.org/journals/oncology-reviews/articles/10.3389/or.2026.1605636/full"],["Что необходимо проверить в публикации перед тем, как менять свою практику?",["A. Число авторов","B. Страну проведения","C. Первичную конечную точку и её совпадение с зарегистрированным протоколом, размер эффекта в абсолютных величинах, характеристики популяции, профиль токсичности и качество жизни","D. Импакт-фактор журнала"],"C","Ключевые вопросы: соответствует ли популяция исследования вашим больным, была ли первичная точка заявлена заранее, каков абсолютный выигрыш, какова цена в токсичности и как менялось качество жизни. Импакт-фактор журнала о применимости результата к конкретному пациенту не говорит ничего.","CONSORT 2025 Statement","https://pubmed.ncbi.nlm.nih.gov/40245901/"]]},{"c":"М-25","t":"Рак почки","s":"Частная онкология, ч. 2","q":[["Молекулярная основа большинства случаев светлоклеточного рака почки:",["A. Инактивация гена VHL с накоплением факторов HIF и гиперэкспрессией VEGF","B. Мутация BRAF","C. Мутация KRAS","D. Амплификация HER2"],"A","Утрата функции VHL нарушает деградацию факторов, индуцируемых гипоксией; их накопление активирует транскрипцию VEGF и других генов, что делает опухоль исключительно васкуляризированной. Отсюда высокая чувствительность к антиангиогенным препаратам и появление ингибиторов HIF-2α, действующих на самый верх каскада.","VHL-HIF pathway in clear-cell RCC","https://pubmed.ncbi.nlm.nih.gov/20818883/"],["Прогностическая модель IMDC включает:",["A. Только стадию","B. Только гистологический вариант","C. Функциональный статус, время от диагноза до начала терапии, уровень гемоглобина, кальция, нейтрофилов и тромбоцитов","D. Только размер опухоли"],"C","Шесть факторов формируют группы благоприятного, промежуточного и неблагоприятного прогноза. Модель определяет и прогноз, и выбор терапии: при промежуточном и неблагоприятном прогнозе особое место занимает комбинация ниволумаба с ипилимумабом. Расчёт занимает минуту и обязателен до назначения лечения.","IMDC prognostic model","https://pubmed.ncbi.nlm.nih.gov/21444831/"],["Больной с впервые выявленным метастатическим светлоклеточным раком почки, промежуточный прогноз IMDC, ECOG 1. Опции первой линии:",["A. Комбинация на основе ингибитора контрольных точек: с другим ингибитором контрольных точек либо с ингибитором тирозинкиназ","B. Только хирургическое лечение","C. Сунитиниб в монорежиме","D. Наблюдение"],"A","Монотерапия ингибиторами тирозинкиназ уступила место комбинациям. Ниволумаб с ипилимумабом (CheckMate 214) даёт наибольшую долю полных ответов и плато на кривой выживаемости, но требует времени и сопряжён с иммуноопосредованными явлениями. Комбинации ингибитора контрольных точек с ингибитором тирозинкиназ (CheckMate 9ER, KEYNOTE-426, CLEAR) дают более высокую частоту ответов и быстрый эффект. Выбор определяется темпом болезни, симптомами и сопутствующей патологией.","CheckMate 214","https://pubmed.ncbi.nlm.nih.gov/29562145/"],["Что показало исследование CARMENA?",["A. Системная терапия не нужна","B. Нефрэктомия улучшает выживаемость во всех группах","C. При промежуточном и неблагоприятном прогнозе циторедуктивная нефрэктомия перед системной терапией не улучшает выживаемость","D. Циторедуктивная нефрэктомия обязательна всем"],"C","До CARMENA нефрэктомия считалась обязательным первым шагом. Исследование показало, что при промежуточном и неблагоприятном прогнозе она не даёт выигрыша и откладывает начало эффективной системной терапии. Операция сохраняет роль у отобранных больных: при благоприятном прогнозе, малом объёме метастатического поражения, симптомной первичной опухоли или как отсроченное вмешательство после хорошего ответа на системную терапию.","CARMENA","https://pubmed.ncbi.nlm.nih.gov/29860937/"],["Адъювантная терапия при раке почки высокого риска после нефрэктомии:",["A. Не показана никому","B. Показан сунитиниб","C. Показана лучевая терапия","D. Пембролизумаб по данным KEYNOTE-564 улучшает безрецидивную и общую выживаемость"],"D","KEYNOTE-564 — единственное адъювантное исследование при раке почки, показавшее выигрыш в общей выживаемости; предшествующие исследования с ингибиторами тирозинкиназ такого результата не дали, а часть их была отрицательной. Отбор больных проводится по критериям высокого риска рецидива, использованным в протоколе.","KEYNOTE-564 — overall survival","https://pubmed.ncbi.nlm.nih.gov/38631003/"],["Белзутифан относится к классу:",["A. Ингибиторов тирозинкиназ","B. Ингибиторов mTOR","C. Ингибиторов контрольных точек","D. Ингибиторов HIF-2α"],"D","Белзутифан блокирует фактор, индуцируемый гипоксией, — центральное звено каскада, активируемого при утрате VHL. LITESPARK-005 показал его превосходство над эверолимусом у предлеченных больных. Характерные нежелательные явления — анемия и гипоксия, требующие контроля. Препарат также применяется при синдроме фон Гиппеля — Линдау.","LITESPARK-005 — belzutifan versus everolimus","https://pubmed.ncbi.nlm.nih.gov/39167807/"],["Малое образование почки до 3 см у пожилого больного с тяжёлой сопутствующей патологией:",["A. Может наблюдаться динамически либо подвергнуться термоаблации; при вмешательстве предпочтительна резекция почки","B. Требует системной терапии","C. Требует биопсии в обязательном порядке","D. Требует немедленной радикальной нефрэктомии"],"A","Малые образования часто растут медленно, а часть из них доброкачественные. У пожилых и коморбидных больных активное наблюдение или аблация обоснованы. При показаниях к операции предпочтительна резекция почки, а не нефрэктомия: сохранение паренхимы снижает риск хронической болезни почек и сердечно-сосудистых событий.","EAU Guidelines","https://uroweb.org/guidelines"],["Особенность метастазирования рака почки, влияющая на тактику:",["A. Возможны поздние метастазы через много лет и олигометастатическое течение, при котором обосновано локальное лечение","B. Никогда не метастазирует в кости","C. Всегда быстро прогрессирует","D. Метастазирует только в лёгкие"],"A","Рецидивы через 10 и более лет после нефрэктомии описаны, поэтому наблюдение длительное. При ограниченном числе очагов и медленном темпе роста обосновано локальное воздействие — метастазэктомия или стереотаксическая лучевая терапия — иногда без системной терапии, что позволяет отсрочить её начало.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Несветлоклеточные варианты рака почки:",["A. Не требуют системной терапии","B. Лечатся так же, как светлоклеточный","C. Всегда имеют лучший прогноз","D. Составляют отдельную группу с иной биологией и худшими результатами стандартных подходов; предпочтительно включение в клинические исследования"],"D","Папиллярный, хромофобный, собирательных трубочек и другие варианты изучены существенно хуже: большинство ключевых исследований включали только светлоклеточный рак. При папиллярном раке значима роль пути MET. Практическая рекомендация — по возможности предлагать участие в исследовании и лечить в центрах с опытом.","SWOG 1500 / PAPMET — cabozantinib in papillary RCC","https://pubmed.ncbi.nlm.nih.gov/33592176/"],["Типичная токсичность комбинации ингибитора контрольных точек с ингибитором тирозинкиназ, требующая внимания:",["A. Только гематологическая","B. Только нейротоксичность","C. Токсичность отсутствует","D. Наложение иммуноопосредованных явлений и токсичности ингибитора тирозинкиназ — гепатотоксичность, диарея, кожные реакции; разграничение определяет тактику"],"D","Диарея, гепатотоксичность и сыпь возможны при обоих компонентах, но требуют разного лечения: при иммуноопосредованной природе назначаются глюкокортикоиды, при токсичности ингибитора тирозинкиназ — приостановка и редукция дозы. Практический приём — временно отменить ингибитор тирозинкиназ и наблюдать: быстрое разрешение указывает на его роль, сохранение симптомов — на иммуноопосредованный механизм.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"]]},{"c":"М-26","t":"Уротелиальный рак","s":"Частная онкология, ч. 2","q":[["Современный предпочтительный режим первой линии при местнораспространённом и метастатическом уротелиальном раке:",["A. Энфортумаб ведотин с пембролизумабом","B. Пембролизумаб в монорежиме","C. Гемцитабин с цисплатином","D. Метотрексат, винбластин, доксорубицин, цисплатин"],"A","EV-302 показал удвоение медианы общей выживаемости — 31,5 против 16,1 мес при отношении рисков 0,47 — и рост частоты полных ответов до 29,1 %. Комбинация применима независимо от пригодности к цисплатину, что снимает историческую проблему разделения больных на кандидатов и некандидатов.","EV-302 / KEYNOTE-A39","https://www.nejm.org/doi/full/10.1056/NEJMoa2312117"],["Характерная токсичность энфортумаба ведотина, требующая настороженности:",["A. Ототоксичность","B. Нефротоксичность","C. Кожные реакции, включая тяжёлые буллёзные формы, гипергликемия и периферическая нейропатия","D. Кардиотоксичность"],"C","Тяжёлые кожные реакции, вплоть до синдрома Стивенса — Джонсона и токсического эпидермального некролиза, могут развиваться в первых циклах и требуют немедленной отмены при появлении пузырей или поражения слизистых. Гипергликемия требует контроля глюкозы перед каждым введением, особенно при исходном сахарном диабете и ожирении. Нейропатия кумулятивна и служит причиной редукции дозы.","EV-302 / KEYNOTE-A39","https://www.nejm.org/doi/full/10.1056/NEJMoa2312117"],["Больному с метастатическим уротелиальным раком комбинация с энфортумабом недоступна. Что обосновано после платиносодержащей химиотерапии без прогрессирования?",["A. Продолжение химиотерапии до прогрессирования","B. Лучевая терапия","C. Поддерживающая терапия авелумабом","D. Наблюдение"],"C","JAVELIN Bladder 100 показал улучшение общей выживаемости при переходе на поддерживающий авелумаб после 4–6 циклов платиносодержащей химиотерапии у больных без прогрессирования. Продолжение химиотерапии за пределы 6 циклов пользы не даёт и увеличивает токсичность.","JAVELIN Bladder 100","https://pubmed.ncbi.nlm.nih.gov/32945632/"],["Тестирование на нарушения FGFR2/3 при уротелиальном раке необходимо, потому что:",["A. Определяет объём операции","B. Влияет на стадирование","C. Определяет прогноз","D. Открывает возможность терапии эрдафитинибом, превосходящим химиотерапию у предлеченных больных"],"D","THOR показал преимущество эрдафитиниба над химиотерапией при нарушениях FGFR у больных, ранее получавших лечение. Характерные нежелательные явления — гиперфосфатемия, требующая контроля и коррекции, и офтальмологические осложнения, включая серозную отслойку сетчатки, что требует регулярных осмотров офтальмолога.","THOR — erdafitinib in FGFR-altered urothelial cancer","https://pubmed.ncbi.nlm.nih.gov/37870975/"],["Стандартом при мышечно-инвазивном раке мочевого пузыря у кандидата на цисплатин является:",["A. Неоадъювантная платиносодержащая химиотерапия с последующей радикальной цистэктомией; по данным NIAGARA обосновано добавление периоперационного дурвалумаба","B. Внутрипузырная БЦЖ-терапия","C. Только лучевая терапия","D. Немедленная цистэктомия"],"A","Неоадъювантная химиотерапия улучшает выживаемость и остаётся обязательным компонентом у кандидатов на цисплатин. NIAGARA добавила к этой схеме периоперационный дурвалумаб с улучшением выживаемости без событий и общей выживаемости. Немедленная цистэктомия без неоадъювантной терапии у кандидата на цисплатин — устаревший подход.","NIAGARA / FDA approval summary","https://pubmed.ncbi.nlm.nih.gov/41678313/"],["Что показали исследования KEYNOTE-905 / EV-303 у больных мышечно-инвазивным раком, не подходящих для цисплатина?",["A. Преимущество только по частоте ответов","B. Отсутствие пользы","C. Периоперационный энфортумаб ведотин с пембролизумабом дал частоту полного патоморфологического ответа 57 % и существенное снижение риска события и смерти","D. Показана только цистэктомия"],"C","В KEYNOTE-905/EV-303 у преимущественно цисплатин-непригодных пациентов периоперационный энфортумаб ведотин + пембролизумаб с последующей радикальной операцией улучшил 2-летнюю выживаемость без событий: 74,7% против 39,4%, HR 0,40; 2-летнюю общую выживаемость: 79,7% против 63,1%, HR 0,50; полный патоморфологический ответ составил 57,1% против 8,6%. Это уже не только сообщение о частоте pCR, а опубликованное рандомизированное доказательство III фазы.","KEYNOTE-905/EV-303 — perioperative enfortumab vedotin + pembrolizumab","https://pubmed.ncbi.nlm.nih.gov/41707170/"],["Адъювантный ниволумаб после радикальной операции при уротелиальном раке высокого риска:",["A. Заменяет неоадъювантную терапию","B. Не показан","C. Улучшает безрецидивную выживаемость по данным CheckMate 274","D. Показан всем без исключения"],"C","CheckMate 274 включал больных с патоморфологическими признаками высокого риска после операции, в том числе получавших неоадъювантную химиотерапию. С появлением периоперационных режимов место адъювантной терапии сужается, поэтому решение принимается с учётом того, что больной получал до операции.","CheckMate 274","https://pubmed.ncbi.nlm.nih.gov/34077643/"],["Какова базовая лечебная стратегия при впервые выявленном немышечно-инвазивном раке мочевого пузыря высокого риска?",["A. Немедленная цистэктомия обязательна всем без исключения","B. Системная химиотерапия является стандартом первого шага","C. Полная трансуретральная резекция с последующей внутрипузырной БЦЖ-терапией, включая поддерживающую терапию у подходящих пациентов","D. Только наблюдение"],"C","Для BCG-naive заболевания высокого риска стандарт включает адекватную ТУР и внутрипузырную БЦЖ-терапию с поддержкой у подходящих больных. При BCG-unresponsive заболевании ситуация иная: радикальная цистэктомия остаётся онкологически наиболее надёжной стратегией у пригодных пациентов, а для тех, кто отказывается от неё или не подходит для операции, существуют органосохраняющие варианты, включая пембролизумаб для определённых групп.","KEYNOTE-057 — pembrolizumab in BCG-unresponsive high-risk NMIBC","https://pubmed.ncbi.nlm.nih.gov/34051177/"],["Основной модифицируемый фактор риска уротелиального рака:",["A. Алкоголь","B. Гиподинамия","C. Курение","D. Избыточная масса тела"],"C","Курение обусловливает примерно половину случаев. Отказ от курения снижает риск рецидива и прогрессирования уже после установления диагноза, поэтому беседа об отказе — часть лечения, а не общая рекомендация. Значимы также профессиональные контакты с ароматическими аминами, что требует уточнения профессионального анамнеза.","PDQ® — рак мочевого пузыря","https://www.cancer.gov/publications/pdq"],["Рак верхних мочевыводящих путей отличается от рака мочевого пузыря тем, что:",["A. Не метастазирует","B. Не требует лечения","C. Лечится только БЦЖ","D. Имеет иные подходы: нефруретерэктомия с резекцией устья, органосохраняющее лечение при отобранных опухолях, адъювантная химиотерапия по данным POUT, а также связь с синдромом Линча"],"D","POUT показал улучшение безрецидивной выживаемости при адъювантной химиотерапии после нефруретерэктомии, что важно, поскольку после удаления почки функция часто не позволяет назначить цисплатин позднее. Отдельно следует помнить о связи с синдромом Линча: при раннем возрасте и отягощённом анамнезе показано тестирование системы репарации неспаренных оснований.","POUT — adjuvant chemotherapy for upper tract urothelial carcinoma","https://pubmed.ncbi.nlm.nih.gov/32145825/"]]},{"c":"М-27","t":"Метастатический колоректальный рак","s":"Частная онкология, ч. 1","q":[["Какой минимальный объём молекулярного тестирования обязателен при впервые выявленном метастатическом колоректальном раке?",["A. Только RAS (KRAS, NRAS)","B. RAS, BRAF V600E, статус MMR/MSI, HER2","C. Только статус MMR/MSI","D. Полное секвенирование экзома"],"B","Действующая редакция рекомендаций ESMO требует определения RAS, BRAF V600E, статуса системы репарации неспаренных оснований и HER2 до начала 1-й линии. Тестирование на NTRK-слияния целесообразно при MSI-H или отсутствии иных драйверных нарушений.","ESMO CPG mCRC, Ann Oncol 2026;37(6):759–776","https://www.annalsofoncology.org/article/S0923-7534(26)00108-0/fulltext"],["Пациент 61 года, рак сигмовидной кишки, RAS и BRAF дикого типа, MSS. Какая таргетная опция предпочтительна в 1-й линии?",["A. Бевацизумаб","B. Анти-EGFR-антитело (панитумумаб или цетуксимаб)","C. Регорафениб","D. Таргетная терапия не показана"],"B","PARADIGM показал преимущество панитумумаба над бевацизумабом в 1-й линии при RAS диком типе и левосторонней локализации. При правосторонней локализации такого выигрыша нет — там предпочтителен бевацизумаб.","PARADIGM — panitumumab versus bevacizumab","https://pubmed.ncbi.nlm.nih.gov/37071094/"],["Каков современный принцип первой линии при dMMR/MSI-H метастатическом колоректальном раке?",["A. Только FOLFOX","B. Иммунотерапия ингибитором PD-1; выбор между пембролизумабом и ниволумабом + ипилимумабом зависит от регистрации, доступности и клинической ситуации","C. Только анти-EGFR независимо от RAS","D. Только бевацизумаб"],"B","KEYNOTE-177 установило пембролизумаб как эффективный стандарт первой линии dMMR/MSI-H мКРР. CheckMate 8HW расширило доказательную базу для ниволумаба + ипилимумаба. Эти варианты нельзя представлять как полностью взаимозаменяемые во всех юрисдикциях: регистрационный статус, токсичность и характеристики пациента должны учитываться.","ASCO guideline — Treatment of Metastatic Colorectal Cancer","https://pubmed.ncbi.nlm.nih.gov/36252154/"],["Пациент с BRAF V600E-мутированным мКРР, 1-я линия. Какой режим поддержан результатами BREAKWATER?",["A. FOLFOXIRI + бевацизумаб","B. Энкорафениб + цетуксимаб ± химиотерапия на основе фторпиримидина","C. Вемурафениб + иринотекан","D. Пембролизумаб"],"B","BREAKWATER: медиана общей выживаемости 30,3 против 15,1 мес. В феврале 2026 г. FDA предоставило комбинации полное одобрение. Анти-EGFR в монорежиме при BRAF V600E неэффективен из-за реактивации EGFR по механизму обратной связи.","BREAKWATER — encorafenib, cetuximab and mFOLFOX6","https://www.nejm.org/doi/10.1056/NEJMoa2501912"],["Какая опция обоснована при HER2-положительном, RAS дикого типа, рефрактерном мКРР?",["A. Трастузумаб + тукатиниб или трастузумаб дерукстекан","B. Цетуксимаб в монорежиме","C. Пембролизумаб","D. Регорафениб + капецитабин"],"A","HER2-амплификация встречается у 3–5 % больных, чаще при левосторонней локализации и RAS диком типе. MOUNTAINEER и DESTINY-CRC02 показали активность в рефрактерной популяции. HER2-положительный статус также предсказывает низкую эффективность анти-EGFR.","MOUNTAINEER — tucatinib plus trastuzumab in HER2-positive mCRC","https://pubmed.ncbi.nlm.nih.gov/36512983/"],["Какая комбинация в 3-й и последующих линиях подтверждена исследованием SUNLIGHT?",["A. Регорафениб + ниволумаб","B. Трифлуридин/типирацил + бевацизумаб","C. Фрутиквинтиниб + капецитабин","D. Митомицин + капецитабин"],"B","SUNLIGHT показал преимущество добавления бевацизумаба к трифлуридину/типирацилу по общей и беспрогрессивной выживаемости. Альтернативы — фрутиквинтиниб (FRESCO-2) и регорафениб.","SUNLIGHT — trifluridine/tipiracil plus bevacizumab","https://pubmed.ncbi.nlm.nih.gov/37133585/"],["Перед назначением фторпиримидинов целесообразно оценить:",["A. Активность UGT1A1","B. Активность дигидропиримидиндегидрогеназы (DPD)","C. Уровень тимидилатсинтазы","D. Полиморфизм CYP2D6"],"B","Частичный или полный дефицит DPD ведёт к тяжёлой, потенциально фатальной токсичности фторпиримидинов. UGT1A1 обсуждается перед иринотеканом, но не перед фторпиримидинами.","ESMO CPG mCRC, раздел по безопасности","https://www.annalsofoncology.org/article/S0923-7534(26)00108-0/fulltext"],["Наиболее характерная токсичность цетуксимаба, коррелирующая с эффективностью терапии:",["A. Артериальная гипертензия","B. Акнеформная сыпь","C. Ладонно-подошвенный синдром","D. Периферическая нейропатия"],"B","Акнеформная сыпь — класс-эффект анти-EGFR-антител, её выраженность ассоциирована с более высокой эффективностью. Также характерна гипомагниемия. Гипертензия типична для бевацизумаба, ладонно-подошвенный синдром — для капецитабина и регорафениба, нейропатия — для оксалиплатина.","Рекомендации RUSSCO по сопроводительной терапии","https://www.rosoncoweb.ru/standarts/suptherapy/"],["Больному с исходно резектабельными метастазами в печени планируется резекция. Какова роль периоперационной химиотерапии по данным EORTC 40983 (EPOC)?",["A. Увеличивает общую выживаемость","B. Улучшает беспрогрессивную выживаемость без доказанного выигрыша в общей выживаемости","C. Не влияет ни на один показатель","D. Показана только при синхронных метастазах"],"B","EORTC 40983 показал прирост беспрогрессивной выживаемости около 7–8 % при периоперационном FOLFOX4; при длительном наблюдении (Lancet Oncol 2013) выигрыша в общей выживаемости не получено. Это важный пример расхождения суррогатной и «твёрдой» конечных точек — режим применяется, но обсуждать его с пациентом нужно честно.","EORTC 40983 — perioperative FOLFOX4 for resectable liver metastases","https://pubmed.ncbi.nlm.nih.gov/18358928/"],["Что показало исследование New EPOC при добавлении цетуксимаба к периоперационной химиотерапии у больных с резектабельными метастазами в печени и KRAS диким типом?",["A. Увеличение беспрогрессивной выживаемости","B. Ухудшение исходов — снижение беспрогрессивной и общей выживаемости","C. Отсутствие различий","D. Улучшение только частоты R0-резекций"],"B","Добавление цетуксимаба привело к ухудшению беспрогрессивной выживаемости, набор был досрочно остановлен; при длительном наблюдении подтвердилось снижение и общей выживаемости. Ключевой вывод: эффективность препарата при распространённой болезни не переносится автоматически на периоперационный этап.","New EPOC, Lancet Oncol 2020","https://www.thelancet.com/article/S1470-2045(19)30798-3/fulltext"],["Больной 60 лет, бессимптомная первичная опухоль ободочной кишки, синхронные нерезектабельные метастазы в печени. Показана ли резекция первичной опухоли до начала системной терапии?",["A. Да, всегда","B. Нет — рандомизированные исследования не показали выигрыша в выживаемости","C. Да, при поражении более одного органа","D. Да, при уровне РЭА выше нормы"],"B","Три рандомизированных исследования — iPACS (JCOG1007), объединённый анализ SYNCHRONOUS и CCRe-IV и CAIRO4 — не показали выигрыша в общей выживаемости от упреждающей резекции первичной опухоли при бессимптомном течении. Более того, в CAIRO4 отмечена значимая 60-дневная послеоперационная летальность. Резекция остаётся показанной при осложнениях: обструкции, кровотечении, перфорации.","iPACS, JCO 2021;39:1098–1107 · SYNCHRONOUS/CCRe-IV, JCO 2024;42:1531–1541 · CAIRO4, Ann Oncol 2024","https://ascopubs.org/doi/10.1200/JCO.20.02447"],["Пациент с исходно нерезектабельными метастазами только в печени, левосторонняя локализация, RAS и BRAF дикого типа. Что показало исследование CAIRO5 для этой подгруппы?",["A. FOLFOXIRI + бевацизумаб превосходит дублет с панитумумабом","B. Дублет с панитумумабом не уступает дублету с бевацизумабом по беспрогрессивной выживаемости, при этом различия по частоте R0/R1-резекций невелики","C. Индукционная терапия не влияет на резектабельность","D. Оптимален монорежим капецитабина"],"B","CAIRO5 — ключевое исследование по стратегии при исходно нерезектабельных метастазах в печени. Принципиален не только выбор режима, но и процедура: резектабельность оценивалась централизованной панелью хирургов и радиологов каждые 2 месяца. Это модель для организации работы консилиума.","CAIRO5, Lancet Oncol 2023;24:757–771; PMID 37329889","https://pubmed.ncbi.nlm.nih.gov/37329889/"]]},{"c":"М-28","t":"Коммуникация с пациентом: сообщение плохих новостей и обсуждение целей лечения","s":"Общая онкология","q":[["Первый шаг протокола SPIKES:",["A. Обсудить лечение","B. Спросить о жалобах","C. Подготовка: обеспечить приватность, время, отсутствие помех и присутствие близкого по желанию пациента","D. Сообщить диагноз"],"C","Разговор в коридоре, на бегу, при звонящем телефоне обесценивает содержание. Подготовка включает сесть на уровне глаз пациента, выключить телефон, убедиться, что есть 15–20 минут, и уточнить, хочет ли он присутствия близкого человека.","SPIKES six-step protocol","https://pubmed.ncbi.nlm.nih.gov/10964998/"],["Что означает шаг «оценка восприятия» в SPIKES?",["A. Выяснить, что пациент уже знает и как понимает свою ситуацию, прежде чем сообщать новую информацию","B. Оценить уровень образования","C. Проверить документы","D. Оценить психическое состояние"],"A","Вопрос «Что вам уже говорили о результатах обследования?» экономит время и предотвращает две ошибки: повторение известного и внезапное сообщение того, к чему пациент не готов. Он также показывает, есть ли расхождение между реальностью и представлениями больного.","SPIKES six-step protocol","https://pubmed.ncbi.nlm.nih.gov/10964998/"],["Пациентка после сообщения о метастазах заплакала. Наиболее уместная реакция:",["A. Позвать родственников","B. Продолжить объяснять план лечения","C. Предложить успокоительное","D. Сделать паузу, назвать эмоцию и дать время: «Вижу, что это тяжёлая новость. Я рядом»"],"D","После сильной эмоциональной реакции полезно сначала признать эмоцию, дать пациенту время и только затем продолжать обсуждение. Это повышает вероятность того, что последующая информация будет воспринята и позволяет сохранить контакт.","ASCO Guideline Update: Patient–Clinician Communication, 2026","https://pubmed.ncbi.nlm.nih.gov/41805420/"],["Родственники просят не говорить пациенту диагноз. Правильная тактика:",["A. Сообщить диагноз вопреки просьбе немедленно","B. Отказаться от разговора","C. Согласиться","D. Выяснить их опасения, объяснить право пациента на информацию и спросить самого пациента, сколько он хочет знать"],"D","Право на информацию принадлежит пациенту, но объём определяет он сам. Уместно поблагодарить родственников за заботу, выяснить, чего именно они боятся, и предложить компромисс: спросить у пациента, насколько подробно он хочет знать. Часто выясняется, что он знает больше, чем предполагает семья, и молчит, чтобы её защитить.","ASCO Patient-Clinician Communication Guideline Update 2026","https://ascopubs.org/doi/10.1200/JCO-26-00118"],["Пациент спрашивает: «Сколько мне осталось?» Наиболее корректный подход:",["A. Уточнить, зачем ему эта информация, затем говорить о диапазонах и о том, что прогноз неточен для конкретного человека","B. Назвать точный срок","C. Сказать, что это неизвестно никому","D. Уклониться от ответа"],"A","За вопросом могут стоять разные потребности: успеть съездить к дочери, оформить документы, понять, стоит ли начинать лечение. Уточняющий вопрос позволяет ответить на настоящий запрос. Далее уместны диапазоны — недели, месяцы, годы — с честным указанием на неопределённость. Отказ отвечать воспринимается как утаивание и разрушает доверие.","ASCO Patient-Clinician Communication Guideline Update 2026","https://ascopubs.org/doi/10.1200/JCO-26-00118"],["Что показало исследование раннего подключения паллиативной помощи при метастатическом раке лёгкого?",["A. Улучшение качества жизни, снижение депрессивной симптоматики и увеличение медианы выживаемости при меньшей агрессивности терапии в конце жизни","B. Сокращение продолжительности жизни","C. Ухудшение качества жизни","D. Отсутствие различий"],"A","Результат опровергает распространённое представление, будто разговор о паллиативной помощи «отнимает надежду» и приближает смерть. Практический вывод: паллиативная помощь подключается параллельно с противоопухолевым лечением с момента установления метастатического диагноза, а не когда «лечить больше нечем».","Temel et al. — early palliative care","https://pubmed.ncbi.nlm.nih.gov/20818875/"],["Что показало исследование CanCORS о понимании целей паллиативной химиотерапии при метастатическом раке лёгкого и колоректальном раке?",["A. Большинство пациентов точно понимали, что лечение не является излечивающим","B. Ошибочные ожидания объяснялись только уровнем образования","C. Многие пациенты не понимали, что химиотерапия крайне маловероятно приведёт к излечению; более высокая оценка коммуникации с врачом парадоксально ассоциировалась с большей вероятностью такого заблуждения","D. Ошибочных ожиданий практически не было"],"C","В CanCORS 69% пациентов с метастатическим раком лёгкого и 81% с метастатическим колоректальным раком не продемонстрировали понимания того, что химиотерапия не является излечивающей. При этом высокий рейтинг коммуникации с врачом ассоциировался с большей вероятностью неверных ожиданий. Исследование не доказывает, что причиной была только формулировка врача, поэтому прежнее объяснение было слишком причинным.","Weeks et al. — Patients' Expectations about Effects of Chemotherapy for Advanced Cancer","https://www.nejm.org/doi/full/10.1056/NEJMoa1204410"],["Пациент с исчерпанными опциями требует «делать хоть что-нибудь». Наиболее конструктивный подход:",["A. Сказать, что сделать ничего нельзя","B. Назначить любую химиотерапию","C. Выяснить, что стоит за просьбой, обозначить, что активная помощь продолжается, и переформулировать цели в достижимых терминах","D. Направить к другому врачу"],"C","За требованием обычно стоит страх быть брошенным. Ключевая формулировка — не «мы больше ничего не можем сделать», а «мы меняем цель: теперь наша задача — чтобы вам было не больно, чтобы вы могли есть и спать, чтобы вы были дома с семьёй». Назначение неэффективной химиотерапии из жалости ухудшает и качество, и продолжительность жизни.","ASCO Patient-Clinician Communication Guideline Update 2026","https://ascopubs.org/doi/10.1200/JCO-26-00118"],["Совместное принятие решения предполагает, что:",["A. Врач перекладывает выбор на пациента","B. Решение принимает только врач","C. Решение принимает семья","D. Врач представляет опции с их последствиями, выясняет ценности и приоритеты пациента и вместе с ним приходит к решению"],"D","Крайности одинаково вредны: патернализм лишает пациента субъектности, а формальное «решайте сами» перекладывает на него груз, который он не в силах нести без экспертизы. Правильная формулировка — «вот варианты и что они означают для вашей жизни; расскажите, что для вас важнее, и я скажу, что рекомендую».","ASCO Guideline Update: Patient–Clinician Communication, 2026","https://pubmed.ncbi.nlm.nih.gov/41805420/"],["Наиболее частая ошибка при сообщении плохих новостей:",["A. Присутствие родственников","B. Использование медицинских терминов","C. Слишком короткий разговор","D. Информационная перегрузка: врач заполняет паузу деталями, спасаясь от собственной тревоги, и пациент не запоминает ничего"],"D","После плохой новости способность воспринимать информацию резко падает. Рабочее правило — сообщить главное короткой фразой, замолчать, дать эмоции проявиться, затем передавать информацию небольшими блоками с проверкой понимания и завершить кратким письменным резюме и назначенной датой следующей встречи.","SPIKES six-step protocol","https://pubmed.ncbi.nlm.nih.gov/10964998/"]]},{"c":"М-29","t":"Лабораторная медицина в онкологии; опухолевые маркёры","s":"Общая онкология","q":[["Основное ограничение опухолевых маркёров, объясняющее их непригодность для скрининга:",["A. Сложность выполнения","B. Отсутствие стандартизации","C. Недостаточные чувствительность и специфичность: у бессимптомного человека положительный результат чаще ложный, чем истинный","D. Высокая стоимость"],"C","При низкой распространённости заболевания даже высокая специфичность даёт преобладание ложноположительных результатов среди всех положительных. Практическое следствие — каскад ненужных исследований, инвазивных вмешательств и тревоги. Исключение составляет ПСА, применение которого для скрининга обсуждается отдельно и требует информированного решения.","ASCO Guideline — tumor markers in gastrointestinal cancer","https://pmc.ncbi.nlm.nih.gov/articles/PMC2793647/"],["У пациента с механической желтухой значительно повышен CA 19-9. Как корректнее интерпретировать результат?",["A. Он не имеет никакого значения","B. Холестаз может существенно повышать CA 19-9; показатель нельзя использовать как самостоятельное подтверждение рака и следует переоценивать после устранения билиарной обструкции","C. Сам уровень CA 19-9 является показанием к операции","D. Высокий CA 19-9 подтверждает злокачественную опухоль независимо от билирубина"],"B","Обструктивная желтуха — важная причина ложноположительного повышения CA 19-9, поэтому результат следует интерпретировать вместе с билирубином, визуализацией и клинической картиной. После декомпрессии желчных путей динамика маркёра может быть информативнее исходного значения. Формулировка «оценка до дренирования лишена смысла» была чрезмерно категоричной: исходное значение можно фиксировать, но нельзя трактовать как специфическое доказательство злокачественности.","Review — serum CA 19-9 as a biomarker for pancreatic cancer","https://pubmed.ncbi.nlm.nih.gov/22693400/"],["У части людей CA 19-9 не определяется даже при распространённой опухоли, потому что:",["A. Ошибка лаборатории","B. Опухоль его не вырабатывает никогда","C. Примерно 5–10 % населения имеют фенотип Льюис-отрицательный и не синтезируют этот антиген","D. Влияние терапии"],"C","CA 19-9 экспрессируется только при наличии соответствующего Lewis-антигена; приблизительно 5–10% населения имеют Lewis-отрицательный фенотип и могут не демонстрировать повышения CA 19-9 даже при распространённом раке поджелудочной железы. Поэтому нормальный CA 19-9 не исключает заболевание и не должен использоваться изолированно для оценки ответа или рецидива.","Review — serum CA 19-9 as a biomarker for pancreatic cancer","https://pubmed.ncbi.nlm.nih.gov/22693400/"],["Что такое эффект высоких доз (hook effect) в иммуноанализе?",["A. Влияние гемолиза","B. Завышение результата при повторных измерениях","C. Ложно низкий результат при очень высокой концентрации аналита из-за насыщения антител","D. Ошибка калибровки"],"C","High-dose hook effect — аналитическая интерференция некоторых двухсайтовых иммуноанализов: при чрезвычайно высокой концентрации аналита нарушается формирование «сэндвич»-комплекса, и результат может стать ложно низким. Если лабораторный результат резко не соответствует клинической картине, полезно связаться с лабораторией и выполнить измерение после разведения или альтернативным методом. Эффект зависит от конкретной тест-системы и не возникает одинаково во всех анализаторах.","Ward et al. — investigation of interferences in immunoassay","https://pubmed.ncbi.nlm.nih.gov/28847718/"],["Что следует учитывать при интерпретации хромогранина A у пациента с нейроэндокринной опухолью?",["A. Ингибиторы протонной помпы могут существенно повышать CgA; при возможности их временно отменяют или заменяют и повторяют анализ","B. Лекарства не влияют на CgA","C. CgA специфичен только для прогрессирования NET","D. Повышение CgA всегда означает необходимость смены терапии"],"A","Ингибиторы протонной помпы — частая причина ложного повышения CgA. В проспективном исследовании после отмены PPI или замены на H2-блокатор уровень CgA существенно снижался. Повышение возможно также при почечной недостаточности и других состояниях, поэтому CgA нельзя использовать как самостоятельный критерий прогрессирования без сопоставления с клиникой и визуализацией.","Korse et al. — PPI discontinuation and chromogranin A in NET","https://pubmed.ncbi.nlm.nih.gov/21989216/"],["Почему при наблюдении дифференцированного рака щитовидной железы вместе с тиреоглобулином определяют антитела к тиреоглобулину?",["A. Они нужны только для диагностики тиреоидита","B. Они не влияют на измерение тиреоглобулина","C. TgAb могут интерферировать с иммунометрическим определением тиреоглобулина и приводить к заниженным значениям; динамика TgAb также может быть клинически информативна","D. Они заменяют визуализацию"],"C","TgAb могут приводить к занижению Tg при иммунометрических методах, поэтому отрицательный/низкий Tg нельзя интерпретировать без знания статуса антител. Тренд TgAb может дополнительно помогать оценке ответа, но не является совершенным суррогатным маркёром и не заменяет визуализацию. Желательно использовать последовательные измерения одной методикой, поскольку разные TgAb-тесты также дают несопоставимые результаты.","Rosario et al. — differentiated thyroid cancer follow-up with Tg antibodies","https://pubmed.ncbi.nlm.nih.gov/33690160/"],["Как оценивают динамику АФП и ХГЧ при герминогенных опухолях?",["A. Только по времени суток","B. Только по абсолютному значению в одном анализе","C. С учётом последовательных измерений и ожидаемого периода полувыведения; недостаточное снижение после лечения может указывать на сохраняющуюся активную опухоль","D. Только по исходному уровню"],"C","Кинетика АФП и ХГЧ имеет важное значение при герминогенных опухолях: после удаления/лечения маркёры должны снижаться в соответствии с их биологическим периодом полувыведения. Однако решение о смене терапии не основывают на одной лабораторной точке: важны повторные измерения, стадия, визуализация и клинический контекст. Прежняя фраза «это единственная нозология» удалена как неоправданно абсолютная.","EAU Guidelines — Testicular Cancer","https://uroweb.org/guidelines/testicular-cancer/chapter/diagnostic-evaluation"],["После радикального лечения КРР отмечается устойчивый рост РЭА при отсутствии находок на плановой КТ. Каков правильный принцип действий?",["A. Подтвердить тенденцию повторным анализом, оценить возможные доброкачественные причины и выполнить клинически обоснованное дополнительное обследование; не начинать системную терапию только по маркёру","B. Немедленно начать химиотерапию","C. Выполнить лапаротомию без дополнительной визуализации","D. Игнорировать тенденцию"],"A","РЭА используется в структурированном наблюдении после радикального лечения КРР у пациентов, которым потенциально доступно лечение рецидива. Устойчивый рост требует подтверждения и поиска причины, но сам по себе не является достаточным основанием для химиотерапии. Рутинная ПЭТ/КТ не входит в стандартное плановое наблюдение; её возможное применение при противоречивой ситуации определяется клиническим контекстом.","ASCO endorsement — colorectal cancer follow-up and surveillance","https://pubmed.ncbi.nlm.nih.gov/24220554/"],["Какова типичная ошибка при использовании сывороточных опухолевых маркёров у человека без установленного онкологического диагноза?",["A. Определение маркёра натощак","B. Повторное исследование в той же лаборатории","C. Назначение широких панелей маркёров как универсального способа «провериться на рак»","D. Сопоставление результата с клинической картиной"],"C","Большинство сывороточных опухолевых маркёров не обладают достаточной чувствительностью и специфичностью для популяционного скрининга. Их применение должно быть привязано к конкретной клинической ситуации, нозологии и задаче — диагностической, прогностической или мониторинговой.","ASCO Guideline — tumor markers in gastrointestinal cancer","https://pmc.ncbi.nlm.nih.gov/articles/PMC2793647/"],["Почему при длительном мониторинге опухолевого маркёра желательно сохранять одну и ту же аналитическую методику?",["A. Только из-за стоимости","B. Только из-за времени выполнения","C. Разные тест-системы могут давать систематически различающиеся абсолютные значения; смена метода способна имитировать изменение уровня маркёра","D. Потому что другие лаборатории не могут измерять тот же маркёр"],"C","Межметодная вариабельность для некоторых опухолевых маркёров остаётся значимой; для CA 19-9 она особенно выражена. Поэтому серийные значения предпочтительно получать одной методикой. Если метод или лаборатория меняются, это следует учитывать при интерпретации и при необходимости получить переходное параллельное измерение.","Sturgeon et al. — standardization of tumor markers","https://pubmed.ncbi.nlm.nih.gov/27542005/"],["Как корректно интерпретировать роль ctDNA в выявлении молекулярной остаточной болезни после радикального лечения солидной опухоли?",["A. ctDNA уже является универсальным стандартом для назначения адъювантной терапии при всех опухолях","B. Отрицательный результат исключает рецидив","C. ctDNA не имеет прогностического значения","D. Выявление ctDNA после радикального лечения обладает высокой прогностической ценностью для риска рецидива, но рутинное изменение терапии по MRD без доказанной клинической пользы не рекомендуется"],"D","ESMO различает клиническую валидность и клиническую полезность. Обнаружение ctDNA после потенциально радикального лечения во многих опухолях предсказывает высокий риск последующего рецидива, однако в 2022 году доказательств улучшения исходов при рутинной смене лечения на основании MRD было недостаточно. Поэтому нельзя представлять ctDNA-MRD как универсальный уже внедрённый алгоритм лечения.","ESMO recommendations — circulating tumour DNA assays in cancer","https://doi.org/10.1016/j.annonc.2022.05.520"]]},{"c":"М-30","t":"Лучевая терапия: физика, радиобиология, показания","s":"Общая онкология","q":[["Зачем лучевую терапию дробят на фракции?",["A. Из-за ограничений аппаратуры","B. Для удобства организации","C. Чтобы снизить стоимость","D. Нормальные ткани восстанавливаются между фракциями эффективнее опухолевых; кроме того, реализуются редистрибуция клеток по фазам цикла и реоксигенация"],"D","Четыре классических «R» радиобиологии: репарация сублетальных повреждений, редистрибуция клеток в более радиочувствительные фазы цикла, репопуляция и реоксигенация гипоксических зон. Первое и последнее дают терапевтический выигрыш, репопуляция опухоли — работает против нас, поэтому затягивать курс нельзя.","Review — radiobiology, fractionation and α/β ratio","https://pubmed.ncbi.nlm.nih.gov/36872128/"],["Что означает низкое соотношение α/β для ткани?",["A. Отсутствие реакции на облучение","B. Быструю пролиферацию","C. Высокую чувствительность к величине разовой дозы; такие ткани и опухоли выигрывают от гипофракционирования либо, наоборот, страдают от крупных фракций","D. Высокую чувствительность к суммарной дозе"],"C","Поздно реагирующие нормальные ткани — спинной мозг, лёгкие, почки — имеют низкое α/β и потому особенно уязвимы при крупных фракциях. Среди опухолей низкое α/β характерно для рака предстательной железы и молочной железы, что радиобиологически обосновывает гипофракционирование именно при них.","Review — radiobiology, fractionation and α/β ratio","https://pubmed.ncbi.nlm.nih.gov/36872128/"],["Для чего используют EQD2 в лучевой терапии?",["A. Для ориентировочного биологического сопоставления различных режимов фракционирования и оценки кумулятивной дозы, особенно при повторном облучении","B. Только для расчёта стоимости лечения","C. Для выбора производителя линейного ускорителя","D. Для измерения объёма опухоли"],"A","EQD2 рассчитывается на основе линейно-квадратичной модели и переводит режим в эквивалентную дозу при фракционировании по 2 Гр для выбранного α/β. Это полезно при сравнении схем и реоблучении, но расчёт остаётся модельным приближением: результат зависит от выбранного α/β, размера фракции, времени между курсами и восстановления тканей. Поэтому EQD2 нельзя применять как абсолютно точную арифметическую сумму биологического риска.","Jones et al. — use of the linear-quadratic model in radiotherapy","https://pubmed.ncbi.nlm.nih.gov/11764395/"],["Больному с неоперабельным периферическим раком лёгкого I стадии показана:",["A. Химиотерапия","B. Классическое облучение за 30 фракций","C. Только наблюдение","D. Стереотаксическая лучевая терапия"],"D","Стереотаксическая лучевая терапия обеспечивает локальный контроль свыше 90 % при малом числе фракций и хорошей переносимости, что делает её стандартом для неоперабельных больных с ранним раком лёгкого. Для центральных опухолей вблизи крупных бронхов и сосудов применяются адаптированные режимы из-за риска тяжёлых осложнений.","ASTRO Guideline — SBRT for early-stage NSCLC","https://www.astro.org/provider-resources/guidelines/astro-s-guideline-on-sbrt-for-early-stage-nsclc"],["Какой режим лучевой терапии является доказанным стандартным вариантом при неосложнённом болезненном метастазе в кость?",["A. Только 30 Гр за 10 фракций","B. 8 Гр однократно — один из стандартных эквивалентных по обезболиванию вариантов","C. Лучевая терапия не показана","D. Только 50 Гр за 25 фракций"],"B","Однократные 8 Гр обеспечивают обезболивание, сопоставимое с многофракционными режимами, при меньшем числе визитов. После одной фракции повторное облучение требуется чаще. Выбор фракционирования зависит от прогноза, локализации, риска перелома, предшествующей фиксации и наличия неврологических осложнений; поэтому слово «оптимальный» для всех пациентов заменено на «стандартный вариант».","RTOG 97-14 — 8 Gy single fraction vs multifraction radiotherapy","https://pubmed.ncbi.nlm.nih.gov/23165743/"],["Больной с метастатическим поражением позвоночника жалуется на нарастающую слабость в ногах и задержку мочи. Первоочередные действия:",["A. Начало химиотерапии","B. Плановая консультация невролога","C. Немедленно глюкокортикоиды в высокой дозе и экстренная МРТ всего позвоночника, затем решение о декомпрессии или облучении","D. Обезболивание и наблюдение"],"C","Подозрение на метастатическую компрессию спинного мозга требует срочной оценки и МРТ позвоночника; при неврологическом дефиците обычно начинают дексаметазон. Тактика затем определяется механической нестабильностью, радиочувствительностью, распространённостью болезни и общим состоянием. В рандомизированном исследовании Patchell у отобранных пациентов прямая декомпрессивная операция с последующей лучевой терапией лучше сохраняла способность ходить, чем одна лучевая терапия. Это не означает, что операция предпочтительна каждому пациенту.","Patchell et al. — decompressive surgery for metastatic spinal cord compression","https://pubmed.ncbi.nlm.nih.gov/16112300/"],["Какое утверждение о ранних и поздних лучевых повреждениях наиболее корректно?",["A. Между ними нет биологических различий","B. Они различаются только календарным сроком возникновения","C. Поздние реакции всегда протекают легче ранних","D. Ранние реакции чаще связаны с быстро обновляющимися тканями и нередко регрессируют после лечения; поздние эффекты возникают позже и могут быть стойкими или необратимыми, поэтому дозо-объёмные ограничения критичны"],"D","QUANTEC подчёркивает зависимость риска поздних повреждений от дозы и объёма облучённой нормальной ткани. Ранние реакции действительно чаще обратимы, но не абсолютно всегда; поздние эффекты часто стойкие, однако их выраженность зависит от органа, дозы, фракционирования и сопутствующей терапии. Поэтому прежняя формула «острые обратимы, поздние необратимы» была чрезмерно категоричной.","QUANTEC — introduction to normal-tissue dose-volume effects","https://pmc.ncbi.nlm.nih.gov/articles/PMC3431964/"],["Одновременное назначение цисплатина с лучевой терапией при химиолучевом лечении объясняется тем, что:",["A. Он является радиосенсибилизатором: нарушает репарацию лучевых повреждений и синхронизирует клетки, усиливая эффект облучения","B. Цисплатин уменьшает опухоль до облучения","C. Он заменяет часть дозы облучения","D. Он снижает лучевую токсичность"],"A","При одновременном применении химиопрепарат усиливает лучевое повреждение опухоли. Плата — усиление острых реакций, прежде всего мукозита и эзофагита, поэтому такое лечение требует активной сопроводительной терапии и нередко нутритивной поддержки. Последовательное назначение переносится легче, но менее эффективно.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Что такое феномен лучевой памяти (radiation recall)?",["A. Ошибка укладки","B. Воспалительная реакция в ранее облучённой зоне, возникающая при последующем введении лекарственного препарата","C. Поздний фиброз","D. Рецидив опухоли в зоне облучения"],"B","Реакция развивается в зоне, облучённой недели или месяцы назад, при назначении определённых препаратов — классически антрациклинов и таксанов, описана и при таргетных средствах и ингибиторах контрольных точек. Проявляется дерматитом, пневм
