нту с ГЦР и циррозом?",["A. Только АФП","B. Только биопсию печени","C. Никакой дополнительной оценки риска кровотечения не требуется","D. Риск портальной гипертензии и варикозного кровотечения; у пациентов с циррозом обычно выполняют недавнюю ЭГДС и лечат варикозные вены высокого риска"],"D","В IMbrave150 перед включением требовалась оценка варикозных вен, а нелеченные/неполностью леченные варикозы высокого риска исключались. Поэтому перед режимом с бевацизумабом у пациента с циррозом необходимо целенаправленно оценить риск кровотечения и обеспечить профилактику по гепатологическим рекомендациям. Это клинический принцип, а не утверждение, что одна и та же ЭГДС нужна буквально каждому пациенту независимо от уже выполненного обследования и давности результатов.","ESMO Clinical Practice Guideline — Hepatocellular carcinoma 2025","https://pubmed.ncbi.nlm.nih.gov/39986353/"]]},{"c":"М-42","t":"Рак яичников, фаллопиевых труб и первичный рак брюшины","s":"Частная онкология, ч. 2","q":[["Как следует организовать BRCA-тестирование при впервые выявленном эпителиальном раке яичников?",["A. Только у пациенток моложе 50 лет","B. Предлагать герминальное тестирование независимо от семейного анамнеза; если патогенного герминального BRCA1/2-варианта нет, опухолевое BRCA-тестирование может дополнительно выявить терапевтически значимый вариант","C. Только при отягощённом семейном анамнезе","D. BRCA-тестирование не влияет на лечение"],"B","При эпителиальном раке яичников герминальное тестирование BRCA1/2 и других генов предрасположенности рекомендуется независимо от возраста и семейного анамнеза. Если патогенный герминальный вариант BRCA1/2 не выявлен, опухолевое тестирование может обнаружить соматическую BRCA-мутацию и повлиять на выбор PARP-ингибитора. Поэтому прежнее впечатление, что всем пациенткам обязательно одновременно выполняют два независимых теста, было упрощённым.","ASCO Guideline — Germline and Somatic Tumor Testing in Epithelial Ovarian Cancer","https://pubmed.ncbi.nlm.nih.gov/31986064/"],["Чем статус дефицита гомологичной рекомбинации отличается от мутации BRCA?",["A. Это синонимы","B. HRD не влияет на терапию","C. Дефицит гомологичной рекомбинации — более широкое понятие, включающее опухоли без мутации BRCA, но с признаками геномной нестабильности; он расширяет группу, отвечающую на PARP-ингибиторы","D. HRD определяется только в крови"],"C","BRCA1/2-мутация — один из механизмов нарушения гомологичной рекомбинации, тогда как HRD — более широкое биологическое состояние, которое может выявляться и без мутации BRCA. В исследованиях первой линии, включая PAOLA-1, HRD использовался для стратификации ожидаемой пользы от PARP-ингибиторов. Однако конкретная прогностическая и предиктивная интерпретация зависит от теста, линии лечения и выбранного препарата.","PAOLA-1 translational analysis — HRD and olaparib + bevacizumab","https://pubmed.ncbi.nlm.nih.gov/36716415/"],["Что показало исследование LION?",["A. Лимфаденэктомия улучшает выживаемость","B. При клинически негативных лимфоузлах и полной циторедукции систематическая лимфаденэктомия не улучшает выживаемость и увеличивает частоту осложнений","C. Операция не нужна","D. Лимфаденэктомия обязательна"],"B","Результат изменил объём стандартной операции: при отсутствии клинически подозрительных узлов расширенная лимфаденэктомия не выполняется. Это классический пример деэскалации хирургического вмешательства без потери онкологической эффективности, но со снижением частоты лимфокист, лимфедемы и кровопотери.","LION — systematic lymphadenectomy in advanced ovarian cancer","https://pubmed.ncbi.nlm.nih.gov/30811909/"],["Основной прогностический фактор, который может изменить сам хирург при раке яичников:",["A. Гистологический тип","B. Стадия","C. Полнота циторедукции: отсутствие макроскопической остаточной опухоли даёт наилучшие результаты","D. Возраст"],"C","Наличие даже небольшой остаточной опухоли существенно ухудшает прогноз, поэтому операция выполняется в центре с достаточным опытом и возможностью мультивисцеральных резекций. Если полная циторедукция недостижима, предпочтительна неоадъювантная химиотерапия с интервальной операцией.","ESGO Guidelines","https://guidelines.esgo.org/"],["Что определяет решение о вторичной циторедукции при платиночувствительном рецидиве?",["A. Желание больной","B. Размер рецидива","C. Уровень CA 125","D. Соответствие критериям отбора: хороший функциональный статус, полная циторедукция при первой операции, отсутствие асцита — при их выполнении операция улучшает исходы"],"D","DESKTOP III показало пользу вторичной циторедукции у больных, отобранных по критериям AGO. Ключевое условие — реальная достижимость полной циторедукции: при неполном удалении результат хуже, чем при отказе от операции. Поэтому решение принимается только в специализированном центре.","DESKTOP III — secondary cytoreduction in recurrent ovarian cancer","https://pubmed.ncbi.nlm.nih.gov/34874631/"],["Поддерживающая терапия PARP-ингибитором после первой линии при мутации BRCA:",["A. Показана только при II стадии","B. Показана только при рецидиве","C. Показана: SOLO-1 продемонстрировал беспрецедентное удлинение беспрогрессивной выживаемости с сохранением эффекта при длительном наблюдении","D. Не показана"],"C","Значительная доля больных с мутацией BRCA остаётся без прогрессирования многие годы после завершения двухлетнего курса олапариба, что позволяет обсуждать с ними перспективу длительной ремиссии. Требуется контроль гематологической токсичности и настороженность в отношении миелодиспластического синдрома как редкого отдалённого осложнения.","SOLO1","https://pubmed.ncbi.nlm.nih.gov/30345884/"],["При платинорезистентном рецидиве рака яичников с высокой экспрессией рецептора фолата альфа обоснован:",["A. Мирветуксимаб соравтансин","B. Гормонотерапия","C. Повторный платиносодержащий режим","D. Только симптоматическая терапия"],"A","MIRASOL показало превосходство мирветуксимаба соравтансина над химиотерапией по выбору врача в этой популяции. Требуется определение экспрессии рецептора фолата альфа. Характерная токсичность — офтальмологические осложнения, включая кератопатию, что обязывает к профилактическим глазным каплям и осмотрам офтальмолога.","MIRASOL — mirvetuximab soravtansine in FRα-positive ovarian cancer","https://www.nejm.org/doi/full/10.1056/NEJMoa2309169"],["Понятие платинорезистентности при раке яичников:",["A. Прогрессирование на фоне терапии","B. Любой рецидив","C. Повышение CA 125","D. Рецидив в течение примерно 6 месяцев после завершения платиносодержащей терапии; определяет выбор последующего лечения"],"D","Интервал без платины — исторически главный фактор выбора терапии рецидива. При платиночувствительном рецидиве повторно назначается платиносодержащий режим и обсуждается вторичная циторедукция; при платинорезистентном — режимы без платины и конъюгаты антитело–препарат. В последние годы жёсткость этого деления смягчается за счёт новых опций.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Изолированный рост CA 125 при отсутствии симптомов и изменений на КТ у больной в ремиссии:",["A. Требует операции","B. Не является основанием для начала терапии: раннее начало по биохимическому рецидиву не улучшает общую выживаемость и ухудшает качество жизни","C. Игнорируется полностью","D. Требует немедленного начала химиотерапии"],"B","Это один из самых практически важных выводов в онкогинекологии: лечение по одному лишь маркёру не продлевает жизнь, но раньше начинает токсичность. Наблюдение продолжается с сокращением интервала визуализации; терапия начинается при появлении симптомов или подтверждённого рецидива по данным визуализации.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Первичная профилактика рака яичников у носительниц герминальной мутации BRCA:",["A. Не разработана","B. Приём препаратов","C. Скрининг с CA 125 и УЗИ","D. Риск-снижающая сальпингоовариэктомия по достижении рекомендованного возраста после реализации репродуктивных планов"],"D","Скрининг маркёром и ультразвуковым исследованием у носительниц не показал снижения смертности и не рекомендуется как основная стратегия. Риск-снижающая операция резко снижает риск рака яичников и обсуждается заранее с учётом репродуктивных планов и последствий хирургической менопаузы. Комбинированные оральные контрацептивы также снижают риск.","ESGO Guidelines","https://guidelines.esgo.org/"]]},{"c":"М-43","t":"Рак эндометрия","s":"Частная онкология, ч. 2","q":[["Четыре молекулярных подтипа рака эндометрия:",["A. Эндометриоидный, серозный, светлоклеточный, карциносаркома","B. Гормонозависимый и гормононезависимый","C. I и II патогенетические типы","D. POLE-ультрамутированный, с дефицитом системы репарации, p53-аномальный, без специфического молекулярного профиля"],"D","Классификация основана на данных проекта TCGA и оказалась прогностически сильнее гистологической. POLE-ультрамутированные опухоли имеют превосходный прогноз даже при высокой степени злокачественности, p53-аномальные — неблагоприятный даже при формально ранней стадии.","TCGA — integrated genomic characterization of endometrial carcinoma","https://pubmed.ncbi.nlm.nih.gov/23636398/"],["Больная с эндометриоидной карциномой высокой степени злокачественности, глубокой инвазией миометрия и мутацией POLE в экзонуклеазном домене. Что это меняет?",["A. Меняется объём операции","B. Требуется эскалация лечения","C. Ничего","D. Прогноз превосходный; по FIGO 2023 стадия снижается, а адъювантная терапия может быть деэскалирована"],"D","Ультрамутированный фенотип порождает множество неоантигенов и выраженный иммунный ответ, что объясняет отличный прогноз. Молекулярный анализ PORTEC-3 показал отсутствие выигрыша от адъювантной химиотерапии в этой подгруппе. Практическое следствие — возможность избежать избыточного лечения у больной, которая по клинико-морфологическим критериям получила бы полную программу.","PORTEC-3 molecular classification","https://pubmed.ncbi.nlm.nih.gov/32749941/"],["Каков современный принцип первой линии при первично распространённом или рецидивирующем раке эндометрия, особенно при dMMR?",["A. Только гормонотерапия всем пациенткам","B. Только лучевая терапия","C. Карбоплатин + паклитаксел с ингибитором контрольных точек и последующей поддерживающей иммунотерапией у подходящих пациенток","D. Только доксорубицин"],"C","Рандомизированные исследования показали выраженную пользу добавления ингибиторов контрольных точек к карбоплатину/паклитакселу, особенно в dMMR-популяции, и этот подход вошёл в современные рекомендации. Конкретный препарат и применение в pMMR зависят от регистрации, предыдущего лечения и клинического контекста.","SEOM-GEICO Clinical Guidelines — Endometrial Cancer 2025","https://pubmed.ncbi.nlm.nih.gov/40986254/"],["p53-аномальный подтип рака эндометрия означает:",["A. Благоприятный прогноз","B. Неблагоприятный прогноз даже при формально ранней стадии; обосновывает эскалацию адъювантного лечения","C. Чувствительность к эндокринотерапии","D. Отсутствие показаний к лечению"],"B","Аномальная экспрессия p53 по данным иммуногистохимии соответствует серозоподобному молекулярному профилю с высокой копийной изменчивостью. По данным молекулярного анализа PORTEC-3 именно в этой подгруппе сосредоточен выигрыш от адъювантной химиолучевой терапии. При HER2-положительных серозных опухолях дополнительно обсуждается анти-HER2-терапия.","PORTEC-3 molecular classification","https://pubmed.ncbi.nlm.nih.gov/32749941/"],["Всем больным раком эндометрия показано определение статуса системы репарации, потому что:",["A. Не показано","B. Требуется для стадирования только","C. Определяет выбор терапии при распространённой болезни и может указывать на синдром Линча","D. Это влияет только на прогноз"],"C","Рак эндометрия нередко бывает первой опухолью при синдроме Линча, опережая колоректальный рак. Поэтому иммуногистохимия четырёх белков системы репарации выполняется всем; при утрате MLH1/PMS2 исследуется метилирование промотора, при утрате MSH2/MSH6 показано генетическое консультирование сразу.","ESGO Guidelines","https://guidelines.esgo.org/"],["Молодой женщине с атипической гиперплазией эндометрия или высокодифференцированной карциномой, ограниченной эндометрием, желающей сохранить фертильность:",["A. Возможна консервативная терапия прогестинами с последующим тщательным наблюдением в специализированном центре","B. Показана химиотерапия","C. Показана лучевая терапия","D. Показана только гистерэктомия"],"A","Консервативное лечение возможно при строгих условиях: высокая дифференцировка, отсутствие инвазии миометрия по МРТ, отсутствие внематочного распространения, готовность к частым контрольным биопсиям. Пациентка предупреждается о риске прогрессирования и о необходимости гистерэктомии после реализации репродуктивных планов.","ESGO Guidelines","https://guidelines.esgo.org/"],["Основной фактор риска рака эндометрия:",["A. Инфекция ВПЧ","B. Курение","C. Алкоголь","D. Длительное воздействие эстрогенов без противодействия прогестерона: ожирение, синдром поликистозных яичников, монотерапия эстрогенами, тамоксифен"],"D","Ожирение — ведущий модифицируемый фактор: жировая ткань служит источником периферической конверсии андрогенов в эстрогены. Рост заболеваемости следует за ростом распространённости ожирения. Тамоксифен повышает риск, что учитывается при наблюдении больных раком молочной железы, однако рутинный скрининг эндометрия у них не проводится.","PDQ® — рак эндометрия","https://www.cancer.gov/publications/pdq"],["Роль биопсии сторожевого лимфоузла при раке эндометрия:",["A. Требует полной лимфаденэктомии в дополнение","B. Не применяется","C. Применяется только при III стадии","D. Заменяет систематическую лимфаденэктомию у большинства больных, обеспечивая стадирование при меньшей частоте лимфедемы"],"D","Картирование сторожевого лимфоузла с ультрастадированием стало стандартом хирургического стадирования: оно обеспечивает информацию о статусе лимфоузлов при существенно меньшей травматичности. Систематическая лимфаденэктомия резервируется для отдельных ситуаций.","ESGO Guidelines","https://guidelines.esgo.org/"],["При рецидивирующем раке эндометрия без дефицита системы репарации после прогрессирования на платине:",["A. Обсуждаются комбинация пембролизумаба с ленватинибом, эндокринотерапия при гормонозависимых опухолях, а также подходы, изучаемые в DUO-E","B. Опций нет","C. Повторная операция","D. Только симптоматическая терапия"],"A","При сохранной системе репарации иммунотерапия в монорежиме малоэффективна, но комбинация с ленватинибом показала активность. При эндометриоидных гормонозависимых опухолях с низкой опухолевой нагрузкой обоснована эндокринотерапия, нередко с длительным контролем при хорошей переносимости. DUO-E показала выигрыш и в подгруппе с сохранной системой репарации.","DUO-E — durvalumab ± olaparib in advanced endometrial cancer","https://pubmed.ncbi.nlm.nih.gov/37864337/"],["Что необходимо включить в наблюдение излеченной больной раком эндометрия помимо онкологического контроля?",["A. Ничего дополнительно","B. Систематическую оценку сердечно-сосудистого риска, поскольку сердечно-сосудистая патология — ведущая причина смерти этих больных, не связанная с опухолью","C. Только гинекологический осмотр","D. Только контроль массы тела"],"B","Больные раком эндометрия часто имеют ожирение, сахарный диабет и артериальную гипертензию, и умирают чаще от сердечно-сосудистых причин, чем от рецидива. Оценка и коррекция факторов риска должны быть частью наблюдения, а не дополнением. У молодых пациенток по возможности сохраняются яичники: ранняя хирургическая менопауза усугубляет и без того повышенный риск.","ESGO Guidelines","https://guidelines.esgo.org/"]]},{"c":"М-44","t":"Рак шейки матки","s":"Частная онкология, ч. 2","q":[["Какова основа первичной профилактики рака шейки матки?",["A. Вакцинация против ВПЧ, предпочтительно до инфицирования/начала половой жизни","B. Только ежегодная цитология","C. Профилактическая гистерэктомия","D. Приём антибиотиков"],"A","Персистирующая инфекция онкогенными типами ВПЧ является необходимым причинным фактором подавляющего большинства случаев рака шейки матки. Популяционные исследования демонстрируют выраженное снижение инвазивного рака в вакцинированных когортах, особенно при вакцинации в молодом возрасте. Вакцинация дополняет, но не отменяет организованный скрининг. Прежняя фраза об «единственной распространённой опухоли, устранимой как проблема общественного здравоохранения» удалена как избыточно категоричная.","HPV vaccination and invasive cervical cancer — population study","https://pubmed.ncbi.nlm.nih.gov/32997908/"],["Что показало исследование SHAPE?",["A. Радикальная гистерэктомия обязательна всем","B. Операция не нужна","C. У тщательно отобранных больных низкого риска простая гистерэктомия не уступает радикальной при меньшей частоте урологических и сексуальных нарушений","D. Лучевая терапия предпочтительнее"],"C","Радикальная гистерэктомия сопровождается нарушениями мочеиспускания, сексуальной функции и лимфедемой. SHAPE показало, что при малых опухолях с ограниченной инвазией и отсутствием поражения лимфоузлов эти риски можно избежать без потери онкологической эффективности. Ключевое условие — строгий отбор.","SHAPE — simple versus radical hysterectomy","https://pubmed.ncbi.nlm.nih.gov/38416430/"],["При раннем раке шейки матки, требующем радикальной гистерэктомии, предпочтительный доступ:",["A. Роботический","B. Открытый","C. Лапароскопический","D. Влагалищный"],"B","Исследование LACC неожиданно показало худшую безрецидивную и общую выживаемость при малоинвазивном доступе. Вероятные объяснения — использование маточного манипулятора и вскрытие влагалища в брюшной полости. Открытый доступ остаётся стандартом; это важный урок о непереносимости выводов между нозологиями.","ESGO Guidelines","https://guidelines.esgo.org/"],["Каков основной принцип радикального лечения местнораспространённого рака шейки матки?",["A. Только хирургическое лечение","B. Только наружная лучевая терапия без брахитерапии","C. Одновременная химиолучевая терапия с цисплатином и обязательным брахитерапевтическим компонентом; у подходящих пациенток высокого риска обсуждается добавление пембролизумаба","D. Только иммунотерапия"],"C","Одновременная химиолучевая терапия с цисплатином и брахитерапией остаётся основой радикального лечения местнораспространённого рака шейки матки. KEYNOTE-A18 показало улучшение исходов при добавлении пембролизумаба к химиолучевой терапии у популяции высокого риска; наибольшая регуляторно подтверждённая роль относится к FIGO 2014 III–IVA. Это не означает автоматического добавления иммунотерапии каждой пациентке с любой местнораспространённой стадией.","KEYNOTE-A18 — pembrolizumab + chemoradiotherapy","https://pubmed.ncbi.nlm.nih.gov/38521086/"],["Почему брахитерапия при раке шейки матки незаменима?",["A. Позволяет подвести к опухоли дозу, недостижимую дистанционными методами без повреждения соседних органов; её отсутствие резко ухудшает выживаемость","B. Она дешевле","C. Она заменяет химиотерапию","D. Она короче по времени"],"A","Крутое падение дозы от источника позволяет достичь высокой дозы в опухоли при щажении мочевого пузыря и прямой кишки. Данные реальной практики показывают, что значительная часть больных брахитерапию не получает, и это напрямую ухудшает результаты. Организационное обеспечение доступа к брахитерапии — вопрос выживаемости, а не удобства.","SEER study — brachytherapy utilization and survival in cervical cancer","https://pubmed.ncbi.nlm.nih.gov/37951548/"],["Каков принцип первой линии при рецидивирующем или метастатическом раке шейки матки, не подлежащем радикальному локальному лечению?",["A. Только лучевая терапия","B. Только цисплатин","C. Иммунотерапия противопоказана независимо от PD-L1","D. Платиносодержащая химиотерапия + паклитаксел; при PD-L1 CPS ≥1 добавляют пембролизумаб, а бевацизумаб используют при отсутствии противопоказаний и с учётом риска свищей/кровотечения"],"D","KEYNOTE-826 установило добавление пембролизумаба к платине/паклитакселу с бевацизумабом или без него у PD-L1-положительных опухолей как стандартный подход первой линии. Бевацизумаб не обязателен каждой пациентке и может быть нежелателен при высоком риске свищей или кровотечения, особенно после облучения таза.","KEYNOTE-826","https://pubmed.ncbi.nlm.nih.gov/34534429/"],["Тизотумаб ведотин направлен против:",["A. HER2","B. PD-L1","C. VEGF","D. Тканевого фактора"],"D","Тканевый фактор избыточно экспрессирован при раке шейки матки. innovaTV 301 показало превосходство над химиотерапией во второй линии. Характерные нежелательные явления — офтальмологические, требующие профилактических мер и осмотров, а также кровотечения и периферическая нейропатия.","innovaTV 301 — tisotumab vedotin versus chemotherapy","https://www.nejm.org/doi/full/10.1056/NEJMoa2313811"],["Скрининг рака шейки матки в современной организации:",["A. ВПЧ-тестирование как основной метод с удлинённым интервалом, с цитологией как методом сортировки","B. Кольпоскопия всем","C. Осмотр гинеколога","D. Цитология ежегодно всем"],"A","ВПЧ-тестирование превосходит цитологию по чувствительности к предраковым изменениям и позволяет удлинить интервал скрининга. Цитология используется для сортировки ВПЧ-положительных женщин. В РФ в рамках диспансеризации применяется цитологическое исследование мазка с шейки матки раз в три года с 18 до 64 лет.","ESGO Guidelines","https://guidelines.esgo.org/"],["Молодая женщина с раком шейки матки IB1, желающая сохранить фертильность:",["A. Показана только лучевая терапия","B. Возможна трахелэктомия с лимфодиссекцией у тщательно отобранных больных в специализированном центре","C. Возможности нет","D. Показана простая гистерэктомия"],"B","Радикальная трахелэктомия сохраняет тело матки и возможность беременности при сопоставимых онкологических результатах у отобранных больных: малый размер опухоли, отсутствие поражения лимфоузлов, благоприятная гистология. Беременность после трахелэктомии сопряжена с повышенным риском преждевременных родов и ведётся акушером высокого риска.","ESGO Guidelines","https://guidelines.esgo.org/"],["Наиболее значимое отдалённое последствие химиолучевой терапии на область таза, требующее обсуждения заранее:",["A. Нейропатия","B. Кардиотоксичность","C. Ранняя менопауза, сексуальная дисфункция вследствие стеноза влагалища, лучевой проктит и цистит, лимфедема","D. Алопеция"],"C","У молодых больных облучение яичников вызывает необратимую менопаузу, поэтому до начала лечения обсуждаются транспозиция яичников и сохранение репродуктивного материала. Стеноз влагалища профилактируется дилататорами и требует прямого разговора, которого врачи часто избегают. Лучевые проктит и цистит могут проявляться спустя годы.","ESGO Guidelines","https://guidelines.esgo.org/"]]},{"c":"М-45","t":"Рак вульвы и влагалища; трофобластическая болезнь","s":"Частная онкология, ч. 2","q":[["Два патогенетических пути рака вульвы:",["A. ВПЧ-ассоциированный, чаще у молодых, с лучшим прогнозом; и ВПЧ-независимый, на фоне склерозирующего лишая, чаще у пожилых, с худшим прогнозом","B. Различий нет","C. Гормональный и негормональный","D. Наследственный и спорадический"],"A","Разграничение проводится по экспрессии p16 и p53 и имеет прогностическое значение. ВПЧ-независимый путь, связанный со склерозирующим лишаем и мутациями TP53, отличается более агрессивным течением и высоким риском местного рецидива, что определяет более интенсивное наблюдение.","Классификация ВОЗ","https://whobluebooks.iarc.fr/"],["Главный прогностический фактор при раке вульвы:",["A. Возраст","B. Глубина инвазии","C. Размер опухоли","D. Состояние паховых лимфоузлов"],"D","Поражение паховых лимфоузлов резко ухудшает прогноз, поэтому их оценка обязательна при глубине инвазии более 1 мм. При поражении показана послеоперационная лучевая терапия, нередко с одновременной химиотерапией.","ESGO Guidelines","https://guidelines.esgo.org/"],["Биопсия сторожевого лимфоузла при раке вульвы применима:",["A. Только при метастазах","B. При одиночной опухоли менее 4 см и клинически негативных паховых узлах, в центрах с достаточным опытом","C. Всем больным","D. Не применяется"],"B","Стратегия сторожевого лимфоузла доказана у тщательно отобранных пациенток с ранним плоскоклеточным раком вульвы: обычно при одиночной опухоли <4 см, клинически негативных паховых узлах и при выполнении процедуры в опытном центре. GROINSS-V показало низкую частоту изолированного пахового рецидива у пациенток с отрицательным сторожевым узлом и позволило избежать морбидной пахово-бедренной лимфодиссекции у большинства таких больных.","GROINSS-V I — long-term follow-up of sentinel-node strategy","https://pubmed.ncbi.nlm.nih.gov/26428940/"],["Склерозирующий лишай вульвы:",["A. Лечится хирургически всегда","B. Предрасполагающее состояние для ВПЧ-независимого рака вульвы; требует лечения и наблюдения","C. Не связан с раком","D. Является злокачественным"],"B","Длительно существующий склерозирующий лишай сопряжён с повышенным риском развития плоскоклеточного рака вульвы. Лечение топическими глюкокортикоидами уменьшает симптомы и, по имеющимся данным, снижает риск. Наблюдение важно, поскольку рак развивается на изменённом фоне и легко просматривается.","ESGO Guidelines","https://guidelines.esgo.org/"],["Наиболее частая ошибка при ведении больных с симптомами со стороны вульвы:",["A. Избыточное наблюдение","B. Слишком ранняя операция","C. Длительное лечение «воспаления» или зуда без биопсии подозрительного участка, что откладывает диагноз на месяцы и годы","D. Избыточная биопсия"],"C","Хронический зуд и изменения кожи вульвы часто ведутся как воспалительная патология без морфологической верификации. Правило простое: любое стойкое изменение кожи вульвы, не отвечающее на лечение в течение нескольких недель, требует биопсии. Задержка диагноза при раке вульвы измеряется месяцами и напрямую влияет на объём операции.","ESGO Guidelines","https://guidelines.esgo.org/"],["Диагноз трофобластической неоплазии устанавливается прежде всего на основании:",["A. Данных МРТ","B. Динамики ХГЧ: плато или рост уровня после эвакуации пузырного заноса; биопсия обычно не требуется и опасна","C. Морфологического исследования","D. Клинической картины"],"B","Критерии основаны на динамике ХГЧ. Биопсия сопряжена с риском профузного кровотечения из-за выраженной васкуляризации опухоли и, как правило, не выполняется. Это редкая ситуация в онкологии, когда лечение начинается без морфологической верификации.","EOTTD–ESGO–GCIG–ISSTD Practical Guidelines for Gestational Trophoblastic Disease, 2025","https://pubmed.ncbi.nlm.nih.gov/40359461/"],["Шкала FIGO/ВОЗ при трофобластической неоплазии определяет:",["A. Прогноз выживаемости только","B. Стадию","C. Объём операции","D. Разделение на низкий и высокий риск, от которого зависит выбор монотерапии или полихимиотерапии"],"D","Шкала учитывает возраст, тип предшествующей беременности, интервал от неё, уровень ХГЧ, размер и локализацию метастазов, их число и предшествующую химиотерапию. При низком риске применяется монотерапия метотрексатом или дактиномицином, при высоком — полихимиотерапия. Неверная стратификация ведёт к недостаточному лечению.","EOTTD–ESGO–GCIG–ISSTD Practical Guidelines for Gestational Trophoblastic Disease, 2025","https://pubmed.ncbi.nlm.nih.gov/40359461/"],["Результаты лечения трофобластической неоплазии:",["A. Излечение достигается у подавляющего большинства больных, включая метастатические формы; при низком риске — практически у всех","B. Излечение возможно только при I стадии","C. Лечение симптоматическое","D. Неблагоприятные"],"A","Это одно из самых излечимых злокачественных заболеваний благодаря высокой чувствительности к химиотерапии и наличию точного маркёра для мониторинга. Даже при метастазах в лёгкие и головной мозг излечение достижимо. Отсюда принципиальная важность правильной диагностики: пропустить излечимое заболевание особенно обидно.","ESGO Guidelines","https://guidelines.esgo.org/"],["Почему после лечения гестационной трофобластической неоплазии рекомендуют надёжную контрацепцию в течение периода контроля ХГЧ?",["A. Беременность после лечения навсегда противопоказана","B. Контрацепция нужна только из-за тератогенности предшествующей терапии","C. Контрацепция не имеет значения","D. Новая беременность повышает ХГЧ и затрудняет интерпретацию маркёра при наблюдении; длительность контрацепции соответствует выбранному протоколу последующего контроля"],"D","ХГЧ является основным маркёром для выявления персистенции или рецидива трофобластической болезни. Новая беременность также физиологически повышает ХГЧ, поэтому в период предусмотренного протоколом мониторинга рекомендуется надёжная контрацепция. Длительность наблюдения зависит от типа заболевания и рекомендаций; после завершения контроля последующая беременность в большинстве случаев допустима.","EOTTD–ESGO–GCIG–ISSTD Practical Guidelines for Gestational Trophoblastic Disease, 2025","https://pubmed.ncbi.nlm.nih.gov/40359461/"],["Рак влагалища в большинстве случаев:",["A. Не требует лечения","B. Оказывается метастатическим или распространением из соседних органов; первичный рак влагалища редок и требует исключения других локализаций","C. Является первичным","D. Всегда аденокарцинома"],"B","Прежде чем ставить диагноз первичного рака влагалища, необходимо исключить распространение с шейки матки, вульвы, а также метастазы, в том числе рака эндометрия и колоректального рака. Первичный рак влагалища ассоциирован с ВПЧ и лечится преимущественно химиолучевой терапией с брахитерапией.","ESGO Guidelines","https://guidelines.esgo.org/"]]},{"c":"М-46","t":"Базальноклеточный и плоскоклеточный рак кожи","s":"Частная онкология, ч. 1","q":[["Основной фактор риска немеланомных опухолей кожи:",["A. Кумулятивное воздействие ультрафиолетового излучения; дополнительно — иммуносупрессия, светлый фототип, ионизирующее излучение","B. Наследственность в большинстве случаев","C. Питание","D. Курение"],"A","Плоскоклеточный рак связан преимущественно с кумулятивной дозой ультрафиолета и потому локализуется на открытых участках у пожилых. Отдельная группа высокого риска — реципиенты трансплантатов и другие больные на иммуносупрессии, у которых риск плоскоклеточного рака возрастает многократно, а течение агрессивнее.","PDQ® — опухоли кожи","https://www.cancer.gov/publications/pdq"],["Ключевое клиническое различие базальноклеточного и плоскоклеточного рака кожи:",["A. Оба не метастазируют","B. Различий нет","C. Базальноклеточный метастазирует чаще","D. Базальноклеточный рак практически не метастазирует, но склонен к местнодеструирующему росту; плоскоклеточный способен метастазировать в регионарные лимфоузлы"],"D","Отсюда разная тактика: при базальноклеточном раке задача — радикальное местное лечение, оценка регионарных узлов обычно не требуется. При плоскоклеточном раке необходима оценка регионарных лимфоузлов, особенно при признаках высокого риска: крупный размер, глубокая инвазия, периневральная инвазия, локализация на ушной раковине и губе, иммуносупрессия.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Микрографическая хирургия по Мосу применяется прежде всего:",["A. При опухолях высокого риска и в анатомически сложных зонах лица, где важно максимальное сохранение ткани при полном контроле краёв","B. При всех опухолях кожи","C. При метастатическом процессе","D. Вместо биопсии"],"A","Операция Мооса обеспечивает поэтапное удаление опухоли с микроскопическим контролем практически всей периферической и глубокой границы резекции, что позволяет максимально сохранять здоровую ткань. Рандомизированные и долгосрочные данные особенно поддерживают её использование при рецидивных и высокорисковых опухолях лица. Она не является обязательным методом для каждого базальноклеточного или плоскоклеточного рака кожи.","NCI PDQ — Skin Cancer Treatment","https://www.cancer.gov/types/skin/hp/skin-treatment-pdq"],["Ингибиторы Hedgehog применяются при:",["A. Местнораспространённом или метастатическом базальноклеточном раке, неоперабельном и не подлежащем облучению, а также при синдроме Горлина","B. Карциноме Меркеля","C. Меланоме","D. Плоскоклеточном раке кожи"],"A","Активация сигнального пути Hedgehog вследствие мутаций PTCH1 или SMO лежит в основе большинства базальноклеточных раков. Ингибиторы дают высокую частоту ответов, но переносимость ограничивает длительность приёма: мышечные спазмы, извращение вкуса, алопеция и потеря массы тела нередко ведут к перерывам и отказу от лечения.","ERIVANCE BCC — vismodegib in advanced basal-cell carcinoma","https://pubmed.ncbi.nlm.nih.gov/28511673/"],["Почему плоскоклеточный рак кожи высокочувствителен к ингибиторам контрольных точек?",["A. Из-за васкуляризации","B. Из-за высокой экспрессии PD-L1","C. Из-за очень высокой мутационной нагрузки, обусловленной ультрафиолетовым повреждением ДНК, и большого числа неоантигенов","D. Из-за низкой пролиферации"],"C","Ультрафиолет вызывает характерные замены C>T, и мутационная нагрузка при плоскоклеточном раке кожи одна из самых высоких среди всех опухолей. Это объясняет частоту ответов на цемиплимаб при распространённом процессе и выигрыш от адъювантного применения у больных высокого риска по данным C-POST.","C-POST — adjuvant cemiplimab in high-risk cutaneous squamous-cell carcinoma","https://pubmed.ncbi.nlm.nih.gov/40454639/"],["Реципиент почечного трансплантата с множественными плоскоклеточными раками кожи. Ключевая особенность ведения:",["A. Обсуждение коррекции иммуносупрессии совместно с трансплантологом, активное наблюдение и осторожность с ингибиторами контрольных точек из-за риска отторжения трансплантата","B. Стандартное лечение без изменений","C. Отмена наблюдения","D. Только местное лечение"],"A","Риск плоскоклеточного рака у реципиентов возрастает многократно, опухоли множественные и агрессивные. Переход на ингибиторы mTOR в схеме иммуносупрессии снижает риск новых опухолей. Ингибиторы контрольных точек эффективны, но сопряжены с реальным риском отторжения трансплантата, поэтому решение принимается совместно с трансплантологом и обсуждается с больным прямо.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Актинический кератоз:",["A. Доброкачественное образование без риска","B. Не связан с ультрафиолетом","C. Всегда требует иссечения","D. Предраковое изменение, часть очагов прогрессирует в плоскоклеточный рак; подлежит лечению и наблюдению"],"D","Актинический кератоз отражает поле канцеризации — участок кожи с накопленным ультрафиолетовым повреждением. Применяются криодеструкция, местные средства, фотодинамическая терапия. Важна концепция лечения поля, а не отдельных очагов, и обязательна защита от солнца.","PDQ® — опухоли кожи","https://www.cancer.gov/publications/pdq"],["Периневральная инвазия при плоскоклеточном раке кожи:",["A. Не имеет значения","B. Признак высокого риска: повышает вероятность местного рецидива и распространения по нервным стволам, служит показанием к более широкому иссечению и обсуждению послеоперационной лучевой терапии","C. Требует химиотерапии","D. Означает метастазирование"],"B","Периневральная инвазия, особенно крупных нервных стволов, резко ухудшает локальный контроль и может проявляться неврологической симптоматикой — онемением, парестезиями, парезом мимических мышц. При её выявлении обсуждаются МРТ для оценки распространения по нерву и послеоперационная лучевая терапия.","NCCN Guidelines","https://www.nccn.org/guidelines/category_1"],["Карцинома Меркеля отличается от других опухолей кожи тем, что:",["A. Течёт благоприятно","B. Не требует лечения","C. Не метастазирует","D. Это редкая агрессивная нейроэндокринная опухоль кожи, часто ассоциированная с полиомавирусом, с высокой частотой метастазирования и высокой чувствительностью к ингибиторам контрольных точек"],"D","Встречается преимущественно у пожилых и у больных с иммуносупрессией. Отличается быстрым ростом и ранним лимфогенным метастазированием, что требует биопсии сторожевого лимфоузла. При распространённом процессе ингибиторы контрольных точек дают высокую частоту длительных ответов, изменив прогноз этой ранее фатальной опухоли.","JAVELIN Merkel 200 — long-term avelumab in metastatic Merkel cell carcinoma","https://pubmed.ncbi.nlm.nih.gov/34715570/"],["Что необходимо сделать при выявлении опухоли кожи, помимо её лечения?",["A. Определить онкомаркеры","B. Осмотреть весь кожный покров, поскольку опухоли кожи часто множественные, и дать рекомендации по фотозащите и самообследованию","C. Назначить КТ всего тела","D. Ничего"],"B","Наличие одной опухоли кожи означает высокий риск последующих: поле канцеризации распространяется на всю инсолированную кожу. Полный осмотр кожного покрова, включая волосистую часть головы, ушные раковины и стопы, выявляет дополнительные очаги. Фотозащита и регулярное самообследование — обязательная часть рекомендаций.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-47","t":"Меланома: биология, диагностика, стадирование, локализованные стадии","s":"Частная онкология, ч. 1","q":[["Главный морфологический прогностический фактор при первичной меланоме кожи:",["A. Толщина опухоли по Бреслоу, дополняемая наличием изъязвления","B. Цвет","C. Локализация","D. Диаметр образования"],"A","Толщина опухоли по Бреслоу и изъязвление — ключевые параметры категории T и прогноза первичной меланомы кожи. Однако показания к биопсии сторожевого лимфоузла и хирургические отступы определяются не одной толщиной, а совокупностью стадии и клинических факторов. Поэтому толщина по Бреслоу остаётся главным морфологическим прогностическим параметром, но не единственным основанием для всей тактики.","AJCC 8th edition melanoma staging","https://pubmed.ncbi.nlm.nih.gov/29850954/"],["Правильный метод биопсии при подозрении на меланому:",["A. Эксцизионная биопсия с минимальным отступом, позволяющая оценить всю толщину опухоли","B. Кюретаж","C. Инцизионная биопсия во всех случаях","D. Тонкоигольная аспирация"],"A","Только полное удаление образования позволяет корректно измерить толщину по Бреслоу, от которой зависит вся дальнейшая тактика. Тонкоигольная аспирация и кюретаж недопустимы. Инцизионная биопсия используется как исключение при крупных образованиях или локализации на лице, где полное иссечение до диагноза нецелесообразно.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Что показало исследование MSLT-II у пациентов с метастазом меланомы в сторожевом лимфоузле?",["A. Наблюдение недопустимо","B. Биопсия сторожевого лимфоузла не имеет значения","C. Полная лимфодиссекция обязательна всем","D. Немедленная полная лимфодиссекция улучшала регионарный контроль, но не улучшала меланома-специфическую выживаемость и увеличивала риск лимфедемы; допустимо ультразвуковое наблюдение"],"D","В MSLT-II 3-летняя меланома-специфическая выживаемость была одинаковой — около 86% — при немедленной лимфодиссекции и наблюдении. Лимфодиссекция улучшала регионарный контроль, но сопровождалась существенно большей частотой лимфедемы. Следовательно, формулировка о выигрыше общей выживаемости была некорректной.","MSLT-II — completion dissection vs observation","https://pubmed.ncbi.nlm.nih.gov/28591523/"],["Адъювантная терапия при меланоме II стадии:",["A. Не проводится","B. Только химиотерапия","C. Проводится всем со II стадией","D. При IIB и IIC обоснован адъювантный пембролизумаб по данным KEYNOTE-716"],"D","Адъювантная иммунотерапия распространилась на стадии без поражения лимфоузлов. Однако при II стадии значительная часть больных излечивается операцией, поэтому обсуждение с пациентом должно включать абсолютные величины выигрыша и риск необратимых иммуноопосредованных явлений, прежде всего эндокринопатий.","KEYNOTE-716 — adjuvant pembrolizumab for stage IIB/IIC melanoma","https://pubmed.ncbi.nlm.nih.gov/35367007/"],["Что принципиально показало исследование SWOG S1801?",["A. Химиотерапия эффективнее","B. Тот же препарат в том же общем количестве доз даёт лучший результат, если часть введений выполнена до операции","C. Иммунотерапия не нужна","D. Операция не нужна"],"B","Различие только в порядке: часть доз пембролизумаба перенесена на дооперационный этап. Биологическое объяснение — присутствие опухоли обеспечивает антигенную стимуляцию и расширение пула специфических T-клеток. Это одно из самых наглядных доказательств того, что последовательность лечения сама по себе является терапевтическим фактором.","SWOG S1801 — neoadjuvant–adjuvant versus adjuvant pembrolizumab","https://pubmed.ncbi.nlm.nih.gov/36856617/"],["Что добавило исследование NADINA?",["A. Отменило операцию","B. Подтвердило превосходство адъювантного подхода","C. Неоадъювантная комбинация ипилимумаба с ниволумабом превзошла адъювантный ниволумаб; при выраженном патоморфологическом ответе объём последующей терапии может быть сокращён","D. Показало неэффективность иммунотерапии"],"C","Помимо превосходства неоадъювантного подхода, NADINA ввела принцип адаптации лечения к патоморфологическому ответу: больные с выраженным ответом получают меньше терапии, что снижает токсичность без потери эффективности. Это модель персонализации по ответу, а не по исходному биомаркёру.","NADINA — neoadjuvant nivolumab + ipilimumab","https://pubmed.ncbi.nlm.nih.gov/38828984/"],["Определение мутации BRAF при меланоме необходимо:",["A. При III стадии и выше, поскольку определяет выбор адъювантной терапии и опции при прогрессировании","B. Не требуется","C. Только при метастатической болезни","D. Только у молодых"],"A","При BRAF V600-мутированной меланоме III стадии комбинация дабрафениба с траметинибом — альтернатива адъювантной иммунотерапии, что важно при противопоказаниях к ингибиторам контрольных точек. При метастатической болезни статус BRAF определяет наличие таргетной опции. Мутация встречается примерно у 40–50 % больных.","COMBI-AD — final long-term results","https://www.nejm.org/doi/full/10.1056/NEJMoa2404139"],["Правило ABCDE и дерматоскопия используются для:",["A. Стадирования","B. Оценки ответа на лечение","C. Повышения точности клинической диагностики пигментных образований и отбора для биопсии","D. Определения прогноза"],"C","Асимметрия, неровность границ, неоднородность окраски, диаметр и эволюция образования — базовые клинические признаки; дополняет их правило «гадкого утёнка» — образование, отличающееся от остальных у данного человека. Дерматоскопия существенно повышает чувствительность и специфичность, снижая как число пропущенных меланом, так и число ненужных иссечений.","Systematic review/meta-analysis — dermoscopic structures for melanoma detection","https://pubmed.ncbi.nlm.nih.gov/34347005/"],["Особенность акральной и слизистой меланомы:",["A. Лечатся только хирургически","B. Не метастазируют","C. Лучший прогноз","D. Не связаны с ультрафиолетом, реже имеют мутацию BRAF, хуже отвечают на иммунотерапию и часто выявляются поздно"],"D","Эти варианты имеют иной патогенез: при них чаще встречаются нарушения KIT, а мутационная нагрузка ниже, чем при меланоме, связанной с ультрафиолетом, что объясняет меньшую эффективность иммунотерапии. Акральная меланома нередко просматривается: подногтевые и подошвенные образования требуют настороженности, а признак Хатчинсона на ногтевом валике — прямое показание к биопсии.","Классификация опухолей ВОЗ","https://whobluebooks.iarc.fr/"],["Что должно входить в наблюдение больного после радикального лечения меланомы?",["A. Только онкомаркеры","B. Только КТ","C. Наблюдение не требуется","D. Регулярный осмотр всего кожного покрова и регионарных зон, обучение самообследованию, фотозащита; интенсивность инструментального наблюдения зависит от стадии"],"D","Риск второй первичной меланомы у перенёсших её существенно повышен, поэтому осмотр кожи пожизненный. Самообследование выявляет значительную долю рецидивов между визитами, и обучение ему — реальный инструмент, а не формальность. Интенсивность визуализации определяется стадией и тем, будет ли выявленный рецидив подлежать активному лечению.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"]]},{"c":"М-48","t":"Метастатическая меланома; редкие формы: увеальная и слизистых оболочек","s":"Частная онкология, ч. 1","q":[["Больной с BRAF V600-мутированной метастатической меланомой, бессимптомная болезнь, ECOG 0. С чего начинать?",["A. С химиотерапии","B. Порядок не важен","C. С комбинации ингибиторов BRAF и MEK","D. С иммунотерапии; таргетную терапию оставить на последующую линию"],"D","DREAMseq прямо сравнило последовательности и показало существенно лучшую общую выживаемость при начале с иммунотерапии. Объяснение: эффект ингибиторов контрольных точек более длительный, а после прогрессирования на BRAF/MEK иммунотерапия работает хуже. Таргетная терапия предпочтительна лишь при необходимости срочного контроля симптомной, быстро прогрессирующей болезни.","DREAMseq / EA6134","https://pubmed.ncbi.nlm.nih.gov/36166727/"],["Ключевое преимущество комбинации ниволумаба с релатлимабом перед комбинацией с ипилимумабом:",["A. Более высокая эффективность у всех больных","B. Меньшая стоимость","C. Пероральный приём","D. Сопоставимая активность при существенно меньшей частоте тяжёлых иммуноопосредованных явлений"],"D","RELATIVITY-047 показало превосходство над монотерапией ниволумабом при токсичности заметно ниже, чем у комбинации с ипилимумабом. Выбор между режимами зависит от ситуации: при большой опухолевой массе и метастазах в головной мозг комбинация с ипилимумабом остаётся предпочтительной, несмотря на токсичность.","RELATIVITY-047 — 4-year update","https://pubmed.ncbi.nlm.nih.gov/40513285/"],["В каких ситуациях комбинация ниволумаба с ипилимумабом предпочтительнее других режимов?",["A. У пожилых","B. При аутоиммунных заболеваниях","C. При большой опухолевой массе, метастазах в головной мозг, высоком уровне лактатдегидрогеназы — когда нужен максимальный по глубине ответ","D. У всех больных"],"C","Двойная блокада даёт наибольшую частоту полных ответов и наиболее выраженный внутричерепной контроль, что подтверждено в CheckMate 204 при метастазах в мозг. Плата — иммуноопосредованные явления 3–4-й степени более чем у половины больных, поэтому режим требует опыта ведения токсичности и готовности пациента.","CheckMate 067 — final 10-year outcomes","https://pubmed.ncbi.nlm.nih.gov/39282897/"],["Больной достиг полного ответа на иммунотерапии, лечение продолжается 2 года. Что дальше?",["A. Начать химиотерапию","B. Возможно прекращение терапии при устойчивом ответе; часть больных сохраняет ремиссию длительно после отмены","C. Перейти на таргетную терапию","D. Продолжать пожизненно"],"B","Меланома — нозология, где прекращение иммунотерапии после длительного полного ответа не приводит к немедленному возврату болезни у большинства больных: формируется иммунологическая память. При последующем прогрессировании возможна повторная попытка иммунотерапии, нередко успешная. Это одна из тем, которую пациенты воспринимают тревожно и которую нужно обсуждать заранее.","CheckMate 067 — final 10-year outcomes","https://pubmed.ncbi.nlm.nih.gov/39282897/"],["Терапия опухоль-инфильтрирующими лимфоцитами (лифилейцел) применяется:",["A. В первой линии","B. При прогрессировании после ингибиторов контрольных точек, в центрах с опытом; требует лимфодеплеции и интерлейкина-2","C. Вместо операции","D. При увеальной меланоме"],"B","Лифилейцел — аутологичная терапия опухоль-инфильтрирующими лимфоцитами. FDA предоставило ускоренное одобрение в 2024 году взрослым с нерезектабельной или метастатической меланомой после anti-PD-1 терапии и, при BRAF V600-положительной опухоли, после BRAF-ингибитора с/без MEK-ингибитора. Производство требует резекции опухоли, лимфодеплеции и последующего введения клеточного продукта с поддержкой IL-2; лечение проводится в специализированном центре.","FDA — lifileucel accelerated approval for unresectable/metastatic melanoma","https://www.fda.gov/drugs/resources-information-approved-drugs/fda-grants-accelerated-approval-lifileucel-unresectable-or-metastatic-melanoma"],["Тебентафусп применяется при увеальной меланоме у больных:",["A. Всех","B. С мутацией BRAF","C. HLA-A*02:01-положительных","D. С мутацией KIT"],"C","Механизм основан на T-клеточном рецепторе, распознающем пептид gp100 в комплексе с HLA-A*02:01, поэтому определение этого аллеля обязательно перед назначением. Тебентафусп — первый препарат, улучшивший общую выживаемость при метастатической увеальной меланоме. Характерное осложнение — синдром высвобождения цитокинов при первых введениях, требующий наблюдения.","Tebentafusp — 3-year overall survival in metastatic uveal melanoma","https://pubmed.ncbi.nlm.nih.gov/37870955/"],["Почему иммунотерапия при увеальной меланоме менее эффективна, чем при меланоме кожи?",["A. Из-за локализации","B. Из-за возраста больных","C. Из-за печёночного тропизма","D. Из-за низкой мутационной нагрузки: увеальная меланома не связана с ультрафиолетом, несёт мутации GNAQ/GNA11 и мало неоантигенов"],"D","Мутации или амплификации KIT встречаются у части слизистых и акральных меланом. В фазе II иматиниб демонстрировал ответы преимущественно у опухолей с активирующими мутациями KIT, тогда как одна лишь амплификация была значительно менее надёжным предиктором. Поэтому тестирование KIT может быть клинически полезным, но ингибитор KIT не следует рассматривать как стандарт для всех слизистых меланом.","ESMO–EURACAN Clinical Practice Guideline — uveal melanoma","https://pubmed.ncbi.nlm.nih.gov/42020098/"],["Слизистая меланома отличается от меланомы кожи тем, что:",["A. Имеет лучший прогноз","B. Не метастазирует","C. Лечится только хирургически","D. Не связана с ультрафиолетом, имеет низкую мутационную нагрузку, чаще несёт нарушения KIT, хуже отвечает на иммунотерапию и обычно выявляется поздно"],"D","Локализация в полости носа, придаточных пазухах, полости рта, аноректальной области и на вульве обусловливает позднюю диагностику. При выявлении нарушений KIT возможна таргетная терапия иматинибом у части больных. Прогноз существенно хуже, чем при меланоме кожи сопоставимой стадии.","Phase II — imatinib in KIT-altered melanoma","https://pubmed.ncbi.nlm.nih.gov/23775962/"],["Какова роль ЛДГ при метастатической меланоме?",["A. ЛДГ не имеет прогностического значения","B. ЛДГ используется только для диагностики меланомы","C. Повышение ЛДГ является неблагоприятным прогностическим фактором и входит в категорию M1 в TNM; само по себе значение ЛДГ не определяет конкретный режим системной терапии","D. Нормальный ЛДГ исключает метастатическое заболевание"],"C","ЛДГ — валидированный прогностический фактор при метастатической меланоме и учитывается в стадировании M1. Повышенный уровень ассоциирован с худшим прогнозом и часто отражает большую опухолевую нагрузку. Однако ЛДГ не является самостоятельным предиктивным биомаркером выбора конкретного препарата; решение о терапии определяется совокупностью клинических факторов, BRAF-статусом, симптомами, темпом болезни и другими параметрами.","ESMO Clinical Practice Guideline — Cutaneous Melanoma (2025)","https://pubmed.ncbi.nlm.nih.gov/39550033/"],["Больной с метастатической меланомой и бессимптомными метастазами в головной мозг:",["A. Может получать двойную иммунотерапию с высокой частотой внутричерепных ответов; облучение при возможности отсрочивается","B. Показана только таргетная терапия","C. Не подлежит системной терапии","D. Требует немедленного облучения всего мозга"],"A","CheckMate 204 показало высокую частоту длительного внутричерепного контроля при комбинации ниволумаба с ипилимумабом у больных с бессимптомными метастазами в мозг. Это позволяет отсрочить облучение с его нейрокогнитивными последствиями. При симптомных или крупных очагах локальное лечение проводится в первую очередь.","ASCO Guideline Update — systemic therapy for melanoma","https://pubmed.ncbi.nlm.nih.gov/37579248/"]]},{"c":"М-49","t":"Саркомы мягких тканей","s":"Частная онкология, ч. 2","q":[["Почему при подозрении на саркому мягких тканей больного следует направить в референс-центр до биопсии?",["A. Из-за стоимости","B. Диагноз при пересмотре экспертом меняется у значительной доли больных, а неправильно выполненная биопсия или энуклеация ухудшают исход и требуют повторного вмешательства","C. Это не требуется","D. Из организационных соображений"],"B","Диагностика сарком требует специализированной морфологической экспертизы. Современные рекомендации подчёркивают необходимость пересмотра материала в референсном центре: значимые расхождения между первоначальным и экспертным диагнозом встречаются достаточно часто и могут менять лечебную тактику. Поэтому биопсию и последующее лечение желательно планировать совместно с саркомным центром до окончательной операции.","UK guidelines for management of soft-tissue sarcomas (2024)","https://www.nature.com/articles/s41416-024-02674-y"],["Какой признак должен вызвать подозрение на саркому мягких тканей?",["A. Образование глубже фасции, размером более 5 см, растущее или болезненное — независимо от анамнеза травмы","B. Только болезненность","C. Только быстрый рост","D. Любое подкожное образование"],"A","Классическая ошибка — трактовка образования как посттравматической гематомы или липомы и наблюдение в течение месяцев. Указание на травму в анамнезе встречается часто и не исключает саркому. Глубина расположения, размер более 5 см и рост — показания к МРТ и направлению в специализированное учреждение.","ESMO-EURACAN-GENTURIS — Soft tissue and visceral sarcomas","https://pubmed.ncbi.nlm.nih.gov/34303806/"],["Комбинация доксорубицина с ифосфамидом по сравнению с доксорубицином в монорежиме при распространённой саркоме:",["A. Не применяется","B. Улучшает общую выживаемость","C. Менее токсична","D. Даёт более высокую частоту ответов при существенно большей токсичности, но без выигрыша в общей выживаемости"],"D","В EORTC 62012 комбинация доксорубицина с ифосфамидом увеличивала частоту объективных ответов и БПВ по сравнению с одним доксорубицином, но не обеспечила статистически значимого улучшения общей выживаемости. Поэтому комбинация особенно уместна, когда уменьшение опухоли является непосредственной целью, а не как обязательный режим для каждого пациента с распространённой саркомой мягких тканей.","EORTC 62012 — doxorubicin vs doxorubicin + ifosfamide","https://pubmed.ncbi.nlm.nih.gov/24618336/"],["Почему точный гистологический вариант саркомы принципиален для выбора терапии?",["A. Влияет только на прогноз","B. Не имеет значения","C. Определяет только объём операции","D. Разные подтипы по-разному чувствительны к препаратам: трабектедин и эрибулин активны при липосаркоме и лейомиосаркоме, пазопаниб — при несжиросодержащих саркомах и так далее"],"D","Заключение «саркома мягких тканей» без указания варианта не позволяет выбрать лечение. Современная химиотерапия сарком гистология-ориентирована, а при ряде редких вариантов существуют специфические подходы, включая таргетные препараты. Это главный практический аргумент за пересмотр препаратов экспертом.","NCI PDQ — Adult Soft Tissue Sarcoma Treatment","https://www.cancer.gov/types/soft-tissue-sarcoma/hp/adult-soft-tissue-treatment-pdq"],["Десмоидная опухоль:",["A. Является злокачественной с высоким риском метастазирования","B. Лечится только лучевой терапией","C. Требует немедленной радикальной операции","D. Местноагрессивная опухоль без метастатического потенциала; современная тактика — активное наблюдение, при прогрессировании системная терапия, операция резервируется"],"D","Саркомы мягких тканей — гетерогенная группа, поэтому чувствительность к системной терапии зависит от гистологического подтипа. Доксорубицин остаётся базовой первой линией для многих распространённых STS, тогда как трабектедин имеет установленную роль прежде всего при липосаркоме/лейомиосаркоме, эрибулин — при липосаркоме, а другие режимы выбирают с учётом морфологии и предшествующего лечения. Универсальной «гистологической таблицы», автоматически определяющей препарат, нет.","DeFi — nirogacestat for desmoid tumors","https://pubmed.ncbi.nlm.nih.gov/36884323/"],["Основной путь метастазирования сарком мягких тканей конечностей:",["A. Лимфогенный","B. По брюшине","C. В кости","D. Гематогенный, преимущественно в лёгкие; регионарные лимфоузлы поражаются редко, кроме отдельных подтипов"],"D","Отсюда программа наблюдения: КТ органов грудной клетки как основной метод. Лимфогенное метастазирование характерно для отдельных вариантов — эпителиоидной, светлоклеточной, синовиальной саркомы, рабдомиосаркомы и ангиосаркомы, — при которых оценка регионарных узлов оправдана.","ESMO-EURACAN-GENTURIS — Soft tissue and visceral sarcomas","https://pubmed.ncbi.nlm.nih.gov/34303806/"],["Резекция лёгочных метастазов при саркоме:",["A. Обоснована у отобранных больных с ограниченным числом очагов, длительным безрецидивным периодом и контролируемым первичным очагом; может давать длительную выживаемость","B. Показана всем","C. Заменяет системную терапию","D. Не применяется"],"A","При саркомах метастазэктомия применяется активнее, чем при большинстве других опухолей, и у части больных даёт длительную выживаемость, в том числе при повторных резекциях. Рандомизированных данных немного, и значительную роль играет отбор, но подход прочно вошёл в практику.","ESMO-EURACAN-GENTURIS — Soft tissue and visceral sarcomas","https://pubmed.ncbi.nlm.nih.gov/34303806/"],["Роль лучевой терапии при саркомах мягких тканей конечностей:",["A. Применяется только паллиативно","B. Применяется до или после операции при опухолях высокого риска для снижения частоты местных рецидивов; предоперационное облучение даёт меньше поздних осложнений, но больше раневых","C. Заменяет операцию","D. Не применяется"],"B","Комбинация операции с лучевой терапией позволила заменить ампутации органосохраняющими вмешательствами при сохранении локального контроля. Предоперационное облучение проводится в меньшей дозе и меньшем объёме, что снижает поздний фиброз и тугоподвижность, но повышает частоту раневых осложнений — выбор обсуждается консилиумом.","ESMO-EURACAN-GENTURIS — Soft tissue and visceral sarcomas","https://pubmed.ncbi.nlm.nih.gov/34303806/"],["Теносиновиальная гигантоклеточная опухоль:",["A. Злокачественная опухоль с метастазами","B. Лечится химиотерапией","C. Не требует лечения","D. Доброкачественная, но местноагрессивная и инвалидизирующая опухоль сустава; при неоперабельных формах эффективны ингибиторы CSF1R"],"D","Диффузная теносиновиальная гигантоклеточная опухоль может вызывать выраженное нарушение функции сустава и рецидивировать после операции. При заболевании, не подходящем для хирургического лечения без значимой функциональной потери, ингибирование CSF1R является доказанной системной стратегией. В MOTION вимселтиниб дал объективный ответ у 40% пациентов против 0% на плацебо и улучшал функциональные и симптоматические показатели.","MOTION — vimseltinib for tenosynovial giant cell tumor","https://pubmed.ncbi.nlm.nih.gov/38843860/"],["Наиболее частая ошибка на этапе первичного обращения при саркоме мягких тканей:",["A. Слишком раннее направление к онкологу","B. Избыточное обследование","C. Назначение МРТ","D. Удаление образования «как липомы» без предварительной визуализации и биопсии, что превращает операцию в нерадикальную и ухудшает прогноз"],"D","Так называемая операция «whoops» — неплановое удаление саркомы под видом доброкачественного образования — встречается часто. Она оставляет опухолевые клетки в ложе, требует повторного расширенного иссечения, а иногда и лучевой терапии. Правило: образование глубже фасции или размером более 5 см требует МРТ до любого вмешательства.","ESMO-EURACAN-GENTURIS — Soft tissue and visceral sarcomas","https://pubmed.ncbi.nlm.nih.gov/34303806/"]]},{"c":"М-50","t":"Остеосаркома и первичные опухоли костей; метастатическое поражение костей","s":"Частная онкология, ч. 2","q":[["Подросток с болью в области коленного сустава, усиливающейся ночью, и рентгенологической картиной остеодеструкции с периостальной реакцией. Первоочередные действия:",["A. Направление в специализированный центр по опухолям костей до выполнения биопсии","B. Физиотерапия","C. Наблюдение и обезболивание","D. Биопсия в ближайшем стационаре"],"A","Биопсия при опухолях костей должна выполняться в том центре, где будет проводиться лечение: неправильно выбранная траектория контаминирует ткани и может лишить больного возможности органосохраняющей операции. Ночная боль в области метафиза длинной кости у подростка — классическая картина остеосаркомы, требующая срочного направления.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Стандарт лечения локализованной остеосаркомы:",["A. Только химиотерапия","B. Только операция","C. Только лучевая терапия","D. Предоперационная химиотерапия, органосохраняющая операция и послеоперационная химиотерапия"],"D","Химиотерапия превратила остеосаркому из заболевания с выживаемостью около 20 % в излечимое у большинства больных с локализованной формой. Предоперационный этап позволяет оценить лечебный патоморфоз — сильный прогностический фактор. Однако попытки усилить лечение при плохом ответе, изученные в крупных международных исследованиях, результатов не улучшили.","EURAMOS-1 — MAP-based treatment in resectable high-grade osteosarcoma","https://pubmed.ncbi.nlm.nih.gov/26033801/"],["Саркома Юинга отличается от остеосаркомы тем, что:",["A. Не требует системной терапии","B. Встречается только у взрослых","C. Менее чувствительна к химиотерапии","D. Высокочувствительна и к химиотерапии, и к лучевой терапии; локальное лечение может быть хирургическим, лучевым или комбинированным"],"D","Радиочувствительность саркомы Юинга позволяет применять лучевую терапию как метод локального контроля там, где операция функционально неприемлема. Диагноз подтверждается характерными транслокациями с участием гена EWSR1. Режимы интенсивные, с сокращённым интервалом между курсами.","COG randomized trial — interval-compressed VDC/IE in Ewing sarcoma","https://pubmed.ncbi.nlm.nih.gov/23091096/"],["Хондросаркома и хордома:",["A. Малочувствительны к химиотерапии и стандартной лучевой терапии; основа лечения — радикальная операция, при хордоме применяется протонная и ионная терапия","B. Не требуют лечения","C. Лечатся иммунотерапией","D. Высокочувствительны к химиотерапии"],"A","Отсюда принципиальное значение первой операции: при этих опухолях радикальность вмешательства определяет исход, а возможности спасения при рецидиве ограничены. Протонная и ионная терапия позволяют подвести высокую дозу вблизи критических структур основания черепа и позвоночника.","ESMO/ASCO Global Curriculum 2023 — bone sarcomas and referral-centre management","https://pmc.ncbi.nlm.nih.gov/articles/PMC10664856/"],["Какова роль остеомодифицирующих препаратов при метастатическом раке молочной железы с поражением костей?",["A. Их назначают только после патологического перелома","B. Они не применяются","C. Их используют только как анальгетики","D. Их рекомендуют для профилактики скелетных осложнений при наличии костных метастазов с учётом противопоказаний, функции почек, кальциевого обмена и стоматологического риска"],"D","ASCO/CCO рекомендует остеомодифицирующую терапию при метастатическом раке молочной железы с костными метастазами. Перед лечением оценивают стоматологический статус и факторы риска остеонекроза челюсти; при деносумабе и бисфосфонатах контролируют кальций и другие параметры минерального обмена. Конкретный препарат и частота введения определяются сопутствующими заболеваниями, функцией почек и используемой рекомендацией.","ASCO-CCO — bone-modifying agents in metastatic breast cancer","https://pubmed.ncbi.nlm.nih.gov/29035643/"],["Шкала Мирелса используется для:",["A. Оценки ответа на лечение","B. Оценки риска патологического перелома и определения показаний к профилактической фиксации","C. Оценки боли","D. Стадирования"],"B","Учитываются локализация очага, его характер — литический или бластический, — размер относительно диаметра кости и выраженность боли. При высокой сумме баллов профилактическая фиксация выполняется до перелома: она технически проще, безопаснее и функционально выгоднее, чем операция после состоявшегося перелома.","Mirels score — validation for impending pathological fracture","https://pubmed.ncbi.nlm.nih.gov/30062934/"],["Больной с метастазами в позвоночник жалуется на нарастающую слабость в ногах. Действия:",["A. Обезболивание","B. Немедленно глюкокортикоиды в высокой дозе и экстренная МРТ всего позвоночника","C. Плановая консультация","D. Лучевая терапия через неделю"],"B","Хондросаркома и хордома относятся к редким первичным опухолям костей с биологией, отличной от остеосаркомы и саркомы Юинга. При локализованном процессе основой лечения обычно является специализированная локальная терапия, прежде всего хирургическая, а чувствительность к стандартной цитотоксической химиотерапии ограничена. Из-за редкости и сложности анатомической локализации пациентов следует направлять в референсные центры; системное лечение зависит от конкретного подтипа и молекулярных особенностей.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Гипокальциемия на фоне деносумаба:",["A. Частое и предотвратимое осложнение; требует профилактического приёма кальция и витамина D и контроля уровня кальция","B. Не встречается","C. Означает прогрессирование","D. Не требует лечения"],"A","Деносумаб подавляет резорбцию кости и высвобождение кальция, что при исходном дефиците витамина D может привести к выраженной гипокальциемии, вплоть до жизнеугрожающей. Профилактика проста: коррекция дефицита витамина D до начала, постоянный приём кальция и витамина D, контроль уровня кальция, особенно при почечной недостаточности.","ASCO-CCO — bone-modifying agents in metastatic breast cancer","https://pubmed.ncbi.nlm.nih.gov/29035643/"],["Остеонекроз челюсти при длительной терапии остеомодифицирующими агентами:",["A. Не связан с лечением","B. Лечится увеличением дозы","C. Встречается только при бисфосфонатах","D. Редкое, но тяжёлое осложнение; профилактика — санация полости рта до начала терапии и отказ от плановых инвазивных стоматологических вмешательств во время неё"],"D","Риск возрастает с длительностью терапии и резко повышается при удалении зубов и имплантации на её фоне. Поэтому санация проводится до начала, а при необходимости вмешательства во время терапии решение принимается совместно со стоматологом. Осложнение описано и для бисфосфонатов, и для деносумаба.","ASCO-CCO — bone-modifying agents in metastatic breast cancer","https://pubmed.ncbi.nlm.nih.gov/29035643/"],["Гигантоклеточная опухоль кости:",["A. Доброкачественная, но местноагрессивная опухоль; деносумаб позволяет уменьшить объём операции или лечить неоперабельные формы","B. Злокачественная опухоль с ранним метастазированием","C. Не требует лечения","D. Лечится химиотерапией"],"A","Опухоль разрушает эпифиз длинных костей и часто рецидивирует после кюретажа. Молекулярная основа — гиперпродукция RANKL, что сделало деносумаб патогенетически обоснованным. Редко возможны так называемые доброкачественные метастазы в лёгкие, что не меняет доброкачественной природы заболевания.","Phase II — denosumab in giant-cell tumor of bone","https://pubmed.ncbi.nlm.nih.gov/31704134/"]]},{"c":"М-51","t":"Гастроинтестинальные стромальные опухоли","s":"Частная онкология, ч. 2","q":[["Почему мутационное тестирование имеет принципиальное значение при ГИСО?",["A. Оно не влияет на лечение","B. Оно требуется только для научных исследований","C. Генотип KIT/PDGFRA и другие молекулярные подтипы помогают определить чувствительность к ингибиторам тирозинкиназ, выбор препарата и в отдельных ситуациях дозу","D. Оно полностью заменяет морфологическую диагностику"],"C","Мутационный профиль ГИСО принципиально влияет на системное лечение. При распространённом KIT exon 9-мутированном ГИСО более высокая доза иматиниба может иметь преимущество, тогда как PDGFRA D842V характеризуется первичной резистентностью к иматинибу и чувствительностью к авапритинибу. Эти правила нельзя механически переносить на все клинические ситуации, в частности на адъювантную терапию, где решение зависит от риска рецидива и доказательной базы для конкретного генотипа.","ESMO–EURACAN–GENTURIS Clinical Practice Guideline: GIST","https://pubmed.ncbi.nlm.nih.gov/34560242/"],["Мутация PDGFRA D842V означает:",["A. Необходимость удвоить дозу иматиниба","B. Благоприятный прогноз при любой терапии","C. Высокую чувствительность к иматинибу","D. Первичную резистентность к иматинибу; показан авапритиниб"],"D","Эта мутация меняет конформацию киназы так, что иматиниб не связывается. Назначение иматиниба таким больным — потеря времени при прогрессирующей опухоли. Авапритиниб разработан именно под эту мишень и даёт высокую частоту ответов.","NAVIGATOR — avapritinib in PDGFRA D842V-mutant GIST","https://pubmed.ncbi.nlm.nih.gov/33465704/"],["При распространённой или нерезектабельной ГИСО с мутацией KIT в экзоне 9 предпочтительная доза иматиниба составляет:",["A. 800 мг/сут","B. 200 мг/сут","C. Иматиниб не показан","D. Только 400 мг/сут независимо от мутации"],"A","Для распространённой ГИСО с мутацией KIT в экзоне 9 данные рандомизированных исследований поддерживают преимущество 800 мг/сут (обычно 400 мг 2 раза в сутки) по контролю заболевания по сравнению с 400 мг/сут. Это утверждение не следует автоматически переносить на адъювантную терапию.","ESMO–EURACAN–GENTURIS Clinical Practice Guideline: GIST","https://pubmed.ncbi.nlm.nih.gov/34560242/"],["Длительность адъювантной терапии иматинибом у больных высокого риска:",["A. 1 год","B. Пожизненно","C. 6 месяцев","D. 3 года"],"D","SSGXVIII/AIO показало, что 3 года адъювантного иматиниба у пациентов с высоким риском рецидива обеспечивают лучшие безрецидивную и общую выживаемость, чем 1 год. Более длительная терапия изучалась отдельно и не отменяет того, что длительность должна определяться риском, мутационной чувствительностью и актуальными рекомендациями.","SSGXVIII/AIO — 3 vs 1 year adjuvant imatinib","https://pubmed.ncbi.nlm.nih.gov/26527782/"],["Стратификация риска рецидива при ГИСО основана на:",["A. Локализации, размере опухоли, митотическом индексе и наличии разрыва капсулы","B. Возрасте больного","C. Уровне маркёров","D. Только размере"],"A","При прочих равных опухоли желудка ведут себя благоприятнее тонкокишечных. Митотический индекс подсчитывается на стандартизованной площади и должен быть в заключении. Разрыв капсулы — интраоперационный или спонтанный — автоматически относит больного к высокому риску независимо от остальных параметров.","Классификация ВОЗ","https://whobluebooks.iarc.fr/"],["Оценка ответа на иматиниб при ГИСО имеет особенность:",["A. Оценивается только по размеру","B. Опухоль может не уменьшаться или даже увеличиваться за счёт миксоидной дегенерации и кровоизлияния при снижении плотности — это признак ответа, а не прогрессирования","C. Оценивается по маркёрам","D. Оценка не требуется"],"B","Критерии Чоя учитывают снижение плотности опухоли по КТ наряду с изменением размера. Оценка только по RECIST может привести к ошибочному выводу о прогрессировании и преждевременной смене эффективного препарата. При сомнениях помогает ПЭТ: метаболический ответ наступает уже через несколько дней.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Последовательность линий терапии при распространённой ГИСО:",["A. Химиотерапия, затем иматиниб","B. Иматиниб, сунитиниб, регорафениб, рипретиниб","C. Иммунотерапия в первой линии","D. Только иматиниб"],"B","ГИСО малочувствительна к классической химиотерапии и лучевой терапии, поэтому вся стратегия строится на последовательности ингибиторов тирозинкиназ. При отдельных мутациях порядок меняется: при PDGFRA D842V первой линией становится авапритиниб. Рипретиниб установлен как стандарт четвёртой линии по данным INVICTUS.","INVICTUS — ripretinib in advanced GIST","https://pubmed.ncbi.nlm.nih.gov/32511981/"],["Что показало исследование INTRIGUE?",["A. Оба препарата бесполезны","B. В общей популяции превосходства не получено, но в подгруппе с мутацией экзона 11 KIT рипретиниб показал сопоставимую эффективность при лучшей переносимости","C. Сунитиниб неэффективен","D. Рипретиниб превосходит сунитиниб во всей популяции"],"B","Формально отрицательное исследование, результаты которого тем не менее влияют на практику: молекулярная подгруппа определяет выбор между препаратами с разным профилем токсичности. Полезный пример для семинара по методологии — почему подгрупповые данные требуют осторожности, но не всегда бесполезны.","INTRIGUE — ripretinib versus sunitinib after imatinib","https://pubmed.ncbi.nlm.nih.gov/35947817/"],["При местнораспространённой ГИСО, требующей обширной операции:",["A. Показана лучевая терапия","B. Обоснована предоперационная терапия иматинибом для уменьшения опухоли и снижения объёма вмешательства","C. Оперировать немедленно","D. Операция противопоказана"],"B","Предоперационная терапия может уменьшить опухоль настолько, что удастся сохранить орган — например, избежать гастрэктомии или экстирпации прямой кишки. Обязательное условие — предварительное молекулярное тестирование: при PDGFRA D842V такой подход бессмыслен. Оценка ответа проводится через 3–6 месяцев по критериям Чоя.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["ГИСО дикого типа по KIT и PDGFRA у молодого больного требует:",["A. Стандартной терапии иматинибом","B. Химиотерапии","C. Только наблюдения","D. Дополнительного обследования: оценки сукцинатдегидрогеназы, поскольку такие опухоли часто связаны с её дефицитом и наследственными синдромами"],"D","ГИСО с дефицитом сукцинатдегидрогеназы встречаются у молодых, чаще локализуются в желудке, метастазируют в лимфоузлы, что для ГИСО нетипично, и малочувствительны к иматинибу. Они могут быть частью наследственных синдромов, включая триаду Карни и синдром Карни — Стратакиса, что требует генетического консультирования.","ESMO–EURACAN–GENTURIS Clinical Practice Guideline: GIST","https://pubmed.ncbi.nlm.nih.gov/34560242/"]]},{"c":"М-52","t":"Рак щитовидной железы","s":"Частная онкология, ч. 2","q":[["Что лучше всего объясняет резкий рост выявляемости рака щитовидной железы в ряде стран без сопоставимого роста смертности?",["A. Только улучшение лечения","B. Только истинное увеличение числа клинически значимых опухолей","C. Гипердиагностика: широкое применение УЗИ выявляет большое число небольших опухолей, часть которых не проявилась бы клинически в течение жизни","D. Только изменение системы стадирования"],"C","Эпидемиологические данные, особенно опыт Южной Кореи, показывают резкий рост выявляемости небольших папиллярных раков после широкого внедрения УЗИ без соответствующего роста смертности. Это соответствует гипердиагностике — выявлению опухолей, которые при отсутствии скрининга не стали бы клинически значимыми. Формулировка «никогда бы не проявились» заменена, поскольку судьбу конкретной микрокарциномы невозможно знать заранее.","NCI PDQ — Thyroid Cancer Screening","https://www.cancer.gov/types/thyroid/hp/thryoid-screening-pdq"],["При папиллярной микрокарциноме щитовидной железы без неблагоприятных признаков:",["A. Возможно активное наблюдение как альтернатива немедленной операции","B. Показана радиойодтерапия","C. Показана тотальная тиреоидэктомия всем","D. Показана лучевая терапия"],"A","Наблюдение с ультразвуковым контролем показало сопоставимые исходы при отсутствии признаков экстратиреоидного распространения, поражения лимфоузлов и неблагоприятной локализации вблизи трахеи и возвратного нерва. Операция выполняется при росте опухоли или появлении неблагоприятных признаков. Условие — готовность пациента к наблюдению.","Active surveillance of low-risk papillary thyroid microcarcinoma","https://pubmed.ncbi.nlm.nih.gov/33224844/"],["Стадирование дифференцированного рака щитовидной железы имеет особенность:",["A. Не зависит от возраста","B. Не применяется","C. Учитывает возраст больного: у более молодых даже при отдалённых метастазах стадия не превышает II","D. Определяется только размером"],"C","Возрастной порог отражает принципиально иное биологическое поведение опухоли у молодых, у которых даже метастатическая болезнь нередко течёт годами и десятилетиями. Это уникальная особенность среди всех локализаций и наглядный пример того, что стадирование — инструмент прогноза, а не описание анатомии.","ESMO Clinical Practice Guidelines","https://www.esmo.org/guidelines"],["Как формулируется современный подход к радиойодтерапии после операции при дифференцированном раке щитовидной железы?",["A. Радиойод обязателен после любой операции","B. Радиойод полностью заменяет хирургическое лечение","C. Радиойод применяют только при отдалённых метастазах","D. Решение индивидуализируют по риску рецидива и ожидаемой пользе; при низком риске рутинное применение обычно не требуется, при более высоком риске показания рассматривают шире"],"D","ATA 2025 подчёркивает риск-адаптированный подход: радиойод не является автоматическим этапом после операции у каждого пациента. Решение зависит от риска рецидива, остаточной болезни, патологических и молекулярных факторов и ожидаемой клинической пользы.","ATA 2025 — differentiated thyroid cancer","https://pubmed.ncbi.nlm.nih.gov/40844370/"],["Целевой уровень ТТГ после лечения дифференцированного рака:",["A. Выше нормы","B. Определяется группой риска: выраженная супрессия при высоком риске, умеренная или нормальные значения при низком","C. Не имеет значения","D. Максимально низкий у всех"],"B","Длительная выраженная супрессия ТТГ повышает риск фибрилляции предсердий, остеопороза и переломов. Поэтому цель индивидуализируется: при низком риске достаточно нижней границы нормы. Это одна из частых ошибок — назначение максимальной супрессии всем больным пожизненно.","ATA 2025 — differentiated thyroid cancer","https://pubmed.ncbi.nlm.nih.gov/40844370/"],["Что необходимо учитывать при интерпретации тиреоглобулина после лечения дифференцированного рака щитовидной железы?",["A. Только кальцитонин","B. Только паратгормон","C. ТТГ делает определение антител ненужным","D. Антитела к тиреоглобулину могут искажать измерение Tg, поэтому Tg следует интерпретировать вместе со статусом TgAb и клиническим контекстом"],"D","TgAb могут интерферировать с иммунометрическими методами определения тиреоглобулина и приводить к ложно низким значениям Tg. Поэтому при серийном наблюдении Tg оценивают вместе с TgAb и желательно одной и той же методикой. Динамика TgAb может быть дополнительным индикатором, но не заменяет визуализацию и не является абсолютным доказательством рецидива.","ATA 2025 — differentiated thyroid cancer","https://pubmed.ncbi.nlm.nih.gov/40844370/"],["Радиойодрефрактерный дифференцированный рак с прогрессированием:",["A. Не подлежит лечению","B. Показаны мультикиназные ингибиторы — ленватиниб, сорафениб; при выявлении слияний RET или NTRK предпочтительны селективные ингибиторы","C. Показана химиотерапия","D. Показана повторная радиойодтерапия"],"B","SELECT и DECISION установили роль мультикиназных ингибиторов. Их токсичность существенна: артериальная гипертензия, диарея, ладонно-подошвенный синдром. При выявлении слияний RET или NTRK селективные ингибиторы дают сопоставимую или лучшую эффективность при заметно лучшей переносимости, поэтому молекулярное тестирование целесообразно.","SELECT — lenvatinib in radioiodine-refractory thyroid cancer","https://pubmed.ncbi.nlm.nih.gov/25671254/"],["Медуллярный рак щитовидной железы:",["A. Происходит из парафолликулярных C-клеток, продуцирует кальцитонин, не накапливает радиойод; требует исключения герминальной мутации RET","B. Всегда наследственный","C. Лечится радиойодом","D. Происходит из фолликулярного эпителия"],"A","Кальцитонин и раково-эмбриональный антиген служат маркёрами. Радиойодтерапия неэффективна, поскольку C-клетки не захватывают йод. Примерно четверть случаев наследственные, в рамках синдромов множественных эндокринных неоплазий 2-го типа, поэтому тестирование зародышевой линии RET показано всем больным.","LIBRETTO-531 — phase III design / RET-mutant MTC","https://pubmed.ncbi.nlm.nih.gov/35969032/"],["При выявлении герминальной мутации RET у больного медуллярным раком необходимо:",["A. Назначить радиойодтерапию","B. Ничего дополнительно","C. Исключить феохромоцитому до операции и провести каскадное тестирование родственников","D. То
